<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZouMots · Les natures des mots</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:radial-gradient(circle at top,#338ad6,#153c78 55%,#101c49);color:#17233d;min-height:100vh}.wrap{max-width:950px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;color:white;gap:10px;flex-wrap:wrap}h1{font-size:clamp(2.4rem,7vw,4.5rem);margin:10px 0;color:#fff;text-shadow:4px 5px #122d6b}.pill{background:#fff;border-radius:50px;padding:9px 15px;font-weight:900}.panel{background:#fff8e7;border:5px solid #fff;border-radius:28px;box-shadow:0 13px 0 #142958,0 20px 40px #0005;padding:20px;margin:18px 0}.modes{display:flex;gap:8px;flex-wrap:wrap}button{cursor:pointer;border:0;font-weight:900;font-size:1rem;border-radius:15px;padding:13px 15px;box-shadow:0 4px 0 #0003}button:active{transform:translateY(3px);box-shadow:0 1px 0 #0003}.mode{background:#e4ebff}.mode.on{background:#ffcf35}.sentence{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:25px 0}.word{background:white;border:3px solid #c4d4f5;min-width:65px;padding:12px 10px}.word.active{outline:4px solid #ffcc27}.word.good{border-color:#35bd77}.tag{display:block;font-size:.7rem;border-radius:6px;margin-top:5px;padding:3px;color:white}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.choice{color:white;min-height:60px}.foot{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}.hint{background:#ffe67d}.next{background:#69d788}.status{font-weight:800;min-height:30px}.overlay{position:fixed;inset:0;background:#0a1734b9;display:none;place-items:center;z-index:9;padding:16px}.overlay.show{display:grid}.popup{background:white;border:6px solid #ffda48;border-radius:28px;padding:20px;max-width:650px;width:100%;box-shadow:0 16px 60px #0008;position:relative;animation:pop .25s ease-out}.popup h2{margin:5px 0;color:#215cba}.popup p{font-size:1.12rem;line-height:1.45}.wolf{width:110px;height:110px;object-fit:contain;float:left;margin-right:15px}.close{position:absolute;right:12px;top:12px;background:#f2e8dd}.memo{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px}.memo span{font-size:.8rem;border-radius:8px;padding:6px 9px;color:white;font-weight:900}@keyframes pop{from{transform:scale(.75);opacity:0}to{transform:scale(1);opacity:1}}@media(max-width:550px){.choices{grid-template-columns:repeat(2,1fr)}.panel{padding:12px}.wolf{width:80px;height:80px}}@media(prefers-reduced-motion:reduce){.popup{animation:none}}
</style><div class="wrap"><div class="top"><a href="ressources.html#grammaire" style="color:white">← Grammaire</a><span class="pill" id="score">⭐ 0 XP</span></div><h1>🐺 ZouMots</h1><div class="panel"><div class="modes"><button class="mode on" data-mode="analyse">🔍 Analyse complète</button><button class="mode" data-mode="express">⚡ Express</button><button class="mode" data-mode="defi">🏆 Défi</button></div><h2 id="task">Trouve la nature de chaque mot !</h2><div id="progress"></div><div class="sentence" id="sentence"></div><div class="choices" id="choices"></div><p class="status" id="status" aria-live="polite"></p><div class="foot"><button class="hint" id="hint">💡 Indice du loup</button><button class="next" id="next">Phrase suivante →</button></div><div class="memo" id="memo"></div></div></div><div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Indice grammatical"><div class="popup"><button class="close" id="close" aria-label="Fermer">✕</button><img class="wolf" src="images/logo-zou-mai-sensei.png" alt="Loup Zoumaï"><h2 id="hintTitle">L'indice du loup</h2><p id="hintText"></p><p style="font-size:.85rem;color:#526079">À toi de réessayer !</p></div></div><script>
const C={N:['Nom','#2878d0','Un nom désigne une personne, un animal, un lieu, une chose ou une idée. On peut souvent mettre « un » ou « une » devant.'], 'Dét.':['Déterminant','#e49a21','Le déterminant accompagne un nom : le, une, ces, mon…'], 'Adj.':['Adjectif','#269c68',"L’adjectif apporte une précision sur un nom et peut souvent s’accorder avec lui."],V:['Verbe','#d34a50','Le verbe peut se conjuguer. Essaie de changer le temps de la phrase.'],'Pron.':['Pronom','#9461d4','Le pronom peut remplacer un nom ou un groupe nominal.'], 'Adv.':['Adverbe','#b96b25','L’adverbe est invariable. Il peut préciser un verbe, un adjectif ou un autre adverbe.'], 'Prép.':['Préposition','#138f9a','La préposition introduit un complément : à, de, dans, avec…'], 'Conj.':['Conjonction','#c45d98','La conjonction relie des mots ou des propositions : et, mais, ou…']};
const S=[ [['Le','Dét.'],['petit','Adj.'],['renard','N'],['traverse','V'],['la','Dét.'],['forêt','N'],['sombre','Adj.']], [['Elle','Pron.'],['marche','V'],['lentement','Adv.'],['dans','Prép.'],['le','Dét.'],['jardin','N']], [['Les','Dét.'],['enfants','N'],['jouent','V'],['et','Conj.'],['leur','Dét.'],['chien','N'],['dort','V']], [['Cette','Dét.'],['grande','Adj.'],['maison','N'],['semble','V'],['très','Adv.'],['ancienne','Adj.']], [['Nous','Pron.'],['partons','V'],['avec','Prép.'],['nos','Dét.'],['amis','N'],['mais','Conj.'],['ils','Pron.'],['arrivent','V'],['tard','Adv.']], [['Le','Dét.'],['chat','N'],['noir','Adj.'],['observe','V'],['les','Dét.'],['oiseaux','N'],['depuis','Prép.'],['la','Dét.'],['fenêtre','N']] ];
let level=0,selected=0,done={},tries={},xp=0,mode='analyse',timer;const el=id=>document.getElementById(id);const words=()=>S[level%S.length];const complete=()=>Object.keys(done).length===words().length;
function render(){let w=words();el('task').textContent=mode==='analyse'?'Analyse la nature de chaque mot':mode==='express'?'Identifie les mots un par un !':'Défi : analyse sans te tromper !';el('progress').textContent='Phrase '+(level+1)+' · '+Object.keys(done).length+'/'+w.length+' mots';el('score').textContent='⭐ '+xp+' XP';el('sentence').innerHTML='';w.forEach(([t,n],i)=>{let b=document.createElement('button');b.className='word'+(i===selected?' active':'')+(done[i]?' good':'');b.textContent=t;if(done[i]){let x=document.createElement('span');x.className='tag';x.style.background=C[n][1];x.textContent=n;b.append(x)}b.onclick=()=>{selected=i;render()};el('sentence').append(b)});el('choices').innerHTML='';Object.entries(C).forEach(([id,[name,color]])=>{let b=document.createElement('button');b.className='choice';b.style.background=color;b.textContent=id+' · '+name;b.onclick=()=>answer(id);el('choices').append(b)});el('memo').innerHTML=Object.entries(C).map(([k,v])=>'<span style="background:'+v[1]+'">'+k+' · '+v[0]+'</span>').join('');}
function answer(id){if(complete()||done[selected])return;let expected=words()[selected][1];if(id===expected){done[selected]=true;xp+=tries[selected]?5:15;el('status').textContent=['✨ Bien joué !','🐾 Bravo !','🌟 Super analyse !','🎉 Combo grammatical !'][Math.floor(Math.random()*4)];if(complete()){xp+=30;el('status').textContent='🏆 Phrase complète ! +30 XP. Tu peux passer à la suivante.'}else{selected=words().findIndex((w,i)=>!done[i])}render()}else{tries[selected]=(tries[selected]||0)+1;el('status').textContent='🧐 Essaie encore : le loup a un indice pour toi.';popup(id,true)}}
function popup(id,error){let c=C[id];el('hintTitle').textContent=error?'🐺 Vérifie ton idée : '+c[0]:'🐺 Le mémo du loup';el('hintText').textContent=error?c[2]:'Observe le mot « '+words()[selected][0]+' ». Teste une manipulation : peux-tu le conjuguer, lui ajouter un déterminant ou vérifier ce qu’il précise ?';el('overlay').classList.add('show');clearTimeout(timer);timer=setTimeout(close,6500)}
function close(){el('overlay').classList.remove('show');clearTimeout(timer)}
el('close').onclick=close;el('overlay').onclick=e=>{if(e.target===el('overlay'))close()};el('hint').onclick=()=>popup(words()[selected][1],false);el('next').onclick=()=>{if(!complete()){el('status').textContent='Termine la phrase pour débloquer la suivante.';return}level++;selected=0;done={};tries={};el('status').textContent='🚀 Nouvelle mission !';render()};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('on',x===b));level=0;selected=0;done={};tries={};render()});render();
</script></html>
