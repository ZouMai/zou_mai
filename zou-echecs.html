<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zou Échecs — parcours découverte</title>
<style>
:root{font-family:system-ui,Arial,sans-serif;color:#f4f6f7;background:#172636}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:18px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}a{color:#c6e2fa}h1{margin:0;font-size:clamp(1.5rem,4vw,2.4rem)}.sub{color:#c6d2df;margin:5px 0}.layout{display:grid;grid-template-columns:minmax(0,660px) minmax(260px,1fr);gap:22px;align-items:start}.board-wrap{width:100%;max-width:660px}.board{display:grid;grid-template-columns:repeat(8,1fr);border:5px solid #34495c;border-radius:5px;overflow:hidden;touch-action:manipulation}.square{position:relative;aspect-ratio:1;display:grid;place-items:center;border:0;padding:0;cursor:pointer}.light{background:#eeeed2}.dark{background:#769656}.square.selected{background:#e8cf62}.square.last{box-shadow:inset 0 0 0 999px #e9d96655}.square.target::after{content:"";position:absolute;width:24%;height:24%;border-radius:50%;background:#233d2e80;pointer-events:none}.square.capture::after{content:"";position:absolute;inset:4%;border:5px solid #304e3988;border-radius:50%;pointer-events:none}.square img{width:91%;height:91%;object-fit:contain;position:relative;z-index:1;pointer-events:none}.coord{position:absolute;z-index:2;font-size:clamp(9px,1.4vw,13px);font-weight:800;left:3px;top:2px;color:#344a32}.dark .coord{color:#fff9dd}.file{top:auto;bottom:2px;left:auto;right:3px}.panel{background:#23374a;border-radius:16px;padding:20px}.panel h2{margin:5px 0 10px;font-size:1.25rem}.tag{font-size:.8rem;color:#a6d3ff;font-weight:700}.task{font-size:1.12rem;line-height:1.45}.status{min-height:3.2em;color:#ffe7a2;font-weight:650}.actions{display:flex;flex-wrap:wrap;gap:9px}button.action{background:#d9e7f2;color:#132333;border:0;border-radius:9px;padding:11px 14px;font-weight:800;cursor:pointer}button.action:disabled{opacity:.45;cursor:not-allowed}.steps{margin-top:20px;padding-left:22px;line-height:1.95}.steps li.done{color:#8be0a7}.steps li.active{color:#ffe18c;font-weight:800}.hint{color:#c7d4e0;font-size:.92rem}.progress{height:9px;background:#415569;border-radius:20px;overflow:hidden}.bar{height:100%;width:0;background:#8bd0a1;transition:width .25s}.foot{font-size:.8rem;color:#bdc9d6;margin-top:14px}@media(max-width:790px){.layout{grid-template-columns:1fr}.panel{padding:16px}.wrap{padding:10px}.board{border-width:3px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="wrap">
<header><div><h1>♟ Zou Échecs</h1><p class="sub">Apprendre · Jouer · Progresser</p></div><a href="jeux.html">← Retour aux jeux</a></header>
<div class="layout"><section class="board-wrap" aria-label="Échiquier interactif"><div class="board" id="board" role="group" aria-label="Échiquier 8 par 8"></div><p class="hint">Sélectionne une pièce, puis une case verte. Les coups illégaux sont refusés.</p><div class="actions"><button class="action" id="flip">↻ Retourner</button><button class="action" id="reset">↺ Recommencer</button></div></section>
<aside class="panel"><div class="tag">PARCOURS 1 · DÉCOUVERTE</div><h2 id="title">Chargement…</h2><div class="progress"><div class="bar" id="bar"></div></div><p class="task" id="task"></p><p class="status" id="status" role="status" aria-live="polite"></p><div class="actions"><button class="action" id="hint">💡 Indice</button><button class="action" id="next" disabled>Étape suivante →</button></div><ol class="steps" id="steps"></ol><p class="foot">Les règles complètes sont contrôlées par chess.js. Pièces Staunton SVG de style Lichess (CBurnett).</p></aside></div></div>
<script type="module">
import { Chess } from 'https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm';
const lessons=[
{title:'La tour',fen:'4k3/8/8/8/8/8/8/R3K3 w - - 0 1',task:'Déplace la tour de a1 jusqu’à a5.',from:'a1',to:'a5',hint:'La tour avance en ligne droite, horizontalement ou verticalement.'},
{title:'Le fou',fen:'4k3/8/8/8/8/8/8/2B1K3 w - - 0 1',task:'Déplace le fou de c1 à g5.',from:'c1',to:'g5',hint:'Le fou se déplace en diagonale.'},
{title:'La dame',fen:'4k3/8/8/8/8/8/8/3QK3 w - - 0 1',task:'Déplace la dame de d1 à d5.',from:'d1',to:'d5',hint:'La dame combine les déplacements de la tour et du fou.'},
{title:'Le cavalier',fen:'4k3/8/8/8/8/8/8/1N2K3 w - - 0 1',task:'Déplace le cavalier de b1 à c3.',from:'b1',to:'c3',hint:'Le cavalier saute en L : deux cases puis une sur le côté.'},
{title:'Le pion',fen:'4k3/8/8/8/8/8/4P3/4K3 w - - 0 1',task:'Avance le pion de e2 à e4.',from:'e2',to:'e4',hint:'Depuis sa case de départ, un pion peut avancer de deux cases si elles sont libres.'},
{title:'La capture',fen:'4k3/8/8/8/3p4/8/8/R3K3 w - - 0 1',task:'Capture le pion noir en d4 avec la tour de a1.',from:'a1',to:'d4',hint:'Une pièce capture une pièce adverse en prenant sa place.'}
];
let step=0,game,selected=null,flipped=false,complete=false,last=[];
const $=id=>document.getElementById(id),names={k:'roi',q:'dame',r:'tour',b:'fou',n:'cavalier',p:'pion'};
function load(){game=new Chess(lessons[step].fen);selected=null;complete=false;last=[];render();$('status').textContent='À toi de jouer !';$('next').disabled=true}
function render(){const l=lessons[step];$('title').textContent=l.title;$('task').textContent=l.task;$('bar').style.width=(100*(step+(complete?1:0))/lessons.length)+'%';$('steps').innerHTML=lessons.map((x,i)=>'<li class="'+(i<step?'done':i===step?'active':'')+'">'+x.title+(i<step?' ✓':'')+'</li>').join('');
const root=$('board');root.replaceChildren();let squares=[];for(let rank=8;rank>=1;rank--)for(let file=0;file<8;file++)squares.push('abcdefgh'[file]+rank);if(flipped)squares.reverse();
const moves=selected?game.moves({square:selected,verbose:true}):[];
for(const sq of squares){const piece=game.get(sq),f=sq.charCodeAt(0)-97,r=Number(sq[1]);const btn=document.createElement('button');btn.type='button';btn.className='square '+((f+r)%2?'light':'dark');if(sq===selected)btn.classList.add('selected');if(last.includes(sq))btn.classList.add('last');if(moves.some(m=>m.to===sq))btn.classList.add(piece?'capture':'target');btn.setAttribute('aria-label',sq+(piece?' '+(piece.color==='w'?'blanc ':'noir ')+names[piece.type]:' vide'));if(piece){const img=document.createElement('img');img.alt='';img.src='https://lichess1.org/assets/piece/cburnett/'+piece.color+piece.type.toUpperCase()+'.svg';btn.append(img)}if((flipped?r===8:r===1)||(flipped?r===1:r===8)){if((flipped?r===8:r===1)){const c=document.createElement('span');c.className='coord file';c.textContent=sq[0];btn.append(c)}}if((flipped?f===7:f===0)){const c=document.createElement('span');c.className='coord';c.textContent=r;btn.append(c)}btn.addEventListener('click',()=>click(sq));root.append(btn)}}
function click(sq){if(complete)return;const p=game.get(sq);if(selected){const possible=game.moves({square:selected,verbose:true}).find(m=>m.to===sq);if(possible){const from=selected;game.move({from,to:sq,promotion:'q'});selected=null;last=[from,sq];if(from===lessons[step].from&&sq===lessons[step].to){complete=true;$('status').textContent='Bravo ! Défi réussi. ⭐';$('next').disabled=false}else{$('status').textContent='Coup légal, mais ce n’est pas encore le coup demandé. Recommence.';setTimeout(()=>{if(!complete){game.undo();last=[];render()}},700)}render();return}}selected=p&&p.color===game.turn()?sq:null;render()}
$('hint').onclick=()=>$('status').textContent=lessons[step].hint;
$('flip').onclick=()=>{flipped=!flipped;render()};
$('reset').onclick=load;
$('next').onclick=()=>{if(!complete)return;if(step<lessons.length-1){step++;load()}else{$('status').textContent='Parcours terminé ! Bravo ! 🏆';$('next').disabled=true}};
load();
</script></body></html>
