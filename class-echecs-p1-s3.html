<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class'Échecs · Le fou</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#edf5f3;background:#142535}*{box-sizing:border-box}body{margin:0}main{max-width:720px;margin:auto;padding:16px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}a{color:#d2e8dc}h1{font-size:clamp(1.4rem,4vw,2rem);margin:18px 0 5px}.muted{color:#c6d4da;font-size:.9rem}.board-wrap{position:relative;margin:18px auto 12px;max-width:620px}.board{display:grid;grid-template-columns:repeat(8,1fr);border:5px solid #354d5c;border-radius:8px;overflow:hidden;box-shadow:0 12px 35px #09182466}.sq{border:0;padding:0;aspect-ratio:1;display:grid;place-items:center;position:relative;cursor:pointer;touch-action:manipulation}.light{background:#eeeed2}.dark{background:#769656}.sq.selected{background:#e5c968!important}.sq.target:after{content:"";position:absolute;width:23%;height:23%;border-radius:50%;background:#21463888}.sq.capture:after{content:"";position:absolute;inset:5%;border:4px solid #2d584999;border-radius:50%}.sq img{width:96%;height:96%;pointer-events:none;filter:drop-shadow(0 2px 1px #17212b35)}.coord{position:absolute;font-size:clamp(11px,2vw,16px);font-weight:900;pointer-events:none}.coord.rank{top:2px;left:4px}.coord.file{bottom:2px;right:4px}.light .coord{color:#527249}.dark .coord{color:#f8f3d9}.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:12px 0}.controls button,.overlay button{border:0;border-radius:10px;background:#d8e8ce;color:#142535;padding:12px 17px;font:inherit;font-weight:800;cursor:pointer}.message{font-weight:700;min-height:2.5em;text-align:center;color:#ffe5a4}.meta{text-align:center;color:#c6d4da}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:7%;background:#132739a0;z-index:10}.overlay[hidden]{display:none}.overlay-card{background:#fffdf5;color:#142535;border:3px solid #e8d596;border-radius:18px;padding:clamp(15px,4vw,28px);text-align:center;max-width:95%;box-shadow:0 12px 40px #0007}.overlay-card h2{margin:0 0 8px}.overlay-card p{line-height:1.5}.overlay-card button{background:#25485a;color:white}.arrow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}.sq:focus-visible{outline:3px solid #ffca65;outline-offset:-3px;z-index:4}
</style></head><body><main><header><strong>♟ Class'Échecs</strong><a href="class-echecs.html#parcours-1">← Les séances</a></header><h1>♝ Séance 3 · Les fous</h1><p class="muted">Séance 3 · Se déplacer en diagonale</p><div class="board-wrap"><div id="board" class="board" aria-label="Échiquier de le fou"></div><svg id="arrows" class="arrow" viewBox="0 0 800 800" aria-hidden="true" hidden><defs><marker id="arrowhead" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0 L5 2.5 L0 5 Z" fill="#efb72b"/></marker></defs><line id="arrowline" x1="0" y1="0" x2="0" y2="0" stroke="#efb72b" stroke-width="14" stroke-linecap="round" marker-end="url(#arrowhead)"/></svg><div id="overlay" class="overlay" hidden><div class="overlay-card"><h2 id="overlay-title">🎯 Ta mission</h2><p id="overlay-text">Rejoins la case c1 avec ton fou en suivant les diagonales.</p><button id="overlay-button">Je joue !</button></div></div></div><p class="meta" id="progress">0 coup · Destination : c1</p><p class="message" id="message" role="status" aria-live="polite"></p><div class="controls"><button id="hint">💡 Indice</button><button id="undo">↶ Annuler</button><button id="reset">↺ Recommencer</button></div><p class="muted">Clique sur le fou puis sur une case marquée. Le fou se déplace en diagonale.</p></main><script>
'use strict';
const $=id=>document.getElementById(id),files='abcdefgh',goal='c1';let bishop='f6',selected=false,history=[],timer=null,completed=false;
function legal(s){const dx=Math.abs(files.indexOf(s[0])-files.indexOf(bishop[0])),dy=Math.abs(Number(s[1])-Number(bishop[1]));return dx===dy&&dx>0}
function clearArrow(){$('arrows').hidden=true}
function draw(){const board=$('board');board.replaceChildren();for(let r=8;r>=1;r--)for(let f=0;f<8;f++){const sq=files[f]+r,cell=document.createElement('button');cell.type='button';cell.className='sq '+((f+r)%2?'dark':'light');cell.setAttribute('aria-label',sq+(sq===bishop?' fou blanc':''));if(sq===bishop&&selected)cell.classList.add('selected');if(selected&&legal(sq))cell.classList.add('target');if(sq===goal)cell.style.boxShadow='inset 0 0 0 4px #e2ad32';if(sq===bishop){const img=document.createElement('img');img.alt='';img.src='https://lichess1.org/assets/piece/merida/wB.svg';cell.append(img)}if(f===0){const e=document.createElement('span');e.className='coord rank';e.textContent=r;cell.append(e)}if(r===1){const e=document.createElement('span');e.className='coord file';e.textContent=files[f];cell.append(e)}cell.addEventListener('click',()=>play(sq));cell.draggable=sq===bishop;cell.addEventListener('dragstart',e=>{if(sq!==bishop){e.preventDefault();return}e.dataTransfer.setData('text/plain',sq)});cell.addEventListener('dragover',e=>e.preventDefault());cell.addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer.getData('text/plain')===bishop){selected=true;play(sq)}});board.append(cell)}$('progress').textContent=history.length+' coup'+(history.length>1?'s':'')+' · Objectif : '+goal}
function overlay(title,text,button,action){$('overlay-title').textContent=title;$('overlay-text').textContent=text;$('overlay-button').textContent=button;$('overlay-button').onclick=action;$('overlay').hidden=false}
function dismiss(){$('overlay').hidden=true}
function play(sq){if(completed)return;if(!$('overlay').hidden)dismiss();clearArrow();if(sq===bishop){selected=!selected;$('message').textContent=selected?'Choisis une case indiquée.':'';draw();return}if(!selected){$('message').textContent='Clique d’abord sur le fou blanc.';return}if(!legal(sq)){$('message').textContent='Le fou avance uniquement en diagonale.';return}history.push(bishop);bishop=sq;selected=false;draw();if(sq===goal){completed=true;$('message').textContent='Bravo ! Tu as atteint c1.';overlay('🏆 Bravo !','Tu as atteint c1 en '+history.length+' coups.','Continuer →',()=>location.href='class-echecs-exercices.html?parcours=1&seance=4');timer=setTimeout(()=>location.href='class-echecs-exercices.html?parcours=1&seance=4',2600)}else{$('message').textContent=['Bien joué !','Joli coup !','Continue !'][history.length%3]}}
function reset(){if(timer)clearTimeout(timer);timer=null;bishop='f6';selected=false;history=[];completed=false;clearArrow();dismiss();$('message').textContent='Clique sur le fou blanc pour commencer.';draw()}
$('reset').onclick=reset;$('undo').onclick=()=>{if(!history.length)return;if(timer)clearTimeout(timer);completed=false;dismiss();bishop=history.pop();selected=false;clearArrow();draw();$('message').textContent='Coup annulé.'};
$('hint').onclick=()=>{const target=legal(goal)?goal:'h4';const board=$('board'),a=[...board.children].find(c=>c.getAttribute('aria-label').startsWith(bishop)),b=[...board.children].find(c=>c.getAttribute('aria-label').startsWith(target));if(!a||!b)return;const bounds=board.getBoundingClientRect(),center=e=>{const r=e.getBoundingClientRect();return {x:(r.left+r.width/2-bounds.left)/bounds.width*800,y:(r.top+r.height/2-bounds.top)/bounds.height*800}};const p=center(a),q=center(b);$('arrowline').setAttribute('x1',p.x);$('arrowline').setAttribute('y1',p.y);$('arrowline').setAttribute('x2',q.x);$('arrowline').setAttribute('y2',q.y);$('arrows').hidden=false;$('message').textContent='Le fou se déplace en diagonale. Suis la flèche.'};
draw();$('overlay-button').onclick=dismiss;$('message').textContent='Clique sur le fou blanc pour commencer.';
</script></body></html>
