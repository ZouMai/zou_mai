<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Miroir Magique · 4 modes · Zou Maï</title><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><link rel="stylesheet" href="zoumai.css"><link rel="stylesheet" href="zoumai-brand.css"><style>
*{box-sizing:border-box}body{margin:0;background:#10151f;color:#f8f5eb;font-family:Arial,sans-serif}main{max-width:980px;margin:auto;padding:20px 12px 65px}.back{color:#ffdc59;font-weight:800}h1{font-size:clamp(2rem,6vw,3.4rem);margin:20px 0 6px}.intro{color:#d2deea;line-height:1.5}.panel{background:#1b2839;border:2px solid #435973;border-radius:22px;padding:clamp(10px,3vw,24px)}.modes,.tools,.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:15px 0}button{font:inherit;cursor:pointer}.mode,.tool,.action{border:2px solid #62758d;border-radius:11px;background:#31445e;color:white;padding:10px 13px;font-weight:800}.mode.active,.tool.active{background:#ffdb55;color:#131923;border-color:#ffdb55}.action.primary{background:#ffdb55;color:#131923;border-color:#ffdb55}.info{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;font-weight:800}.tag{padding:8px 12px;border-radius:12px;background:#344963}.board{display:grid;width:min(100%,560px);aspect-ratio:1;grid-template-rows:repeat(13,minmax(0,1fr));margin:16px auto;gap:1px;background:#9badbf;padding:2px;border:2px solid #8ba0b5;border-radius:8px;overflow:hidden;touch-action:manipulation}.cell{border:0;border-radius:0;min-width:0;min-height:0;padding:0;background:#f0f5fc;position:relative;aspect-ratio:1}.cell.right{background:#f0f5fc;cursor:pointer}.cell.axis{background:#f0f5fc}.cell.axis:after{content:"";position:absolute;left:50%;top:0;height:100%;border-left:2px dashed #8557c6;pointer-events:none}.cell.model{background:#348cdb}.cell.drawn{background:#e6a63d}.cell.correct{background:#30b67e}.cell.wrong{background:#ec6874}.cell.hint{outline:2px dashed #159e72;outline-offset:-2px}.cell svg{width:100%;height:100%;display:block}.cell:focus-visible{outline:3px solid #fff;z-index:3}.feedback{text-align:center;min-height:52px;padding:12px;font-weight:800}.legend{text-align:center;color:#d3dce7;font-size:.9rem}.stars{text-align:center;color:#ffd54b;font-size:1.4rem;min-height:27px}.subtitle{text-align:center;font-weight:800;color:#cbd8ea}.tool[disabled]{opacity:.5}.instructions{color:#d3dce7;text-align:center;font-size:.9rem}@media(max-width:550px){.mode,.tool,.action{padding:9px 10px;font-size:.82rem}.board{gap:1px}}
</style></head><body><main><a class="back" href="jeux.html">← Retour aux jeux</a><h1>🪞 MIROIR MAGIQUE</h1><p class="intro">Construis le reflet exact d'une figure. Les formes doivent être à la bonne distance de l'axe et les triangles orientés dans le bon sens.</p><section class="panel"><div class="modes" id="modes"></div><div class="info"><span class="tag" id="level"></span><span class="tag" id="score"></span></div><p class="subtitle" id="name"></p><div class="tools" id="tools"></div><div class="board" id="board" aria-label="Quadrillage de symétrie"></div><p class="instructions" id="instructions"></p><p class="legend">Quadrillage uniforme · Bleu : modèle · Orange : ta réponse · Trait violet : axe</p><div class="stars" id="stars"></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div><div class="actions"><button class="action primary" id="check">✓ Vérifier</button><button class="action" id="hint">💡 Indice</button><button class="action" id="clear">↺ Effacer</button><button class="action primary" id="next">Suivant →</button></div></section></main><script>
'use strict';
const modeNames=['Pixel miroir','Demi-carrés','Architecte','Expert'],N=13,axis=6;
const shapes=[
{name:'Éclair',cells:[[0,0,1],[1,0,1],[2,0,1],[2,1,1],[3,1,1],[3,2,1]]},
{name:'Escalier',cells:[[0,0,1],[1,0,1],[1,1,1],[2,1,1],[2,2,1],[3,2,1],[3,3,1]]},
{name:'Flèche',cells:[[0,1,1],[1,0,1],[1,1,1],[1,2,1],[2,1,1],[3,1,1]]},
{name:'Couronne',cells:[[0,0,1],[0,2,1],[0,4,1],[1,0,1],[1,1,1],[1,2,1],[1,3,1],[1,4,1],[2,0,1],[2,4,1],[3,0,1],[3,1,1],[3,2,1],[3,3,1],[3,4,1]]},
{name:'Papillon',cells:[[0,1,2],[0,2,1],[1,0,2],[1,1,1],[1,2,1],[2,1,1],[2,2,1],[3,0,3],[3,1,1],[3,2,1],[4,1,4],[4,2,1]]},
{name:'Fusée',cells:[[0,2,2],[1,1,2],[1,2,1],[2,1,1],[2,2,1],[3,0,2],[3,1,1],[3,2,1],[4,0,1],[4,1,1],[4,2,1],[5,1,3],[5,2,1]]},
{name:'Château',cells:[[0,0,1],[0,2,1],[1,0,1],[1,1,1],[1,2,1],[2,0,1],[2,1,1],[2,2,1],[3,0,1],[3,2,1],[4,0,1],[4,1,1],[4,2,1]]},
{name:'Robot',cells:[[0,0,1],[0,1,1],[0,2,1],[1,0,1],[1,2,1],[2,0,1],[2,1,1],[2,2,1],[3,1,1],[4,0,1],[4,2,1]]},
{name:'Maison',cells:[[0,2,2],[1,1,2],[1,2,1],[2,0,2],[2,1,1],[2,2,1],[3,0,1],[3,1,1],[3,2,1],[4,0,1],[4,2,1]]},
{name:'Sapins',cells:[[0,1,2],[1,0,2],[1,1,1],[1,2,1],[2,0,1],[2,1,1],[2,2,1],[3,1,1],[4,0,2],[4,1,1],[4,2,1]]},
{name:'Diamant',cells:[[0,2,2],[1,1,2],[1,2,1],[2,0,2],[2,1,1],[2,2,1],[3,1,3],[3,2,1],[4,2,4]]},
{name:'Blason',cells:[[0,0,1],[0,1,1],[0,2,1],[1,0,1],[1,1,1],[1,2,1],[2,0,1],[2,1,1],[2,2,1],[3,0,3],[3,1,1],[3,2,1],[4,1,3],[4,2,1]]}
];
let mode=0,step=0,placed=new Map(),tool=1,hints=0,checked=false,showHint=false;
const solved=new Map(),key=(r,c)=>r+','+c;
const triangles={2:'0,0 100,0 0,100',3:'0,0 100,0 100,100',4:'100,0 100,100 0,100',5:'0,0 0,100 100,100'};
function pattern(){let p=shapes[(step+mode*3)%shapes.length];return p}
function data(){let p=pattern(),a=new Map(),b=new Map(),offset=mode===0?2:mode===1?1:mode===2?0:step%3;for(const [r,c,v] of p.cells){let rr=r+3,cc=5-c-offset;if(cc<0)continue;let val=mode===0?1:v; if(mode===1&&v===1&&(r+c)%3===0)val=2+(r+c)%4; if(mode===3&&v===1&&(r+c+step)%4===0)val=2+(r+c)%4;a.set(key(rr,cc),val);b.set(key(rr,12-cc),val===2?3:val===3?2:val===4?5:val===5?4:val)}return {a,b}}
function cellSvg(v){return v>1?'<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polygon points="'+triangles[v]+'" fill="currentColor"/></svg>':''}
function render(){const {a,b}=data(),board=document.getElementById('board');board.replaceChildren();board.style.gridTemplateColumns='repeat('+N+',1fr)';for(let r=0;r<N;r++)for(let c=0;c<N;c++){const k=key(r,c),btn=document.createElement('button');btn.type='button';btn.className='cell '+(c===axis?'axis':c>axis?'right':'');let v=c<axis?a.get(k):placed.get(k);if(c<axis&&v)btn.classList.add('model');if(c>axis&&v){btn.classList.add(checked?(b.get(k)===v?'correct':'wrong'):'drawn');if(v>1)btn.style.color=checked?(b.get(k)===v?'#30b67e':'#ec6874'):'#e6a63d'}if(showHint&&b.has(k)&&!placed.has(k))btn.classList.add('hint');if(v>1){btn.classList.remove('model','drawn','correct','wrong');btn.style.background='#f0f5fc';btn.style.color=c<axis?'#348cdb':checked?(b.get(k)===v?'#30b67e':'#ec6874'):'#e6a63d';btn.innerHTML=cellSvg(v)}btn.disabled=c<=axis;btn.setAttribute('aria-label','Ligne '+(r+1)+', colonne '+(c+1)+(v?', pièce '+v:''));if(c>axis)btn.onclick=()=>{let current=placed.get(k)||0;if(mode===0){current=current?0:1}else{current=tool===current?0:tool}current?placed.set(k,current):placed.delete(k);checked=false;document.getElementById('feedback').textContent='Continue, puis vérifie ton dessin.';render()};board.append(btn)}document.getElementById('level').textContent='Mode '+(mode+1)+' / 4 · Défi '+(step+1)+' / 10';document.getElementById('name').textContent=(mode>=2?pattern().name:'Figure '+(step+1));document.getElementById('score').textContent='⭐ '+[...solved.keys()].filter(k=>k.startsWith(mode+'-')).length+' / 10 défis réussis';document.getElementById('instructions').textContent=mode===0?'Clique sur les cases à colorier.': 'Choisis une pièce, puis clique sur les cases du quadrillage. Un second clic avec la même pièce l’efface.';document.querySelectorAll('.mode').forEach((b,i)=>{b.classList.toggle('active',i===mode);b.setAttribute('aria-pressed',String(i===mode))});document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('active',Number(b.dataset.value)===tool))}
function setup(){const modes=document.getElementById('modes');modeNames.forEach((name,i)=>{let b=document.createElement('button');b.className='mode';b.textContent=(i+1)+'. '+name;b.onclick=()=>{mode=i;step=0;reset();setupTools();render()};modes.append(b)});setupTools();render()}
function setupTools(){let area=document.getElementById('tools');area.replaceChildren();if(mode===0)return;[1,2,3,4,5].forEach(v=>{let b=document.createElement('button');b.className='tool';b.dataset.value=v;b.innerHTML=v===1?'■ Carré':'◢ Triangle '+(v-1);b.onclick=()=>{tool=v;render()};area.append(b)})}
function reset(){placed.clear();checked=false;showHint=false;hints=0;tool=1;document.getElementById('feedback').textContent='À toi de jouer !';document.getElementById('stars').textContent=''}
document.getElementById('check').onclick=()=>{checked=true;const {b}=data();let good=[...placed].filter(([k,v])=>b.get(k)===v).length,wrong=[...placed].filter(([k,v])=>b.get(k)!==v).length;if(good===b.size&&wrong===0){let stars=hints===0?3:hints===1?2:1;let id=mode+'-'+step;solved.set(id,Math.max(stars,solved.get(id)||0));document.getElementById('stars').textContent='★'.repeat(stars)+'☆'.repeat(3-stars);document.getElementById('feedback').textContent='Bravo ! Symétrie parfaite. '+stars+' étoile(s) !'}else document.getElementById('feedback').textContent=good+' / '+b.size+' pièces correctes et '+wrong+' erreur(s). Vérifie aussi le sens des triangles.';render()};
document.getElementById('hint').onclick=()=>{showHint=!showHint;if(showHint)hints++;document.getElementById('feedback').textContent=showHint?'Les contours verts indiquent les emplacements manquants.':'Continue sans les indices.';render()};
document.getElementById('clear').onclick=()=>{placed.clear();checked=false;showHint=false;document.getElementById('feedback').textContent='Réessaie !';document.getElementById('stars').textContent='';render()};
document.getElementById('next').onclick=()=>{step=(step+1)%10;reset();render()};
setup();
</script><script src="site-tracking.js" defer></script></body></html>
