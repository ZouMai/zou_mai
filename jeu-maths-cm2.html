</style></head><body><main class="wrap"><div class="top"><a class="brand" href="maths-lecons-cm2.html">← ZOU MAÏ · MATHS</a><span class="badge" id="badge">CM2</span></div><div class="hero"><div><span class="badge" id="category">Une leçon, un défi</span><h1 id="title">Défis de maths</h1><p id="subtitle">Observe, calcule et progresse à ton rythme.</p></div><img src="images/loup-bleu-original.png" alt="Le loup bleu de Zou Maï"></div><section class="card" id="intro"><h2>Ta mission</h2><p id="introText"></p><p>Aucun chronomètre : tu peux prendre le temps de réfléchir. Tu recevras une explication après chaque réponse.</p><button id="start" class="btn">Commencer →</button></section><section class="card hidden" id="game"><div class="row"><span id="counter"></span><span id="points"></span></div><div class="progress"><span id="progress"></span></div><div class="question" id="question"></div><div class="diagram hidden" id="diagram"></div><div class="options" id="options"></div><div class="feedback hidden" id="feedback" role="status" aria-live="polite"></div><div class="actions"><span class="note">Une réponse par question.</span><button id="next" class="btn hidden">Question suivante →</button></div></section><section class="card hidden" id="end"><h2 id="result"></h2><p id="conclusion"></p><div class="review hidden" id="review"></div><div class="actions"><button id="again" class="btn">Rejouer ↻</button><a href="maths-lecons-cm2.html">Toutes les leçons →</a></div></section></main><script>
(()=>{'use strict';
const titles={4:'Droites perpendiculaires',5:'Fractions (2)',6:'Fractions décimales',7:'Nombres décimaux (1)',8:'Périmètres',9:'Multiplications avec des nombres entiers',10:'Division euclidienne',11:'Droites parallèles',12:'Proportionnalité (1) : passage à l’unité',13:'Multiplier et diviser un décimal par 10, 100, 1 000',14:'Multiplier un décimal par un entier',15:'Multiples et diviseurs',16:'Grands nombres entiers : les millions',17:'Aires (2)',18:'Nombres décimaux (2) : repérage',19:'Proportionnalité (2) : pourcentages',20:'Division décimale',21:'Nombres décimaux (3) : comparer et ranger',22:'Angles',23:'Cercle et disque',24:'Grands nombres entiers : les milliards',25:'Durées',26:'Triangles',27:'Aires (3)',28:'Quadrilatères',29:'Reproduction de figures',30:'Nombres décimaux (4)',31:'Construction de figures',32:'Symétrie axiale',33:'Proportionnalité (3) : échelles',34:'Solides',35:'Volumes et contenances'};
const n=Number(new URLSearchParams(location.search).get('m'));if(!titles[n]){location.replace('maths-lecons-cm2.html');return}
const $=s=>document.querySelector(s),rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[rand(0,a.length-1)],shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a},fmt=x=>String(Number(x.toFixed(5))).replace('.',','),sp=x=>Math.trunc(x).toLocaleString('fr-FR').replace(/\u202f/g,' '),Q=(ask,correct,wrong,why,visual='')=>({ask,correct:String(correct),wrong:wrong.map(String),why,visual});
const numberOptions=(v,offsets=[-2,-1,1,2],format=fmt)=>offsets.map(k=>format(v+k));
function lineFig(kind){const lines={perp:'<path d="M30 55H310 M170 10V100"/><path d="M170 55h16v16" stroke="#e58a2b"/>',parallel:'<path d="M30 30H310 M30 78H310"/>',cross:'<path d="M30 25L310 90 M30 90L310 25"/>',oblique:'<path d="M30 86H310 M80 10L220 105"/>'};return `<svg viewBox="0 0 340 115" width="340" aria-label="Deux droites à observer"><g fill="none" stroke="#364cc0" stroke-width="4" stroke-linecap="round">${lines[kind]}</g></svg>`}
function gridFig(kind,dist=3){let s='<svg viewBox="0 0 240 140" width="240" aria-label="Figure sur quadrillage">';for(let x=20;x<=220;x+=20)s+=`<path d="M${x} 10V130" stroke="#d6ddeb"/>`;for(let y=10;y<=130;y+=20)s+=`<path d="M20 ${y}H220" stroke="#d6ddeb"/>`;if(kind==='mirror')s+='<path d="M120 5V135" stroke="#e35a66" stroke-width="3" stroke-dasharray="5 4"/><circle cx="${120-20*dist}" cy="50" r="7" fill="#315bc4"/><text x="${108-20*dist}" y="42">A</text>';else s+='<path d="M40 110L140 30L200 110Z" stroke="#284ba9" stroke-width="3" fill="#9edfd7"/><text x="32" y="123">A</text><text x="139" y="24">B</text><text x="204" y="122">C</text>';return s+'</svg>'}
function circleFig(kind){return `<svg viewBox="0 0 220 150" width="220" aria-label="Cercle de centre O"><circle cx="110" cy="75" r="58" fill="${kind==='disc'?'#c2ece5':'none'}" stroke="#3753b5" stroke-width="3"/><circle cx="110" cy="75" r="3" fill="#111"/><text x="103" y="70">O</text><path d="M110 75H168" stroke="#ef704d" stroke-width="3"/><text x="136" y="69">r</text></svg>`}
function angleFig(deg){let x=65+60*Math.cos(deg*Math.PI/180),y=95-60*Math.sin(deg*Math.PI/180);return `<svg viewBox="0 0 190 120" width="190" aria-label="Angle de ${deg} degrés"><path d="M65 95H155 M65 95L${x.toFixed(1)} ${y.toFixed(1)}" fill="none" stroke="#4351c7" stroke-width="4" stroke-linecap="round"/><circle cx="65" cy="95" r="4" fill="#17213d"/></svg>`}
function make(k){let a=[],i,den,num,whole,other,v,d,h,l,w,arr,kind,op;
for(i=0;i<15;i++){
switch(k){
case 4:if(i%3===0){kind=pick(['perp','parallel','oblique']);a.push(Q('Quelle relation vois-tu entre les deux droites ?',kind==='perp'?'perpendiculaires':kind==='parallel'?'parallèles':'sécantes sans angle droit',['parallèles','perpendiculaires','sécantes sans angle droit'].filter(x=>x!==(kind==='perp'?'perpendiculaires':kind==='parallel'?'parallèles':'sécantes sans angle droit')),'Des droites perpendiculaires forment un angle droit. Des parallèles gardent le même écartement.',lineFig(kind)))}else if(i%3===1){a.push(Q('Quelle est la mesure de l’angle formé par deux droites perpendiculaires ?','90°',['45°','180°','360°'],'Elles forment quatre angles droits, chacun de 90°.',lineFig('perp')))}else{v=rand(2,9);a.push(Q(`Le plus court segment entre le point A et la droite (d) mesure ${v} cm. Quelle est la distance de A à (d) ?`,`${v} cm`,[`${v+1} cm`,`${2*v} cm`,`${v-1} cm`],'La distance d’un point à une droite est mesurée sur le segment perpendiculaire.'))}break;
case 5:den=rand(3,9);num=rand(1,den+4);other=rand(1,den+4);if(i%2){let answer=num<den?'< 1':num===den?'= 1':'> 1';a.push(Q(`${num}/${den} est…`,answer,['< 1','= 1','> 1'].filter(x=>x!==answer),`Compare le numérateur ${num} au dénominateur ${den}.`))}else{let answer=num<other?'<':num===other?'=':'>';a.push(Q(`Complète : ${num}/${den} … ${other}/${den}`,answer,['<','=','>'].filter(x=>x!==answer),'Quand les dénominateurs sont égaux, compare les numérateurs.'))}break;
case 6:den=pick([10,100,1000]);num=rand(1,den-1);if(i%2){a.push(Q(`Quelle fraction est une fraction décimale ?`,`${num}/${den}`,[`${num}/3`,`${num}/7`,`${num}/9`],'Une fraction décimale a pour dénominateur 10, 100 ou 1 000.'))}else{let answer=den===10?'dixième':den===100?'centième':'millième';a.push(Q(`Comment appelle-t-on 1/${den} ?`,answer,['dixième','centième','millième'].filter(x=>x!==answer),`Une unité partagée en ${den} parts égales donne des ${answer}s.`))}break;
case 7:v=rand(1,89)+rand(1,99)/100;if(i%2){let b=rand(2,40)/10,base=Math.round(v*100)/100;a.push(Q(`${fmt(base)} + ${fmt(b)} = ?`,fmt(base+b),[fmt(base+b+.1),fmt(base+b+1),fmt(base+b-.1)],'Aligne unités, dixièmes et centièmes.'))}else{let b=rand(10,Math.floor(v*10))/10;a.push(Q(`${fmt(v)} − ${fmt(b)} = ?`,fmt(v-b),[fmt(v-b+.1),fmt(v-b+1),fmt(v-b-.1)],'Aligne les virgules avant de soustraire.'))}break;
case 8:l=rand(3,14);w=rand(2,9);a.push(Q(`Un rectangle mesure ${l} cm sur ${w} cm. Quel est son périmètre ?`,`${2*(l+w)} cm`,[`${l*w} cm`,`${l+w} cm`,`${2*l+w} cm`],'Additionne les quatre côtés : P = 2 × (L + l).'));break;
case 9:l=rand(12,58);w=rand(3,19);v=l*w;a.push(Q(`${l} × ${w} = ?`,sp(v),[sp(v+l),sp(v-w),sp(v+10*w)],`Décompose ${w} en dizaines et unités puis additionne les produits.`));break;
case 10:d=rand(3,12);whole=rand(4,24);num=rand(1,d-1);v=d*whole+num;if(i%2)a.push(Q(`Dans ${v} ÷ ${d}, quel est le quotient entier ?`,String(whole),[whole-1,whole+1,num],`${v} = ${d} × ${whole} + ${num}.`));else a.push(Q(`Dans ${v} ÷ ${d}, quel est le reste ?`,String(num),[num+1,num-1,d],`Le reste ${num} est inférieur au diviseur ${d}.`));break;
case 11:if(i%3===0){kind=pick(['parallel','perp','cross']);a.push(Q('Ces deux droites sont-elles parallèles ?',kind==='parallel'?'Oui':'Non',[kind==='parallel'?'Non':'Oui','Elles sont confondues','Impossible à déterminer'],'Des parallèles ont toujours le même écartement.',lineFig(kind)))}else if(i%3===1){a.push(Q('Deux droites perpendiculaires à une même droite sont…','parallèles',['perpendiculaires','sécantes avec un angle aigu','confondues'],'Deux perpendiculaires à une même droite sont parallèles.'))}else{v=rand(2,9);a.push(Q(`L’écartement entre deux droites parallèles vaut ${v} cm à un endroit. Plus loin, cet écartement vaut…`,`${v} cm`,[`${v+1} cm`,`${v-1} cm`,`${2*v} cm`],'L’écartement entre deux droites parallèles est constant.'))}break;
case 12:d=rand(2,8);v=rand(2,9);h=rand(3,9);a.push(Q(`${d} cahiers coûtent ${fmt(d*v)} €. Combien coûtent ${h} cahiers identiques ?`,`${fmt(h*v)} €`,[`${fmt(d*v+h)} €`,`${fmt(v+h)} €`,`${fmt(h*(v+1))} €`],`Un cahier coûte ${fmt(v)} €. Multiplie par ${h}.`));break;
case 13:v=rand(101,987)/100;d=pick([10,100,1000]);op=i%2?'÷':'×';whole=op==='×'?v*d:v/d;a.push(Q(`${fmt(v)} ${op} ${sp(d)} = ?`,fmt(whole),[fmt(whole*10),fmt(whole/10),fmt(whole+1)],`Multiplier ou diviser par ${d} déplace la valeur de chaque chiffre de ${String(d).length-1} rang(s).`));break;
case 14:v=rand(12,89)/10;d=rand(2,9);a.push(Q(`${fmt(v)} × ${d} = ?`,fmt(v*d),[fmt(v*d+1),fmt(v*d+.1),fmt(v*d-d)],'Multiplie comme avec des entiers, puis replace la virgule.'));break;
case 15:d=pick([2,3,5,9,10]);v=rand(3,30)*d;num=v+1;a.push(Q(`Lequel de ces nombres est divisible par ${d} ?`,sp(v),[sp(num),sp(v+d-1),sp(v+d+1)],`${v} = ${d} × ${v/d}.`));break;
case 16:v=rand(1,92)*1000000+rand(1,999)*1000+rand(1,999);a.push(Q(`Dans ${sp(v)}, combien y a-t-il de millions entiers ?`,String(Math.floor(v/1e6)),[Math.floor(v/1e6)+1,Math.floor(v/1000),Math.floor(v/1e6)-1],`Lis la classe des millions : ${Math.floor(v/1e6)}.`));break;
case 17:l=rand(3,13);w=rand(2,9);if(i%2)a.push(Q(`Aire d’un rectangle de ${l} cm sur ${w} cm ?`,`${l*w} cm²`,[`${2*(l+w)} cm²`,`${l+w} cm²`,`${l*w*2} cm²`],'Aire du rectangle = longueur × largeur.'));else a.push(Q(`Aire d’un carré de côté ${l} cm ?`,`${l*l} cm²`,[`${4*l} cm²`,`${2*l} cm²`,`${l*l+l} cm²`],'Aire du carré = côté × côté.'));break;
case 18:den=pick([10,100,1000]);num=rand(1,den-1);v=num/den;a.push(Q(`Sur une droite graduée en ${den} parts par unité, où placer ${num}/${den} ?`,fmt(v),[fmt((num+1)/den),fmt((num+den)/den),fmt((num-1)/den)],`Chaque graduation vaut 1/${den} : avance de ${num} graduations.`));break;
case 19:d=pick([10,20,25,50,75]);v=pick([100,200,400]);whole=d*v/100;a.push(Q(`${d} % de ${v} objets, cela fait combien d’objets ?`,sp(whole),[sp(d),sp(whole+v/10),sp(v-whole)],`${d} % signifie ${d} sur 100 : ${v} × ${d} ÷ 100 = ${whole}.`));break;
case 20:if(i%2){d=pick([3,6,7,9]);whole=rand(2,12);v=d*whole+1;num=Math.round(v/d*100)/100;a.push(Q(`Quel est le quotient de ${v} ÷ ${d}, arrondi au centième ?`,fmt(num),[fmt(num+.01),fmt(num-.01),fmt(num+.1)],`Le quotient est proche de ${fmt(num)} au centième.`))}else{d=pick([2,4,5,8]);whole=rand(2,20)+pick([.25,.5,.75]);v=d*whole;a.push(Q(`${fmt(v)} ÷ ${d} = ?`,fmt(whole),[fmt(whole+d),fmt(whole/10),fmt(whole+.5)],`Vérifie : ${fmt(whole)} × ${d} = ${fmt(v)}.`))}break;
case 21:v=rand(1,80)+rand(1,9)/10;w=v+rand(1,9)/100;if(i%3===0){a.push(Q(`Quel nombre est compris entre ${fmt(v)} et ${fmt(w)} ?`,fmt((v+w)/2),[fmt(v-.01),fmt(w+.01),fmt(w+1)],'Un nombre intercalé doit être plus grand que le premier et plus petit que le second.'))}else if(i%3===1){a.push(Q(`Complète : ${fmt(v)} … ${fmt(w)}`,'<',['>','='],'Écris un zéro supplémentaire après la virgule puis compare les centièmes.'))}else{a.push(Q(`Range du plus petit au plus grand : ${fmt(w)}, ${fmt(v)}, ${fmt(w+.1)}`,`${fmt(v)} ; ${fmt(w)} ; ${fmt(w+.1)}`,[`${fmt(w)} ; ${fmt(v)} ; ${fmt(w+.1)}`,`${fmt(w+.1)} ; ${fmt(w)} ; ${fmt(v)}`],'Compare les dixièmes, puis les centièmes.'))}break;
case 22:d=pick([20,30,35,40,45,55,60,70,75,80,90,100,110,120,130,145,150,160]);if(i%3===0){a.push(Q(`Un angle de ${d}° est…`,d===90?'droit':d<90?'aigu':'obtus',['aigu','droit','obtus'].filter(x=>x!==(d===90?'droit':d<90?'aigu':'obtus')),'Un angle droit vaut 90°. En dessous il est aigu, au-dessus il est obtus.',angleFig(d)))}else{a.push(Q('Observe cet angle. Est-il aigu, droit ou obtus ?',d===90?'droit':d<90?'aigu':'obtus',['aigu','droit','obtus'].filter(x=>x!==(d===90?'droit':d<90?'aigu':'obtus')),'Compare son ouverture à celle d’un angle droit.',angleFig(d)))}break;
case 23:l=rand(2,12);if(i%2)a.push(Q(`Le rayon d’un cercle mesure ${l} cm. Quel est son diamètre ?`,`${2*l} cm`,[`${l} cm`,`${l/2} cm`,`${l+2} cm`],'Le diamètre vaut deux fois le rayon.',circleFig('circle')));else a.push(Q(`Le diamètre d’un disque mesure ${2*l} cm. Quel est son rayon ?`,`${l} cm`,[`${2*l} cm`,`${4*l} cm`,`${l+2} cm`],'Le rayon vaut la moitié du diamètre.',circleFig('disc')));break;
case 24:v=rand(1,70)*1000000000+rand(1,999)*1000000+rand(1,999)*1000+rand(1,999);a.push(Q(`Dans ${sp(v)}, combien y a-t-il de milliards entiers ?`,Math.floor(v/1e9),[Math.floor(v/1e9)+1,Math.floor(v/1e9)-1,Math.floor(v/1e6)],'Lis la classe des milliards, à gauche de celle des millions.'));break;
case 25:l=rand(1,4);w=rand(5,50);if(i%2)a.push(Q(`${l} h ${w} min = combien de minutes ?`,`${l*60+w} min`,[`${l*100+w} min`,`${l*60-w} min`,`${l*60+w+60} min`],`Une heure vaut 60 minutes : ${l} × 60 + ${w}.`));else{v=rand(2,7)*60+rand(1,59);a.push(Q(`${v} min = ?`,`${Math.floor(v/60)} h ${v%60} min`,[`${Math.floor(v/60)-1} h ${v%60} min`,`${Math.floor(v/60)} h ${v%60+10} min`,`${v} h`],'Regroupe les minutes par paquets de 60.'))}break;
case 26:l=rand(3,12);if(i%3===0)a.push(Q(`Un triangle a trois côtés de ${l} cm. Quel est son type ?`,'équilatéral',['rectangle','scalène','obtusangle'],'Ses trois côtés sont égaux.'));else if(i%3===1)a.push(Q(`Un triangle a deux côtés de ${l} cm et un troisième côté de ${l+rand(1,Math.min(3,l-1))} cm. Quel est son type ?`,'isocèle',['équilatéral','rectangle','carré'],'Il possède deux côtés égaux.'));else a.push(Q(`Un triangle possède un angle de 90° et un côté de ${l} cm. Quel est son type ?`,'rectangle',['équilatéral','obtusangle','losange'],'Un angle de 90° est un angle droit.'));break;
case 27:l=rand(2,9);w=rand(2,9);if(i%2)a.push(Q(`${l} cm² = combien de mm² ?`,`${l*100} mm²`,[`${l*10} mm²`,`${l*1000} mm²`,`${l+100} mm²`],'1 cm² = 100 mm².'));else a.push(Q(`Un rectangle de ${l} m sur ${w} m a quelle aire ?`,`${l*w} m²`,[`${2*(l+w)} m²`,`${l+w} m²`,`${l*w*100} m²`],'Multiplie longueur × largeur ; l’unité d’aire est le m².'));break;
case 28:kind=pick(['carré','rectangle','losange','trapèze','parallélogramme']);let traits={carré:'quatre angles droits et quatre côtés égaux',rectangle:'quatre angles droits et deux côtés voisins de longueurs différentes',losange:'quatre côtés égaux, sans angle droit',trapèze:'exactement une paire de côtés opposés parallèles',parallélogramme:'deux paires de côtés opposés parallèles, sans angle droit et sans quatre côtés égaux'};if(i%2===0)a.push(Q(`Quel est le nom le plus précis de ce quadrilatère : ${traits[kind]} ?`,kind,Object.keys(traits).filter(x=>x!==kind),`Ces propriétés permettent de reconnaître un ${kind}.`));else{v=rand(3,11);a.push(Q(kind==='carré'?`Un quadrilatère a quatre côtés égaux de ${v} cm et quatre angles droits. Son nom précis ?`:kind==='rectangle'?`Un quadrilatère a quatre angles droits et des côtés voisins de ${v} cm et ${v+2} cm. Son nom précis ?`:kind==='losange'?`Un quadrilatère a quatre côtés égaux de ${v} cm sans angle droit. Son nom précis ?`:kind==='trapèze'?`Un quadrilatère a exactement une paire de côtés opposés parallèles. Son nom ?`:`Un quadrilatère a deux paires de côtés opposés parallèles, sans angle droit ni quatre côtés égaux. Son nom précis ?`,kind,Object.keys(traits).filter(x=>x!==kind),`Les propriétés décrites correspondent à un ${kind}.`))}break;
case 29:kind=pick(['diagonale','médiane']);if(i%3===0){a.push(Q('Dans un carré, combien de diagonales peut-on tracer ?', '2',['1','3','4'],'Chaque diagonale relie deux sommets opposés.'))}else if(i%3===1){a.push(Q('Dans un carré, combien de médianes joignent les milieux de côtés opposés ?', '2',['1','3','4'],'Une médiane est horizontale, l’autre verticale.'))}else{a.push(Q(kind==='diagonale'?'Dans ce carré, quel segment joint deux sommets opposés ?':'Dans ce carré, quel segment joint les milieux de deux côtés opposés ?',kind==='diagonale'?'[AC]':'[MN]',kind==='diagonale'?['[AB]','[MN]','[BM]']:['[AC]','[AB]','[BD]'],kind==='diagonale'?'[AC] est une diagonale : il relie deux sommets opposés.':'[MN] est une médiane : il relie les milieux de côtés opposés.','<svg viewBox="0 0 210 175" width="210" aria-label="Carré ABCD, milieux M et N"><path d="M40 20H160V140H40Z M40 20L160 140 M100 20V140" fill="none" stroke="#3f50bb" stroke-width="3"/><g font-size="15" font-weight="bold" fill="#17213d"><text x="21" y="20">A</text><text x="165" y="20">B</text><text x="165" y="157">C</text><text x="21" y="157">D</text><text x="95" y="17">M</text><text x="95" y="159">N</text></g></svg>'))}break;
case 30:l=rand(1,9);w=rand(1,9);d=rand(1,9);v=l+w/10+d/100;if(i%2)a.push(Q(`${l} unités + ${w} dixièmes + ${d} centièmes = ?`,fmt(v),[fmt(l+w/100+d/10),fmt(l+w/10),fmt(l+d/10+w/100)],'Les dixièmes sont juste après la virgule, puis viennent les centièmes.'));else a.push(Q(`Dans ${fmt(v)}, quel est le chiffre des centièmes ?`,String(d),[String(w),String(l),String((d+1)%10)],'Le deuxième chiffre après la virgule est celui des centièmes.'));break;
case 31:if(i%3===0){a.push(Q('Pour construire un triangle ABC à partir de trois points A, B et C, que faut-il tracer ?','[AB], [BC] et [AC]',['(AB), (BC) et (AC)','[AB) seulement','un cercle de centre A'],'Les côtés du triangle sont des segments reliant les trois sommets.'))}else if(i%3===1){a.push(Q('Avant de tracer précisément un programme de construction, que peux-tu faire ?','Un croquis à main levée',['Mesurer au hasard','Effacer les consignes','Tracer toutes les droites sans lire'],'Le croquis aide à anticiper la figure et l’ordre des étapes.'))}else{kind=pick(['segment','droite','demi-droite']);let notation={segment:'[AB]',droite:'(AB)','demi-droite':'[AB)'};a.push(Q(`Quelle notation correspond à une ${kind} passant par A et B ?`,notation[kind],Object.values(notation).filter(x=>x!==notation[kind]).concat(['{AB}']),'Les crochets marquent les extrémités ; les parenthèses indiquent un prolongement.'))}break;
case 32:v=rand(2,4);a.push(Q(`Le point A est à gauche de l’axe vertical, à ${v} carreaux de l’axe. Où placer son symétrique A’ ?`,`à droite, à ${v} carreaux`,[`à droite, à ${v+1} carreaux`,`à gauche, à ${v} carreaux`,`sur l’axe`],'Un point et son symétrique sont à la même distance de l’axe, sur des côtés opposés.',gridFig('mirror',v)));break;
case 33:d=pick([10,20,50,100]);l=rand(2,9);a.push(Q(`Sur un plan à l’échelle 1/${d}, une longueur mesure ${l} cm. Combien mesure-t-elle en réalité ?`,`${l*d} cm`,[`${l/d} cm`,`${l+d} cm`,`${l*d*10} cm`],`1 cm sur le plan représente ${d} cm réels : multiplie ${l} par ${d}.`));break;
case 34:kind=pick(['cube','pavé droit','pyramide','cylindre']);if(i%3===0){a.push(Q(`Un ${kind} est-il un polyèdre ?`,kind==='cylindre'?'Non':'Oui',[kind==='cylindre'?'Oui':'Non','Seulement s’il est petit','Impossible à savoir'],'Un polyèdre n’a que des faces planes. Le cylindre possède une surface courbe.'))}else if(i%3===1){a.push(Q(`Combien de sommets possède un ${kind==='pyramide'?'cube':kind==='cylindre'?'pavé droit':kind} ?`,kind==='pyramide'?'8':kind==='cylindre'?'8':'8',['4','6','12'],'Un cube ou un pavé droit possède 8 sommets.'))}else{a.push(Q('Une base carrée et quatre faces latérales triangulaires forment quel solide ?','une pyramide à base carrée',['un cube','un cylindre','un prisme à base carrée'],'Les faces triangulaires se rejoignent en un sommet.'))}break;
case 35:l=rand(2,6);w=rand(2,5);h=rand(2,4);if(i%3===0)a.push(Q('1 litre correspond à quel volume ?','1 dm³',['1 cm³','100 dm³','1 m³'],'Un litre est le volume d’un cube de 1 dm de côté.'));else a.push(Q(`Un pavé droit mesure ${l} cm × ${w} cm × ${h} cm. Quel est son volume ?`,`${l*w*h} cm³`,[`${l*w+h} cm³`,`${2*(l+w+h)} cm³`,`${l+w+h} cm³`],`Volume = longueur × largeur × hauteur = ${l*w*h} cm³.`));break;
}}
return shuffle(a).slice(0,10)}
let deck=[],idx=0,score=0,miss=[],done=false;$('#badge').textContent='CM2 · M'+n;$('#title').textContent=titles[n];$('#category').textContent=n%2?'NOMBRES ET CALCULS':'DÉFI CM2';$('#introText').textContent=`M${n} · ${titles[n]} : 10 questions variées pour revoir la leçon du porte-vue.`;
function render(){done=false;let q=deck[idx];$('#counter').textContent=`Question ${idx+1} / ${deck.length}`;$('#points').textContent=`★ ${score} point${score>1?'s':''}`;$('#progress').style.width=`${100*idx/deck.length}%`;$('#question').textContent=q.ask;$('#diagram').classList.toggle('hidden',!q.visual);$('#diagram').innerHTML=q.visual;$('#feedback').className='feedback hidden';$('#next').classList.add('hidden');$('#next').textContent=idx===deck.length-1?'Voir mon résultat →':'Question suivante →';let opts=[q.correct,...q.wrong.filter(x=>x!==q.correct)];opts=shuffle([...new Set(opts)].slice(0,4));$('#options').replaceChildren();opts.forEach(c=>{let b=document.createElement('button');b.type='button';b.className='option';b.textContent=c;b.onclick=()=>answer(c,b);$('#options').appendChild(b)})}
function answer(c,b){if(done)return;done=true;let q=deck[idx],ok=c===q.correct;if(ok)score++;else miss.push(q.ask);document.querySelectorAll('.option').forEach(el=>{el.disabled=true;if(el.textContent===q.correct)el.classList.add('correct')});if(!ok)b.classList.add('wrong');$('#feedback').className='feedback '+(ok?'good':'bad');$('#feedback').textContent=(ok?'Bravo ! ':'Regarde la bonne réponse. ')+q.why;$('#points').textContent=`★ ${score} point${score>1?'s':''}`;$('#next').classList.remove('hidden')}
function start(){deck=make(n);idx=0;score=0;miss=[];$('#intro').classList.add('hidden');$('#end').classList.add('hidden');$('#game').classList.remove('hidden');render();scrollTo({top:0,behavior:'smooth'})}
$('#start').onclick=start;$('#again').onclick=start;$('#next').onclick=()=>{if(!done)return;if(++idx<deck.length)render();else{$('#game').classList.add('hidden');$('#end').classList.remove('hidden');$('#result').textContent=`${score} / ${deck.length} · ${score>=8?'Bravo !':'Continue à t’entraîner !'}`;$('#conclusion').textContent='Chaque réponse t’aide à mieux comprendre la leçon.';$('#review').classList.toggle('hidden',!miss.length);$('#review').innerHTML=miss.length?'<b>Questions à revoir :</b><ul>'+miss.map(x=>'<li>'+x.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</li>').join('')+'</ul>':''}scrollTo({top:0,behavior:'smooth'})};
})();</script></body></html>
