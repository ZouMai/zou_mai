<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calcul mental CM2 · Zou Maï</title>
<style>
:root{--ink:#122033;--blue:#3047d8;--teal:#079d82;--gold:#f4b72b;--red:#d95555;--bg:#f3f0e8;--card:#fff}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 8% 5%,#dbe9ff,transparent 27%),radial-gradient(circle at 92% 40%,#d8f5eb,transparent 30%),var(--bg)}
button,input{font:inherit}.wrap{max-width:1120px;margin:auto;padding:18px 16px 70px}.top,.row,.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.top a{color:#243b8f;font-weight:850;text-decoration:none}
.hero{display:flex;align-items:center;gap:18px;margin:25px 0}.hero img{width:88px}.hero h1{font-size:clamp(2.25rem,7vw,4.6rem);line-height:.95;letter-spacing:-.06em;margin:4px 0}.hero p{margin:8px 0;color:#536174;font-weight:650}.badge,.pill{display:inline-block;background:#fff;border:1px solid #d8deea;border-radius:99px;padding:5px 11px;font-size:.78rem;font-weight:850}
.panel{background:var(--card);border:2px solid #dfe4ed;border-radius:24px;padding:clamp(16px,3vw,26px);margin:15px 0;box-shadow:0 10px 28px #1a2a4710}.hidden{display:none!important}
.group{margin:28px 0}.group h2{font-size:1.45rem;margin:0 0 4px}.group>p{color:#657184;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.skill{position:relative;text-align:left;border:2px solid #d8deea;border-radius:18px;background:#fff;padding:15px;min-height:142px;color:var(--ink);cursor:pointer;transition:.15s}.skill:hover,.skill:focus-visible{border-color:var(--blue);transform:translateY(-2px)}.skill b{display:block;font-size:1.03rem;margin:6px 0}.skill small{color:#657184}.skill .num{font-size:.72rem;font-weight:900;color:var(--blue)}.skill .icon{font-size:1.55rem}.skill.done:after{content:"✓";position:absolute;right:10px;top:9px;color:var(--teal);font-weight:900}
.boss{border:0;background:linear-gradient(135deg,#222c70,#4a36b4);color:#fff;border-radius:20px;padding:18px;text-align:left;cursor:pointer;width:100%;margin-top:10px}.boss b{font-size:1.3rem}.boss small{display:block;opacity:.82;margin-top:4px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.level{border:2px solid #d7ddea;border-radius:15px;background:#fff;padding:14px;text-align:left;cursor:pointer}.level.active{border-color:var(--blue);background:#eef0ff}.level strong{display:block}.level small{color:#657184}
.btn{border:0;border-radius:13px;background:var(--blue);color:#fff;font-weight:850;padding:12px 18px;cursor:pointer}.ghost{border:1px solid #cbd4e5;background:#f5f7fb;color:#253766;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}
.progress{height:10px;background:#e6e9f1;border-radius:10px;overflow:hidden;margin:15px 0 22px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--blue));transition:.25s}
.board{text-align:center;background:#f7f9fc;border:1px solid #dce3ed;border-radius:20px;padding:clamp(20px,5vw,38px);min-height:280px}.kicker{font-size:.78rem;font-weight:900;color:#66758a;text-transform:uppercase;letter-spacing:.08em}.question{font-size:clamp(1.65rem,5vw,3rem);font-weight:900;margin:14px 0 22px}.hint{color:#66758a;margin:-12px 0 20px}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:620px;margin:auto}.answer{min-height:62px;border:2px solid #b9c6df;background:#fff;border-radius:15px;font-size:1.3rem;font-weight:850;cursor:pointer}.answer.good{background:#daf7ed;border-color:var(--teal)}.answer.bad{background:#ffe5e5;border-color:var(--red)}
.entry{width:min(330px,95%);padding:13px;border:2px solid #aebbd6;border-radius:13px;text-align:center;font-size:1.35rem}.feedback{margin:15px auto 0;max-width:650px;padding:12px;border-radius:12px;font-weight:800}.feedback.ok{background:#dcf8ee;color:#08644d}.feedback.ko{background:#fff0e5;color:#8b411d}
.mastery{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}.mastery div{background:#f3f5f9;border-radius:10px;padding:8px;font-size:.78rem}.mastery b{display:block;font-size:1rem}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.mastery{grid-template-columns:repeat(2,1fr)}.hero img{width:68px}.skill{min-height:132px}.levels{grid-template-columns:1fr}.answers{grid-template-columns:1fr 1fr}}
@media(max-width:390px){.grid{grid-template-columns:1fr}.answers{grid-template-columns:1fr 1fr}.question{font-size:1.65rem}}
</style></head>
<body><main class="wrap">
<header class="top"><a href="ressources.html#ma">← ZOU MAÏ · MATHS</a><a href="maths-lecons-cm2.html">Leçons</a></header>
<section class="hero"><div><span class="badge">CM2 · AUTOMATISMES</span><h1>Calcul mental</h1><p>17 compétences. Une progression claire. Tu t'entraînes là où tu en as besoin.</p></div><img src="images/loup-bleu-original.png" alt="Le loup bleu de Zou Maï"></section>

<section id="home">
<div class="panel"><div class="row"><div><strong>Ton parcours</strong><div style="color:#657184;font-size:.9rem">🟢 Découverte → 🔵 Automatisation → 🔴 Fluence</div></div><span class="pill" id="global">0 / 17 maîtrisées</span></div><div class="mastery" id="mastery"></div></div>
<div id="groups"></div>
<button class="boss" id="boss"><b>👑 Boss du calcul mental</b><small>10 questions mélangées dans toutes les compétences. Les points faibles reviennent plus souvent.</small></button>
</section>

<section id="setup" class="panel hidden">
<div class="row"><div><span class="pill" id="skillCode"></span><h2 id="skillTitle"></h2><p id="skillDesc"></p></div><button class="ghost" id="back">← Compétences</button></div>
<div class="levels">
<button class="level active" data-l="1">🟢 <strong>Découverte</strong><small>Sans chrono · nombres simples</small></button>
<button class="level" data-l="2">🔵 <strong>Automatisation</strong><small>Calculs plus variés · 12 s</small></button>
<button class="level" data-l="3">🔴 <strong>Fluence</strong><small>Réponse rapide · 7 s</small></button>
</div><div class="actions" style="margin-top:16px"><span class="pill" id="record"></span><button class="btn" id="start">Commencer →</button></div>
</section>

<section id="play" class="panel hidden">
<div class="row"><span class="pill" id="playName"></span><span class="pill" id="score"></span></div><div class="progress"><i id="bar"></i></div>
<div class="board"><div class="kicker" id="kind"></div><div class="question" id="question"></div><div class="hint" id="hint"></div><div id="answerZone"></div><div id="feedback" class="feedback hidden" aria-live="polite"></div></div>
<div class="actions" style="margin-top:15px"><button class="ghost" id="quit">Quitter</button><button class="btn hidden" id="next">Suivant →</button></div>
</section>

<section id="end" class="panel hidden"><h2 id="result"></h2><p id="summary"></p><div class="actions"><button class="ghost" id="homeBtn">Toutes les compétences</button><button class="btn" id="again">Rejouer ↻</button></div></section>
</main>
<script>
(()=>{"use strict";
const $=x=>document.getElementById(x), rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a, one=a=>a[rnd(0,a.length-1)], sh=a=>[...a].sort(()=>Math.random()-.5), fmt=n=>Number(n.toFixed(3)).toLocaleString("fr-FR",{maximumFractionDigits:3});
const skills=[
{id:"tablesAdd",g:0,i:"⚡",t:"Faits additifs",d:"Sommes et différences usuelles",gen:l=>{let a=rnd(2,l==1?10:20),b=rnd(2,l==1?10:20);return Q(a+" + "+b,a+b,"Additionne mentalement.")}},
{id:"tablesMult",g:0,i:"✖️",t:"Tables de multiplication",d:"Produits et facteurs manquants",gen:l=>{let a=rnd(2,l==1?9:12),b=rnd(2,l==1?9:12);if(Math.random()<.35)return Q(a+" × ? = "+a*b,b,"Retrouve le facteur manquant.");return Q(a+" × "+b,a*b,"Utilise les tables.")}},
{id:"doubles",g:0,i:"🪞",t:"Doubles et moitiés",d:"Automatiser les relations ×2 et ÷2",gen:l=>{let n=l==1?rnd(2,50):rnd(10,250);if(Math.random()<.5)return Q("Double de "+n,n*2,"Doubler, c'est multiplier par 2.");let x=n*2;return Q("Moitié de "+x,n,"Prends la moitié.")}},
{id:"oddhalf",g:0,i:"🍕",t:"Moitiés des impairs",d:"3, 5, 7… jusqu'à 15",gen:l=>{let n=one([3,5,7,9,11,13,15]);return Q("Moitié de "+n,n/2,"Partage en deux : la réponse peut finir par ,5.")}},
{id:"fracrel",g:1,i:"🧩",t:"Fractions équivalentes",d:"Reconnaître des fractions usuelles égales",gen:l=>{let base=one([[1,2],[1,4],[3,4],[1,5],[2,5]]),k=rnd(2,l==1?4:8);return Q(base[0]+"/"+base[1]+" = ?/"+(base[1]*k),base[0]*k,"Multiplie numérateur et dénominateur par le même nombre.")}},
{id:"fracdec",g:1,i:"🔄",t:"Fraction ↔ décimal",d:"Passer des fractions usuelles aux décimaux",gen:l=>{let x=one([[1,2,.5],[1,4,.25],[3,4,.75],[1,5,.2],[1,10,.1],[3,10,.3],[1,100,.01]]);return Q(x[0]+"/"+x[1]+" = ?",x[2],"Associe la fraction à son écriture décimale.")}},
{id:"intdec",g:1,i:"🎯",t:"Entier +/− décimal",d:"Ajouter ou soustraire mentalement un entier",gen:l=>{let a=rnd(10,90)/10,b=rnd(1,l==1?5:20),plus=Math.random()<.6;return Q(fmt(a)+(plus?" + ":" − ")+b,plus?a+b:a-b,"La partie décimale reste inchangée.")}},
{id:"x10",g:1,i:"🚀",t:"× 10, × 100, × 1 000",d:"Valeur des chiffres et changement de rang",gen:l=>{let a=rnd(11,999)/(l==1?1:10),k=one([10,100,1000]);return Q(fmt(a)+" × "+k,a*k,"Chaque chiffre prend une valeur "+k+" fois plus grande.")}},
{id:"d10",g:1,i:"🪂",t:"÷ 10, ÷ 100, ÷ 1 000",d:"Diviser entiers et décimaux par 10, 100, 1 000",gen:l=>{let k=one([10,100,1000]),a=rnd(11,999)*(l==1?10:1);return Q(fmt(a)+" ÷ "+k,a/k,"Chaque chiffre prend une valeur "+k+" fois plus petite.")}},
{id:"decadd",g:2,i:"🧠",t:"Addition de décimaux",d:"Additionner deux décimaux simples",gen:l=>{let den=l==1?10:100,a=rnd(10,90)/den,b=rnd(10,90)/den;return Q(fmt(a)+" + "+fmt(b),a+b,"Regroupe unités, dixièmes et centièmes.")}},
{id:"near",g:2,i:"🥷",t:"Ajouter / soustraire 8, 9, 18, 19…",d:"Utiliser un nombre rond voisin",gen:l=>{let a=rnd(20,l==1?100:500),b=one(l==1?[8,9,18,19]:[8,9,18,19,28,29,98,99]),plus=Math.random()<.5;return Q(a+(plus?" + ":" − ")+b,plus?a+b:a-b,(plus?"Ajoute":"Soustrais")+" d'abord "+(b+1)+", puis corrige de 1.")}},
{id:"zeros",g:2,i:"🏭",t:"Produits de dizaines / centaines",d:"30 × 400, 6 000 × 70…",gen:l=>{let a=rnd(2,9)*one([10,100,l>1?1000:100]),b=rnd(2,9)*one([10,100]);return Q(fmt(a)+" × "+fmt(b),a*b,"Multiplie les chiffres non nuls puis utilise la valeur de position.")}},
{id:"distrib",g:2,i:"🧱",t:"Distributivité",d:"Décomposer pour calculer plus vite",gen:l=>{let a=rnd(3,9),b=rnd(12,l==1?39:99),t=Math.floor(b/10)*10,u=b%10;return Q(a+" × "+b,a*b,a+" × "+t+" + "+a+" × "+u+" = "+a*b+".")}},
{id:"halfdec",g:2,i:"🪞",t:"Double / moitié d'un décimal",d:"Doubler ou diviser par 2 un décimal simple",gen:l=>{let n=rnd(11,l==1?99:299)/10;if(Math.random()<.5)return Q("Double de "+fmt(n),n*2,"Multiplie par 2.");let x=n*2;return Q("Moitié de "+fmt(x),n,"Divise par 2.")}},
{id:"div48",g:3,i:"✂️",t:"Diviser par 4 ou par 8",d:"Utiliser des moitiés successives",gen:l=>{let d=one([4,8]),n=rnd(2,l==1?20:80)*d;return Q(n+" ÷ "+d,n/d,d==4?"Prends la moitié, puis encore la moitié.":"Prends trois moitiés successives.")}},
{id:"x5",g:3,i:"✋",t:"Multiplier par 5",d:"Avec entiers puis décimaux",gen:l=>{let n=l==1?rnd(2,60):rnd(11,250)/10;return Q(fmt(n)+" × 5",n*5,"Multiplie par 10 puis prends la moitié.")}},
{id:"x50",g:3,i:"💥",t:"Multiplier par 50",d:"Avec entiers puis décimaux",gen:l=>{let n=l==1?rnd(2,30):rnd(11,120)/10;return Q(fmt(n)+" × 50",n*50,"Multiplie par 100 puis prends la moitié.")}}
];
const groups=[["1 · Faits numériques","Résultats à connaître et relations à automatiser."],["2 · Fractions & numération décimale","Comprendre les écritures et la valeur des chiffres."],["3 · Stratégies de calcul","Choisir une procédure efficace plutôt que poser l'opération."],["4 · Procédures expertes","Diviser et multiplier astucieusement."]];
function Q(q,a,why){return{q,a:Number(a.toFixed? a.toFixed(3):a),why}}
let skill=null,level=1,round=0,score=0,qs=[],timer=null,boss=false;
function store(){try{return JSON.parse(localStorage.getItem("zoumai-cm2-mental-v2")||"{}")}catch(e){return{}}}function save(id,l,s){let x=store(),k=id+"-"+l;x[k]=Math.max(x[k]||0,s);localStorage.setItem("zoumai-cm2-mental-v2",JSON.stringify(x))}
function mastered(id){let x=store();return (x[id+"-2"]||0)>=8||(x[id+"-3"]||0)>=7}
function renderHome(){let box=$("groups");box.innerHTML="";groups.forEach((g,gi)=>{let sec=document.createElement("section");sec.className="group";sec.innerHTML="<h2>"+g[0]+"</h2><p>"+g[1]+"</p><div class=grid></div>";skills.filter(s=>s.g===gi).forEach(s=>{let b=document.createElement("button");b.className="skill"+(mastered(s.id)?" done":"");b.innerHTML='<span class="num">CM'+(skills.indexOf(s)+1)+'</span><div class="icon">'+s.i+'</div><b>'+s.t+'</b><small>'+s.d+'</small>';b.onclick=()=>openSkill(s);sec.querySelector(".grid").appendChild(b)});box.appendChild(sec)});let n=skills.filter(s=>mastered(s.id)).length;$("global").textContent=n+" / 17 maîtrisées";$("mastery").innerHTML='<div><b>17</b>compétences</div><div><b>3</b>niveaux</div><div><b>10</b>questions / défi</div><div><b>'+n+'</b>maîtrisées</div>'}
function view(id){["home","setup","play","end"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}
function openSkill(s){skill=s;boss=false;level=1;$("skillCode").textContent="CM"+(skills.indexOf(s)+1);$("skillTitle").textContent=s.i+" "+s.t;$("skillDesc").textContent=s.d;document.querySelectorAll(".level").forEach((b,i)=>b.classList.toggle("active",i===0));record();view("setup");scrollTo(0,0)}
function record(){let x=store();$("record").textContent="Record : "+(x[skill.id+"-"+level]||0)+" / 10"}
document.querySelectorAll(".level").forEach(b=>b.onclick=()=>{level=+b.dataset.l;document.querySelectorAll(".level").forEach(x=>x.classList.toggle("active",x===b));record()});
function start(){round=0;score=0;qs=[];if(boss){for(let i=0;i<10;i++){let weak=skills.filter(s=>!mastered(s.id)),s=one(weak.length&&Math.random()<.7?weak:skills);qs.push({...s.gen(2),s})}}else for(let i=0;i<10;i++)qs.push(skill.gen(level));view("play");render();scrollTo(0,0)}
function choices(q){let a=q.a,step=Math.abs(a)<1?.1:Math.abs(a)<20?1:Math.abs(a)<200?5:Math.abs(a)<2000?10:100,vals=[a];for(let k=1;vals.length<4;k++){for(let d of [step*k,-step*k])if(a+d>=0&&!vals.includes(a+d)){vals.push(Number((a+d).toFixed(3)));if(vals.length===4)break}}let z=document.createElement("div");z.className="answers";sh(vals).forEach(v=>{let b=document.createElement("button");b.className="answer";b.textContent=fmt(v);b.onclick=()=>judge(Math.abs(v-a)<.0001,b,q);z.appendChild(b)});$("answerZone").appendChild(z)}
function entry(q){let z=document.createElement("div"),i=document.createElement("input"),b=document.createElement("button");i.className="entry";i.inputMode="decimal";i.placeholder="Ta réponse";b.className="btn";b.textContent="Valider";b.style.marginLeft="8px";z.append(i,b);$("answerZone").appendChild(z);let go=()=>{let v=Number(i.value.replace(/\s/g,"").replace(",","."));if(Number.isFinite(v))judge(Math.abs(v-q.a)<.0001,i,q)};b.onclick=go;i.onkeydown=e=>{if(e.key==="Enter")go()};i.focus()}
function render(){clearTimeout(timer);let q=qs[round];$("playName").textContent=boss?"👑 Boss":skill.i+" "+skill.t;$("score").textContent="★ "+score+" · "+(round+1)+"/10";$("bar").style.width=(round*10)+"%";$("kind").textContent=boss?"COMPÉTENCE : "+q.s.t:level===1?"DÉCOUVERTE":level===2?"AUTOMATISATION":"FLUENCE";$("question").textContent=q.q;$("hint").textContent=!boss&&level===1?q.why:"";$("answerZone").innerHTML="";$("feedback").className="feedback hidden";$("next").classList.add("hidden");Math.random()<.65?choices(q):entry(q);let sec=boss?10:level===1?0:level===2?12:7;if(sec)timer=setTimeout(()=>judge(false,null,q,true),sec*1000)}
function judge(ok,node,q,timeout=false){clearTimeout(timer);$("answerZone").querySelectorAll("button,input").forEach(x=>x.disabled=true);if(node&&node.classList)node.classList.add(ok?"good":"bad");if(ok)score++;let f=$("feedback");f.className="feedback "+(ok?"ok":"ko");f.textContent=ok?"✓ Bien joué ! "+q.why:(timeout?"⏱ Temps écoulé. ":"")+"Réponse : "+fmt(q.a)+". "+q.why;$("next").classList.remove("hidden")}
function next(){round++;if(round<10)render();else finish()}
function finish(){if(!boss)save(skill.id,level,score);$("result").textContent=(score>=9?"🏆 ":score>=7?"👏 ":"🎯 ")+score+" / 10";$("summary").textContent=score>=9?"Compétence très solide !":score>=7?"Bien. Rejoue pour automatiser encore.":"Cette compétence mérite encore un peu d'entraînement.";view("end");renderHome();scrollTo(0,0)}
$("back").onclick=()=>{renderHome();view("home")};$("start").onclick=start;$("quit").onclick=()=>{clearTimeout(timer);renderHome();view("home")};$("next").onclick=next;$("homeBtn").onclick=()=>{renderHome();view("home")};$("again").onclick=start;$("boss").onclick=()=>{boss=true;skill=null;level=2;start()};renderHome();
})();
</script><script src="site-tracking.js" defer></script></body></html>
