<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jeux de calcul mental S1 à S35 · Zou Maï</title><style>
:root{--ink:#17213d;--blue:#4348c7;--mint:#16b994;--paper:#f7f3eb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 5%,#d7ebff,transparent 30%),radial-gradient(circle at 95% 80%,#d4f5e9,transparent 33%),var(--paper);color:var(--ink);font:17px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:850px;margin:auto;padding:18px 16px 56px}a{color:#243a99}.top{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-weight:850}.brand{text-decoration:none;letter-spacing:.07em}.hero{display:flex;align-items:center;gap:20px;margin:25px 0}.hero img{width:100px;max-width:22vw;filter:drop-shadow(0 9px 8px #18264430)}h1{font-size:clamp(2rem,6vw,3.8rem);line-height:1.04;letter-spacing:-.05em;margin:5px 0}.hero p{margin:5px 0}.pill{display:inline-block;background:white;border-radius:99px;padding:5px 11px;font-size:.83rem;font-weight:850}.card{background:white;border:2px solid #e3e6ef;border-radius:23px;padding:clamp(17px,4vw,30px);box-shadow:0 12px 30px #13214015;margin-top:16px}.choose{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.choose label{display:grid;gap:5px;font-weight:800}.choose select{min-width:135px;border:2px solid #cbd4e8;border-radius:12px;padding:10px;font:inherit;background:white;color:var(--ink)}button{font:inherit;font-weight:800;cursor:pointer}.btn{background:var(--blue);color:white;border:0;border-radius:14px;padding:12px 19px}.btn:hover{background:#2c329e}.btn:disabled{opacity:.5;cursor:default}.subtle{background:#e9edf9;color:#2b397d;border:0;border-radius:12px;padding:10px 15px}.btn:focus-visible,.subtle:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #ff9b47;outline-offset:2px}.hidden{display:none!important}.meta{color:#526078;font-size:.86rem}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;font-weight:800}.progress{height:11px;background:#e9ecf7;border-radius:99px;margin:16px 0 22px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--blue));transition:width .3s}.prompt{font-size:clamp(1.3rem,3.5vw,2rem);font-weight:850;margin:12px 0 24px;overflow-wrap:anywhere}.answer{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.answer input{font:inherit;font-size:1.4rem;width:min(280px,100%);border:2px solid #bac6e3;border-radius:14px;padding:11px 14px;color:var(--ink)}.feedback{padding:15px;margin-top:17px;border-radius:14px;font-weight:750}.feedback.good{background:#ddf8ee;color:#086d51}.feedback.bad{background:#fff0e9;color:#99461d}.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:17px}.review{background:#fff4e9;padding:15px;border-radius:16px;margin:18px 0}.review li{margin:7px 0}.chooser{margin-bottom:15px}.navline{display:flex;justify-content:space-between;gap:10px;margin-top:17px}.error{color:#b13030;font-weight:800}@media(max-width:600px){.card{border-radius:18px}.hero img{width:75px}.choose{display:grid;grid-template-columns:1fr 1fr}.choose select{width:100%;min-width:0}.answer input{width:100%}}
</style></head><body><main class="wrap"><header class="top"><a class="brand" href="ressources.html#ma">← ZOU MAÏ · MATHS</a><a href="maths-lecons-cm2.html">Leçons de maths</a></header><div class="hero"><div><span class="pill">CM2 · 35 SÉRIES · 140 JEUX</span><h1>Calcul mental</h1><p>Une fiche, un jeu : choisis la série et la séance de ton fichier.</p></div><img src="images/loup-bleu-original.png" alt="Le loup bleu de Zou Maï"></div><section class="card chooser"><div class="choose"><label>Série<select id="serie" aria-label="Choisir une série"></select></label><label>Séance<select id="seance" aria-label="Choisir une séance"><option value="0">Séance 1</option><option value="1">Séance 2</option><option value="2">Séance 3</option><option value="3">Séance 4</option></select></label></div><div class="navline"><button class="subtle" id="prev">← Fiche précédente</button><button class="subtle" id="following">Fiche suivante →</button></div></section><section class="card" id="loading" role="status">Chargement des jeux…</section><section class="card hidden" id="intro"><span class="pill" id="label"></span><h2 id="heading"></h2><p id="description"></p><p class="meta" id="page"></p><p class="meta" id="best"></p><button class="btn" id="start">Jouer à cette fiche →</button></section><section class="card hidden" id="game"><div class="row"><span id="counter"></span><span id="score"></span></div><div class="progress" aria-label="Progression"><span id="bar"></span></div><div class="prompt" id="prompt"></div><div class="answer"><input id="response" inputmode="decimal" autocomplete="off" aria-label="Ta réponse" placeholder="Ta réponse"><button class="btn" id="validate">Valider</button></div><div id="feedback" class="feedback hidden" role="status" aria-live="polite"></div><div class="actions"><span class="meta">Écris un nombre. Tu peux utiliser une virgule.</span><button class="btn hidden" id="next">Calcul suivant →</button></div></section><section class="card hidden" id="end"><h2 id="result"></h2><p id="conclusion"></p><div id="review" class="review hidden"></div><div class="actions"><button class="btn" id="retry">Rejouer la fiche ↻</button><button class="subtle" id="nextSheet">Passer à la fiche suivante →</button></div></section></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let data=null,deck=[],idx=0,points=0,errors=[],answered=false;const hide=(id,v)=>$(id).classList.toggle('hidden',v);const clean=s=>String(s).trim().replace(/[\s\u00a0\u202f]/g,'').replace(',','.');const num=s=>Number(clean(s));
for(let i=1;i<=35;i++)$('serie').add(new Option('S'+i,i-1));
function at(){return [+$('serie').value,+$('seance').value]}function current(){let [s,j]=at();return data[s][j]}function key(){let [s,j]=at();return 'zoumai-calcul-mental-S'+(s+1)+'-'+(j+1)}
function select(s,j){$('serie').value=s;$('seance').value=j;showIntro();window.scrollTo({top:0,behavior:'smooth'})}function move(delta){let [s,j]=at(),p=s*4+j+delta;if(p<0||p>=140)return;select(Math.floor(p/4),p%4)}
function showIntro(){if(!data)return;let [s,j]=at(),x=current();hide('game',true);hide('end',true);hide('intro',false);$('label').textContent='S'+(s+1)+' · SÉANCE '+(j+1);$('heading').textContent='Jeu de la fiche S'+(s+1)+'-'+(j+1);$('description').textContent=x.questions.length+' défis tirés de cette séance, avec correction immédiate après chaque réponse.';$('page').textContent='Fichier de calcul mental CM2 · page '+x.page;try{let best=localStorage.getItem(key());$('best').textContent=best===null?'':'Ton meilleur résultat sur cet appareil : '+best+'/'+x.questions.length}catch(e){$('best').textContent=''}$('prev').disabled=s===0&&j===0;$('following').disabled=s===34&&j===3;history.replaceState(null,'','#S'+(s+1)+'-'+(j+1))}
function begin(){deck=[...current().questions];idx=0;points=0;errors=[];hide('intro',true);hide('end',true);hide('game',false);showQuestion()}
function showQuestion(){answered=false;let q=deck[idx];$('counter').textContent='Défi '+(idx+1)+'/'+deck.length;$('score').textContent='★ '+points+' point'+(points>1?'s':'');$('bar').style.width=(idx/deck.length*100)+'%';$('prompt').textContent=q.q;$('response').value='';$('response').disabled=false;$('validate').disabled=false;hide('feedback',true);hide('next',true);$('next').textContent=idx===deck.length-1?'Voir mon résultat →':'Calcul suivant →';$('response').focus()}
function validate(){if(answered)return;let q=deck[idx],raw=$('response').value;if(!raw.trim()){ $('response').focus();return}let given=num(raw),expected=num(q.a);if(!Number.isFinite(given)){ $('feedback').className='feedback bad';$('feedback').textContent='Écris seulement un nombre, avec une virgule si besoin.';return}answered=true;let ok=Math.abs(given-expected)<1e-6;if(ok)points++;else errors.push({q:q.q,a:q.a});$('feedback').className='feedback '+(ok?'good':'bad');$('feedback').textContent=(ok?'Bien joué ! ':'La réponse attendue est '+q.a+'. ')+q.why;$('response').disabled=true;$('validate').disabled=true;hide('next',false);$('score').textContent='★ '+points+' point'+(points>1?'s':'')}
function next(){if(!answered)return;if(++idx<deck.length){showQuestion();return}hide('game',true);hide('end',false);$('result').textContent=points+'/'+deck.length+' · '+(points>=deck.length-2?'Bravo !':'Continue à t’entraîner !');$('conclusion').textContent=errors.length?'Regarde les calculs à revoir et retente la fiche.':'Tous les calculs sont justes !';let box=$('review');hide('review',!errors.length);box.replaceChildren();if(errors.length){let b=document.createElement('b');b.textContent='Calculs à revoir :';box.append(b);let ul=document.createElement('ul');errors.forEach(e=>{let li=document.createElement('li');li.textContent=e.q+' → '+e.a;ul.append(li)});box.append(ul)}try{let old=Number(localStorage.getItem(key())||0);if(points>old)localStorage.setItem(key(),String(points))}catch(e){}$('nextSheet').disabled=at()[0]===34&&at()[1]===3;window.scrollTo({top:0,behavior:'smooth'})}
$('serie').onchange=showIntro;$('seance').onchange=showIntro;$('prev').onclick=()=>move(-1);$('following').onclick=()=>move(1);$('start').onclick=begin;$('validate').onclick=validate;$('next').onclick=next;$('retry').onclick=begin;$('nextSheet').onclick=()=>move(1);$('response').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();answered?next():validate()}};
fetch('calcul-mental-jeux.json').then(r=>{if(!r.ok)throw Error('données absentes');return r.json()}).then(d=>{if(d.length!==35||d.some(x=>x.length!==4))throw Error('données incomplètes');data=d;let m=location.hash.match(/^#S(\d+)-(\d+)$/);if(m){$('serie').value=Math.min(34,Math.max(0,+m[1]-1));$('seance').value=Math.min(3,Math.max(0,+m[2]-1))}hide('loading',true);showIntro()}).catch(()=>{$('loading').className='card error';$('loading').textContent='Les jeux ne se chargent pas pour le moment. Réessaie dans quelques instants.'});
})();</script></body></html>
