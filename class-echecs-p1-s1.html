<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class'Échecs · P1 · Séance 1</title><style>
*{box-sizing:border-box}body{margin:0;background:#142535;color:#f1f6f2;font:16px system-ui,Arial}main{max-width:720px;margin:auto;padding:15px}a{color:#cce9d9}h1{font-size:clamp(1.4rem,4vw,2rem);margin:18px 0 6px}.muted{color:#cbd9df;font-size:.9rem;line-height:1.5}.steps{display:flex;gap:6px;flex-wrap:wrap;margin:15px 0}.steps button{flex:1;min-width:105px;padding:10px 7px;background:#294456;color:white;border:1px solid #63808b;border-radius:9px;font:inherit;font-size:.82rem;cursor:pointer}.steps button.active{background:#d5e5b6;color:#172635;font-weight:800}.board{display:grid;grid-template-columns:repeat(8,1fr);border:5px solid #354d5c;border-radius:8px;overflow:hidden;max-width:620px;margin:12px auto;box-shadow:0 12px 35px #09182466}.sq{aspect-ratio:1;border:0;padding:0;position:relative;display:grid;place-items:center;cursor:pointer;touch-action:manipulation}.light{background:#eeeed2}.dark{background:#769656}.sq.sel{background:#e7c861!important}.sq.target:after{content:"";position:absolute;width:22%;height:22%;background:#27473577;border-radius:50%}.sq.capture:after{content:"";position:absolute;inset:6%;border:4px solid #2a654d99;border-radius:50%}.sq img{width:96%;height:96%;pointer-events:none;filter:drop-shadow(0 2px 1px #17212b35)}.coord{position:absolute;font-size:clamp(10px,2vw,15px);font-weight:900;pointer-events:none}.rank{left:3px;top:2px}.file{right:3px;bottom:2px}.light .coord{color:#527249}.dark .coord{color:#f8f3d9}.instruction{font-size:1.05rem;font-weight:750;min-height:3em;margin:14px 0 5px}.status{min-height:2.5em;color:#ffe3a1;font-weight:700}.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.controls button,.next{border:0;border-radius:10px;background:#d5e5b6;color:#142535;padding:11px 16px;font:inherit;font-weight:800;cursor:pointer}.rules{color:#d7e3e3;font-size:.9rem;line-height:1.5}.rules p{margin:5px 0}.sq:focus-visible{outline:3px solid #ffd169;outline-offset:-3px}.next{display:none;margin:10px auto}.next.show{display:block}
</style></head><body><main><header><a href="class-echecs.html#parcours-1">← Parcours 1</a></header><h1>♟ Séance 1 · Découverte du jeu et des pions</h1><p class="muted">Class'Échecs · Parcours 1 · Exercices et bataille de pions</p><nav class="steps" aria-label="Étapes de la séance"><button data-step="0" class="active">1. L'échiquier</button><button data-step="1">2. Les pièces</button><button data-step="2">3. Les pions</button><button data-step="3">4. Bataille !</button></nav><p id="instruction" class="instruction" aria-live="polite"></p><div id="board" class="board" aria-label="Échiquier interactif"></div><p id="status" class="status" role="status" aria-live="polite"></p><div class="controls"><button id="hint">💡 Indice</button><button id="undo">↶ Annuler</button><button id="reset">↺ Recommencer</button></div><button id="next" class="next">Étape suivante →</button><div id="rules" class="rules"></div></main><script>
'use strict';
const $=id=>document.getElementById(id),files='abcdefgh',startBack=['R','N','B','Q','K','B','N','R'];let stage=0,board={},turn='w',selected=null,history=[],task=0,done=false;
const piece=(c,t)=>c+t,op=c=>c==='w'?'b':'w',row=s=>Number(s[1]),col=s=>files.indexOf(s[0]),square=(f,r)=>files[f]+r;
function initial(mode){const b={};if(mode==='pieces'){for(let f=0;f<8;f++){b[square(f,1)]='w'+startBack[f];b[square(f,2)]='wP';b[square(f,7)]='bP';b[square(f,8)]='b'+startBack[f]}}if(mode==='battle'){for(let f=0;f<8;f++){b[square(f,2)]='wP';b[square(f,7)]='bP'}}return b}
const orientations=['h1','a8','a1'],names=['wK','wQ','wR','wB','wN','wP'],nameLabels=['roi','dame','tour','fou','cavalier','pion'];
const pawnChallenges=[
{b:{e2:'wP'},from:'e2',to:'e4',title:'Avance ton pion blanc de deux cases depuis sa position de départ.'},
{b:{d4:'wP'},from:'d4',to:'d5',title:'Avance ton pion blanc d’une case.'},
{b:{e4:'wP',d5:'bP'},from:'e4',to:'d5',title:'Capture le pion noir en diagonale.'},
{b:{e4:'wP',e5:'bP'},from:'e4',to:null,title:'Un pion noir bloque ton pion. Essaie d’avancer, puis constate le blocage.'}
];
function setStage(n){stage=n;task=0;done=false;selected=null;history=[];turn='w';board=n===1?initial('pieces'):n===3?initial('battle'):n===2?{...pawnChallenges[0].b}:{};document.querySelectorAll('[data-step]').forEach(b=>b.classList.toggle('active',+b.dataset.step===n));$('next').classList.remove('show');$('rules').innerHTML=n===3?'<p><strong>Bataille de pions :</strong> deux joueurs, Blancs puis Noirs. Le premier pion arrivé sur la dernière rangée gagne. On gagne aussi si l’adversaire n’a plus de pions ou s’il est bloqué alors qu’on peut jouer. Si les deux joueurs sont bloqués, égalité.</p><p>Le pion avance d’une case, ou de deux depuis sa case de départ si le passage est libre. Il capture en diagonale et ne recule jamais. Pas de prise en passant dans cette séance.</p>':n===1?'<p>Les dames se placent sur la colonne d : dame blanche en d1, dame noire en d8. On dit « dame » et « cavalier ».</p>':n===0?'<p>La case en bas à droite doit être claire. Les lettres désignent les colonnes ; les chiffres désignent les rangées.</p>':'<p>Un pion ne peut pas reculer ni avancer sur une case occupée. Il prend en diagonale, jamais tout droit.</p>';update()}
function update(){const text=stage===0?['Repère la case claire en bas à droite : touche h1.','Touche la case a8.','Touche la case a1.'][task]:stage===1?'Trouve le '+nameLabels[task]+' blanc et touche-le.':stage===2?pawnChallenges[task].title:done?'Partie terminée. Recommence pour une revanche.':(turn==='w'?'Aux Blancs de jouer.':'Aux Noirs de jouer.');$('instruction').textContent=text;$('status').textContent='';draw()}
function pawnMoves(s,b){const p=b[s];if(!p||p[1]!=='P')return [];const c=p[0],dir=c==='w'?1:-1,r=row(s),f=col(s),out=[],ahead=square(f,r+dir);if(r+dir>=1&&r+dir<=8&&!b[ahead]){out.push(ahead);const twice=square(f,r+2*dir);if(r===(c==='w'?2:7)&&!b[twice])out.push(twice)}for(const df of [-1,1])if(f+df>=0&&f+df<8&&r+dir>=1&&r+dir<=8){const target=square(f+df,r+dir);if(b[target]&&b[target][0]!==c)out.push(target)}return out}
function allMoves(c){return Object.keys(board).filter(s=>board[s][0]===c).flatMap(s=>pawnMoves(s,board))}
function finish(msg){done=true;selected=null;$('status').textContent=msg;$('instruction').textContent='🏆 '+msg;$('next').classList.add('show');draw()}
function battleResult(){const wp=Object.entries(board).filter(([s,p])=>p==='wP'),bp=Object.entries(board).filter(([s,p])=>p==='bP');if(wp.some(([s])=>row(s)===8))return 'Les Blancs gagnent : un pion a atteint la dernière rangée !';if(bp.some(([s])=>row(s)===1))return 'Les Noirs gagnent : un pion a atteint la dernière rangée !';if(!wp.length)return 'Les Noirs gagnent : les Blancs n’ont plus de pions !';if(!bp.length)return 'Les Blancs gagnent : les Noirs n’ont plus de pions !';const current=allMoves(turn).length,other=allMoves(op(turn)).length;if(!current&&other)return (turn==='w'?'Les Noirs':'Les Blancs')+' gagnent : adversaire bloqué !';if(!current&&!other)return 'Partie nulle : les deux joueurs sont bloqués.';return null}
function click(s){if(done)return;if(stage===0){if(s===orientations[task]){task++;if(task===3)finish('Tu sais repérer les cases de l’échiquier !');else{update();$('status').textContent='Bravo !'}}else $('status').textContent='Observe les lettres et les chiffres autour de l’échiquier.';return}if(stage===1){if(board[s]===names[task]){task++;if(task===names.length)finish('Tu reconnais les six pièces !');else{update();$('status').textContent='Bien trouvé !'}}else $('status').textContent='Essaie une autre pièce blanche.';return}if(selected===s){selected=null;draw();return}if(!selected){if(board[s]&&board[s][0]==='w'&&(stage===2||stage===3&&turn==='w')||board[s]&&stage===3&&board[s][0]===turn){selected=s;draw()}else $('status').textContent=stage===3?'Choisis un pion de la couleur qui doit jouer.':'Sélectionne le pion blanc.';return}const legal=pawnMoves(selected,board);if(stage===2&&task===3){$('status').textContent='Bien observé : ce pion est bloqué et ne peut pas avancer.';finish('Tu as compris le blocage !');return}if(!legal.includes(s)){ $('status').textContent='Coup interdit : un pion avance droit et capture en diagonale.';return}if(stage===2&&s!==pawnChallenges[task].to){$('status').textContent='Cherche la case demandée par la consigne.';return}history.push({board:{...board},turn,task});board[s]=board[selected];delete board[selected];selected=null;if(stage===2){task++;if(task>=pawnChallenges.length){finish('Tu sais déplacer et capturer avec un pion !');return}board={...pawnChallenges[task].b};update();$('status').textContent='Bravo !'}else{turn=op(turn);const result=battleResult();if(result){done=true;$('instruction').textContent='🏆 '+result;$('status').textContent='Tu peux recommencer une nouvelle bataille.';draw()}else{update();$('status').textContent='Bien joué !'}}}
function draw(){const el=$('board');el.replaceChildren();const targets=selected?pawnMoves(selected,board):[];for(let r=8;r>=1;r--)for(let f=0;f<8;f++){const s=square(f,r),b=document.createElement('button');b.type='button';b.className='sq '+((f+r)%2?'dark':'light');if(s===selected)b.classList.add('sel');if(targets.includes(s))b.classList.add(board[s]?'capture':'target');if(stage===0&&s===orientations[task])b.style.boxShadow='inset 0 0 0 3px #e4b63d';if(board[s]){const img=document.createElement('img');img.src='https://lichess1.org/assets/piece/merida/'+board[s]+'.svg';img.alt='';b.append(img)}if(f===0){const span=document.createElement('span');span.className='coord rank';span.textContent=r;b.append(span)}if(r===1){const span=document.createElement('span');span.className='coord file';span.textContent=files[f];b.append(span)}b.setAttribute('aria-label',s+(board[s]?' '+board[s]:''));b.onclick=()=>click(s);el.append(b)}}
$('reset').onclick=()=>setStage(stage);$('undo').onclick=()=>{if(stage!==3||!history.length)return;const h=history.pop();board=h.board;turn=h.turn;selected=null;done=false;update()};$('hint').onclick=()=>{$('status').textContent=stage===0?'La case h1 est en bas à droite.':stage===1?'Cherche la pièce blanche indiquée.':stage===2?'Sélectionne ton pion, puis regarde les cases proposées.':'Avance vers la dernière rangée ou capture en diagonale.'};$('next').onclick=()=>setStage(Math.min(3,stage+1));document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>setStage(+b.dataset.step));setStage(0);
</script></body></html>
