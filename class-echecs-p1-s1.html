const orientations=['h1','a8','a1','d4','f6','b2','g7','c5','e3','h8','a5','f1','c7','g2','b6','e8','d1','h4','f5','c3'],names=['wK','wQ','wR','wB','wN','wP','bK','bQ','bR','bB','bN','bP'],nameLabels=['roi blanc','dame blanche','tour blanche','fou blanc','cavalier blanc','pion blanc','roi noir','dame noire','tour noire','fou noir','cavalier noir','pion noir'];

{b:{a4:'wP',a5:'bP',c3:'wP',e4:'wP',e5:'bP'},question:'Quel pion blanc peut avancer ?',answers:['c3'],why:'Le pion c3 peut avancer. Les pions a4 et e4 sont bloqués.'},
{b:{b2:'wP',d4:'wP',e5:'bP',g4:'wP',h5:'bP'},question:'Quels pions blancs peuvent prendre ?',answers:['d4','g4'],why:'Les pions d4 et g4 peuvent capturer en diagonale.'},

{b:{b4:'wP',c5:'bP',f4:'wP',f5:'bP',h3:'wP'},question:'Quel pion blanc peut capturer en diagonale ?',answers:['b4'],why:'Le pion b4 peut capturer en c5. Le pion f4 est bloqué devant lui.'}

{b:{a2:'wP',b2:'wP',c2:'wP',d2:'wP',e2:'wP',f2:'wP',g2:'wP',h2:'wP',a7:'bP',b7:'bP',c7:'bP',d7:'bP',e7:'bP',f7:'bP',g7:'bP',h7:'bP'},from:'d2',to:'d4',title:'A2 · Départ : avance le pion d2 de deux cases.',why:'Au départ, un pion peut avancer d’une ou deux cases.'},
{b:{a2:'wP',b2:'wP',c2:'wP',d2:'wP',e4:'wP',f2:'wP',g2:'wP',h2:'wP',a7:'bP',b7:'bP',c7:'bP',d7:'bP',e5:'bP',f7:'bP',g7:'bP',h7:'bP'},from:null,to:null,identify:'e4',title:'A2 · Quel pion blanc est bloqué par un pion noir ?',why:'Les pions e4 et e5 sont face à face : aucun ne peut avancer.'},
{b:{a2:'wP',b2:'wP',c2:'wP',d2:'wP',e4:'wP',f4:'wP',g2:'wP',h2:'wP',a7:'bP',b7:'bP',c7:'bP',d7:'bP',e5:'bP',f7:'bP',g7:'bP',h7:'bP'},from:'f4',to:'e5',title:'A2 · Blancs : capture le pion noir e5 avec ton pion f4.',why:'Le pion prend en diagonale vers l’avant.'},
{b:{a2:'wP',b2:'wP',c2:'wP',d2:'wP',e4:'wP',f4:'bP',g2:'wP',h2:'wP',a7:'bP',b7:'bP',c7:'bP',d7:'bP',f7:'bP',g7:'bP',h7:'bP'},from:null,to:null,identify:'f4',title:'A2 · Après la prise : touche le pion noir arrivé en f4.',why:'Le pion noir a pris en diagonale et s’est placé sur la case f4.'},

{b:{a6:'wP',b5:'wP',c4:'wP',a7:'bP',b6:'bP',c5:'bP',d4:'bP'},identify:'a6',from:null,to:null,identifyMany:['a6','b5','c4'],title:'A3 · Blancs : touche les trois pions blancs bloqués.',why:'Tous les pions blancs sont bloqués. Les Noirs peuvent encore avancer le pion d4 : ils gagnent.'},

{b:{e4:'wP'},from:'e4',to:'e5',title:'Ton pion est maintenant en e4. Avance-le d’une seule case jusqu’en e5.'},
{b:{e5:'wP',d6:'bP'},from:'e5',to:'d6',title:'Depuis e5, capture le pion noir en d6, en diagonale.'},
{b:{e5:'wP',e6:'bP'},from:'e5',to:null,title:'Un pion noir se trouve juste devant ton pion en e5. Sélectionne ton pion, puis essaie d’avancer : il est bloqué.'}

function setStage(n){if(promptTimer)clearTimeout(promptTimer);promptTimer=null;$('center-prompt').classList.remove('show');$('coordinate-reminder').classList.remove('show');promptLocked=false;if(aiTimer)clearTimeout(aiTimer);aiTimer=null;if(advanceTimer)clearTimeout(advanceTimer);advanceTimer=null;stage=n;task=0;done=false;$('game-options').classList.toggle('show',n===5);selected=null;identified=[];history=[];turn='w';board=n===1?initial('pieces'):n===5?initial('battle'):n===2?{...pawnChallenges[0].b}:n===3?{...situations[0].b}:n===4?{...originals[0].b}:{};document.querySelectorAll('[data-step]').forEach(b=>b.classList.toggle('active',+b.dataset.step===n));$('next').classList.remove('show');$('rules').innerHTML=n===5?'<p><strong>Bataille de pions :</strong> deux joueurs, Blancs puis Noirs. Le premier pion arrivé sur la dernière rangée gagne. On gagne aussi si l’adversaire n’a plus de pions ou s’il est bloqué alors qu’on peut jouer. Si les deux joueurs sont bloqués, égalité.</p><p>Le pion avance d’une case, ou de deux depuis sa case de départ si le passage est libre. Il capture en diagonale et ne recule jamais. Pas de prise en passant dans cette séance.</p>':n===4?'<p>Joue le coup demandé ou touche les pions indiqués.</p>':n===3?'<p>Observe les positions. Pour chaque question, touche un pion blanc qui correspond à la consigne. Plusieurs réponses peuvent parfois convenir.</p>':n===1?'<p>Les dames se placent sur la colonne d : dame blanche en d1, dame noire en d8. On dit « dame » et « cavalier ».</p>':n===0?'<p>La case en bas à droite doit être claire. Les lettres désignent les colonnes ; les chiffres désignent les rangées.</p>':'<p>Un pion ne peut pas reculer ni avancer sur une case occupée. Il prend en diagonale, jamais tout droit.</p>';update()}
function update(){const text=stage===0?(task<2?'Touche la case '+orientations[task]:'Repère la coordonnée affichée au centre')+' ('+(task+1)+'/'+orientations.length+').':stage===1?'Touche '+(nameLabels[task].startsWith('dame')||nameLabels[task].startsWith('tour')?'la ':'le ')+nameLabels[task]+' ('+(task+1)+'/'+names.length+').' :stage===2?pawnChallenges[task].title:stage===3?situations[task].question+' ('+(task+1)+'/'+situations.length+')':stage===4?originals[task].title+' ('+(task+1)+'/'+originals.length+')':done?'Partie terminée. Recommence pour une revanche.':(turn==='w'?'Aux Blancs de jouer.':'Aux Noirs de jouer.');$('instruction').textContent=text;$('status').textContent='';draw();showCenterPrompt()}
function pawnMoves(s,b){const p=b[s];if(!p||p[1]!=='P')return [];const c=p[0],dir=c==='w'?1:-1,r=row(s),f=col(s),out=[],ahead=square(f,r+dir);if(r+dir>=1&&r+dir<=8&&!b[ahead]){out.push(ahead);const twice=square(f,r+2*dir);if(r===(c==='w'?2:7)&&!b[twice])out.push(twice)}for(const df of [-1,1])if(f+df>=0&&f+df<8&&r+dir>=1&&r+dir<=8){const target=square(f+df,r+dir);if(b[target]&&b[target][0]!==c)out.push(target)}return out}
function allMoves(c){return Object.keys(board).filter(s=>board[s][0]===c).flatMap(s=>pawnMoves(s,board))}
function moveOptions(c,b){return Object.keys(b).filter(s=>b[s][0]===c).flatMap(from=>pawnMoves(from,b).map(to=>({from,to})))}
function resultFor(b,c){const w=Object.keys(b).filter(s=>b[s]==='wP'),k=Object.keys(b).filter(s=>b[s]==='bP');if(w.some(s=>row(s)===8)||!k.length)return 'w';if(k.some(s=>row(s)===1)||!w.length)return 'b';const m=moveOptions(c,b).length,o=moveOptions(op(c),b).length;if(!m)return o?op(c):'draw';return null}

function evaluate(b){let v=0;for(const [s,p] of Object.entries(b)){const progress=p[0]==='b'?8-row(s):row(s)-1;const value=100+progress*17+(progress>=5?progress*14:0);v+=(p[0]==='b'?1:-1)*value}return v}
function searchMove(b,color,depth,alpha,beta){const result=resultFor(b,color);if(result)return {score:result==='draw'?0:result==='b'?100000+depth:-100000-depth};if(depth===0)return {score:evaluate(b)};const options=moveOptions(color,b);let best=color==='b'?-Infinity:Infinity,chosen=null;for(const m of options){const score=searchMove(afterMove(b,m),op(color),depth-1,alpha,beta).score;if(color==='b'?score>best:score<best){best=score;chosen=m}if(color==='b')alpha=Math.max(alpha,best);else beta=Math.min(beta,best);if(beta<=alpha)break}return {score:best,move:chosen}}
function computerMove(){aiTimer=null;if(stage!==5||done||turn!=='b'||$('opponent').value!=='computer')return;const options=moveOptions('b',board);if(!options.length){const result=battleResult();if(result){done=true;$('instruction').textContent='🏆 '+result;draw()}return}let chosen;const level=$('level').value;if(level==='easy')chosen=options[Math.floor(Math.random()*options.length)];else if(level==='medium'){const scored=options.map(m=>({m,score:evaluate(afterMove(board,m))+(board[m.to]?70:0)+Math.random()*65}));scored.sort((a,b)=>b.score-a.score);chosen=scored[0].m}else{let best=-Infinity;for(const m of options){const score=searchMove(afterMove(board,m),'w',3,-Infinity,Infinity).score;if(score>best){best=score;chosen=m}}}history.push({board:{...board},turn,task});board=afterMove(board,chosen);turn='w';const result=battleResult();if(result){done=true;$('instruction').textContent='🏆 '+result;$('status').textContent='Tu peux recommencer pour une revanche.';draw()}else{update();$('status').textContent='L’ordinateur a joué '+chosen.from+' → '+chosen.to+'. À toi !'}}

function finish(msg){window.ZouChessBoard?.showToast?.('🏆 '+msg,2400);done=true;selected=null;$('status').textContent=msg;$('instruction').textContent='🏆 '+msg;$('next').classList.add('show');draw()}
function battleResult(){const wp=Object.entries(board).filter(([s,p])=>p==='wP'),bp=Object.entries(board).filter(([s,p])=>p==='bP');if(wp.some(([s])=>row(s)===8))return 'Les Blancs gagnent : un pion a atteint la dernière rangée !';if(bp.some(([s])=>row(s)===1))return 'Les Noirs gagnent : un pion a atteint la dernière rangée !';if(!wp.length)return 'Les Noirs gagnent : les Blancs n’ont plus de pions !';if(!bp.length)return 'Les Blancs gagnent : les Noirs n’ont plus de pions !';const current=allMoves(turn).length,other=allMoves(op(turn)).length;if(!current&&other)return (turn==='w'?'Les Noirs':'Les Blancs')+' gagnent : adversaire bloqué !';if(!current&&!other)return 'Partie nulle : les deux joueurs sont bloqués.';return null}
function click(s){if(done||promptLocked)return;if(stage===5&&$('opponent').value==='computer'&&turn==='b')return;if(stage===0){if(s===orientations[task]){task++;if(task===orientations.length)finish('Tu sais repérer les cases de l’échiquier !');else{update();$('status').textContent='Bravo !'}}else $('status').textContent='Observe les lettres et les chiffres autour de l’échiquier.';return}if(stage===1){if(board[s]===names[task]){task++;if(task===names.length)finish('Tu reconnais les douze pièces !');else{update();$('status').textContent='Bien trouvé !'}}else $('status').textContent='Essaie une autre pièce blanche.';return}if(stage===3){const situation=situations[task];if(situation.answers.includes(s)){const feedback=situation.why;task++;selected=null;if(task>=situations.length){finish('Tu sais observer les déplacements, les prises et les blocages !');$('status').textContent=feedback}else{board={...situations[task].b};update();$('status').textContent='Bravo ! '+feedback}}else $('status').textContent='Regarde si ce pion peut avancer, prendre ou s’il est bloqué.';return}if(stage===4){const ex=originals[task];if(ex.identifyMany){if(!ex.identifyMany.includes(s)){$('status').textContent='Touche uniquement les pions blancs bloqués.';return}if(identified.includes(s)){$('status').textContent='Tu as déjà trouvé ce pion. Cherche les autres.';return}identified.push(s);if(identified.length===ex.identifyMany.length){identified=[];advanceOriginal()}else{$('status').textContent='Bravo ! '+identified.length+' pion'+(identified.length>1?'s':'')+' sur 3 trouvé'+(identified.length>1?'s':'')+'.';draw()}return}if(ex.identify){if(s!==ex.identify){$('status').textContent='Observe le diagramme original et cherche le bon pion.';return}advanceOriginal();return}if(!selected){if(s===ex.from){selected=s;draw()}else $('status').textContent='Choisis le pion indiqué dans la consigne.';return}if(s===selected){selected=null;draw();return}if(s!==ex.to||!pawnMoves(selected,board).includes(s)){$('status').textContent='Essaie encore : vérifie la direction et la prise.';return}board[s]=board[selected];delete board[selected];selected=null;advanceOriginal();return}if(selected===s){selected=null;draw();return}if(!selected){if(board[s]&&board[s][0]==='w'&&(stage===2||stage===5&&turn==='w')||board[s]&&stage===5&&board[s][0]===turn){selected=s;draw()}else $('status').textContent=stage===5?'Choisis un pion de la couleur qui doit jouer.':'Sélectionne le pion blanc.';return}const legal=pawnMoves(selected,board);if(stage===2&&task===3){$('status').textContent='Bien observé : ce pion est bloqué et ne peut pas avancer.';finish('Tu as compris le blocage !');return}if(!legal.includes(s)){ $('status').textContent='Coup interdit : un pion avance droit et capture en diagonale.';return}if(stage===2&&s!==pawnChallenges[task].to){$('status').textContent='Cherche la case demandée par la consigne.';return}history.push({board:{...board},turn,task});board[s]=board[selected];delete board[selected];selected=null;if(stage===2){task++;if(task>=pawnChallenges.length){finish('Tu sais déplacer et capturer avec un pion !');return}board={...pawnChallenges[task].b};update();$('status').textContent='Bravo !'}else{turn=op(turn);const result=battleResult();if(result){done=true;$('instruction').textContent='🏆 '+result;$('status').textContent='Tu peux recommencer une nouvelle bataille.';draw()}else{update();$('status').textContent='Bien joué !';if(stage===5&&turn==='b'&&$('opponent').value==='computer')aiTimer=setTimeout(computerMove,420)}}}
function advanceOriginal(){const message=originals[task].why;window.ZouChessBoard?.showToast?.('🌟 Bravo !',1400);task++;if(task>=originals.length){finish('Tu as réussi tous les exercices !');$('status').textContent=message}else{board={...originals[task].b};update();$('status').textContent='Bravo ! '+message}}function draw(){const el=$('board');el.replaceChildren();const targets=selected?pawnMoves(selected,board):[];for(let r=8;r>=1;r--)for(let f=0;f<8;f++){const s=square(f,r),b=document.createElement('button');b.type='button';b.className='sq '+((f+r)%2?'dark':'light');if(s===selected||stage===4&&identified.includes(s))b.classList.add('sel');if(targets.includes(s))b.classList.add(board[s]?'capture':'target');if(board[s]){const img=document.createElement('img');img.src='https://lichess1.org/assets/piece/merida/'+board[s]+'.svg';img.alt='';b.append(img)}if(f===0){const span=document.createElement('span');span.className='coord rank';span.textContent=r;b.append(span)}if(r===1){const span=document.createElement('span');span.className='coord file';span.textContent=files[f];b.append(span)}b.setAttribute('aria-label',s+(board[s]?' '+board[s]:''));b.onclick=()=>click(s);el.append(b)}}
