<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opérations posées · Zou Maï</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef4f7;color:#14283e;font:17px system-ui,sans-serif}main{max-width:980px;margin:auto;padding:18px}a{color:#155b92}header{display:flex;align-items:center;gap:15px}header img{width:72px}h1{margin:4px 0;font-size:clamp(2rem,6vw,3.6rem)}.panel{background:#fff;border:2px solid #d7e5ed;border-radius:20px;padding:18px;margin:16px 0;box-shadow:0 8px 24px #15304712}.controls,.tabs,.keypad{display:flex;gap:8px;flex-wrap:wrap}button,select{border:0;border-radius:11px;padding:11px 14px;font:inherit;font-weight:750;background:#dce9f5;color:#183b58;cursor:pointer}.active,.primary{background:#155b92!important;color:#fff!important}.task{text-align:center;font-size:1.45rem;font-weight:900}.gridwrap{overflow-x:auto;padding:10px}.grid{margin:auto;border-collapse:collapse;table-layout:fixed}.grid th{font-size:.8rem;color:#607080;height:26px}.grid td{width:58px;height:52px;border:1px solid #a8cee0;text-align:center;font-size:1.65rem;font-weight:850;background:#fbfeff;cursor:pointer}.grid tr.carry td{height:38px;font-size:1rem;color:#b04f28;background:#fff8ec}.grid tr.exchange td{background:#fff5e7;color:#a14c20;font-size:1.05rem;height:39px}.grid tr.result td{border-top:4px solid #e04444}.grid td.sign{border:0;background:white;width:42px}.grid td.selected{outline:4px solid #f0a629;outline-offset:-4px}.grid td.fixed{color:#445b69;background:#edf5f8;cursor:default}.grid td.borrowed{position:relative;background:#fffaf0}.oldDigit{text-decoration:line-through;text-decoration-thickness:3px;color:#687985;font-size:1.15rem;position:absolute;left:8px;bottom:4px}.newDigit{font-weight:950;color:#a33b18;font-size:1.25rem;position:absolute;right:7px;top:2px}.exchangeBtn{background:#f6dfb8!important;color:#713b12!important}.exchangeBtn.hidden{display:none}.phase{font-weight:850;color:#155b92}.info{padding:12px;border-radius:12px;background:#eaf3fa;margin-top:12px;min-height:48px;font-weight:700}.success{background:#daf6e7;color:#17623e}.error{background:#fff0df;color:#81431d}.keypad{justify-content:center;margin:12px}.keypad button{min-width:48px;font-size:1.15rem}.small{font-size:.9rem;color:#5b6b76}.hidden{display:none}@media(max-width:600px){main{padding:10px}.panel{padding:12px}.grid td{width:45px;height:48px}.gridwrap{padding:4px}}</style></head><body><main><a href="maths-lecons-cm2.html">← Mathématiques CM2</a><header><img src="images/loup-bleu-original.png" alt="Zoomy"><div><small>NOMBRES ET CALCULS</small><h1>Opérations posées</h1><div class="phase" id="phase">1 · Je pose</div></div></header>
<div class="panel"><div class="tabs"><button id="add" class="active">＋ Addition</button><button id="sub">− Soustraction</button><select id="level"><option value="1">Palier 1 · sans retenue</option><option value="2">Palier 2 · avec retenues</option><option value="3">Palier 3 · grands nombres</option><option value="4">Palier 4 · décimaux simples</option><option value="5">Palier 5 · décimaux avec retenues</option></select><select id="method" class="hidden" aria-label="Technique de soustraction"><option value="exchange">Casser les dizaines · échanges</option><option value="constant">Écarts constants · retenues</option></select><button id="new">Nouvelle opération ↻</button></div><p class="task" id="task"></p><p class="small">Pose les nombres, écris tes retenues ou échanges, puis effectue directement l’opération.</p></div>
<div class="panel"><div class="gridwrap"><table class="grid" id="grid"></table></div><div class="keypad" id="keys"></div><div class="controls"><button id="check" class="primary">Vérifier mon opération</button><button id="borrowBtn" class="exchangeBtn hidden">✎ Barrer et échanger</button><button id="erase">Effacer la case</button></div><div class="info" id="feedback">Pose les nombres puis effectue l’opération.</div></div>
</main><script>
(()=>{const G=document.getElementById('grid'),K=document.getElementById('keys'),fb=document.getElementById('feedback'),task=document.getElementById('task'),phase=document.getElementById('phase'),check=document.getElementById('check'),level=document.getElementById('level');let op='+',a,b,terms=[],stage='all',sel=null,cells={},cols=6,decimals=false,method=document.getElementById('method'),borrowState=null,borrowDone=false;const borrowBtn=document.getElementById('borrowBtn');
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a, digits=n=>String(n).split('').map(Number);
function make(){stage='all';phase.textContent='Je pose et j’effectue';check.textContent='Vérifier mon opération';let l=+level.value;decimals=l>=4;terms=[];if(!decimals){if(op==='+'){let count=Math.random()<.45?3:2;if(l===1){terms=count===3?[rnd(100,899),rnd(10,99),rnd(1,9)]:[rnd(100,899),rnd(10,99)]}else if(l===2){terms=count===3?[rnd(1000,8999),rnd(100,999),rnd(10,99)]:[rnd(1000,8999),rnd(10,999)]}else{terms=count===3?[rnd(10000,399999),rnd(1000,9999),rnd(10,999)]:[rnd(10000,399999),rnd(10,9999)]}}else{a=l===1?rnd(400,999):l===2?rnd(500,9999):rnd(20000,999999);b=rnd(l===1?100:500,a-1);terms=[a,b]}}else{let scale=l===4?10:100;if(op==='+'){let count=Math.random()<.5?3:2;if(l===4){terms=count===3?[rnd(1000,9999)/10,rnd(100,999)/10,rnd(1,99)/10]:[rnd(1000,9999)/10,rnd(1,999)/10]}else{terms=count===3?[rnd(10000,99999)/100,rnd(100,9999)/100,rnd(1,999)/100]:[rnd(10000,99999)/100,rnd(1,9999)/100]}}else{a=rnd(1000,9999)/scale;b=rnd(100,Math.floor(a*scale)-1)/scale;terms=[a,b]}}a=terms[0];b=terms[1];let maxInt=Math.max(...terms.map(n=>String(Math.trunc(n)).length)),dec=decimals?(l===4?1:2):0;cols=maxInt+dec+1;task.textContent=terms.map((n,i)=>(i? (op==='+'?' ＋ ':' − '):'')+fmt(n)).join('')+' = ?';draw();msg(decimals?'Pose les nombres en alignant les virgules, puis effectue l’opération.':'Pose les nombres puis effectue directement l’opération. Le trait rouge sépare le calcul du résultat.')}
function fmt(n){return decimals?String(n).replace('.',','):String(n)}
function norm(n){if(!decimals)return String(n);let d=+level.value===4?1:2;return Number(n).toFixed(d).replace('.',',')}
function expected(n){let str=norm(n),parts=str.split(','),dec=parts[1]||'',raw=parts[0]+dec;return Array(cols-raw.length).fill(' ').concat(raw.split(''))}
function draw(){method.classList.toggle('hidden',op!== '-');borrowBtn.classList.toggle('hidden',!(op==='-'&&method.value==='exchange'));borrowState=null;borrowDone=false;G.innerHTML='';cells={};let labels=decimals?Array.from({length:cols},(_,i)=>i===cols-1?'dixièmes':i===cols-2?'unités':i===cols-3?'dizaines':''):['C. mill.','D. mill.','U. mill.','C','D','U'].slice(Math.max(0,6-cols));let hr=G.insertRow();hr.insertCell().outerHTML='<th></th>';labels.forEach(x=>{let th=document.createElement('th');th.textContent=x;hr.append(th)});if(!(op==='-'&&method.value==='exchange'))row('carry','Retenues',true);terms.forEach((n,i)=>{row('t'+i,i===0?'':op,false);if(op==='-'&&method.value==='constant'&&i===1)row('bottomcarry','+ retenues',false)});row('res','=',false,true);sel=G.querySelector('td[data-k]');if(sel)sel.classList.add('selected')}
function row(name,sign,carry,result){let tr=G.insertRow();if(carry)tr.className='carry';if(name==='topchange'||name==='bottomcarry')tr.className='exchange';if(result)tr.className='result';let s=tr.insertCell();s.className='sign fixed';s.textContent=sign;for(let i=0;i<cols;i++){let td=tr.insertCell();let k=name+'-'+i;td.dataset.k=k;td.onclick=()=>select(td);cells[k]=td}}
function select(td){if(td.classList.contains('fixed'))return;if(sel)sel.classList.remove('selected');sel=td;td.classList.add('selected')}
function put(v){if(!sel)return;sel.dataset.value=v;sel.textContent=v;let all=[...G.querySelectorAll('td[data-k]')],i=all.indexOf(sel);if(i>=0&&i<all.length-1)select(all[i+1])}
function msg(t,c=''){fb.textContent=t;fb.className='info '+c}

function read(r){return [...G.querySelectorAll('td[data-k^="'+r+'-"]')].map(x=>x.dataset.value!==undefined?x.dataset.value:(x.textContent||' '))}
function same(x,y){return x.join('')===y.join('')}
function subMarks(){let top=expected(a).map(x=>x===' '?0:+x),bottom=expected(b).map(x=>x===' '?0:+x),marks=Array(cols).fill(' '),lower=Array(cols).fill(' ');if(method.value==='exchange'){for(let i=cols-1;i>=0;i--){if(top[i]<bottom[i]){let j=i-1;while(j>=0&&top[j]===0)j--;if(j<0)continue;top[j]--;marks[j]=String(top[j]);for(let k=j+1;k<i;k++){top[k]=9;marks[k]='9'}top[i]+=10;marks[i]=String(top[i])}}}else{let incoming=0;for(let i=cols-1;i>=0;i--){if(top[i]<bottom[i]+incoming){marks[i]='10';if(i>0)lower[i-1]='1';incoming=1}else incoming=0}}return{upper:marks,lower}}
function neededExchange(){let top=expected(a).map(x=>x===' '?0:+x),bottom=expected(b).map(x=>x===' '?0:+x);let out=[];for(let i=cols-1;i>=0;i--){if(top[i]<bottom[i]){let j=i-1;while(j>=0&&top[j]===0)j--;if(j<0)continue;let before=top.slice();top[j]--;for(let k=j+1;k<i;k++)top[k]=9;top[i]+=10;out.push({target:i,donor:j,before,after:top.slice()})}}return out}
function paintExchange(before,after){for(let i=0;i<cols;i++){if(before[i]!==after[i]){let td=cells['t0-'+i];if(!td)continue;td.classList.add('borrowed');let original=td.dataset.value!==undefined?td.dataset.value:(td.textContent||String(before[i]));td.dataset.value=original;td.innerHTML='<span class="oldDigit">'+before[i]+'</span><span class="newDigit">'+after[i]+'</span>'}}}
function doBorrow(){if(!(op==='-'&&method.value==='exchange'))return;if(!terms.every((n,i)=>same(read('t'+i),expected(n))))return msg('Commence par poser correctement les deux nombres. Ensuite sélectionne la colonne où tu ne peux pas soustraire.','error');if(!sel||!sel.dataset.k||!sel.dataset.k.startsWith('t0-'))return msg('Touche d’abord le chiffre du nombre du haut que tu veux transformer.','error');let target=+sel.dataset.k.split('-')[1],ops=neededExchange(),step=ops.find(x=>x.target===target);if(!step)return msg('Dans cette colonne, aucun échange n’est nécessaire. Choisis la colonne où le chiffre du haut est trop petit.','error');paintExchange(step.before,step.after);borrowDone=true;msg('Échange effectué comme sur le cahier : l’ancien chiffre est barré et la nouvelle valeur est écrite au-dessus. Continue ton calcul.')}
function marksOK(){if(method.value==='exchange')return neededExchange().length===0||borrowDone;let m=subMarks();return same(read('carry'),m.upper)&&same(read('bottomcarry'),m.lower)}
function verify(){let poseOK=terms.every((n,i)=>same(read('t'+i),expected(n))),ans=op==='+'?terms.reduce((s,n)=>s+n,0):terms[0]-terms[1],resultOK=same(read('res'),expected(ans));if(!poseOK){return msg(decimals?'Ton opération est mal posée. Vérifie surtout que les virgules sont bien alignées.':'Ton opération est mal posée. Vérifie l’alignement des unités, dizaines et centaines.','error')}if(!resultOK)return msg('Ton opération est bien posée, mais il y a une erreur de calcul. Reprends colonne par colonne et vérifie tes retenues.','error');if(op==='-'&&!marksOK())return msg(method.value==='exchange'?'Résultat juste, mais il manque un échange : barre le chiffre concerné et transforme-le comme sur ton cahier.':'Résultat juste, mais vérifie les retenues : 10 unités en haut et 1 dizaine en bas, dans la colonne suivante.','error');msg('Bravo ! Ton opération est bien posée, tes retenues sont correctes et le résultat aussi.','success')}
K.innerHTML='';'0123456789'.split('').forEach(n=>{let x=document.createElement('button');x.textContent=n;x.onclick=()=>put(n);K.append(x)});
borrowBtn.onclick=doBorrow;document.getElementById('erase').onclick=()=>{if(sel){sel.textContent='';delete sel.dataset.value}};check.onclick=verify;document.getElementById('new').onclick=make;level.onchange=make;method.onchange=make;document.getElementById('add').onclick=e=>{op='+';document.getElementById('add').className='active';document.getElementById('sub').className='';make()};document.getElementById('sub').onclick=e=>{op='-';document.getElementById('sub').className='active';document.getElementById('add').className='';make()};make()})();
</script></body></html>
