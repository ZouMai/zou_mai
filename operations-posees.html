<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opérations posées · Zou Maï</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef4f7;color:#14283e;font:17px system-ui,sans-serif}main{max-width:980px;margin:auto;padding:18px}a{color:#155b92}header{display:flex;align-items:center;gap:15px}header img{width:72px}h1{margin:4px 0;font-size:clamp(2rem,6vw,3.6rem)}.panel{background:#fff;border:2px solid #d7e5ed;border-radius:20px;padding:18px;margin:16px 0;box-shadow:0 8px 24px #15304712}.controls,.tabs,.keypad{display:flex;gap:8px;flex-wrap:wrap}button,select{border:0;border-radius:11px;padding:11px 14px;font:inherit;font-weight:750;background:#dce9f5;color:#183b58;cursor:pointer}.active,.primary{background:#155b92!important;color:#fff!important}.task{text-align:center;font-size:1.45rem;font-weight:900}.gridwrap{overflow-x:auto;padding:10px}.grid{margin:auto;border-collapse:collapse;table-layout:fixed}.grid th{font-size:.8rem;color:#607080;height:26px}.grid td{width:58px;height:52px;border:1px solid #a8cee0;text-align:center;font-size:1.65rem;font-weight:850;background:#fbfeff;cursor:pointer}.grid tr.carry td{height:38px;font-size:1rem;color:#b04f28;background:#fff8ec}.grid tr.result td{border-top:4px solid #193a52}.grid td.sign{border:0;background:white;width:42px}.grid td.selected{outline:4px solid #f0a629;outline-offset:-4px}.grid td.fixed{color:#445b69;background:#edf5f8;cursor:default}.phase{font-weight:850;color:#155b92}.info{padding:12px;border-radius:12px;background:#eaf3fa;margin-top:12px;min-height:48px;font-weight:700}.success{background:#daf6e7;color:#17623e}.error{background:#fff0df;color:#81431d}.keypad{justify-content:center;margin:12px}.keypad button{min-width:48px;font-size:1.15rem}.small{font-size:.9rem;color:#5b6b76}.hidden{display:none}@media(max-width:600px){main{padding:10px}.panel{padding:12px}.grid td{width:45px;height:48px}.gridwrap{padding:4px}}</style></head><body><main><a href="maths-lecons-cm2.html">← Mathématiques CM2</a><header><img src="images/loup-bleu-original.png" alt="Zoomy"><div><small>NOMBRES ET CALCULS</small><h1>Opérations posées</h1><div class="phase" id="phase">1 · Je pose</div></div></header>
<div class="panel"><div class="tabs"><button id="add" class="active">＋ Addition</button><button id="sub">− Soustraction</button><select id="level"><option value="1">Palier 1 · sans retenue</option><option value="2">Palier 2 · avec retenues</option><option value="3">Palier 3 · grands nombres</option></select><button id="new">Nouvelle opération ↻</button></div><p class="task" id="task"></p><p class="small">Étape 1 : place chaque chiffre dans la bonne colonne. Étape 2 : calcule et écris toi-même les retenues ou échanges.</p></div>
<div class="panel"><div class="gridwrap"><table class="grid" id="grid"></table></div><div class="keypad" id="keys"></div><div class="controls"><button id="check" class="primary">Vérifier la pose</button><button id="erase">Effacer la case</button></div><div class="info" id="feedback">Commence par poser les deux nombres.</div></div>
</main><script>
(()=>{const G=document.getElementById('grid'),K=document.getElementById('keys'),fb=document.getElementById('feedback'),task=document.getElementById('task'),phase=document.getElementById('phase'),check=document.getElementById('check'),level=document.getElementById('level');let op='+',a,b,stage='pose',sel=null,cells={},cols=6;
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a, digits=n=>String(n).split('').map(Number);
function make(){stage='pose';phase.textContent='1 · Je pose';check.textContent='Vérifier la pose';let l=+level.value;if(op==='+'){if(l===1){a=rnd(120,643);b=rnd(110,Math.min(999-a,333));while([...String(a).padStart(3,'0')].some((x,i)=>+x + +String(b).padStart(3,'0')[i]>=10))b=rnd(110,333)}else if(l===2){a=rnd(245,899);b=rnd(156,899)}else{a=rnd(12000,899999);b=rnd(5000,499999)}}else{if(l===1){a=rnd(400,999);b=rnd(100,a);while([...String(a)].some((x,i)=>+x < +(String(b).padStart(String(a).length,'0')[i])))b=rnd(100,a)}else if(l===2){a=rnd(500,9999);b=rnd(100,a-1)}else{a=rnd(20000,999999);b=rnd(5000,a-1)}}cols=Math.max(4,String(Math.max(a,b)).length+1);task.textContent=a+' '+(op==='+'?'＋':'−')+' '+b+' = ?';draw();msg('Pose les deux nombres : unités sous unités, dizaines sous dizaines…')}
function draw(){G.innerHTML='';cells={};let labels=['C. mill.','D. mill.','U. mill.','C','D','U'].slice(6-cols);let hr=G.insertRow();hr.insertCell().outerHTML='<th></th>';labels.forEach(x=>{let th=document.createElement('th');th.textContent=x;hr.append(th)});if(stage==='calc'){row('carry','Retenues',true)}row('a','',false);row('b',op,false);if(stage==='calc')row('res','=',false,true);sel=G.querySelector('td[data-k]');if(sel)sel.classList.add('selected')}
function row(name,sign,carry,result){let tr=G.insertRow();if(carry)tr.className='carry';if(result)tr.className='result';let s=tr.insertCell();s.className='sign fixed';s.textContent=sign;for(let i=0;i<cols;i++){let td=tr.insertCell();let k=name+'-'+i;td.dataset.k=k;td.onclick=()=>select(td);cells[k]=td}}
function select(td){if(td.classList.contains('fixed'))return;if(sel)sel.classList.remove('selected');sel=td;td.classList.add('selected')}
function put(v){if(!sel)return;sel.textContent=v;let all=[...G.querySelectorAll('td[data-k]')],i=all.indexOf(sel);if(i>=0&&i<all.length-1)select(all[i+1])}
function msg(t,c=''){fb.textContent=t;fb.className='info '+c}
function expected(n){return String(n).padStart(cols,'').split('')}
function read(r){return [...G.querySelectorAll('td[data-k^="'+r+'-"]')].map(x=>x.textContent||' ')}
function same(x,y){return x.join('')===y.join('')}
function verify(){if(stage==='pose'){if(!same(read('a'),expected(a))||!same(read('b'),expected(b)))return msg('La pose n’est pas encore correcte. Vérifie surtout la colonne des unités : le dernier chiffre de chaque nombre doit être dans U.','error');stage='calc';phase.textContent='2 · Je calcule';check.textContent='Vérifier mon calcul';draw();let ea=expected(a),eb=expected(b);[ea,eb].forEach((arr,r)=>arr.forEach((v,i)=>{if(v!==' '){let td=cells[(r?'b':'a')+'-'+i];td.textContent=v;td.classList.add('fixed')}}));msg(op==='+'?'Calcule de droite à gauche. Écris les retenues dans la petite ligne du haut.':'Calcule de droite à gauche. Utilise la petite ligne du haut pour noter tes échanges/retenues.')}else{let ans=op==='+'?a+b:a-b;if(!same(read('res'),expected(ans)))return msg('Le résultat contient encore une erreur. Reprends colonne par colonne et vérifie tes retenues.','error');msg('Bravo ! Opération correctement posée et calculée.','success')}}
K.innerHTML='';'0123456789'.split('').forEach(n=>{let x=document.createElement('button');x.textContent=n;x.onclick=()=>put(n);K.append(x)});
document.getElementById('erase').onclick=()=>{if(sel)sel.textContent=''};check.onclick=verify;document.getElementById('new').onclick=make;level.onchange=make;document.getElementById('add').onclick=e=>{op='+';document.getElementById('add').className='active';document.getElementById('sub').className='';make()};document.getElementById('sub').onclick=e=>{op='-';document.getElementById('sub').className='active';document.getElementById('add').className='';make()};make()})();
</script></body></html>
