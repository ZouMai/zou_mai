<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opérations posées · Zou Maï</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef4f7;color:#14283e;font:17px system-ui,sans-serif}main{max-width:980px;margin:auto;padding:18px}a{color:#155b92}header{display:flex;align-items:center;gap:15px}header img{width:72px}h1{margin:4px 0;font-size:clamp(2rem,6vw,3.6rem)}.panel{background:#fff;border:2px solid #d7e5ed;border-radius:20px;padding:18px;margin:16px 0;box-shadow:0 8px 24px #15304712}.controls,.tabs,.keypad{display:flex;gap:8px;flex-wrap:wrap}button,select{border:0;border-radius:11px;padding:11px 14px;font:inherit;font-weight:750;background:#dce9f5;color:#183b58;cursor:pointer}.active,.primary{background:#155b92!important;color:#fff!important}.task{text-align:center;font-size:1.45rem;font-weight:900}.gridwrap{overflow-x:auto;padding:10px}.grid{margin:auto;border-collapse:collapse;table-layout:fixed}.grid th{font-size:.8rem;color:#607080;height:26px}.grid td{width:58px;height:52px;border:1px solid #a8cee0;text-align:center;font-size:1.65rem;font-weight:850;background:#fbfeff;cursor:pointer}.grid tr.carry td{height:38px;font-size:1rem;color:#b04f28;background:#fff8ec}.grid tr.result td{border-top:4px solid #e04444}.grid td.sign{border:0;background:white;width:42px}.grid td.selected{outline:4px solid #f0a629;outline-offset:-4px}.grid td.fixed{color:#445b69;background:#edf5f8;cursor:default}.phase{font-weight:850;color:#155b92}.info{padding:12px;border-radius:12px;background:#eaf3fa;margin-top:12px;min-height:48px;font-weight:700}.success{background:#daf6e7;color:#17623e}.error{background:#fff0df;color:#81431d}.keypad{justify-content:center;margin:12px}.keypad button{min-width:48px;font-size:1.15rem}.small{font-size:.9rem;color:#5b6b76}.hidden{display:none}@media(max-width:600px){main{padding:10px}.panel{padding:12px}.grid td{width:45px;height:48px}.gridwrap{padding:4px}}</style></head><body><main><a href="maths-lecons-cm2.html">← Mathématiques CM2</a><header><img src="images/loup-bleu-original.png" alt="Zoomy"><div><small>NOMBRES ET CALCULS</small><h1>Opérations posées</h1><div class="phase" id="phase">1 · Je pose</div></div></header>
<div class="panel"><div class="tabs"><button id="add" class="active">＋ Addition</button><button id="sub">− Soustraction</button><select id="level"><option value="1">Palier 1 · sans retenue</option><option value="2">Palier 2 · avec retenues</option><option value="3">Palier 3 · grands nombres</option><option value="4">Palier 4 · décimaux simples</option><option value="5">Palier 5 · décimaux avec retenues</option></select><button id="new">Nouvelle opération ↻</button></div><p class="task" id="task"></p><p class="small">Pose les nombres, écris tes retenues ou échanges, puis effectue directement l’opération.</p></div>
<div class="panel"><div class="gridwrap"><table class="grid" id="grid"></table></div><div class="keypad" id="keys"></div><div class="controls"><button id="check" class="primary">Vérifier la pose</button><button id="erase">Effacer la case</button></div><div class="info" id="feedback">Pose les nombres puis effectue l’opération.</div></div>
</main><script>
(()=>{const G=document.getElementById('grid'),K=document.getElementById('keys'),fb=document.getElementById('feedback'),task=document.getElementById('task'),phase=document.getElementById('phase'),check=document.getElementById('check'),level=document.getElementById('level');let op='+',a,b,terms=[],stage='all',sel=null,cells={},cols=6,decimals=false;
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a, digits=n=>String(n).split('').map(Number);
function make(){stage='all';phase.textContent='Je pose et j’effectue';check.textContent='Vérifier mon opération';let l=+level.value;decimals=l>=4;terms=[];if(!decimals){if(op==='+'){let count=Math.random()<.45?3:2;if(l===1){terms=count===3?[rnd(100,899),rnd(10,99),rnd(1,9)]:[rnd(100,899),rnd(10,99)]}else if(l===2){terms=count===3?[rnd(1000,8999),rnd(100,999),rnd(10,99)]:[rnd(1000,8999),rnd(10,999)]}else{terms=count===3?[rnd(10000,399999),rnd(1000,9999),rnd(10,999)]:[rnd(10000,399999),rnd(10,9999)]}}else{a=l===1?rnd(400,999):l===2?rnd(500,9999):rnd(20000,999999);b=rnd(l===1?100:500,a-1);terms=[a,b]}}else{let scale=l===4?10:100;if(op==='+'){let count=Math.random()<.5?3:2;if(l===4){terms=count===3?[rnd(1000,9999)/10,rnd(100,999)/10,rnd(1,99)/10]:[rnd(1000,9999)/10,rnd(1,999)/10]}else{terms=count===3?[rnd(10000,99999)/100,rnd(100,9999)/100,rnd(1,999)/100]:[rnd(10000,99999)/100,rnd(1,9999)/100]}}else{a=rnd(1000,9999)/scale;b=rnd(100,Math.floor(a*scale)-1)/scale;terms=[a,b]}}a=terms[0];b=terms[1];let maxInt=Math.max(...terms.map(n=>String(Math.trunc(n)).length)),dec=decimals?(l===4?1:2):0;cols=maxInt+dec+1;task.textContent=terms.map((n,i)=>(i? (op==='+'?' ＋ ':' − '):'')+fmt(n)).join('')+' = ?';draw();msg(decimals?'Pose les nombres en alignant les virgules, puis effectue l’opération.':'Pose les nombres puis effectue directement l’opération. Le trait rouge sépare le calcul du résultat.')}
function fmt(n){return decimals?String(n).replace('.',','):String(n)}
function norm(n){if(!decimals)return String(n);let d=+level.value===4?1:2;return Number(n).toFixed(d).replace('.',',')}
function expected(n){let str=norm(n),parts=str.split(','),dec=parts[1]||'',raw=parts[0]+dec;return Array(cols-raw.length).fill(' ').concat(raw.split(''))}
function draw(){G.innerHTML='';cells={};let labels=decimals?Array.from({length:cols},(_,i)=>i===cols-1?'dixièmes':i===cols-2?'unités':i===cols-3?'dizaines':''):['C. mill.','D. mill.','U. mill.','C','D','U'].slice(Math.max(0,6-cols));let hr=G.insertRow();hr.insertCell().outerHTML='<th></th>';labels.forEach(x=>{let th=document.createElement('th');th.textContent=x;hr.append(th)});row('carry','Retenues',true);terms.forEach((n,i)=>row('t'+i,i===0?'':op,false));row('res','=',false,true);sel=G.querySelector('td[data-k]');if(sel)sel.classList.add('selected')}
function row(name,sign,carry,result){let tr=G.insertRow();if(carry)tr.className='carry';if(result)tr.className='result';let s=tr.insertCell();s.className='sign fixed';s.textContent=sign;for(let i=0;i<cols;i++){let td=tr.insertCell();let k=name+'-'+i;td.dataset.k=k;td.onclick=()=>select(td);cells[k]=td}}
function select(td){if(td.classList.contains('fixed'))return;if(sel)sel.classList.remove('selected');sel=td;td.classList.add('selected')}
function put(v){if(!sel)return;sel.textContent=v;let all=[...G.querySelectorAll('td[data-k]')],i=all.indexOf(sel);if(i>=0&&i<all.length-1)select(all[i+1])}
function msg(t,c=''){fb.textContent=t;fb.className='info '+c}

function read(r){return [...G.querySelectorAll('td[data-k^="'+r+'-"]')].map(x=>x.textContent||' ')}
function same(x,y){return x.join('')===y.join('')}
function verify(){let poseOK=terms.every((n,i)=>same(read('t'+i),expected(n))),ans=op==='+'?terms.reduce((s,n)=>s+n,0):terms[0]-terms[1],resultOK=same(read('res'),expected(ans));if(!poseOK){return msg(decimals?'Ton opération est mal posée. Vérifie surtout que les virgules sont bien alignées.':'Ton opération est mal posée. Vérifie l’alignement des unités, dizaines et centaines.','error')}if(!resultOK)return msg('Ton opération est bien posée, mais il y a une erreur de calcul. Reprends colonne par colonne et vérifie tes retenues.','error');msg('Bravo ! Ton opération est bien posée et correctement effectuée.','success')}
K.innerHTML='';'0123456789'.split('').forEach(n=>{let x=document.createElement('button');x.textContent=n;x.onclick=()=>put(n);K.append(x)});
document.getElementById('erase').onclick=()=>{if(sel)sel.textContent=''};check.onclick=verify;document.getElementById('new').onclick=make;level.onchange=make;document.getElementById('add').onclick=e=>{op='+';document.getElementById('add').className='active';document.getElementById('sub').className='';make()};document.getElementById('sub').onclick=e=>{op='-';document.getElementById('sub').className='active';document.getElementById('add').className='';make()};make()})();
</script></body></html>
