const SPEECH_ALIASES={

const INSTRUCTIONS={
 hear:{title:"Écoute puis touche",speech:"Tu vas entendre un son. Écoute bien. Ensuite, touche la lettre ou les lettres qui écrivent ce son.",steps:[["👂","J’écoute"],["🔊","J’entends le son"],["👆","Je touche l’écriture"]]},

function instructionHTML(type){

function speakInstruction(type,after){
 const x=INSTRUCTIONS[type],run=++voiceRun;
 if(!x){after?.();return}

 const u=new SpeechSynthesisUtterance(x.speech);u.lang="fr-FR";u.rate=.82;u.pitch=1.02;
 u.onend=()=>{if(run===voiceRun)after?.()};
 u.onerror=()=>{if(run===voiceRun)after?.()};

}
function mountInstruction(type,after){
 const b=$("instructionAudio");if(b)b.onclick=()=>speakInstruction(type,after);

 attempt=0;advancing=false;fb.textContent="";tiny.textContent="";
 voiceRun++;if("speechSynthesis" in window)speechSynthesis.cancel();
 const plan=LEVELS[levelIndex].items,q=plan[step];bar.style.width=(step/plan.length*100)+"%";
 if(!q){finishLevel();return}
 const mission='<div class="mission">Étape '+(step+1)+' sur '+plan.length+'</div>';
 if(q.type==="hear"){
   stage.innerHTML=mission+instructionHTML("hear")+'<button class="listen" id="listen" aria-label="Réécouter le son">🔊</button>'+choices(q.choices);
   $("listen").onclick=()=>audioPhoneme(q.target);bindChoices(q.target,q);mountInstruction("hear",()=>audioPhoneme(q.target))
 }
 if(q.type==="blend"){
   stage.innerHTML=mission+instructionHTML("blend")+'<div class="demo" id="pieces"><button class="sound soundBtn" data-ph="'+q.parts[0]+'" aria-label="Écouter le son">'+showPart(q.parts[0])+'</button><span class="hand">➜</span><button class="sound soundBtn" data-ph="'+q.parts[1]+'" aria-label="Écouter le son">'+showPart(q.parts[1])+'</button></div><button class="continue" id="blend">J’assemble</button><div class="big" id="blendout" style="display:none">'+q.answer+'</div><button class="mic" id="mic" style="display:none">🎙️</button><button class="back" id="help" style="display:none;margin:10px auto">🔊 Aide</button><div class="tiny">La machine ne lit pas la syllabe à ta place.</div>';
   document.querySelectorAll(".soundBtn").forEach(b=>b.onclick=()=>audioPhoneme(b.dataset.ph));
   $("blend").onclick=()=>{$("pieces").style.display="none";$("blend").style.display="none";$("blendout").style.display="block";$("mic").style.display="grid";$("mic").onclick=()=>recognize({...q,target:q.answer});};
   $("help").onclick=()=>speakWord(q.answer);mountInstruction("blend")
 }
 if(q.type==="chain"){
   stage.innerHTML=mission+instructionHTML("chain")+'<div class="demo" id="pieces">'+q.parts.map((p,i)=>'<span class="sound">'+p+'</span>'+(i<q.parts.length-1?'<span class="hand">+</span>':'')).join("")+'</div><button class="continue" id="blend">J’assemble</button><div class="big" id="blendout" style="display:none">'+q.target+'</div><button class="mic" id="mic" style="display:none">🎙️</button><button class="back" id="help" style="display:none;margin:10px auto">🔊 Aide</button><div class="tiny">Lis tout d’un seul coup.</div>';
   $("blend").onclick=()=>{$("pieces").style.display="none";$("blend").style.display="none";$("blendout").style.display="block";$("mic").style.display="grid";$("mic").onclick=()=>recognize(q);};
   $("help").onclick=()=>speakWord(q.target);mountInstruction("chain")
 }
 if(q.type==="encode"){
   stage.innerHTML=mission+instructionHTML("encode")+'<button class="listen" id="listen">🔊</button>'+choices(q.choices);
   $("listen").onclick=()=>speakWord(q.target);bindChoices(q.target,q);mountInstruction("encode",()=>speakWord(q.target))
 }
 if(q.type==="teach"){
   stage.innerHTML=mission+instructionHTML("teach")+'<div class="teach"><div class="gr">'+q.grapheme+'</div><div class="arrow">↓</div><div class="soundcue">'+q.sound+'</div><div class="example">'+q.example+'</div><button class="listen" id="listen">🔊</button><button class="continue" id="okTeach">J\'ai compris →</button></div>';
   $("listen").onclick=()=>speakWord(q.say);$("okTeach").onclick=()=>{log(true,q);next()};mountInstruction("teach",()=>speakWord(q.say))
 }
 if(q.type==="read"){
   stage.innerHTML=mission+instructionHTML("read")+'<div class="big">'+q.target+'</div><button class="mic" id="mic">🎙️</button><button class="back" id="help" style="display:none;margin:10px auto">🔊 Aide</button><div class="tiny">Le suivant apparaît seulement quand ta lecture est reconnue.</div>';
   $("mic").onclick=()=>recognize(q);$("help").onclick=()=>speakWord(q.target);mountInstruction("read")
 }
}
function next(){step++;render()}
async function recognize(q){
 const mic=$("mic"),SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){tiny.textContent="Reconnaissance vocale indisponible sur ce navigateur.";return}
 mic.classList.add("live");fb.textContent="👂 J'écoute";tiny.textContent="";
 const r=new SR();r.lang="fr-FR";r.continuous=false;r.interimResults=true;r.maxAlternatives=12;
 if("processLocally" in r)try{r.processLocally=true}catch(_){}
 let all=[],ended=false;const timer=setTimeout(()=>{try{r.stop()}catch(_){}},4400);
 r.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)for(let j=0;j<e.results[i].length;j++)all.push(e.results[i][j].transcript)};
 r.onerror=e=>{tiny.textContent=e.error==="no-speech"?"Je n'ai pas entendu de voix.":"Micro : "+e.error};
 r.onend=()=>{if(ended)return;ended=true;clearTimeout(timer);mic.classList.remove("live");const accepted=acceptedFor(q),alts=all.map(norm);const ok=alts.some(x=>accepted.includes(x));if(ok){reward(q)}else{fail(null,q);tiny.textContent=all[0]?"Le micro a entendu : « "+all[0]+" »":"Je n'ai rien pu reconnaître."}};
 try{r.start()}catch(e){mic.classList.remove("live");tiny.textContent="Impossible de démarrer le micro."}
}
renderLevels();
})();
</script></body></html>
