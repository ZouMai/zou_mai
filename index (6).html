<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>The train to London · BD sonorisée · Zou Maï</title><style>:root{--ink:#16191e;--paper:#e8e5df;--yellow:#ffdf35;--blue:#146cbd}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}button,select,a{font:inherit}.toolbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;flex-wrap:wrap;gap:.55rem;padding:.65rem max(10px,2vw);background:#fffefa;box-shadow:0 2px 12px #0002}.toolbar strong{margin-right:auto}.toolbar button,.toolbar select,.toolbar a{padding:.6rem .8rem;border:2px solid #20242a;border-radius:12px;background:#fff;color:#151515;text-decoration:none;font-weight:750;cursor:pointer}.toolbar #playAll{background:#aff3c7}.toolbar #stop{background:#ffe2dd}.toolbar button:disabled{opacity:.55;cursor:default}.toolbar button:focus-visible,.sound-btn:focus-visible{outline:4px solid var(--yellow);outline-offset:3px}.wrap{max-width:1055px;margin:16px auto 40px;padding:0 8px}.page{position:relative;width:100%;background:#fff;box-shadow:0 8px 25px #0002;line-height:0}.page>img{display:block;width:100%;height:auto}.sound-btn{position:absolute;z-index:2;transform:translate(-50%,-50%);width:clamp(30px,3.2vw,42px);height:clamp(30px,3.2vw,42px);display:grid;place-items:center;line-height:1;border:2px solid #fff;border-radius:50%;background:var(--blue);color:#fff;box-shadow:0 2px 8px #0009;cursor:pointer;transition:background .15s}.sound-btn.active{background:#e43166;box-shadow:0 0 0 9px #ffed4f99,0 0 28px 17px #ffde3599;animation:pulse 1s infinite alternate}@keyframes pulse{to{box-shadow:0 0 0 14px #ffed4f77,0 0 36px 22px #ffde3577}}.sound-btn.active:before{content:'';position:absolute;z-index:-1;width:clamp(70px,13vw,145px);height:clamp(42px,7vw,84px);border:5px solid #f9ce16;border-radius:50%;background:#fff25d25;pointer-events:none}.transcript{margin:14px auto;padding:12px 16px;background:#fff;border-radius:14px;border-left:7px solid #ffca25;font-size:1.1rem;line-height:1.4}.transcript strong{display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em}.hint{max-width:1055px;margin:12px auto;padding:0 10px 25px;color:#484c52;font-size:.92rem}@media(max-width:680px){.toolbar strong{width:100%}.wrap{padding:0;margin-top:6px}.sound-btn{width:31px;height:31px;font-size:13px}}@media(prefers-reduced-motion:reduce){.sound-btn.active{animation:none}}</style><link rel="stylesheet" href="zoumai-brand.css"></head>
<body><a class="zm-corner-logo" href="index.html" aria-label="Accueil Zou Maï"><img src="images/logo-zou-mai-sensei.png" alt="Logo Sensei Zou Maï"></a><div class="toolbar"><strong>🎭 The train to London</strong><button type="button" id="playAll">▶ Écouter toute la BD</button><button type="button" id="stop">■ Arrêter</button><label>Vitesse <select id="rate"><option value="0.76">Très lente</option><option value="0.88" selected>Lente</option><option value="1">Normale</option></select></label><a href="../../index.html">← Retour aux leçons</a></div>
<div class="wrap"><div class="page" id="page"><img src="the-train-to-london.png" alt="Planche de BD : The train to London"><button type="button" class="sound-btn" style="left:23%;top:24%" data-character="boy" data-text="Excuse me, Sir? Where is the train to London, please?" aria-label="Case 1 : Excuse me, Sir? Where is the train to London, please?" aria-pressed="false">🔊</button>
<button type="button" class="sound-btn" style="left:82%;top:18%" data-character="conductor" data-text="First, you go straight on." aria-label="Case 2 : First, you go straight on." aria-pressed="false">🔊</button>
<button type="button" class="sound-btn" style="left:21%;top:48%" data-character="conductor" data-text="You turn right and you go up the stairs." aria-label="Case 3 : You turn right and you go up the stairs." aria-pressed="false">🔊</button>
<button type="button" class="sound-btn" style="left:79%;top:48%" data-character="conductor" data-text="Then, you turn left and you go down to the platform 13." aria-label="Case 4 : Then, you turn left and you go down to the platform 13." aria-pressed="false">🔊</button>
<button type="button" class="sound-btn" style="left:60%;top:83%" data-character="conductor" data-text="Finally, you take the RED train!" aria-label="Case 5 : Finally, you take the RED train!" aria-pressed="false">🔊</button>
<button type="button" class="sound-btn" style="left:76%;top:83%" data-character="mum" data-text="He said the RED train, didn't he?" aria-label="Case 6 : He said the RED train, didn't he?" aria-pressed="false">🔊</button></div><div class="transcript" aria-live="polite"><strong>Réplique en cours</strong><span id="caption">Choisis une bulle, ou écoute toute la scène.</span></div></div><p class="hint">Lecture intégrale de la BD dans l’ordre des cases. Clique sur chaque bulle pour faire répéter les élèves. Le chat reste visible dans la scène, mais ne parle pas dans cette planche.</p><script>
(() => {
  'use strict';
  const synth = window.speechSynthesis;
  const buttons = [...document.querySelectorAll('.sound-btn')];
  const playAll = document.querySelector('#playAll');
  const stop = document.querySelector('#stop');
  const rate = document.querySelector('#rate');
  const caption = document.querySelector('#caption');
  let voices = [], token = 0, timeout = null;
  const characters = {boy:{slot:1,pitch:1.18,speed:1.04},conductor:{slot:0,pitch:0.88,speed:0.94},mum:{slot:2,pitch:1.12,speed:0.98}};
  function loadVoices() {
    voices = synth.getVoices().filter(v => /^en[-_]/i.test(v.lang))
      .sort((a,b) => Number(/en-GB/i.test(b.lang)) - Number(/en-GB/i.test(a.lang)));
  }
  function clearActive() {
    buttons.forEach(b => {b.classList.remove('active'); b.setAttribute('aria-pressed','false');});
  }
  function halt() {
    token++;
    clearTimeout(timeout);
    if (synth) synth.cancel();
    clearActive();
    caption.textContent = 'Choisis une bulle, ou écoute toute la scène.';
    playAll.disabled = false;
  }
  function lineAt(i, current, all) {
    if (current !== token) return;
    if (i >= buttons.length) {clearActive(); playAll.disabled = false; caption.textContent = 'Lecture terminée.'; return;}
    const b = buttons[i], actor = characters[b.dataset.character] || Object.values(characters)[0];
    clearActive(); b.classList.add('active'); b.setAttribute('aria-pressed','true');
    caption.textContent = b.dataset.text;
    const u = new SpeechSynthesisUtterance(b.dataset.text);
    u.lang = 'en-GB';
    u.rate = Math.max(.55, Math.min(1.5, Number(rate.value) * actor.speed));
    u.pitch = actor.pitch;
    if (voices.length) u.voice = voices[actor.slot % voices.length];
    let done = false;
    const finish = () => {
      if (done || current !== token) return;
      done = true;
      b.classList.remove('active'); b.setAttribute('aria-pressed','false');
      if (all) timeout = setTimeout(() => lineAt(i + 1, current, true), 340);
    };
    u.onend = finish;
    u.onerror = finish;
    synth.speak(u);
  }
  if (!synth || !window.SpeechSynthesisUtterance) {
    playAll.disabled = true;
    buttons.forEach(b => {b.disabled = true;});
    caption.textContent = 'La synthèse vocale n’est pas disponible sur cet appareil.';
    return;
  }
  loadVoices();
  synth.addEventListener?.('voiceschanged', loadVoices);
  buttons.forEach((b,i) => b.addEventListener('click', () => {halt(); lineAt(i, token, false);}));
  playAll.addEventListener('click', () => {halt(); playAll.disabled = true; lineAt(0, token, true);});
  stop.addEventListener('click', halt);
  window.addEventListener('pagehide', halt);
})();
</script></body></html>
