<script>
const missions=[{"category":"temps","direction":"Présent → imparfait","title":"La classe","level":1,"markup":"Chaque matin, les élèves [[entrent|entraient]] en classe. La maîtresse [[écrit|écrivait]] la date et ils [[ouvrent|ouvraient]] leur cahier."},{"category":"temps","direction":"Présent → imparfait","title":"Le marché","level":1,"markup":"Chaque samedi, les commerçants [[installent|installaient]] leurs étals et les clients [[choisissent|choisissaient]] leurs fruits."},{"category":"temps","direction":"Présent → imparfait","title":"Le phare","level":2,"markup":"Chaque soir, le gardien [[allume|allumait]] la lampe. Il [[voit|voyait]] les bateaux et [[tient|tenait]] son journal."},{"category":"temps","direction":"Présent → imparfait","title":"La forêt","level":2,"markup":"Chaque automne, nous [[ramassons|ramassions]] des feuilles. Nous [[faisons|faisions]] des bouquets et [[prenons|prenions]] des photos."},{"category":"temps","direction":"Présent → imparfait","title":"La cabane","level":3,"markup":"Chaque mercredi, nous [[construisons|construisions]] des cabanes. Nous [[plaçons|placions]] les planches et [[crions|criions]] de joie."},{"category":"temps","direction":"Présent → imparfait","title":"Le refuge","level":3,"markup":"Chaque jour, les bénévoles [[nourrissent|nourrissaient]] les animaux. Une soigneuse [[nettoie|nettoyait]] les cages et [[soigne|soignait]] les oiseaux."},{"category":"temps","direction":"Imparfait → présent","title":"La piscine","level":1,"markup":"Chaque mercredi, je [[nageais|nage]] à la piscine. Je [[mettais|mets]] mon bonnet et [[rejoignais|rejoins]] mes amis."},{"category":"temps","direction":"Imparfait → présent","title":"Le village","level":1,"markup":"Chaque matin, le boulanger [[vendait|vend]] son pain. Les habitants [[venaient|viennent]] tôt et [[discutaient|discutent]] longtemps."},{"category":"temps","direction":"Imparfait → présent","title":"La répétition","level":2,"markup":"Chaque soir, nous [[répétions|répétons]]. Nous [[étions|sommes]] attentifs et [[apprenions|apprenons]] nos répliques."},{"category":"temps","direction":"Imparfait → présent","title":"Le jardin","level":2,"markup":"Chaque été, tu [[arrosais|arroses]] les fleurs et tu [[cueillais|cueilles]] les fraises. Ton frère [[courait|court]] près de toi."},{"category":"temps","direction":"Imparfait → présent","title":"La montagne","level":3,"markup":"Chaque hiver, ils [[prenaient|prennent]] le télésiège. Ils [[voyaient|voient]] les sommets et [[descendaient|descendent]] les pistes."},{"category":"temps","direction":"Imparfait → présent","title":"L'atelier","level":3,"markup":"Chaque semaine, vous [[fabriquiez|fabriquez]] des cerfs-volants. Vous [[pliiez|pliez]] le papier et [[colliez|collez]] les baguettes."},{"category":"temps","direction":"Présent → passé composé","title":"Le match","level":1,"markup":"Aujourd’hui, Hugo [[marque|a marqué]] un but. Ses amis [[applaudissent|ont applaudi]] et l’arbitre [[siffle|a sifflé]] la fin."},{"category":"temps","direction":"Présent → passé composé","title":"La surprise","level":1,"markup":"Ce matin, nous [[préparons|avons préparé]] un gâteau. Nous [[mettons|avons mis]] la table et nous [[invitons|avons invité]] nos voisins."},{"category":"temps","direction":"Présent → passé composé","title":"La randonnée","level":2,"markup":"Aujourd’hui, Léa [[part|est partie]] en randonnée. Elle [[monte|est montée]] au sommet et [[revient|est revenue]] avant la nuit."},{"category":"temps","direction":"Présent → passé composé","title":"Le trésor","level":2,"markup":"Ce matin, les enfants [[trouvent|ont trouvé]] une boîte. Ils l’[[ouvrent|ont ouverte]] et [[découvrent|ont découvert]] une carte."},{"category":"temps","direction":"Présent → passé composé","title":"Le musée","level":3,"markup":"Aujourd’hui, nous [[visitons|avons visité]] le musée. Nous [[voyons|avons vu]] une statue et [[écrivons|avons écrit]] un compte rendu."},{"category":"temps","direction":"Présent → passé composé","title":"La course","level":3,"markup":"Ce matin, elles [[arrivent|sont arrivées]] au stade, [[courent|ont couru]] cinq kilomètres et [[repartent|sont reparties]] ensemble."},{"category":"temps","direction":"Passé composé → présent","title":"Le jardin secret","level":1,"markup":"[[Hier|Aujourd’hui]], Malo [[a trouvé|trouve]] une clé. Il [[a ouvert|ouvre]] la porte et [[a découvert|découvre]] un jardin."},{"category":"temps","direction":"Passé composé → présent","title":"Le concert","level":1,"markup":"[[Hier soir|Ce soir]], les musiciens [[ont joué|jouent]] une mélodie. Le public [[a applaudi|applaudit]] et les enfants [[ont chanté|chantent]]."},{"category":"temps","direction":"Passé composé → présent","title":"Le départ","level":2,"markup":"[[Hier|Aujourd’hui]], nous [[sommes partis|partons]] tôt. Nous [[avons pris|prenons]] le train et [[sommes arrivés|arrivons]] à midi."},{"category":"temps","direction":"Passé composé → présent","title":"Le laboratoire","level":2,"markup":"[[Hier|Aujourd’hui]], tu [[as mélangé|mélanges]] deux liquides. Tu [[as observé|observes]] une réaction et [[as noté|notes]] le résultat."},{"category":"temps","direction":"Passé composé → imparfait","title":"La promenade","level":3,"markup":"Hier, Léa [[a marché|marchait]] dans le parc. Elle [[a regardé|regardait]] les arbres et [[a écouté|écoutait]] les oiseaux."},{"category":"temps","direction":"Passé composé → imparfait","title":"Les vacances","level":3,"markup":"Chaque été, nous [[avons nagé|nagions]] le matin. Nous [[avons joué|jouions]] sur la plage et [[avons construit|construisions]] des châteaux."},{"category":"temps","direction":"Passé composé → imparfait","title":"La lecture","level":1,"markup":"Hier, ils [[ont lu|lisaient]] dans le salon. Leur mère [[a préparé|préparait]] le repas et le chat [[a dormi|dormait]] près du feu."},{"category":"temps","direction":"Imparfait → passé composé","title":"Le défi sportif","level":1,"markup":"Hier, les élèves [[couraient|ont couru]] autour du stade. Puis ils [[buvaient|ont bu]] de l’eau et [[rentraient|sont rentrés]] en classe."},{"category":"temps","direction":"Imparfait → passé composé","title":"L'orage","level":2,"markup":"Hier soir, le vent [[soufflait|a soufflé]] fort. Les branches [[bougeaient|ont bougé]] et une fenêtre [[claquait|a claqué]]."},{"category":"temps","direction":"Imparfait → passé composé","title":"La visite","level":2,"markup":"Hier, nous [[visitions|avons visité]] le château. Nous [[découvrions|avons découvert]] un passage et [[prenions|avons pris]] des photos."},{"category":"personne","direction":"Je → nous","title":"Mon sac","level":3,"markup":"[[Je|Nous]] [[prépare|préparons]] [[mon|notre]] sac. [[Ma|Notre]] sœur [[me|nous]] donne un livre et [[je|nous]] [[la remercie|la remercions]]."},{"category":"personne","direction":"Je → nous","title":"Le stade","level":3,"markup":"[[Je|Nous]] [[prends|prenons]] [[mon|notre]] ballon. Le professeur [[me|nous]] demande si [[je|nous]] [[suis|sommes]] [[prêt|prêts]]."},{"category":"personne","direction":"Je → nous","title":"Le secret","level":1,"markup":"[[Je|Nous]] [[me|nous]] [[cache|cachons]] derrière un arbre. [[Mon|Notre]] ami [[m’|nous ]]appelle, mais [[je|nous]] ne [[réponds|répondons]] pas."},{"category":"personne","direction":"Je → nous","title":"La bibliothèque","level":1,"markup":"[[Je|Nous]] [[choisis|choisissons]] [[mes|nos]] livres. [[Je|Nous]] les [[lis|lisons]] et la bibliothécaire [[me|nous]] conseille un roman."},{"category":"personne","direction":"Il → ils","title":"Le jardinier","level":2,"markup":"[[Il|Ils]] [[arrose|arrosent]] [[sa|leur]] plante. [[Son|Leur]] voisin [[lui|leur]] donne des graines."},{"category":"personne","direction":"Il → ils","title":"Le musicien","level":2,"markup":"[[Il|Ils]] [[joue|jouent]] de la guitare. [[Sa|Leur]] sœur [[l’|les ]]écoute et [[lui|leur]] sourit."},{"category":"personne","direction":"Il → ils","title":"Le détective","level":3,"markup":"[[Il|Ils]] [[découvre|découvrent]] un indice. [[Son|Leur]] collègue [[le|les]] félicite et [[lui|leur]] montre une carte."},{"category":"personne","direction":"Il → ils","title":"L'explorateur","level":3,"markup":"[[Il|Ils]] [[prend|prennent]] [[son|leur]] sac et [[rejoint|rejoignent]] [[son|leur]] guide. Celui-ci [[lui|leur]] explique le chemin."},{"category":"personne","direction":"Nous → je","title":"Le potager","level":1,"markup":"[[Nous|Je]] [[plantons|plante]] des graines. [[Notre|Mon]] voisin [[nous|me]] prête un arrosoir et [[nous|je]] [[sommes|suis]] [[contents|content]]."},{"category":"personne","direction":"Nous → je","title":"Le dessin","level":1,"markup":"[[Nous|Je]] [[dessinons|dessine]] une maison. [[Nos|Mes]] amis [[nous|me]] regardent et [[nous|je]] [[leur montrons|leur montre]] le résultat."},{"category":"personne","direction":"Ils → il","title":"Le cinéma","level":2,"markup":"[[Ils|Il]] [[arrivent|arrive]] au cinéma. [[Leurs|Ses]] amis [[les|le]] attendent et [[leur|lui]] donnent un billet."},{"category":"personne","direction":"Ils → il","title":"Le laboratoire","level":2,"markup":"[[Ils|Il]] [[font|fait]] une expérience. [[Leur|Son]] professeur [[leur|lui]] explique la consigne et [[ils|il]] [[notent|note]] le résultat."}].concat([{"category":"temps","direction":"Présent → imparfait","title":"Le secret de la tour","level":3,"markup":"À la tombée du jour, la vieille horloge [[sonne|sonnait]] au-dessus des toits. Dans l'escalier, une enfant [[retient|retenait]] son souffle, [[aperçoit|apercevait]] une lueur et [[comprend|comprenait]] qu'un secret [[demeure|demeurait]] derrière la porte."},{"category":"temps","direction":"Imparfait → présent","title":"Le voyageur des brumes","level":3,"markup":"Au bord du fleuve, un voyageur [[attendait|attend]] le passage du bac. Il [[connaissait|connaît]] le nom des étoiles, mais [[ignorait|ignore]] celui du village. Parfois, les roseaux [[pliaient|plient]] et les eaux [[frémissaient|frémissent]]."},{"category":"temps","direction":"Présent → passé composé","title":"La lettre oubliée","level":3,"markup":"Dans le silence de la bibliothèque, Émilie [[découvre|a découvert]] une lettre jaunie. Elle [[lit|a lu]] quelques lignes, [[reconnaît|a reconnu]] une écriture familière, puis [[referme|a refermé]] doucement le tiroir."},{"category":"temps","direction":"Passé composé → imparfait","title":"La maison des souvenirs","level":3,"markup":"Chaque soir, le vent [[a traversé|traversait]] les volets disjoints. La lumière [[a dessiné|dessinait]] de longues ombres sur le parquet, tandis que la grand-mère [[a raconté|racontait]] des histoires et que les enfants [[ont écouté|écoutaient]] en silence."},{"category":"personne","direction":"Je → nous","title":"Le carnet de l'explorateur","level":3,"markup":"[[Je|Nous]] [[suis|sommes]] [[seul|seuls]] face à l'immense forêt. [[Mon|Notre]] courage [[me|nous]] [[permet|permet]] d'avancer. [[Je|Nous]] [[distingue|distinguons]] une trace dans la boue et [[je|nous]] [[comprends|comprenons]] que quelqu'un [[m’|nous ]]observe."}]);
const $=id=>document.getElementById(id);let pieces=[],targets=[],step=0,phase='transform',found=new Set(),mistakes=0,stars=0,streak=0,missionsDone=0,completed=false;
function refreshHud(){$('stars').textContent=stars;$('streak').textContent=streak;$('missionsDone').textContent=missionsDone}function celebrate(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<16;i++){let e=document.createElement('span');e.className='confetti';e.textContent=['⭐','✦','✨'][i%3];e.style.left=(8+Math.random()*84)+'vw';e.style.top=(10+Math.random()*30)+'vh';document.body.append(e);setTimeout(()=>e.remove(),1700)}}function parse(s){let out=[],re=/\[\[([^|]+)\|([^\]]+)\]\]/g,m,last=0;while((m=re.exec(s))){if(m.index>last)out.push({text:s.slice(last,m.index)});out.push({text:m[1],to:m[2],done:false});last=re.lastIndex}if(last<s.length)out.push({text:s.slice(last)});return out}
function current(){return missions.filter(m=>m.category===$('category').value&&m.direction===$('direction').value)[+$('mission').value]}
function directions(){let ds=[...new Set(missions.filter(m=>m.category===$('category').value).map(m=>m.direction))];$('direction').replaceChildren(...ds.map(d=>new Option(d,d)));list()}
function list(){let ms=missions.filter(m=>m.category===$('category').value&&m.direction===$('direction').value);$('mission').replaceChildren(...ms.map((m,i)=>new Option((i+1)+' · '+m.title,i)));start()}
function report(message){
  $('feedback').textContent=message;
}
function start(){
  const mission=current();
  if(!mission)return;
  pieces=parse(mission.markup);
  targets=pieces.flatMap((piece,index)=>piece.to===undefined?[]:[index]);
  step=0;
  found=new Set();
  mistakes=0;
  completed=false;
  phase=+$('difficulty').value===4?'identify':'transform';

  $('resultPanel').open=false;

function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function token(text,key){
  return '<button type="button" class="pick" data-token="'+key+'" aria-pressed="false">'+text+'</button>';
}
function renderSource(expert){
  $('source').innerHTML=pieces.map((piece,index)=>{
    const word=esc(piece.text);
    if(expert){
      if(piece.to!==undefined)return token(word,index);
      let part=0;
      return word.replace(/[^\s.,;:!?()«»]+/g,term=>token(term,'plain-'+index+'-'+part++));
    }
    if(piece.to===undefined)return word;
    const state=piece.done?'done':targets[step]===index?'current':'';
    return '<span class="mark '+state+'">'+word+'</span>';
  }).join('');
}
$('source').onclick=event=>{
  const button=event.target.closest('button[data-token]');
  if(!button||phase!=='identify')return;
  const key=button.dataset.token;
  if(found.has(key))found.delete(key);
  else found.add(key);
  button.setAttribute('aria-pressed',String(found.has(key)));
  $('progress').textContent=found.size+' élément(s) repéré(s)';
  report('');

function render(){
  const expert=phase==='identify';
  const finished=step>=targets.length;
  const choices=+$('difficulty').value===1;
