<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transpo'Chrono · ZouMaï</title><style>:root{font-family:system-ui,Arial;background:#f3f5fb;color:#202b44}*{box-sizing:border-box}body{margin:0}main{max-width:960px;margin:auto;padding:20px}h1{font-size:2.2rem;margin-bottom:4px}section{background:white;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 6px 24px #1b285012}label{display:inline-block;margin:6px 12px 6px 0;font-weight:600}select,button,input{font:inherit;border:1px solid #b9c6df;border-radius:10px;padding:10px;background:white}button{cursor:pointer;margin:4px}button:disabled{opacity:.45;cursor:default}.primary{background:#364cb3;color:white;border-color:#364cb3}.text{background:#eef2ff;padding:18px;border-radius:12px;font-size:1.25rem;line-height:2.15}.mark{background:#ffe59b;border-bottom:3px solid #c89a27;border-radius:4px;padding:1px}.mark.current{outline:3px solid #7855ca}.mark.done{background:#c8f2d8;border-bottom-color:#27804a}.pick{background:transparent;border:0;padding:1px 2px;margin:0;border-radius:4px;font:inherit;color:inherit;line-height:inherit}.pick.selected{background:#ffe59b;outline:2px solid #c28b20}.hint{background:#edf4ff;padding:14px;border-left:5px solid #5268c0;border-radius:9px}#feedback{min-height:28px;font-weight:650}#answer{width:min(100%,420px)}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.tag{font-size:.88rem;background:#e7ebf9;padding:5px 10px;border-radius:20px}a{color:#344db2}#choice{display:flex;flex-wrap:wrap}small{color:#53607a}</style></head><body><main><a href="francais-1-conjugaison.html">← Retour à Conjugaison</a><h1>🕰️ Transpo'Chrono</h1><p>Transforme un texte complet. Choisis une mission, puis avance des transformations guidées jusqu'à l'écriture autonome.</p><section><div><label>Type de transposition <select id="category"><option value="temps">Changer de temps</option><option value="personne">Changer de personne</option></select></label><label>Transformation <select id="direction"></select></label></div><div><label>Difficulté <select id="difficulty"><option value="1">1 · Choisir</option><option value="2">2 · Écrire avec aide</option><option value="3">3 · Écrire seul</option><option value="4">4 · Expert : repérer + écrire</option></select></label><label>Texte <select id="mission"></select></label></div><p class="hint" id="instruction"></p><p id="progress"></p><div id="source" class="text"></div><p id="question"></p><div id="choice"></div><div class="controls" id="writearea" hidden><input id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Écris la transformation"><button class="primary" id="check">Vérifier</button></div><div class="controls"><button id="hint">💡 Aide</button><button id="verify" hidden class="primary">J'ai tout repéré</button><button id="next" disabled class="primary">Texte suivant →</button></div><p id="feedback" aria-live="polite"></p></section><section><b>📖 Texte transposé</b><p class="text" id="result"></p><small>Une transformation peut modifier plusieurs mots, notamment un auxiliaire, un participe passé ou un groupe de pronoms.</small></section></main><script>
const missions=[{"category":"temps","direction":"Présent → imparfait","title":"La classe","level":1,"markup":"Chaque matin, les élèves [[entrent|entraient]] en classe. La maîtresse [[écrit|écrivait]] la date et ils [[ouvrent|ouvraient]] leur cahier."},{"category":"temps","direction":"Présent → imparfait","title":"Le marché","level":1,"markup":"Chaque samedi, les commerçants [[installent|installaient]] leurs étals et les clients [[choisissent|choisissaient]] leurs fruits."},{"category":"temps","direction":"Présent → imparfait","title":"Le phare","level":2,"markup":"Chaque soir, le gardien [[allume|allumait]] la lampe. Il [[voit|voyait]] les bateaux et [[tient|tenait]] son journal."},{"category":"temps","direction":"Présent → imparfait","title":"La forêt","level":2,"markup":"Chaque automne, nous [[ramassons|ramassions]] des feuilles. Nous [[faisons|faisions]] des bouquets et [[prenons|prenions]] des photos."},{"category":"temps","direction":"Présent → imparfait","title":"La cabane","level":3,"markup":"Chaque mercredi, nous [[construisons|construisions]] des cabanes. Nous [[plaçons|placions]] les planches et [[crions|criions]] de joie."},{"category":"temps","direction":"Présent → imparfait","title":"Le refuge","level":3,"markup":"Chaque jour, les bénévoles [[nourrissent|nourrissaient]] les animaux. Une soigneuse [[nettoie|nettoyait]] les cages et [[soigne|soignait]] les oiseaux."},{"category":"temps","direction":"Imparfait → présent","title":"La piscine","level":1,"markup":"Chaque mercredi, je [[nageais|nage]] à la piscine. Je [[mettais|mets]] mon bonnet et [[rejoignais|rejoins]] mes amis."},{"category":"temps","direction":"Imparfait → présent","title":"Le village","level":1,"markup":"Chaque matin, le boulanger [[vendait|vend]] son pain. Les habitants [[venaient|viennent]] tôt et [[discutaient|discutent]] longtemps."},{"category":"temps","direction":"Imparfait → présent","title":"La répétition","level":2,"markup":"Chaque soir, nous [[répétions|répétons]]. Nous [[étions|sommes]] attentifs et [[apprenions|apprenons]] nos répliques."},{"category":"temps","direction":"Imparfait → présent","title":"Le jardin","level":2,"markup":"Chaque été, tu [[arrosais|arroses]] les fleurs et tu [[cueillais|cueilles]] les fraises. Ton frère [[courait|court]] près de toi."},{"category":"temps","direction":"Imparfait → présent","title":"La montagne","level":3,"markup":"Chaque hiver, ils [[prenaient|prennent]] le télésiège. Ils [[voyaient|voient]] les sommets et [[descendaient|descendent]] les pistes."},{"category":"temps","direction":"Imparfait → présent","title":"L'atelier","level":3,"markup":"Chaque semaine, vous [[fabriquiez|fabriquez]] des cerfs-volants. Vous [[pliiez|pliez]] le papier et [[colliez|collez]] les baguettes."},{"category":"temps","direction":"Présent → passé composé","title":"Le match","level":1,"markup":"Aujourd’hui, Hugo [[marque|a marqué]] un but. Ses amis [[applaudissent|ont applaudi]] et l’arbitre [[siffle|a sifflé]] la fin."},{"category":"temps","direction":"Présent → passé composé","title":"La surprise","level":1,"markup":"Ce matin, nous [[préparons|avons préparé]] un gâteau. Nous [[mettons|avons mis]] la table et nous [[invitons|avons invité]] nos voisins."},{"category":"temps","direction":"Présent → passé composé","title":"La randonnée","level":2,"markup":"Aujourd’hui, Léa [[part|est partie]] en randonnée. Elle [[monte|est montée]] au sommet et [[revient|est revenue]] avant la nuit."},{"category":"temps","direction":"Présent → passé composé","title":"Le trésor","level":2,"markup":"Ce matin, les enfants [[trouvent|ont trouvé]] une boîte. Ils l’[[ouvrent|ont ouverte]] et [[découvrent|ont découvert]] une carte."},{"category":"temps","direction":"Présent → passé composé","title":"Le musée","level":3,"markup":"Aujourd’hui, nous [[visitons|avons visité]] le musée. Nous [[voyons|avons vu]] une statue et [[écrivons|avons écrit]] un compte rendu."},{"category":"temps","direction":"Présent → passé composé","title":"La course","level":3,"markup":"Ce matin, elles [[arrivent|sont arrivées]] au stade, [[courent|ont couru]] cinq kilomètres et [[repartent|sont reparties]] ensemble."},{"category":"temps","direction":"Passé composé → présent","title":"Le jardin secret","level":1,"markup":"[[Hier|Aujourd’hui]], Malo [[a trouvé|trouve]] une clé. Il [[a ouvert|ouvre]] la porte et [[a découvert|découvre]] un jardin."},{"category":"temps","direction":"Passé composé → présent","title":"Le concert","level":1,"markup":"[[Hier soir|Ce soir]], les musiciens [[ont joué|jouent]] une mélodie. Le public [[a applaudi|applaudit]] et les enfants [[ont chanté|chantent]]."},{"category":"temps","direction":"Passé composé → présent","title":"Le départ","level":2,"markup":"[[Hier|Aujourd’hui]], nous [[sommes partis|partons]] tôt. Nous [[avons pris|prenons]] le train et [[sommes arrivés|arrivons]] à midi."},{"category":"temps","direction":"Passé composé → présent","title":"Le laboratoire","level":2,"markup":"[[Hier|Aujourd’hui]], tu [[as mélangé|mélanges]] deux liquides. Tu [[as observé|observes]] une réaction et [[as noté|notes]] le résultat."},{"category":"temps","direction":"Passé composé → imparfait","title":"La promenade","level":3,"markup":"Hier, Léa [[a marché|marchait]] dans le parc. Elle [[a regardé|regardait]] les arbres et [[a écouté|écoutait]] les oiseaux."},{"category":"temps","direction":"Passé composé → imparfait","title":"Les vacances","level":3,"markup":"Chaque été, nous [[avons nagé|nagions]] le matin. Nous [[avons joué|jouions]] sur la plage et [[avons construit|construisions]] des châteaux."},{"category":"temps","direction":"Passé composé → imparfait","title":"La lecture","level":1,"markup":"Hier, ils [[ont lu|lisaient]] dans le salon. Leur mère [[a préparé|préparait]] le repas et le chat [[a dormi|dormait]] près du feu."},{"category":"temps","direction":"Imparfait → passé composé","title":"Le défi sportif","level":1,"markup":"Hier, les élèves [[couraient|ont couru]] autour du stade. Puis ils [[buvaient|ont bu]] de l’eau et [[rentraient|sont rentrés]] en classe."},{"category":"temps","direction":"Imparfait → passé composé","title":"L'orage","level":2,"markup":"Hier soir, le vent [[soufflait|a soufflé]] fort. Les branches [[bougeaient|ont bougé]] et une fenêtre [[claquait|a claqué]]."},{"category":"temps","direction":"Imparfait → passé composé","title":"La visite","level":2,"markup":"Hier, nous [[visitions|avons visité]] le château. Nous [[découvrions|avons découvert]] un passage et [[prenions|avons pris]] des photos."},{"category":"personne","direction":"Je → nous","title":"Mon sac","level":3,"markup":"[[Je|Nous]] [[prépare|préparons]] [[mon|notre]] sac. [[Ma|Notre]] sœur [[me|nous]] donne un livre et [[je|nous]] [[la remercie|la remercions]]."},{"category":"personne","direction":"Je → nous","title":"Le stade","level":3,"markup":"[[Je|Nous]] [[prends|prenons]] [[mon|notre]] ballon. Le professeur [[me|nous]] demande si [[je|nous]] [[suis|sommes]] [[prêt|prêts]]."},{"category":"personne","direction":"Je → nous","title":"Le secret","level":1,"markup":"[[Je|Nous]] [[me|nous]] [[cache|cachons]] derrière un arbre. [[Mon|Notre]] ami [[m’|nous ]]appelle, mais [[je|nous]] ne [[réponds|répondons]] pas."},{"category":"personne","direction":"Je → nous","title":"La bibliothèque","level":1,"markup":"[[Je|Nous]] [[choisis|choisissons]] [[mes|nos]] livres. [[Je|Nous]] les [[lis|lisons]] et la bibliothécaire [[me|nous]] conseille un roman."},{"category":"personne","direction":"Il → ils","title":"Le jardinier","level":2,"markup":"[[Il|Ils]] [[arrose|arrosent]] [[sa|leur]] plante. [[Son|Leur]] voisin [[lui|leur]] donne des graines."},{"category":"personne","direction":"Il → ils","title":"Le musicien","level":2,"markup":"[[Il|Ils]] [[joue|jouent]] de la guitare. [[Sa|Leur]] sœur [[l’|les ]]écoute et [[lui|leur]] sourit."},{"category":"personne","direction":"Il → ils","title":"Le détective","level":3,"markup":"[[Il|Ils]] [[découvre|découvrent]] un indice. [[Son|Leur]] collègue [[le|les]] félicite et [[lui|leur]] montre une carte."},{"category":"personne","direction":"Il → ils","title":"L'explorateur","level":3,"markup":"[[Il|Ils]] [[prend|prennent]] [[son|leur]] sac et [[rejoint|rejoignent]] [[son|leur]] guide. Celui-ci [[lui|leur]] explique le chemin."},{"category":"personne","direction":"Nous → je","title":"Le potager","level":1,"markup":"[[Nous|Je]] [[plantons|plante]] des graines. [[Notre|Mon]] voisin [[nous|me]] prête un arrosoir et [[nous|je]] [[sommes|suis]] [[contents|content]]."},{"category":"personne","direction":"Nous → je","title":"Le dessin","level":1,"markup":"[[Nous|Je]] [[dessinons|dessine]] une maison. [[Nos|Mes]] amis [[nous|me]] regardent et [[nous|je]] [[leur montrons|leur montre]] le résultat."},{"category":"personne","direction":"Ils → il","title":"Le cinéma","level":2,"markup":"[[Ils|Il]] [[arrivent|arrive]] au cinéma. [[Leurs|Ses]] amis [[les|le]] attendent et [[leur|lui]] donnent un billet."},{"category":"personne","direction":"Ils → il","title":"Le laboratoire","level":2,"markup":"[[Ils|Il]] [[font|fait]] une expérience. [[Leur|Son]] professeur [[leur|lui]] explique la consigne et [[ils|il]] [[notent|note]] le résultat."}];
const $=id=>document.getElementById(id);let pieces=[],targets=[],step=0,phase='transform',found=new Set(),mistakes=0;
function parse(s){let out=[],re=/\[\[([^|]+)\|([^\]]+)\]\]/g,m,last=0;while((m=re.exec(s))){if(m.index>last)out.push({text:s.slice(last,m.index)});out.push({text:m[1],to:m[2],done:false});last=re.lastIndex}if(last<s.length)out.push({text:s.slice(last)});return out}
function current(){return missions.filter(m=>m.category===$('category').value&&m.direction===$('direction').value)[+$('mission').value]}
function directions(){let ds=[...new Set(missions.filter(m=>m.category===$('category').value).map(m=>m.direction))];$('direction').replaceChildren(...ds.map(d=>new Option(d,d)));list()}
function list(){let ms=missions.filter(m=>m.category===$('category').value&&m.direction===$('direction').value);$('mission').replaceChildren(...ms.map((m,i)=>new Option((i+1)+' · '+m.title,i)));start()}
function start(){let m=current();if(!m)return;pieces=parse(m.markup);targets=pieces.map((p,i)=>p.to!==undefined?i:-1).filter(i=>i>=0);step=0;found=new Set();mistakes=0;phase=+$('difficulty').value===4?'identify':'transform';$('next').disabled=true;$('feedback').textContent='';$('instruction').textContent=$('category').value==='temps'?'⏳ On garde la personne, on change le temps. Observe les auxiliaires, les participes passés et les repères temporels. Pour les habitudes, « chaque jour » peut rester inchangé.':'👥 On garde le temps, on change la personne. Les pronoms sujets, pronoms compléments, déterminants possessifs et accords peuvent changer. Les autres personnages ne changent pas forcément.';render()}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function text(){return pieces.map(p=>p.done?p.to:p.text).join('')}
function render(){let expert=phase==='identify';$('verify').hidden=!expert;$('writearea').hidden=expert||+$('difficulty').value===1;$('choice').hidden=expert||+$('difficulty').value!==1;$('progress').textContent=expert?'Éléments repérés : '+found.size+' / ?':'Transformations : '+step+' / '+targets.length;$('result').textContent=expert?'Le texte transposé apparaîtra après ton repérage.':text();
$('source').innerHTML=pieces.map((p,i)=>{if(p.to===undefined)return esc(p.text).replace(/(\S+)/g,'<button type="button" class="pick" data-plain="1">$1</button>');if(expert)return '<button type="button" class="pick '+(found.has(i)?'selected':'')+'" data-index="'+i+'">'+esc(p.text)+'</button>';return '<span class="mark '+(p.done?'done':targets[step]===i?'current':'')+'">'+esc(p.done?p.to:p.text)+'</span>'}).join('');
$('source').querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>{let i=+b.dataset.index;if(found.has(i))found.delete(i);else found.add(i);$('feedback').textContent='';render()});$('source').querySelectorAll('[data-plain]').forEach(b=>b.onclick=()=>{if(expert){mistakes++;$('feedback').textContent='Ce mot n’a pas besoin de changer. Observe le sujet, le temps et le sens.'}});
if(expert){$('question').textContent='Repère tous les mots ou groupes de mots à transformer, sans surlignage.';$('choice').replaceChildren();return}
if(step>=targets.length){$('question').textContent='🎉 Texte terminé !';$('choice').replaceChildren();$('writearea').hidden=true;$('next').disabled=false;$('feedback').textContent='Mission réussie'+(mistakes?' ! Revois les points qui t’ont posé problème.':' sans erreur !');return}
let p=pieces[targets[step]];$('question').textContent='Que devient « '+p.text+' » ?';if(+$('difficulty').value===1){let pool=[p.to,p.text,'était','avaient','faisaient','sommes','leur','nous','allait','allons','ont joué','jouait'];let opts=[...new Set(pool)].slice(0,4).sort((a,b)=>((a.length*7+step)%11)-((b.length*7+step)%11));$('choice').replaceChildren(...opts.map(v=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>validate(v);return b}))}else{$('answer').value='';$('answer').placeholder='Écris la forme correcte';$('answer').focus()}}
function norm(s){return s.normalize('NFC').replace(/[’]/g,"'").replace(/\s+/g,' ').trim().toLocaleLowerCase('fr')}
function validate(v){let p=pieces[targets[step]];if(norm(v)===norm(p.to)){p.done=true;step++;$('feedback').textContent='✓ Bien joué !';render()}else{mistakes++;$('feedback').textContent='Pas encore. Vérifie la personne, le temps et les accords.'}}
$('check').onclick=()=>validate($('answer').value);$('answer').addEventListener('keydown',e=>{if(e.key==='Enter')validate($('answer').value)});
$('hint').onclick=()=>{if(phase==='identify'){$('feedback').textContent='Cherche les verbes conjugués, les auxiliaires, les pronoms et les déterminants. Clique sur les groupes complets.';return}if(step>=targets.length)return;let p=pieces[targets[step]],n=+$('difficulty').value;if(n===3||n===4){$('feedback').textContent='Indice : la réponse commence par « '+p.to.slice(0,Math.max(1,Math.floor(p.to.length/3)))+'… ».'}else{$('feedback').textContent='Indice : « '+p.text+' » doit respecter la transformation « '+current().direction+' ».'}};
$('verify').onclick=()=>{let missing=targets.filter(i=>!found.has(i));if(missing.length){mistakes++;$('feedback').textContent='Il manque '+missing.length+' élément(s). Continue à chercher.';return}phase='transform';$('feedback').textContent='Tous les éléments sont repérés. Maintenant, écris leurs transformations !';render()};
$('next').onclick=()=>{$('mission').value=(+$('mission').value+1)%$('mission').options.length;start()};
$('category').onchange=directions;$('direction').onchange=list;$('mission').onchange=start;$('difficulty').onchange=start;directions();
</script></body></html>
