<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transpo'Chrono · ZouMaï</title><style>body{font-family:system-ui;background:#f3f5fb;color:#24304b;margin:0}main{max-width:850px;margin:auto;padding:20px}section{background:white;border-radius:18px;padding:22px;margin:16px 0}h1{font-size:2.2rem}button,select{font:inherit;border:1px solid #ccd3e5;background:white;border-radius:10px;padding:10px;margin:4px;cursor:pointer}.source{font-size:1.3rem;line-height:2;background:#eef2ff;padding:18px;border-radius:14px}.word{background:#ffe59b;border-bottom:3px solid #d19b18;font-weight:700}.word.active{outline:3px solid #8855df}.word.done{background:#c9f3d8;border-bottom-color:#29904d}.hint{background:#edf4ff;border-left:5px solid #5267c9;padding:15px;border-radius:8px}.primary{background:#364cb2;color:white}#feedback{font-weight:700;min-height:25px}a{color:#3549ad}</style><main><a href="francais-1-conjugaison.html">← Conjugaison</a><h1>🕰️ Transpo'Chrono</h1><p>Lis le texte. Transforme les mots jaunes, en commençant par celui entouré en violet.</p><section><label>Mission <select id="mode"><option value="time">Présent → imparfait</option><option value="nous">Je → nous</option><option value="ils">Il → ils</option></select></label><label>Texte <select id="level"><option value="0">1 · Découverte</option><option value="1">2 · Entraînement</option><option value="2">3 · Défi</option></select></label><p class="hint" id="instruction"></p><div id="source" class="source"></div><p id="question"></p><div id="choices"></div><p id="feedback" aria-live="polite"></p><button id="hint">💡 Indice</button><button id="next" class="primary" disabled>Texte suivant →</button></section><section><b>📖 Mon texte transformé</b><p id="result" class="source"></p></section></main><script>
const data={time:[
['Aujourd’hui, chaque matin, Léa ouvre les volets. Elle regarde les oiseaux et prend son petit déjeuner.',[['Aujourd’hui','Autrefois'],['ouvre','ouvrait'],['regarde','regardait'],['prend','prenait']]],
['Cette semaine, chaque jour, nous jouons au ballon dans la cour. Le vent souffle et les feuilles tombent.',[['Cette semaine','La semaine dernière'],['jouons','jouions'],['souffle','soufflait'],['tombent','tombaient']]],
['En ce moment, tous les soirs, je fais mes devoirs, puis je vais dans le jardin. Mes amis viennent et nous rions.',[['En ce moment','Quand j’étais plus jeune'],['fais','faisais'],['je vais','j’allais'],['viennent','venaient'],['rions','riions']]]
],nous:[
['Je marche dans la forêt. Je cherche des champignons et je regarde les arbres.',[['Je','Nous'],['marche','marchons'],['Je','Nous'],['cherche','cherchons'],['je','nous'],['regarde','regardons']]],
['Je suis en retard. Je prends mon cartable et je cours vers mon école.',[['Je','Nous'],['suis','sommes'],['Je','Nous'],['prends','prenons'],['mon','nos'],['cartable','cartables'],['je','nous'],['cours','courons'],['mon','notre']]],
['Je vais au marché avec ma sœur. J’achète une pomme et je choisis mon dessert.',[['Je','Nous'],['vais','allons'],['ma','notre'],['J’','Nous '],['achète','achetons'],['je','nous'],['choisis','choisissons'],['mon','notre']]]
],ils:[
['Il arrive à l’école. Il pose son sac et il retrouve son ami.',[['Il','Ils'],['arrive','arrivent'],['Il','Ils'],['pose','posent'],['son','leurs'],['sac','sacs'],['il','ils'],['retrouve','retrouvent'],['son','leurs'],['ami','amis']]],
['Il est heureux. Il fait un dessin et prend son crayon.',[['Il','Ils'],['est','sont'],['Il','Ils'],['fait','font'],['prend','prennent'],['son','leurs'],['crayon','crayons']]],
['Il se promène dans la ville. Il voit une affiche et il choisit son spectacle.',[['Il','Ils'],['promène','promènent'],['Il','Ils'],['voit','voient'],['il','ils'],['choisit','choisissent'],['son','leur']]]
]};
const $=id=>document.getElementById(id);let parts=[],pos=[],step=0;function start(){const [s,pairs]=data[$('mode').value][+$('level').value];parts=[];pos=[];let cur=0;for(const [from,to] of pairs){let at=s.indexOf(from,cur);if(at<0)continue;parts.push({s:s.slice(cur,at)});parts.push({s:from,to,done:false});pos.push(parts.length-1);cur=at+from.length}parts.push({s:s.slice(cur)});step=0;$('next').disabled=true;$('instruction').textContent=$('mode').value==='time'?'⏳ Le présent raconte ce qui se passe maintenant. Pour raconter une habitude passée, change d’abord le repère temporel, puis les verbes à l’imparfait. Exemple : Aujourd’hui, elle joue chaque matin → Autrefois, elle jouait chaque matin.':$('mode').value==='nous'?'👥 Le personnage devient un groupe : « je » devient « nous ». Pense aux verbes et aux possessifs.':'👥 Un personnage devient plusieurs personnages : « il » devient « ils ». Pense aux verbes et aux possessifs.';render()}
function render(){const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));$('source').innerHTML=parts.map((p,i)=>p.to?'<span class="word '+(p.done?'done':i===pos[step]?'active':'')+'">'+esc(p.done?p.to:p.s)+'</span>':esc(p.s)).join('');$('result').textContent=parts.map(p=>p.done?p.to:p.s).join('');if(step===pos.length){$('question').textContent='🎉 Texte transformé !';$('choices').innerHTML='';$('feedback').textContent='Mission réussie !';$('next').disabled=false;return}const p=parts[pos[step]];$('question').textContent='Étape '+(step+1)+'/'+pos.length+' : « '+p.s+' » devient…';const extras=$('mode').value==='time'?['jouait','jouaient','jouais','jouons','jouera','joue']:['nous','ils','notre','nos','sont','avons'];let opts=[p.to,p.s,...extras.filter(x=>x!==p.to&&x!==p.s)].slice(0,4).sort(()=>Math.random()-.5);$('choices').innerHTML='';for(const o of opts){const b=document.createElement('button');b.textContent=o;b.onclick=()=>{if(o===p.to){p.done=true;step++;$('feedback').textContent='✓ Bien joué !';render()}else $('feedback').textContent='Essaie encore : observe le sujet et le temps.'};$('choices').appendChild(b)}}$('hint').onclick=()=>{if(step<pos.length){const p=parts[pos[step]];$('feedback').textContent='Indice : '+p.to.slice(0,Math.max(1,Math.ceil(p.to.length/2)))+'…'}};$('next').onclick=()=>{$('level').value=(+$('level').value+1)%3;start()};$('mode').onchange=start;$('level').onchange=start;start();</script></html>
