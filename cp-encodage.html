<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Encodage CP | Zou Maï</title><link rel="stylesheet" href="zoumai.css"><link rel="stylesheet" href="zoumai-brand.css"><style>
body{margin:0;background:#f5f0e5;font-family:Arial;color:#101114}.wrap{width:min(1000px,94vw);margin:auto;padding:25px 0 70px}.top{display:flex;justify-content:space-between;border-bottom:3px solid #111;padding-bottom:16px}.top a{color:#111;font-weight:900;text-decoration:none}h1{text-align:center;font-size:clamp(2.2rem,6vw,4.3rem);margin:28px 0 8px}.sub{text-align:center;font-size:1.1rem}.panel{background:#fff;border:3px solid #111;border-radius:24px;padding:22px;margin:24px 0;box-shadow:6px 6px 0 #111}.sounds{display:flex;flex-wrap:wrap;gap:9px}.sound{border:2px solid #111;background:#fff;border-radius:999px;padding:9px 14px;font-weight:900;cursor:pointer}.sound.on{background:#f2d31c}.modes{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.mode{border:2px solid #111;border-radius:15px;background:#fff;padding:12px 7px;font-weight:800;cursor:pointer}.mode.on{background:#cce9ff}.play{text-align:center}.pic{font-size:7rem;margin:10px}.hint{font-size:1.1rem;min-height:28px}.slots{font-size:1.35rem;font-weight:900;margin:8px}.answer{font-size:1.7rem;width:min(390px,80%);padding:13px;border:3px solid #111;border-radius:14px;text-align:center}.btn{border:3px solid #111;border-radius:14px;padding:12px 20px;margin:10px 4px;font-size:1rem;font-weight:900;background:#f2d31c;cursor:pointer}.feedback{font-size:1.2rem;font-weight:800;min-height:62px;margin:10px auto;max-width:650px}.wrong{background:#ffe2df;padding:12px;border-radius:14px}.right{background:#dcf5df;padding:12px;border-radius:14px}.target{font-size:1.5rem;letter-spacing:2px}.review{font-weight:900}@media(max-width:760px){.modes{grid-template-columns:1fr 1fr}.pic{font-size:5rem}}</style></head><body><a class="zm-corner-logo" href="index.html"><img src="images/logo-zou-mai-sensei.png" alt="Zou Maï"></a><div class="wrap"><div class="top"><strong>ZOU MAÏ · CP</strong><a href="cp-experimentation.html">← Expérimentation CP</a></div><h1>✍️ Le labo des mots</h1><p class="sub">J'écoute, je découpe les sons, j'écris… et si je me trompe, je réécris pour apprendre.</p>
<div class="panel"><strong>1. Choisis les sons que tu connais</strong><p style="margin:8px 0 14px">Tu peux en cocher plusieurs. Le jeu privilégie les mots qui les contiennent.</p><div class="sounds" id="sounds"></div></div>
<div class="panel"><strong>2. Choisis ton jeu</strong><div class="modes" id="modes"></div></div>
<div class="panel play"><div id="modeTitle"></div><div class="pic" id="pic"></div><div class="hint" id="hint"></div><div class="slots" id="slots"></div><input class="answer" id="answer" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Écris le mot"><br><button class="btn" id="check">Je vérifie</button><button class="btn" id="listen" style="background:#fff">🔊 Écouter</button><div class="feedback" id="feedback"></div><div class="review" id="review"></div></div></div>
<script>
const bank=[
{w:"chat",p:"🐱",s:["a","ch"]},{w:"rat",p:"🐀",s:["a","r"]},{w:"lit",p:"🛏️",s:["i","l"]},{w:"mur",p:"🧱",s:["u","m","r"]},{w:"vélo",p:"🚲",s:["é","v","o"]},{w:"moto",p:"🏍️",s:["o","m","t"]},{w:"lune",p:"🌙",s:["u","l","n"]},{w:"fée",p:"🧚",s:["é","f"]},{w:"poule",p:"🐔",s:["ou","p","l"]},{w:"loup",p:"🐺",s:["ou","l","p"]},{w:"roi",p:"👑",s:["oi","r"]},{w:"poire",p:"🍐",s:["oi","p","r"]},{w:"poisson",p:"🐟",s:["oi","s","on"]},{w:"mouton",p:"🐑",s:["ou","on","m","t"]},{w:"ballon",p:"🎈",s:["on","a","b","l"]},{w:"banc",p:"🪑",s:["an","b"]},{w:"dent",p:"🦷",s:["en","d"]},{w:"lapin",p:"🐇",s:["in","a","l","p"]},{w:"pain",p:"🍞",s:["ain","p"]},{w:"train",p:"🚆",s:["ain","tr"]},{w:"chien",p:"🐕",s:["ch","ien"]},{w:"chaton",p:"🐱",s:["ch","a","on"]},{w:"agneau",p:"🐑",s:["gn","eau"]},{w:"bateau",p:"⛵",s:["eau","a","b","t"]},{w:"chapeau",p:"🎩",s:["ch","eau","a","p"]},{w:"feu",p:"🔥",s:["eu","f"]},{w:"fleur",p:"🌸",s:["eu","fl","r"]},{w:"photo",p:"📷",s:["ph","o","t"]},{w:"fille",p:"👧",s:["ill","f","i"]},{w:"quille",p:"🎳",s:["qu","ill","i"]}];
const soundList=["a","i","o","u","é","è","l","r","m","n","f","v","s","z","p","b","t","d","c/k","g","j","ou","oi","on","an/en","in","ain","au/eau","eu/œu","ch","gn","ph","ill","qu"];
let selected=new Set(["a","i","o","u","é","l","r","m","n","f","s","p","t","ou","oi"]);
let mode=1,current=null,stage="answer",errors={};
const modes=["🔤 Je construis le mot","✏️ J'écris le mot","🧱 Les boîtes à sons","🔎 Le graphème manquant","⚔️ Défi des graphèmes"];
function norm(s){return s.toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function renderSounds(){sounds.innerHTML="";soundList.forEach(x=>{let b=document.createElement("button");b.className="sound "+(selected.has(x)?"on":"");b.textContent=x;b.onclick=()=>{selected.has(x)?selected.delete(x):selected.add(x);renderSounds();next()};sounds.appendChild(b)})}
function renderModes(){modes.forEach((x,i)=>{let b=document.createElement("button");b.className="mode "+(mode===i+1?"on":"");b.textContent=x;b.onclick=()=>{mode=i+1;renderModes();next()};document.getElementById("modes").appendChild(b)})}
function pool(){let a=bank.filter(x=>x.s.some(y=>[...selected].some(z=>z.includes(y)||y.includes(z.split("/")[0]))));return a.length?a:bank}
function next(){stage="answer";let a=pool();current=a[Math.floor(Math.random()*a.length)];pic.textContent=current.p;answer.value="";feedback.innerHTML="";modeTitle.innerHTML="<strong>"+modes[mode-1]+"</strong>";hint.textContent=mode===1?"Écris le mot avec les sons que tu entends.":mode===3?"Dis lentement le mot, puis écris-le.":mode===4?"Quel graphème manque ? Écris ensuite le mot entier.":mode===5?"Attention : choisis la bonne façon d'écrire chaque son.":"Regarde l'image et écris le mot.";slots.textContent=mode===3?current.w.split("").map(()=> "□").join(" "):mode===4?mask(current.w):"";answer.focus();showReview()}
function mask(w){let chunks=["eau","ou","oi","on","an","en","in","ain","eu","ch","gn","ph","ill","qu"];let c=chunks.find(x=>w.includes(x));return c?w.replace(c,"___"):"_".repeat(Math.max(1,Math.floor(w.length/2)))}
function explain(got,w){let i=0;while(i<Math.min(got.length,w.length)&&got[i]===w[i])i++;let focus=w.slice(Math.max(0,i-1),Math.min(w.length,i+2));return "Regarde bien cette partie : <strong>"+focus+"</strong>. Écoute le mot puis observe son écriture."}
function checkAnswer(){let got=norm(answer.value),w=norm(current.w);if(stage==="rewrite"){if(got===w){feedback.innerHTML='<div class="right">🌟 Oui ! Tu as réécrit <span class="target">'+current.w+'</span>. Maintenant, on peut continuer.</div>';delete errors[current.w];showReview();setTimeout(next,1100)}else{feedback.innerHTML='<div class="wrong">Pas encore. Recopie exactement : <span class="target">'+current.w+'</span></div>';answer.select()}return}
if(got===w){feedback.innerHTML='<div class="right">Bravo ! <span class="target">'+current.w+'</span></div>';setTimeout(next,900)}else{errors[current.w]=(errors[current.w]||0)+1;stage="rewrite";feedback.innerHTML='<div class="wrong">Tu as écrit <strong>'+answer.value+'</strong>.<br>Le mot s’écrit : <span class="target">'+current.w+'</span><br>'+explain(got,w)+'<br><strong>À toi de le réécrire correctement avant de continuer.</strong></div>';answer.value="";answer.focus();showReview()}}
function showReview(){let n=Object.keys(errors).length;review.textContent=n?"🔁 Mots à revoir : "+n:""}
function speak(){if("speechSynthesis"in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(current.w))}}
document.getElementById("check").onclick=checkAnswer;document.getElementById("listen").onclick=speak;answer.addEventListener("keydown",e=>{if(e.key==="Enter")checkAnswer()});renderSounds();renderModes();next();
</script><script src="site-tracking.js" defer></script></body></html>
