<!doctype html><html lang="fr"><head><title>Le pendu · Zou Maï</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="zoumai.css"><link rel="stylesheet" href="zoumai-brand.css"><style>*{box-sizing:border-box}body{margin:0;background:#111823;color:#f5f2e9;font-family:Arial,sans-serif}main{max-width:850px;margin:auto;padding:22px 15px 70px}a{color:#ffdb53}h1{font-size:clamp(2rem,6vw,3.4rem)}.panel{background:#202d40;border:2px solid #52627a;border-radius:20px;padding:20px;margin-top:18px}.controls{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}button,select,input{font:inherit;border-radius:9px;padding:10px;border:2px solid #62758d}button{background:#ffdc59;color:#161b24;font-weight:900;cursor:pointer}select,input{background:#f9f7f0;color:#17202c}p{line-height:1.5}.status{font-weight:800;min-height:38px;color:#ffdf72}.chip{display:inline-flex;align-items:center;justify-content:center;min-width:48px;min-height:48px;border-radius:10px;background:#344d6b;font-size:1.35rem;font-weight:900;margin:4px}.small{color:#c5d3e5}</style><style>.word{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:25px 0}.letter{width:clamp(24px,7vw,43px);height:48px;border-bottom:4px solid #ffdc59;text-align:center;font-size:1.7rem;font-weight:900}.keyboard{display:flex;justify-content:center;flex-wrap:wrap;gap:6px}.keyboard button{min-width:40px}.keyboard button:disabled{opacity:.35}.drawing{display:block;margin:10px auto;max-width:170px}</style></head><body><main><a href="jeux.html">← Jeux</a><h1>🔤 LE PENDU</h1><p>Découvre le mot caché avant que le dessin ne soit terminé. Les accents sont acceptés comme leur lettre de base.</p><div class="panel"><div class="controls"><label>Thème <select id="theme"><option value="all">Tous les thèmes</option><option value="histoire">Histoire</option><option value="sciences">Sciences</option><option value="geo">Géographie</option><option value="francais">Français</option></select></label><button id="new">Nouveau mot</button></div><p id="category"></p><svg class="drawing" viewBox="0 0 170 180" aria-label="Dessin du pendu"><g id="parts" stroke="#f5f2e9" stroke-width="5" stroke-linecap="round" fill="none"><path d="M15 170 H115" data-step="1"/><path d="M45 170 V12 H115 V32" data-step="2"/><circle cx="115" cy="49" r="17" data-step="3"/><path d="M115 66 V115" data-step="4"/><path d="M115 80 L85 100" data-step="5"/><path d="M115 80 L145 100" data-step="6"/><path d="M115 115 L90 150" data-step="7"/><path d="M115 115 L140 150" data-step="8"/></g></svg><div class="word" id="word"></div><div class="keyboard" id="keyboard"></div><p class="status" id="status" role="status"></p></div></main><script>
const dictionary={histoire:['REVOLUTION','EMPIRE','REPUBLIQUE','NAPOLEON','CHARLEMAGNE','RENAISSANCE','MONARCHIE','RESISTANCE'],sciences:['EVAPORATION','GRAVITATION','VOLCAN','ECOSYSTEME','PHOTOSYNTHESE','ENERGIE','PLANETE','CELLULE'],geo:['CONTINENT','OCEAN','EQUATEUR','HEMISPHERE','LATITUDE','MONTAGNE','FRONTIERE','PENINSULE'],francais:['ADJECTIF','CONJUGAISON','SYNTAXE','PRONOM','INFINITIF','HOMOPHONE','SUJET','PREDICAT']};let answer='',used=new Set(),mistakes=0,finished=false;
function newGame(){let themes=Object.keys(dictionary),theme=document.getElementById('theme').value;if(theme==='all')theme=themes[Math.floor(Math.random()*themes.length)];let choices=dictionary[theme].filter(w=>w!==answer);answer=choices[Math.floor(Math.random()*choices.length)]||dictionary[theme][0];used=new Set();mistakes=0;finished=false;document.getElementById('category').textContent='Thème : '+({histoire:'Histoire',sciences:'Sciences',geo:'Géographie',francais:'Français'}[theme]);document.getElementById('status').textContent='8 erreurs maximum. Bonne recherche !';render()}
function guess(c){if(finished||used.has(c))return;used.add(c);if(!answer.includes(c))mistakes++;if([...answer].every(c=>used.has(c))){finished=true;document.getElementById('status').textContent='🏆 Bravo ! Le mot était '+answer+'.'}else if(mistakes>=8){finished=true;document.getElementById('status').textContent='Partie terminée. Le mot était '+answer+'.'}else document.getElementById('status').textContent='Erreurs : '+mistakes+' / 8';render()}
function render(){document.getElementById('word').innerHTML=[...answer].map(c=>'<span class="letter">'+(used.has(c)||finished?c:'')+'</span>').join('');let keyboard=document.getElementById('keyboard');keyboard.replaceChildren();for(const c of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'){let b=document.createElement('button');b.textContent=c;b.disabled=used.has(c)||finished;b.onclick=()=>guess(c);keyboard.append(b)}document.querySelectorAll('[data-step]').forEach(p=>p.style.visibility=Number(p.dataset.step)<=mistakes?'visible':'hidden')}
document.getElementById('new').onclick=newGame;document.getElementById('theme').onchange=newGame;document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;let c=e.key.toUpperCase();if(/^[A-Z]$/.test(c))guess(c)});newGame();
</script><script src="site-tracking.js" defer></script></body></html>
