<!doctype html><html lang="fr"><head><title>Le pendu · Zou Maï</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="zoumai.css"><link rel="stylesheet" href="zoumai-brand.css"><style>*{box-sizing:border-box}body{margin:0;background:#111823;color:#f5f2e9;font-family:Arial,sans-serif}main{max-width:850px;margin:auto;padding:22px 15px 70px}a{color:#ffdb53}h1{font-size:clamp(2rem,6vw,3.4rem)}.panel{background:#202d40;border:2px solid #52627a;border-radius:20px;padding:20px;margin-top:18px}.controls{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}button,select,input{font:inherit;border-radius:9px;padding:10px;border:2px solid #62758d}button{background:#ffdc59;color:#161b24;font-weight:900;cursor:pointer}select,input{background:#f9f7f0;color:#17202c}p{line-height:1.5}.status{font-weight:800;min-height:38px;color:#ffdf72}.chip{display:inline-flex;align-items:center;justify-content:center;min-width:48px;min-height:48px;border-radius:10px;background:#344d6b;font-size:1.35rem;font-weight:900;margin:4px}.small{color:#c5d3e5}</style><style>.word{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:25px 0}.letter{width:clamp(24px,7vw,43px);height:48px;border-bottom:4px solid #ffdc59;text-align:center;font-size:1.7rem;font-weight:900}.keyboard{display:flex;justify-content:center;flex-wrap:wrap;gap:6px}.keyboard button{min-width:40px}.keyboard button:disabled{opacity:.35}.drawing{display:block;margin:10px auto;max-width:170px}</style><style>
body{background:radial-gradient(ellipse at top,#182b50,#080b16 65%);color:#f4f7ff}main{max-width:900px}h1{color:#8deaff;text-shadow:0 0 24px #008cff88;margin:18px 0 8px;letter-spacing:.04em}.panel{background:#10192c;border:1px solid #395b85;box-shadow:0 0 35px #1b83ff20;text-align:center}.controls{justify-content:center;align-items:center}button{background:#18334e;color:#e5faff;border:1px solid #508ac0;transition:transform .15s,background .15s}button:not(:disabled):hover{background:#285b83;transform:translateY(-2px)}#new{background:#7ce8ff;color:#091426}#category{color:#b9a8ff;font-weight:bold}.stage{display:grid;justify-items:center;gap:8px}.stage img{width:clamp(100px,25vw,190px);height:clamp(100px,25vw,190px);object-fit:contain;filter:drop-shadow(0 0 15px #168cff66)}.lives{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}.paw{font-size:23px;color:#7ce8ff;filter:drop-shadow(0 0 5px #2acaff)}.paw.lost{opacity:.18;filter:grayscale(1)}.word{gap:5px;margin:20px 0}.letter{display:grid;place-items:center;width:clamp(19px,6vw,44px);height:48px;border:1px solid #547cbd;border-bottom:3px solid #7ce8ff;border-radius:8px;background:#18243b;color:#fff;font-size:clamp(1rem,4vw,1.7rem);box-shadow:0 0 9px #248aff22}.letter.found{background:#123e45;border-color:#63e6ba}.keyboard{max-width:620px;margin:auto}.keyboard button{min-width:clamp(34px,8vw,49px);min-height:44px}.keyboard button.good:disabled{opacity:1;background:#14533d;color:#b1ffdc;border-color:#55dca0}.keyboard button.bad:disabled{opacity:1;background:#542538;color:#ffb4c3;border-color:#ff668a}.status{color:#a8eaff;margin-bottom:0}.stage img.win{animation:jump .65s ease 2}.stage img.miss{animation:shake .3s ease}@keyframes jump{50%{transform:translateY(-12px) scale(1.08)}}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><style>.gallows{position:relative;width: min(100%,300px);height:220px}.gallows .frame{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 0 5px #24aaff)}.gallows img{position:absolute;width:100px;height:100px;left:56%;top:105px;transition:top .35s;z-index:1}.gallows[data-errors="6"] img,.gallows[data-errors="7"] img,.gallows[data-errors="8"] img{top:80px}.gallows.won .frame{opacity:.18}.gallows.won img{top:105px}.gallows [data-step]{visibility:hidden}</style><style>.gallows{height:250px}.gallows [data-step]{visibility:hidden}.gallows.win{animation:jump .65s ease 2}.gallows.miss{animation:shake .3s ease}.gallows.won .frame{opacity:1}.gallows.won .frame>g:first-child{opacity:.25}</style><style>#pendu-art{display:none;width:100%;aspect-ratio:1;background-image:url('assets/pendu-zoum.webp?v=2');background-size:400% 200%;background-repeat:no-repeat;border-radius:12px}.gallows.art-ready{height:auto}.gallows.art-ready .frame{display:none}.gallows.art-ready #pendu-art{display:block}.gallows.art-ready[data-errors="0"] #pendu-art{visibility:hidden}</style><style>.gallows{height:auto!important}#pendu-art{display:block!important;aspect-ratio:1;background-image:url('assets/pendu-zoum.webp?v=4')!important}.gallows[data-errors="0"] #pendu-art{visibility:hidden}</style><style>#victory-art{display:none;width:100%;aspect-ratio:1;background:url('assets/pendu-victoire-1.webp') 0 0/300% 200%;border-radius:12px}.gallows.won #pendu-art{display:none!important}.gallows.won #victory-art{display:block;animation:celebrate 1.8s step-end infinite}@keyframes celebrate{0%{background-position:0 0}16.66%{background-position:50% 0}33.33%{background-position:100% 0}50%{background-position:0 100%}66.66%{background-position:50% 100%}83.33%{background-position:100% 100%}}.gallows.won{animation:none}</style><style>.gallows.won #victory-art{background:none;position:relative;overflow:hidden;animation:none}.gallows.won #victory-art:before{content:"";position:absolute;inset:8%;background:url('assets/zouku-loups/03_royal.webp') center/contain no-repeat;animation:jump .8s ease infinite}.gallows.won #victory-art:after{content:"✦  ★  ✧  ★  ✦";position:absolute;inset:0;color:#ffe15c;font-size:2rem;letter-spacing:5px;text-shadow:0 0 12px #00eaff;animation:spark 1.2s ease infinite}@keyframes spark{0%{transform:translateY(15%);opacity:.2}50%{opacity:1}100%{transform:translateY(65%);opacity:0}}.gallows.won.victory-ready #victory-art{background:url('assets/pendu-victoire-1.webp?v=7') 0 0/300% 200%;animation:celebrate 1.8s step-end infinite}.gallows.victory-ready #victory-art:before,.gallows.victory-ready #victory-art:after{display:none}</style></head><body><main><a href="jeux.html">← Jeux</a><h1>ZOUM · LE PENDU NÉON</h1><p>Découvre le mot caché avant de perdre les huit pattes de vie de Zoum. Les accents sont acceptés comme leur lettre de base.</p><div class="panel"><div class="controls"><label>Thème <select id="theme"><option value="all">Tous les thèmes</option><option value="histoire">Histoire</option><option value="sciences">Sciences</option><option value="geo">Géographie</option><option value="francais">Français</option></select></label><button id="new">Nouveau mot</button></div><p id="category"></p><div class="stage"><div class="gallows"><div id="victory-art" role="img" aria-label="Zoum fête ta victoire"></div><div id="pendu-art" role="img" aria-label="Étape du pendu"></div></div><div id="lives" class="lives" aria-label="Vies restantes"></div></div><div class="word" id="word"></div><div class="keyboard" id="keyboard"></div><p class="status" id="status" role="status"></p></div></main><script>
const dictionary={histoire:['REVOLUTION','EMPIRE','REPUBLIQUE','NAPOLEON','CHARLEMAGNE','RENAISSANCE','MONARCHIE','RESISTANCE'],sciences:['EVAPORATION','GRAVITATION','VOLCAN','ECOSYSTEME','PHOTOSYNTHESE','ENERGIE','PLANETE','CELLULE'],geo:['CONTINENT','OCEAN','EQUATEUR','HEMISPHERE','LATITUDE','MONTAGNE','FRONTIERE','PENINSULE'],francais:['ADJECTIF','CONJUGAISON','SYNTAXE','PRONOM','INFINITIF','HOMOPHONE','SUJET','PREDICAT']};let answer='',used=new Set(),mistakes=0,finished=false;
function newGame(){let themes=Object.keys(dictionary),theme=document.getElementById('theme').value;if(theme==='all')theme=themes[Math.floor(Math.random()*themes.length)];let choices=dictionary[theme].filter(w=>w!==answer);answer=choices[Math.floor(Math.random()*choices.length)]||dictionary[theme][0];used=new Set();mistakes=0;finished=false;document.querySelector('.gallows').classList.remove('win','miss','won');document.getElementById('category').textContent='Thème : '+({histoire:'Histoire',sciences:'Sciences',geo:'Géographie',francais:'Français'}[theme]);document.getElementById('status').textContent='8 erreurs maximum. Bonne recherche !';render()}
function guess(c){if(finished||used.has(c))return;used.add(c);if(!answer.includes(c)){mistakes++;const z=document.querySelector('.gallows');z.classList.remove('miss','win');void z.offsetWidth;z.classList.add('miss');}if([...answer].every(c=>used.has(c))){finished=true;document.querySelector('.gallows').classList.add('win');document.getElementById('status').textContent='🏆 Bravo ! Le mot était '+answer+'.'}else if(mistakes>=8){finished=true;document.getElementById('status').textContent='Partie terminée. Le mot était '+answer+'.'}else document.getElementById('status').textContent='Erreurs : '+mistakes+' / 8';render()}
function render(){document.getElementById('word').innerHTML=[...answer].map(c=>'<span class="letter '+(used.has(c)?'found':'')+'">'+(used.has(c)||finished?c:'')+'</span>').join('');let keyboard=document.getElementById('keyboard');keyboard.replaceChildren();for(const c of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'){let b=document.createElement('button');b.textContent=c;b.disabled=used.has(c)||finished;if(used.has(c))b.className=answer.includes(c)?'good':'bad';b.onclick=()=>guess(c);keyboard.append(b)}const stage=document.querySelector('.gallows');stage.dataset.errors=mistakes;const index=Math.max(0,mistakes-1);document.getElementById('pendu-art').style.backgroundPosition=(index%4*100/3)+'% '+(index>=4?100:0)+'%';stage.classList.toggle('won',finished&&mistakes<8);stage.querySelectorAll('[data-step]').forEach(p=>p.style.visibility=Number(p.dataset.step)<=mistakes?'visible':'hidden');document.getElementById('lives').innerHTML=Array.from({length:8},(_,i)=>'<span aria-hidden="true" class="paw '+(i>=8-mistakes?'lost':'')+'">🐾</span>').join('');document.getElementById('lives').setAttribute('aria-label',(8-mistakes)+' vies restantes')}
document.getElementById('new').onclick=newGame;document.getElementById('theme').onchange=newGame;document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;let c=e.key.toUpperCase();if(/^[A-Z]$/.test(c))guess(c)});newGame();const art=new Image();art.onload=()=>document.querySelector('.gallows').classList.add('art-ready');art.src='assets/pendu-zoum.webp?v=2';
const victoryImage=new Image();victoryImage.onload=()=>document.querySelector('.gallows').classList.add('victory-ready');victoryImage.src='assets/pendu-victoire-1.webp?v=7';</script><script src="site-tracking.js" defer></script></body></html>
