<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="zoumai.css"><link rel="stylesheet" href="zoumai-brand.css"><style>body{margin:0;background:#f5f0e5;font-family:Arial;color:#101114}.wrap{width:min(920px,94vw);margin:auto;padding:24px 0 70px}.top{display:flex;justify-content:space-between;border-bottom:3px solid #111;padding:12px}.top a{color:#111;font-weight:900;text-decoration:none}.card{background:#fff;border:3px solid #111;border-radius:24px;padding:24px;box-shadow:7px 7px 0 #111;text-align:center}h1{font-size:clamp(2rem,6vw,3.6rem)}.btn,button{border:3px solid #111;border-radius:13px;padding:11px 16px;margin:6px;background:#f2d31c;font-weight:900;cursor:pointer;font-size:1rem}.white{background:#fff}.big{font-size:clamp(2rem,8vw,4rem);font-weight:900;margin:22px}.feedback{min-height:50px;font-weight:800;margin:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.box{border:2px solid #111;border-radius:14px;padding:14px;background:#fafafa}input,textarea,select{font:inherit;padding:10px;border:2px solid #111;border-radius:10px;max-width:90%}</style></head><body><div class="wrap"><div class="top"><strong>ZOU MAÏ · RASED</strong><a href="cp-experimentation.html">← Espace RASED</a></div><h1>👂 Manipulations phonologiques</h1><div class="card"><div class="grid"><button onclick="mode='fusion';next()">Fusionner</button><button onclick="mode='retire';next()">Retirer</button><button onclick="mode='change';next()">Remplacer</button><button onclick="mode='position';next()">Localiser</button></div><div class="big" id="q">Choisis une manipulation.</div><div id="answers"></div><div class="feedback" id="fb"></div></div><script>let mode="",n=0;const ex={fusion:[["CH + A","CHAT"],["L + OU","LOU"],["M + OU","MOU"]],retire:[["CHAT sans CH","A"],["LOUP sans L","OU"],["ROI sans R","OI"]],change:[["RAT : remplace R par CH","CHAT"],["MOU : remplace M par L","LOU"],["LOU : remplace L par R","ROU"]],position:[["Où entends-tu OU dans LOUP ?","MILIEU"],["Où entends-tu CH dans CHAT ?","DÉBUT"],["Où entends-tu ON dans MOUTON ?","FIN"]]};function next(){let e=ex[mode][n++%3];q.textContent=e[0];let opts=[e[1],"DÉBUT","MILIEU","FIN","CHAT","LOU","OU","A"].filter((x,i,a)=>a.indexOf(x)==i).slice(0,4);if(!opts.includes(e[1]))opts[0]=e[1];opts.sort(()=>Math.random()-.5);answers.innerHTML=opts.map(x=>'<button class="white" onclick="check(this.textContent,\''+e[1]+'\')">'+x+'</button>').join("")}function check(a,b){fb.textContent=a===b?"✓ Oui. Manipulation réussie.":"Réessaie en prononçant lentement.";if(a===b)setTimeout(next,700)}</script></div><script src="site-tracking.js" defer></script></body></html>
