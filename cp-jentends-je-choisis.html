<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>J'entends, je choisis | Zou Maï</title><link rel="stylesheet" href="zoumai.css"><link rel="stylesheet" href="zoumai-brand.css"><style>
body{margin:0;background:#f5f0e5;font-family:Arial;color:#111}.wrap{width:min(900px,94vw);margin:auto;padding:25px 0 70px}.top{display:flex;justify-content:space-between;border-bottom:3px solid #111;padding-bottom:15px}.top a{color:#111;font-weight:900;text-decoration:none}h1{text-align:center;font-size:clamp(2.2rem,6vw,4rem);margin:28px 0 4px}.sub{text-align:center}.levels{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:20px}.lv{border:2px solid #111;border-radius:999px;background:#fff;padding:9px 13px;font-weight:900;cursor:pointer}.lv.on{background:#f2d31c}.card{background:#fff;border:3px solid #111;border-radius:25px;padding:28px;text-align:center;box-shadow:7px 7px 0 #111}.speaker{font-size:4rem;border:3px solid #111;border-radius:50%;width:100px;height:100px;background:#f2d31c;cursor:pointer}.prompt{font-size:1.2rem;font-weight:800;margin:15px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:600px;margin:20px auto}.choice{min-height:80px;border:3px solid #111;border-radius:18px;background:#fff;font-size:1.65rem;font-weight:900;cursor:pointer}.choice:hover{background:#edf5ff}.feedback{min-height:65px;font-size:1.15rem;font-weight:900}.ok{background:#ddf4df;padding:12px;border-radius:12px}.no{background:#ffe1dd;padding:12px;border-radius:12px}.score{font-weight:900;margin:12px}.pic{font-size:5rem}.sequence{font-size:1.5rem;font-weight:900;min-height:40px}.close{margin-top:18px;border-top:2px dashed #aaa;padding-top:15px}.toggle{border:2px solid #111;border-radius:12px;padding:9px;background:#fff;font-weight:800;cursor:pointer}@media(max-width:520px){.choices{grid-template-columns:1fr}.choice{min-height:65px}}</style></head><body><a class="zm-corner-logo" href="index.html"><img src="images/logo-zou-mai-sensei.png" alt="Zou Maï"></a><div class="wrap"><div class="top"><strong>ZOU MAÏ · CP</strong><a href="cp-experimentation.html">← Expérimentation CP</a></div><h1>🎧 J'entends, je choisis</h1><p class="sub">J'écoute attentivement puis je retrouve ce que j'ai entendu.</p><div class="levels" id="levels"></div><div class="card"><div class="score" id="score"></div><div class="pic" id="pic"></div><button class="speaker" id="speaker" aria-label="Écouter">🔊</button><div class="prompt" id="prompt"></div><div class="sequence" id="sequence"></div><div class="choices" id="choices"></div><div class="feedback" id="feedback"></div><div class="close"><button class="toggle" id="closeMode">🎯 Sons proches : NON</button></div></div></div><script>
const levels=["Son → lettres","Syllabe","Syllabe complexe","Mot en morceaux","Mot entier"];
const data=[
[{say:"ou",voice:"ou",a:"OU",c:["OU","ON","OI","AU"]},{say:"oi",voice:"oua",a:"OI",c:["OI","OU","ON","AI"]},{say:"on",voice:"on",a:"ON",c:["ON","OU","AN","IN"]},{say:"ch",voice:"che",a:"CH",c:["CH","J","F","S"]},{say:"in",voice:"in",a:"IN",c:["IN","AN","ON","UN"]},{say:"an",voice:"an",a:"AN",c:["AN","ON","IN","OU"]}],
[{say:"cha",a:"CHA",c:["CHA","JA","CHO","CHOU"]},{say:"lou",a:"LOU",c:["LOU","LON","LOI","LAU"]},{say:"roi",a:"ROI",c:["ROI","ROU","RON","RAI"]},{say:"pin",a:"PIN",c:["PIN","PAN","PON","PAIN"]},{say:"chon",a:"CHON",c:["CHON","CHOU","CHAN","CHIN"]}],
[{say:"trou",a:"TROU",c:["TROU","TOUR","TRON","DROU"]},{say:"brin",a:"BRIN",c:["BRIN","BRAIN","BRAN","PRIN"]},{say:"froi",a:"FROI",c:["FROI","FROU","VROI","FRON"]},{say:"plon",a:"PLON",c:["PLON","PLOU","PLAN","BLON"]},{say:"vran",a:"VRAN",c:["VRAN","VRON","FRAN","VRAIN"]}],
[{say:"mouton",parts:["MOU","TON"],pool:["MOU","MON","TON","TOU"]},{say:"chaton",parts:["CHA","TON"],pool:["CHA","JA","TON","TOU"]},{say:"lapin",parts:["LA","PIN"],pool:["LA","LE","PIN","PAIN"]},{say:"poisson",parts:["POI","SSON"],pool:["POI","POU","SSON","SON"]}],
[{say:"mouton",pic:"🐑",a:"MOUTON",c:["MOUTON","MOUCON","MOUTOU","MONTON"]},{say:"poisson",pic:"🐟",a:"POISSON",c:["POISSON","POISON","POUSSON","POISSONS"]},{say:"lapin",pic:"🐇",a:"LAPIN",c:["LAPIN","LAPAIN","LAPON","RAPIN"]},{say:"chapeau",pic:"🎩",a:"CHAPEAU",c:["CHAPEAU","CHAPO","JAPEAU","CHAPAU"]}]
];
const closePairs=[{say:"pa",a:"PA",c:["PA","BA","TA","DA"]},{say:"ba",a:"BA",c:["BA","PA","DA","TA"]},{say:"fa",a:"FA",c:["FA","VA","SA","CHA"]},{say:"va",a:"VA",c:["VA","FA","BA","JA"]},{say:"cha",a:"CHA",c:["CHA","JA","SA","FA"]},{say:"ga",a:"GA",c:["GA","KA","DA","BA"]}];
let level=0,index=0,good=0,total=0,close=false,selected=[];
function speak(t){if("speechSynthesis"in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";u.rate=.65;speechSynthesis.speak(u)}}
function renderLevels(){levelsEl.innerHTML="";levels.forEach((x,i)=>{let b=document.createElement("button");b.className="lv "+(level===i?"on":"");b.textContent=(i+1)+". "+x;b.onclick=()=>{level=i;index=0;selected=[];render();renderLevels()};levelsEl.appendChild(b)})}
const levelsEl=document.getElementById("levels");
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function next(){index++;selected=[];setTimeout(render,750)}
function answer(ok,correct){total++;if(ok){good++;feedback.innerHTML='<div class="ok">✓ Oui ! Bien écouté.</div>';score.textContent=good+" réussites sur "+total;next()}else{feedback.innerHTML='<div class="no">Écoute encore. Compare bien les étiquettes.</div>';score.textContent=good+" réussites sur "+total;speak(correct)}}
function render(){feedback.innerHTML="";sequence.textContent="";pic.textContent="";choices.innerHTML="";score.textContent=good+" réussites sur "+total;let o=(close&&level===1?closePairs:data[level])[index%(close&&level===1?closePairs.length:data[level].length)];speaker.onclick=()=>speak(o.voice||o.say);
if(level===0||level===1||level===2){prompt.textContent="Quelle étiquette correspond à ce que tu entends ?";shuffle(o.c).forEach(x=>addChoice(x,()=>answer(x===o.a,o.say)))}
if(level===3){prompt.textContent="Retrouve les morceaux du mot, dans l'ordre.";shuffle(o.pool).forEach(x=>addChoice(x,()=>{if(selected.length>=o.parts.length)return;selected.push(x);sequence.textContent=selected.join(" + ");if(selected.length===o.parts.length){let ok=selected.every((v,i)=>v===o.parts[i]);if(ok)answer(true,o.say);else{total++;feedback.innerHTML='<div class="no">Ces morceaux ne forment pas le mot entendu. Réécoute.</div>';score.textContent=good+" réussites sur "+total;selected=[];sequence.textContent="";speak(o.say)}}}))}
if(level===4){pic.textContent=o.pic;prompt.textContent="Quel mot est écrit correctement ?";shuffle(o.c).forEach(x=>addChoice(x,()=>answer(x===o.a,o.say)))}
setTimeout(()=>speak(o.voice||o.say),250)}
function addChoice(x,fn){let b=document.createElement("button");b.className="choice";b.textContent=x;b.onclick=fn;choices.appendChild(b)}
closeMode.onclick=()=>{close=!close;closeMode.textContent="🎯 Sons proches : "+(close?"OUI":"NON");level=1;index=0;selected=[];renderLevels();render()};
renderLevels();render();
</script><script src="site-tracking.js" defer></script></body></html>
