<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sudoku · Zou Maï</title><link rel="stylesheet" href="zoumai.css"><link rel="stylesheet" href="zoumai-brand.css"><style>
*{box-sizing:border-box}body{margin:0;background:#10151f;color:#f7f4e9;font-family:Arial,sans-serif}main{max-width:850px;margin:auto;padding:22px 14px 65px}a{color:#ffda52;font-weight:800}h1{font-size:clamp(2.5rem,7vw,4rem);margin:20px 0 6px}.intro{color:#cad8e6;line-height:1.5}.panel{background:#1c293a;border:2px solid #405773;border-radius:22px;padding:clamp(12px,3vw,24px)}.row,.actions,.pad{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin:14px 0}.row{align-items:center;justify-content:space-between}.pill{background:#334963;border-radius:12px;padding:9px 13px;font-weight:800}button{font:inherit;cursor:pointer}.action,.digit{border:2px solid #5c718b;border-radius:10px;background:#344b68;color:#fff;font-weight:900;padding:11px 14px}.action.primary,.digit.active{background:#ffdc59;color:#161b23;border-color:#ffdc59}.board{display:grid;grid-template-columns:repeat(9,1fr);width:min(100%,510px);aspect-ratio:1;margin:16px auto;border:3px solid #10151f;background:#10151f;gap:1px}.cell{min-width:0;border:0;background:#f0f5fc;color:#1d2a3b;font-size:clamp(1rem,4vw,1.8rem);font-weight:800;padding:0}.cell.fixed{background:#d9e4f2;color:#183957}.cell.selected{background:#ffe1a0}.cell.peer{background:#e3edfa}.cell.conflict{background:#ffc4ca;color:#9b1625}.cell.good{color:#13865b}.cell:nth-child(3n){border-right:2px solid #3b4e69}.cell:nth-child(9n){border-right:0}.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:3px solid #3b4e69}.digit{min-width:42px;font-size:1.15rem}.feedback{text-align:center;min-height:52px;font-weight:800;padding:12px}.note{font-size:.85rem;color:#cbd8e6;text-align:center}.toggle{display:flex;gap:7px;align-items:center;font-weight:700}@media(max-width:480px){.digit{min-width:34px;padding:8px}.action{padding:9px;font-size:.86rem}}</style></head><body><main><a href="jeux.html">← Retour aux jeux</a><h1>🔢 SUDOKU</h1><p class="intro">Remplis chaque ligne, chaque colonne et chaque carré sans répéter un chiffre. Choisis ton niveau et entraîne ta logique !</p><section class="panel"><div class="row"><label>Difficulté <select id="difficulty" class="action"><option value="easy">Débutant</option><option value="medium">Confirmé</option><option value="hard">Expert</option></select></label><span class="pill" id="clock">⏱ 00:00</span><span class="pill" id="mistakes">Erreurs : 0</span></div><div class="board" id="board" role="grid" aria-label="Grille Sudoku"></div><div class="pad" id="pad"></div><div class="actions"><button class="action" id="erase">⌫ Effacer</button><button class="action" id="notes">✎ Notes : non</button><button class="action" id="hint">💡 Indice</button><button class="action primary" id="check">✓ Vérifier</button><button class="action primary" id="new">↻ Nouvelle grille</button></div><p class="note">Clique sur une case puis sur un chiffre, ou utilise ton clavier. Les notes sont de petits chiffres provisoires.</p><div class="feedback" id="feedback" role="status" aria-live="polite"></div></section></main><script>
'use strict';
const board=document.getElementById('board'),pad=document.getElementById('pad'),feedback=document.getElementById('feedback');let solution=[],grid=[],fixed=[],notes=[],selected=-1,noteMode=false,errors=0,started=Date.now(),complete=false;
function shuffled(a){return a.slice().sort(()=>Math.random()-.5)}
function generateSolution(){let a=Array(81).fill(0);function valid(i,n){let r=Math.floor(i/9),c=i%9;for(let k=0;k<9;k++)if(a[r*9+k]===n||a[k*9+c]===n)return false;let br=Math.floor(r/3)*3,bc=Math.floor(c/3)*3;for(let y=0;y<3;y++)for(let x=0;x<3;x++)if(a[(br+y)*9+bc+x]===n)return false;return true}function fill(i){if(i===81)return true;for(const n of shuffled([1,2,3,4,5,6,7,8,9]))if(valid(i,n)){a[i]=n;if(fill(i+1))return true;a[i]=0}return false}fill(0);return a}
function countSolutions(a,limit=2){let count=0;function solve(){if(count>=limit)return;let best=-1,opts=[];for(let i=0;i<81;i++)if(!a[i]){let possible=[];for(let n=1;n<=9;n++)if(valid(i,n))possible.push(n);if(!possible.length)return;if(best<0||possible.length<opts.length){best=i;opts=possible;if(opts.length===1)break}}if(best<0){count++;return}for(const n of opts){a[best]=n;solve();a[best]=0;if(count>=limit)return}}function valid(i,n){let r=i/9|0,c=i%9;for(let k=0;k<9;k++)if(a[r*9+k]===n||a[k*9+c]===n)return false;let br=(r/3|0)*3,bc=(c/3|0)*3;for(let y=0;y<3;y++)for(let x=0;x<3;x++)if(a[(br+y)*9+bc+x]===n)return false;return true}solve();return count}
function newGame(){solution=generateSolution();let puzzle=solution.slice(),difficulty=document.getElementById('difficulty').value,target={easy:36,medium:46,hard:53}[difficulty],removed=0;for(const i of shuffled(Array.from({length:81},(_,i)=>i))){if(removed>=target)break;let previous=puzzle[i];puzzle[i]=0;if(countSolutions(puzzle.slice())!==1)puzzle[i]=previous;else removed++}grid=puzzle;fixed=puzzle.map(Boolean);notes=Array.from({length:81},()=>new Set());selected=-1;noteMode=false;errors=0;complete=false;started=Date.now();feedback.textContent='Nouvelle grille ! À toi de jouer.';render()}
function conflicts(i){let n=grid[i];if(!n)return false;let r=i/9|0,c=i%9;for(let j=0;j<81;j++)if(j!==i&&grid[j]===n){let rr=j/9|0,cc=j%9;if(rr===r||cc===c||(rr/3|0)===(r/3|0)&&(cc/3|0)===(c/3|0))return true}return false}
function render(){board.replaceChildren();for(let i=0;i<81;i++){let b=document.createElement('button');b.type='button';b.className='cell';if(fixed[i])b.classList.add('fixed');if(selected===i)b.classList.add('selected');else if(selected>=0&&((i/9|0)===(selected/9|0)||i%9===selected%9))b.classList.add('peer');if(conflicts(i))b.classList.add('conflict');b.setAttribute('role','gridcell');b.setAttribute('aria-label','Ligne '+((i/9|0)+1)+', colonne '+(i%9+1)+(grid[i]?', '+grid[i]:', vide'));if(grid[i])b.textContent=grid[i];else if(notes[i].size){b.style.fontSize='.65rem';b.textContent=[...notes[i]].sort().join(' ')}b.onclick=()=>{selected=i;render()};board.append(b)}pad.replaceChildren();for(let n=1;n<=9;n++){let b=document.createElement('button');b.className='digit';b.textContent=n;b.onclick=()=>put(n);pad.append(b)}document.getElementById('mistakes').textContent='Erreurs : '+errors;document.getElementById('notes').textContent='✎ Notes : '+(noteMode?'oui':'non')}
function put(n){if(selected<0||fixed[selected]||complete)return;if(noteMode&&n){notes[selected].has(n)?notes[selected].delete(n):notes[selected].add(n)}else{grid[selected]=n;notes[selected].clear();if(n&&n!==solution[selected])errors++;}feedback.textContent='';if(grid.every((v,i)=>v===solution[i])){complete=true;feedback.textContent='🏆 Bravo ! Sudoku terminé sans aucune case manquante !'}render()}
document.getElementById('erase').onclick=()=>put(0);document.getElementById('notes').onclick=()=>{noteMode=!noteMode;render()};document.getElementById('hint').onclick=()=>{if(complete)return;let options=grid.map((v,i)=>!fixed[i]&&v!==solution[i]?i:-1).filter(i=>i>=0);if(!options.length)return;let i=selected>=0&&options.includes(selected)?selected:options[0];grid[i]=solution[i];notes[i].clear();feedback.textContent='Indice : une case a été complétée.';render()};document.getElementById('check').onclick=()=>{let wrong=grid.filter((v,i)=>v&&v!==solution[i]).length,empty=grid.filter(v=>!v).length;feedback.textContent=wrong?wrong+' chiffre(s) incorrect(s).':empty?'Aucune erreur ! Il reste '+empty+' cases.':'Bravo ! Grille réussie !';if(!wrong&&!empty)complete=true;render()};document.getElementById('new').onclick=newGame;document.getElementById('difficulty').onchange=newGame;document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(/^[1-9]$/.test(e.key))put(Number(e.key));if(e.key==='Backspace'||e.key==='Delete')put(0);if(selected>=0&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();let r=selected/9|0,c=selected%9;if(e.key==='ArrowUp')r=Math.max(0,r-1);if(e.key==='ArrowDown')r=Math.min(8,r+1);if(e.key==='ArrowLeft')c=Math.max(0,c-1);if(e.key==='ArrowRight')c=Math.min(8,c+1);selected=r*9+c;render()}});setInterval(()=>{if(complete)return;let s=Math.floor((Date.now()-started)/1000);document.getElementById('clock').textContent='⏱ '+String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000);newGame();
</script><script src="site-tracking.js" defer></script></body></html>
