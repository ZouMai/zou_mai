<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laboratoire des sons | Zou Maï</title><link rel="stylesheet" href="zoumai.css"><link rel="stylesheet" href="zoumai-brand.css"><style>
body{margin:0;background:#f5f0e5;font-family:Arial;color:#111}.wrap{width:min(980px,94vw);margin:auto;padding:25px 0 70px}.top{display:flex;justify-content:space-between;border-bottom:3px solid #111;padding-bottom:15px}.top a{color:#111;font-weight:900;text-decoration:none}h1{text-align:center;font-size:clamp(2.2rem,6vw,4.2rem);margin:28px 0 5px}.sub{text-align:center;font-size:1.08rem}.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:25px 0}.game{border:3px solid #111;border-radius:20px;background:#fff;padding:18px;box-shadow:5px 5px 0 #111;cursor:pointer;text-align:left}.game.on{background:#f2d31c}.game b{display:block;font-size:1.15rem;margin:5px 0}.lab{background:#fff;border:3px solid #111;border-radius:25px;padding:25px;text-align:center;box-shadow:7px 7px 0 #111;min-height:380px}.pic{font-size:6rem}.big{font-size:2rem;font-weight:900;letter-spacing:2px}.btn,.tile{border:3px solid #111;border-radius:13px;padding:11px 16px;margin:6px;background:#fff;font-size:1.15rem;font-weight:900;cursor:pointer}.btn.main{background:#f2d31c}.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:15px}.slot{display:inline-block;border:3px dashed #777;border-radius:12px;min-width:55px;padding:12px;margin:5px;font-size:1.4rem;font-weight:900}.feedback{min-height:55px;font-size:1.15rem;font-weight:800;margin:12px}.ok{background:#ddf4df;padding:11px;border-radius:12px}.no{background:#ffe1dd;padding:11px;border-radius:12px}@media(max-width:700px){.menu{grid-template-columns:1fr 1fr}.pic{font-size:4.8rem}}@media(max-width:440px){.menu{grid-template-columns:1fr}}</style></head><body><a class="zm-corner-logo" href="index.html"><img src="images/logo-zou-mai-sensei.png" alt="Zou Maï"></a><div class="wrap"><div class="top"><strong>ZOU MAÏ · CP</strong><a href="cp-experimentation.html">← Expérimentation CP</a></div><h1>🔬 Laboratoire des sons</h1><p class="sub">Ici, on démonte les mots, on déplace les sons et on en fabrique de nouveaux.</p><div class="menu" id="menu"></div><div class="lab"><h2 id="title"></h2><div id="work"></div><div class="feedback" id="feedback"></div></div></div><script>
const games=[["🔄","Le mot qui se transforme","Change un morceau."],["👽","L'extraterrestre","Répare ses mots."],["🚂","La machine à fusionner","Assemble les syllabes."],["🎧","Où est le son ?","Début, milieu ou fin ?"],["🥷","Le ninja des sons","Attrape le bon son."],["🧪","La machine à mots","Fabrique et lis."]];
let game=0,idx=0,built=[];
const transforms=[{a:"rat",ap:"🐀",b:"chat",bp:"🐱",parts:["R","CH"],rest:"AT"},{a:"moule",ap:"🦪",b:"poule",bp:"🐔",parts:["M","P"],rest:"OULE"},{a:"roue",ap:"🛞",b:"rue",bp:"🛣️",parts:["OU","U"],pre:"R",rest:"E"}];
const aliens=[{bad:"pisson",good:"poisson",pic:"🐟",choices:["OI","I","OU"]},{bad:"chapo",good:"chapeau",pic:"🎩",choices:["EAU","O","AU"]},{bad:"moutou",good:"mouton",pic:"🐑",choices:["ON","OU","AN"]},{bad:"lapain",good:"lapin",pic:"🐇",choices:["IN","AIN","ON"]}];
const fuse=[{p:["CHA","TON"],w:"chaton",pic:"🐱"},{p:["MOU","TON"],w:"mouton",pic:"🐑"},{p:["BA","TEAU"],w:"bateau",pic:"⛵"},{p:["LA","PIN"],w:"lapin",pic:"🐇"},{p:["POI","SSON"],w:"poisson",pic:"🐟"}];
const locate=[{w:"chat",pic:"🐱",sound:"CH",pos:"début"},{w:"poire",pic:"🍐",sound:"OI",pos:"milieu"},{w:"mouton",pic:"🐑",sound:"ON",pos:"fin"},{w:"lapin",pic:"🐇",sound:"IN",pos:"fin"},{w:"poule",pic:"🐔",sound:"OU",pos:"milieu"}];
const ninja=[{sound:"CH",yes:["CHA","CHOU","CHE"],all:["CHA","FOU","CHOU","MA","CHE","RI"]},{sound:"OU",yes:["FOU","MOU","LOU"],all:["FOU","MA","MOU","RI","LOU","CHA"]},{sound:"OI",yes:["POI","ROI","VOI"],all:["POI","RA","ROI","LOU","VOI","MI"]}];
const dictionary={"CHOU":"🥬","LOUP":"🐺","ROI":"👑","RAT":"🐀","CHAT":"🐱","POULE":"🐔","MOU":"", "ROUE":"🛞"};
function speak(t){if("speechSynthesis"in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";u.rate=.75;speechSynthesis.speak(u)}}
function menuRender(){menu.innerHTML="";games.forEach((g,i)=>{let b=document.createElement("button");b.className="game "+(game===i?"on":"");b.innerHTML="<span style='font-size:2rem'>"+g[0]+"</span><b>"+g[1]+"</b><small>"+g[2]+"</small>";b.onclick=()=>{game=i;idx=0;render();menuRender()};menu.appendChild(b)})}
function buttons(vals,fn){return vals.map(v=>'<button class="tile" data-v="'+v+'">'+v+'</button>').join("")}
function bind(fn){document.querySelectorAll(".tile").forEach(b=>b.onclick=()=>fn(b.dataset.v,b))}
function good(msg){feedback.innerHTML='<div class="ok">'+msg+'</div>';setTimeout(()=>{idx++;render()},900)}
function bad(msg){feedback.innerHTML='<div class="no">'+msg+'</div>'}
function render(){feedback.innerHTML="";title.textContent=games[game][1];
if(game===0){let o=transforms[idx%transforms.length];work.innerHTML='<div class="pic">'+o.ap+' ➜ '+o.bp+'</div><p>Transforme <b>'+o.a.toUpperCase()+'</b> en <b>'+o.b.toUpperCase()+'</b>.</p><div class="big">'+(o.pre||"")+' ? '+o.rest+'</div><div class="tiles">'+buttons(o.parts,0)+'</div>';bind(v=>v===o.parts[1]?good("Oui ! "+o.b.toUpperCase()+" 🎉"):bad("Essaie l’autre morceau. Écoute : "+o.b)) }
if(game===1){let o=aliens[idx%aliens.length];work.innerHTML='<div class="pic">'+o.pic+' 👽</div><p>L’extraterrestre a écrit :</p><div class="big">'+o.bad.toUpperCase()+'</div><p>Quel morceau faut-il pour réparer le mot ?</p><div class="tiles">'+buttons(o.choices,0)+'</div><button class="btn main" id="hear">🔊 Écouter le vrai mot</button>';hear.onclick=()=>speak(o.good);bind(v=>o.good.toUpperCase().includes(v)&&!o.bad.toUpperCase().includes(v)?good("Réparé ! "+o.good.toUpperCase()):bad("Pas celui-là. Réécoute le mot."))}
if(game===2){let o=fuse[idx%fuse.length];let parts=[...o.p].sort(()=>Math.random()-.5);work.innerHTML='<div class="pic">'+o.pic+'</div><p>Remets les wagons dans l’ordre puis fusionne-les.</p><div id="built"></div><div class="tiles">'+buttons(parts,0)+'</div><button class="btn main" id="hear">🔊 Écouter</button>';built=[];hear.onclick=()=>speak(o.w);bind((v,b)=>{built.push(v);b.disabled=true;document.getElementById("built").innerHTML=built.map(x=>'<span class="slot">'+x+'</span>').join("");if(built.length===o.p.length){built.join("")===o.p.join("")?good("Fusionne : <span class='big'>"+o.w.toUpperCase()+"</span>"):setTimeout(()=>{bad("L’ordre n’est pas bon. Recommence.");render()},800)}})}
if(game===3){let o=locate[idx%locate.length];work.innerHTML='<div class="pic">'+o.pic+'</div><p>Dans <b>'+o.w.toUpperCase()+'</b>, où entends-tu <span class="big">/'+o.sound.toLowerCase()+'/</span> ?</p><button class="btn main" id="hear">🔊 Écouter</button><div class="tiles">'+buttons(["début","milieu","fin"],0)+'</div>';hear.onclick=()=>speak(o.w);bind(v=>v===o.pos?good("Oui ! Le son est au "+o.pos+"."):bad("Réécoute lentement."))}
if(game===4){let o=ninja[idx%ninja.length],hit=new Set();work.innerHTML='<p>🥷 Coupe toutes les syllabes où tu entends <span class="big">/'+o.sound.toLowerCase()+'/</span>.</p><div class="tiles">'+buttons(o.all.sort(()=>Math.random()-.5),0)+'</div>';bind((v,b)=>{speak(v.toLowerCase());if(o.yes.includes(v)){hit.add(v);b.style.opacity=".25";b.disabled=true;if(hit.size===o.yes.length)good("Ninja parfait ! Tous les /"+o.sound.toLowerCase()+"/ sont trouvés.")}else bad("Non : écoute "+v+".")})}
if(game===5){let tiles=["CH","OU","L","P","R","A","T","OI","M","F"];work.innerHTML='<p>Choisis des blocs. La machine essaiera de lire ce que tu fabriques.</p><div class="built" id="machine">…</div><div class="tiles">'+buttons(tiles,0)+'</div><button class="btn main" id="read">🔊 Lire ma création</button><button class="btn" id="clear">Effacer</button><div id="meaning"></div>';built=[];bind(v=>{built.push(v);machine.textContent=built.join("");let w=built.join("");meaning.innerHTML=dictionary[w]?'<div class="pic" style="font-size:3rem">'+dictionary[w]+'</div>':""});read.onclick=()=>{let w=built.join("").toLowerCase();if(!w)return; speak(w);feedback.innerHTML=dictionary[built.join("")]?'<div class="ok">Tu as fabriqué un vrai mot !</div>':'<div class="ok">La machine ne connaît peut-être pas ce mot, mais <strong>on peut essayer de le lire</strong> !</div>'};clear.onclick=()=>render()}
}
menuRender();render();</script><script src="site-tracking.js" defer></script></body></html>
