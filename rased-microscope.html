<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="zoumai.css"><link rel="stylesheet" href="zoumai-brand.css"><style>body{margin:0;background:#f5f0e5;font-family:Arial;color:#101114}.wrap{width:min(920px,94vw);margin:auto;padding:24px 0 70px}.top{display:flex;justify-content:space-between;border-bottom:3px solid #111;padding:12px}.top a{color:#111;font-weight:900;text-decoration:none}.card{background:#fff;border:3px solid #111;border-radius:24px;padding:24px;box-shadow:7px 7px 0 #111;text-align:center}h1{font-size:clamp(2rem,6vw,3.6rem)}.btn,button{border:3px solid #111;border-radius:13px;padding:11px 16px;margin:6px;background:#f2d31c;font-weight:900;cursor:pointer;font-size:1rem}.white{background:#fff}.big{font-size:clamp(2rem,8vw,4rem);font-weight:900;margin:22px}.feedback{min-height:50px;font-weight:800;margin:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.box{border:2px solid #111;border-radius:14px;padding:14px;background:#fafafa}input,textarea,select{font:inherit;padding:10px;border:2px solid #111;border-radius:10px;max-width:90%}</style></head><body><div class="wrap"><div class="top"><strong>ZOU MAÏ · RASED</strong><a href="cp-experimentation.html">← Espace RASED</a></div><h1>🔎 Microscope de lecture</h1><div class="card"><p>Observer précisément ce qui résiste : syllabes simples, complexes, mots et pseudo-mots.</p><select id="niv"><option value="0">Syllabes simples</option><option value="1">Syllabes complexes</option><option value="2">Mots</option><option value="3">Pseudo-mots</option></select><div class="big" id="item"></div><button onclick="mark('ok')">✓ Lu facilement</button><button class="white" onclick="mark('hes')">~ Hésitation</button><button class="white" onclick="mark('no')">✕ Erreur</button><div class="feedback" id="fb"></div><div id="score"></div></div><script>const d=[["la","mi","sou","cha","ron","fin"],["tra","vrou","plin","bran","froi","clou"],["chat","loup","poire","train","mouton","fleur"],["mipa","troumi","flanou","brapin","chouma","vralon"]];let i=0,s={ok:0,hes:0,no:0};function draw(){item.textContent=d[+niv.value][i%d[+niv.value].length]}niv.onchange=()=>{i=0;draw()};function mark(x){s[x]++;i++;fb.textContent=x==="ok"?"Lecture directe.":x==="hes"?"Hésitation notée.":"Erreur notée : faire verbaliser ce qui a gêné.";score.textContent="Direct : "+s.ok+" · Hésitations : "+s.hes+" · Erreurs : "+s.no;draw()}draw()</script></div><script src="site-tracking.js" defer></script></body></html>
