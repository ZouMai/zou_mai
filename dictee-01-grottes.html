}.audio{background:#167aa7}.feedback{min-height:45px;margin-top:15px;font-weight:900}.ok{color:#16813a}.bad{color:#c52a20}.choices{display:grid;gap:9px}.choices button{background:#fff;border:3px solid #111;padding:12px;text-align:left;font-weight:900}.words{display:flex;flex-wrap:wrap;gap:8px;margin-top:35px}.word{background:#fff;color:#111;padding:8px 10px;border-left:5px solid var(--j);font-weight:800}.word.g{border-color:var(--v)}.word.v{border-color:var(--vio)}@media(max-width:720px){.levels{grid-template-columns:1fr}.missions{grid-template-columns:1fr 1fr}}

<header class="hero">
<span class="tag">DICTÉE 1 · CM2</span>
<h1>LES GROTTES ORNÉES DU PALÉOLITHIQUE</h1>
<p>Cinq missions courtes pour observer, mémoriser, transformer et écrire.</p>
</header>
<main class="wrap">
<figure class="artwork">
<img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Cervids_painted_on_cave_wall_and_Caervids%2C_bovids_and_horses_Wellcome_M0010910.jpg?width=1200" alt="Animaux peints sur une paroi de la grotte de Lascaux">
<figcaption><b>Observe l’œuvre avant de commencer.</b><br>Quels animaux reconnais-tu ? Quelles couleurs et quelles formes les artistes du Paléolithique ont-ils utilisées ?<small>Peintures pariétales de Lascaux · Wellcome Collection / Wikimedia Commons.</small></figcaption>
</figure>
<section class="levels">
<button class="level yellow active" data-l="0">JAUNE<small>Mots essentiels</small>
</button>
<button class="level green" data-l="1">VERT<small>Jaune + intermédiaires</small>
</button>
<button class="level violet" data-l="2">VIOLET<small>Toute la liste</small>
</button>
</section>
<div class="bar">
<span class="pill" id="lev">Niveau jaune</span>
<span class="pill" id="score">0 réussite</span>
</div>
<section class="missions">
<button class="mission active" data-m="flash">👁️<b>Mot éclair</b>
<span>4 mots · observe puis écris</span>
</button>
<button class="mission" data-m="transform">🔄<b>Je transforme</b>
<span>4 pluriels, accords ou verbes</span>
</button>
<button class="mission" data-m="choice">🎯<b>Je choisis</b>
<span>5 orthographes à reconnaître</span>
</button>
<button class="mission" data-m="dictation">🎧<b>Mini-dictée</b>
<span>5, 7 ou 9 mots</span>
</button>
<button class="mission" data-m="reverse">↩️<b>Bonus à l’envers</b>
<span>De la dernière lettre à la première</span>
</button>
<button class="study-tab" id="study">📚<b>Revoir les mots</b>
<span>Consulter la liste du niveau</span>
</button>
</section>
<section class="game" id="game">
</section>
<div class="words" id="words" hidden>
</div>
</main>
<script>
const sets=[
["la Préhistoire","le temps","un homme","une femme","un artiste","une artiste","la grotte","la paroi","décorer","ancien","ancienne","depuis","dans","déjà","souvent"],
["une peinture","un an","un animal","des animaux","un cheval","des chevaux","le corps","une empreinte","le pas","la trace","le doigt","une main","représenter","âgé","âgée","aussi"],
["un enfant","un pays","le succès","la visite","une fois","s’abîmer","petit","petite","deux","afin que","plusieurs"]];
const trans=[[["Mets au pluriel : un homme","des hommes"],["Accorde au féminin : ancien","ancienne"],["Les artistes ___ la grotte. (décorer)","décorent"],["Nous ___ les parois. (décorer)","décorons"]],[["Mets au pluriel : un animal","des animaux"],["Mets au pluriel : un cheval","des chevaux"],["Accorde au féminin : âgé","âgée"],["Les peintures ___ des animaux. (représenter)","représentent"]],[["Mets au pluriel : un pays","des pays"],["Accorde au féminin : petit","petite"],["Les peintures ___ avec le temps. (s’abîmer)","s’abîment"],["La peinture ___. (s’abîmer à l’imparfait)","s’abîmait"]]];
let lvl=0,mode="flash",q=[],i=0,pts=0,answer="",seen="",timer;
const game=document.querySelector("#game"),norm=s=>s.toLowerCase().trim().replace(/[’']/g,"'").normalize("NFD").replace(/[\u0300-\u036f]/g,""),pool=()=>sets.slice(0,lvl+1).flat(),pick=(a,n)=>[...a].sort(()=>Math.random()-.5).slice(0,n);
function hard(w){let a=JSON.parse(localStorage.getItem("zm-d1")||"[]");if(!a.includes(w))a.push(w);localStorage.setItem("zm-d1",JSON.stringify(a))}
function speech(w){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(w.replace(/^(un|une|le|la|des) /i,""));u.lang="fr-FR";u.rate=.72;speechSynthesis.speak(u)}
function score(){document.querySelector("#score").textContent=pts+" réussite"+(pts>1?"s":"")}
function form(title,prompt,a,audio=false){answer=a;game.innerHTML=`<h2>${title}</h2>
<p class="prompt">${prompt}</p>${audio?'<button class="action audio" id="hear">🔊 ÉCOUTER</button>':""}<p class="hint">Écris puis valide.</p>
<input id="inp" autocomplete="off">
<button class="action" id="check">VALIDER</button>
<div class="feedback" id="feed">
</div>`;if(audio){document.querySelector("#hear").onclick=()=>speech(a);speech(a)}document.querySelector("#check").onclick=check;document.querySelector("#inp").onkeydown=e=>e.key==="Enter"&&check();document.querySelector("#inp").focus()}
function check(){let f=document.querySelector("#feed"),v=document.querySelector("#inp").value;if(norm(v)===norm(answer)){pts++;f.className="feedback ok";f.textContent="✓ Bravo !"}else{hard(answer);f.className="feedback bad";f.textContent="La réponse était : "+answer}score();setTimeout(next,900)}
function start(){clearTimeout(timer);i=pts=0;score();if(mode==="transform")q=pick(trans.slice(0,lvl+1).flat(),4);else q=pick(pool(),mode==="dictation"?(lvl===0?5:lvl===1?7:9):mode==="choice"?5:4);next()}
function next(){if(i>=q.length)return finish();if(mode==="flash"){let w=q[i++];game.innerHTML=`<h2>MOT ÉCLAIR · ${i}/${q.length}</h2>
<p class="prompt">${w}</p>
<p class="hint">Observe bien…</p>`;timer=setTimeout(()=>form("MOT ÉCLAIR · "+i+"/"+q.length,"Le mot a disparu.",w),1700)}else if(mode==="transform"){let x=q[i++];form("JE TRANSFORME · "+i+"/"+q.length,x[0],x[1])}else if(mode==="dictation"){let w=q[i++];form("MINI-DICTÉE · "+i+"/"+q.length,"Écoute le mot.",w,true)}else{let w=q[i++],bad=w.replace(/[éèêî]/i,"e");if(bad===w)bad=w.endsWith("s")?w.slice(0,-1):w+"s";let opts=[w,bad,w.replace(/s\b/,"")].filter((x,n,a)=>a.indexOf(x)===n).sort(()=>Math.random()-.5);answer=w;game.innerHTML=`<h2>JE CHOISIS · ${i}/${q.length}</h2>
<p class="prompt">Quelle est la bonne orthographe ?</p>
<div class="choices">${opts.map(x=>`<button>${x}</button>`).join("")}</div>`;document.querySelectorAll(".choices button").forEach(b=>b.onclick=()=>{if(norm(b.textContent)===norm(w))pts++;else hard(w);score();setTimeout(next,500)})}}
function finish(){game.innerHTML=`<h2>MISSION TERMINÉE</h2>
<p class="prompt">${pts} / ${q.length}</p>
<p>${pts===q.length?"Mission parfaite !":"Les erreurs sont conservées dans « Mes mots à revoir »."}</p>
<button class="action" id="again">REJOUER</button>`;document.querySelector("#again").onclick=start}
function words(){document.querySelector("#words").innerHTML=pool().map((w,n)=>`<span class="word ${n>=sets[0].length+(lvl>0?sets[1].length:0)?"v":n>=sets[0].length?"g":""}">${w}</span>`).join("")}
document.querySelectorAll(".level").forEach(b=>b.onclick=()=>{document.querySelectorAll(".level").forEach(x=>x.classList.remove("active"));b.classList.add("active");lvl=+b.dataset.l;document.querySelector("#lev").textContent="Niveau "+["jaune","vert","violet"][lvl];words();document.querySelector("#study").classList.contains("active")?showWords():start()});document.querySelectorAll(".mission").forEach(b=>b.onclick=()=>{document.querySelectorAll(".mission").forEach(x=>x.classList.remove("active"));document.querySelector("#study").classList.remove("active");b.classList.add("active");mode=b.dataset.m;start()});
function showWords(){clearTimeout(timer);document.querySelectorAll(".mission").forEach(x=>x.classList.remove("active"));document.querySelector("#study").classList.add("active");words();const difficult=JSON.parse(localStorage.getItem("zm-d1")||"[]");game.innerHTML=`<h2>REVOIR LES MOTS · ${["JAUNE","VERT","VIOLET"][lvl]}</h2><p class="hint">Lis et mémorise les mots. Ils disparaîtront dès que tu choisiras un exercice.</p><div class="words">${document.querySelector("#words").innerHTML}</div>${difficult.length?'<button class="action" id="hardPractice">RÉVISER MES ERREURS</button>':""}`;if(difficult.length)document.querySelector("#hardPractice").onclick=()=>{document.querySelector("#study").classList.remove("active");document.querySelectorAll(".mission").forEach(x=>x.classList.remove("active"));q=difficult;i=pts=0;mode="dictation";score();next()}}
document.querySelector("#study").onclick=showWords;words();start();
</script>
<script>
const nextInitial=next;
function motSeul(w){return w.replace(/^(un|une|le|la|les|des) /i,"").replace(/\s/g,"")}
function motInverse(w){return [...motSeul(w)].reverse().join("")}
next=function(){
  if(i>=q.length)return finish();
  if(mode==="reverse"){
    const w=q[i++],original=motSeul(w);
    answer=motInverse(w);
    game.innerHTML='<h2>BONUS À L’ENVERS · '+i+'/'+q.length+'</h2><p class="prompt">Écoute le mot, puis écris-le de la dernière lettre à la première.</p><button class="action audio" id="hear">🔊 ÉCOUTER LE MOT</button><p class="hint">Le mot ne sera pas affiché.</p><input id="inp" autocomplete="off"><button class="action" id="check">VALIDER</button><div class="feedback" id="feed"></div>';
    document.querySelector("#hear").onclick=()=>speech(original);
    document.querySelector("#check").onclick=check;
    document.querySelector("#inp").onkeydown=e=>e.key==="Enter"&&check();
    document.querySelector("#inp").focus();
    speech(original);
    return;
  }
  if(mode==="flash"){
    const w=q[i++];
    game.innerHTML='<h2>MOT ÉCLAIR · '+i+'/'+q.length+'</h2><p class="prompt">'+w+'</p><p class="hint">Observe bien le mot pendant quelques secondes…</p>';
    timer=setTimeout(()=>form("MOT ÉCLAIR · "+i+"/"+q.length,"Le mot a disparu.",w),3200);
    return;
  }
  return nextInitial();
}
</script>
</body>
