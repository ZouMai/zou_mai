<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="zoumai.css"><link rel="stylesheet" href="zoumai-brand.css"><style>body{margin:0;background:#f5f0e5;font-family:Arial;color:#101114}.wrap{width:min(920px,94vw);margin:auto;padding:24px 0 70px}.top{display:flex;justify-content:space-between;border-bottom:3px solid #111;padding:12px}.top a{color:#111;font-weight:900;text-decoration:none}.card{background:#fff;border:3px solid #111;border-radius:24px;padding:24px;box-shadow:7px 7px 0 #111;text-align:center}h1{font-size:clamp(2rem,6vw,3.6rem)}.btn,button{border:3px solid #111;border-radius:13px;padding:11px 16px;margin:6px;background:#f2d31c;font-weight:900;cursor:pointer;font-size:1rem}.white{background:#fff}.big{font-size:clamp(2rem,8vw,4rem);font-weight:900;margin:22px}.feedback{min-height:50px;font-weight:800;margin:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.box{border:2px solid #111;border-radius:14px;padding:14px;background:#fafafa}input,textarea,select{font:inherit;padding:10px;border:2px solid #111;border-radius:10px;max-width:90%}</style></head><body><div class="wrap"><div class="top"><strong>ZOU MAÏ · RASED</strong><a href="cp-experimentation.html">← Espace RASED</a></div><h1>🔢 Labo maths</h1><div class="card"><p>Manipuler avant de calculer.</p><div class="grid"><button onclick="game('decomp')">Décomposer</button><button onclick="game('ligne')">Ligne numérique</button><button onclick="game('compare')">Comparer</button><button onclick="game('strategie')">Stratégie de calcul</button></div><div class="big" id="q">Choisis un atelier.</div><div id="a"></div><div class="feedback" id="fb"></div></div><script>function game(m){if(m==="decomp"){q.textContent="37 = ? dizaines + ? unités";a.innerHTML='<button onclick="ok()">3 dizaines + 7 unités</button><button class="white" onclick="no()">7 dizaines + 3 unités</button>'}if(m==="ligne"){q.textContent="Quel nombre est entre 39 et 41 ?";a.innerHTML='<button onclick="ok()">40</button><button class="white" onclick="no()">42</button>'}if(m==="compare"){q.textContent="Quel est le plus grand ?";a.innerHTML='<button onclick="ok()">52</button><button class="white" onclick="no()">25</button>'}if(m==="strategie"){q.textContent="29 + 6 : quelle transformation peut aider ?";a.innerHTML='<button onclick="ok()">30 + 5</button><button class="white" onclick="no()">20 + 6</button>'}}function ok(){fb.textContent="✓ Oui. Demande maintenant : comment le sais-tu ?"}function no(){fb.textContent="Essaie avec du matériel ou une représentation."}</script></div><script src="site-tracking.js" defer></script></body></html>
