<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Labo maths RASED | Zou Maï</title><link rel="stylesheet" href="zoumai.css"><link rel="stylesheet" href="zoumai-brand.css"><style>
body{margin:0;background:#f5f0e5;font-family:Arial;color:#101114}.wrap{width:min(980px,94vw);margin:auto;padding:24px 0 70px}.top{display:flex;justify-content:space-between;border-bottom:3px solid #111;padding:12px}.top a{color:#111;font-weight:900;text-decoration:none}h1{font-size:clamp(2rem,6vw,3.6rem);margin-bottom:8px}.intro{font-size:1.1rem}.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin:22px 0}.menu button,.answer{border:3px solid #111;border-radius:14px;padding:13px;background:#f2d31c;font-weight:900;cursor:pointer;font-size:1rem}.card{background:#fff;border:3px solid #111;border-radius:24px;padding:24px;box-shadow:7px 7px 0 #111;text-align:center}.question{font-size:clamp(1.5rem,5vw,2.5rem);font-weight:1000;margin:8px 0 22px}.answers{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.answer{min-width:110px;background:#fff;font-size:1.35rem}.feedback{min-height:48px;font-size:1.1rem;font-weight:900;margin-top:18px}.visual{min-height:180px;display:flex;align-items:center;justify-content:center;gap:28px;flex-wrap:wrap;margin:10px auto 25px}.quantity{padding:12px;border:3px solid #111;border-radius:18px;min-width:210px}.blocks{display:flex;align-items:flex-end;justify-content:center;gap:5px;min-height:95px}.ten{width:18px;height:82px;border:2px solid #111;background:repeating-linear-gradient(to bottom,#f2d31c 0 7px,#111 7px 8px)}.one{width:18px;height:18px;border:2px solid #111;background:#fff}.units{display:flex;gap:4px;flex-wrap:wrap;max-width:120px}.label{font-size:1.4rem;font-weight:1000;margin-top:8px}.linewrap{width:min(760px,94%);padding:34px 5px 18px}.line{height:6px;background:#111;position:relative;display:flex;justify-content:space-between;align-items:center}.tick{width:3px;height:26px;background:#111;position:relative}.tick span{position:absolute;top:31px;left:50%;transform:translateX(-50%);font-weight:900}.tick.hidden span{color:#c92f28;font-size:1.4rem}.dot{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:24px;height:24px;border:3px solid #111;border-radius:50%;background:#f2d31c}.dots{display:grid;grid-template-columns:repeat(5,24px);gap:8px;justify-content:center}.counter{width:22px;height:22px;border:2px solid #111;border-radius:50%;background:#f2d31c}.arrow{font-size:3rem;font-weight:1000}.hint{margin:10px 0;font-weight:800;color:#555}@media(max-width:600px){.card{padding:16px}.quantity{min-width:145px}.ten{height:65px}.visual{gap:12px}.tick span{font-size:.8rem}}
</style></head><body><div class="wrap"><div class="top"><strong>ZOU MAÏ · RASED</strong><a href="cp-experimentation.html">← Espace RASED</a></div><h1>🔢 Labo maths</h1><p class="intro">Je regarde, je manipule, je dis ce que je vois, puis je réponds.</p><div class="menu"><button data-g="quantite">👀 Quantités</button><button data-g="decomp">🧱 Dizaines/unités</button><button data-g="avant">↔️ Avant / après</button><button data-g="ligne">📏 Ligne graduée</button><button data-g="compare">⚖️ Plus grand</button></div><div class="card"><div class="question" id="q">Choisis un atelier.</div><div class="visual" id="visual"></div><div class="hint" id="hint"></div><div class="answers" id="answers"></div><div class="feedback" id="fb"></div></div></div><script>
const q=document.getElementById('q'),v=document.getElementById('visual'),a=document.getElementById('answers'),fb=document.getElementById('fb'),hint=document.getElementById('hint');
document.querySelectorAll('[data-g]').forEach(b=>b.addEventListener('click',()=>game(b.dataset.g)));
function buttons(vals,good){a.innerHTML='';vals.forEach(x=>{let b=document.createElement('button');b.className='answer';b.textContent=x;b.onclick=()=>check(x==good,b);a.appendChild(b)})}
function check(ok,b){if(ok){fb.textContent='✓ Oui ! Explique comment tu l’as vu.';b.style.background='#bfe8bd'}else{fb.textContent='Regarde encore le dessin. Tu peux compter, grouper ou te repérer sur la ligne.';b.style.background='#ffd2cb'}}
function blocks(n,show=true){let d=Math.floor(n/10),u=n%10,s='<div class="blocks"><div style="display:flex;gap:4px">';for(let i=0;i<d;i++)s+='<span class="ten"></span>';s+='</div><div class="units">';for(let i=0;i<u;i++)s+='<span class="one"></span>';return s+'</div></div>'+(show?'<div class="label">'+n+'</div>':'')}
function numberLine(start,end,missing=null,marker=null){let s='<div class="linewrap"><div class="line">';for(let n=start;n<=end;n++){let hide=n===missing;s+='<span class="tick '+(hide?'hidden':'')+'">'+(marker===n?'<i class="dot"></i>':'')+'<span>'+(hide?'?':n)+'</span></span>'}return s+'</div></div>'}
function dots(n){let s='<div class="dots">';for(let i=0;i<n;i++)s+='<span class="counter"></span>';return s+'</div>'}
function reset(){fb.textContent='';hint.textContent='';a.innerHTML='';v.innerHTML=''}
function game(g){reset();
 if(g==='quantite'){q.textContent='Où y a-t-il le plus de jetons ?';v.innerHTML='<div class="quantity">'+dots(8)+'</div><div class="quantity">'+dots(13)+'</div>';hint.textContent='Tu peux les grouper par 5 ou faire des correspondances.';buttons(['À gauche','À droite'],'À droite')}
 if(g==='decomp'){q.textContent='Quel nombre est représenté ?';v.innerHTML='<div class="quantity">'+blocks(34,false)+'</div>';hint.textContent='Une grande barre = une dizaine. Un petit carré = une unité.';buttons([34,43,304],34)}
 if(g==='avant'){q.textContent='Quel nombre vient juste après 47 ?';v.innerHTML=numberLine(44,50,48,47);hint.textContent='Pars du point jaune et avance d’un seul trait.';buttons([46,48,57],48)}
 if(g==='ligne'){q.textContent='Quel nombre manque sur la ligne ?';v.innerHTML=numberLine(20,30,26);hint.textContent='Chaque petit trait fait avancer de 1.';buttons([25,26,27],26)}
 if(g==='compare'){q.textContent='Quel est le plus grand nombre ?';v.innerHTML='<div class="quantity">'+blocks(32)+'</div><div class="arrow">↔</div><div class="quantity">'+blocks(27)+'</div>';hint.textContent='Compare d’abord le nombre de dizaines.';buttons([32,27],32)}
}
</script><script src="site-tracking.js" defer></script></body></html>
