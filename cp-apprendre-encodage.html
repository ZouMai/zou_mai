<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>J'apprends à encoder | Zou Maï</title><link rel="stylesheet" href="zoumai.css"><link rel="stylesheet" href="zoumai-brand.css"><style>
body{margin:0;background:#f5f0e5;font-family:Arial;color:#101114}.wrap{width:min(900px,94vw);margin:auto;padding:25px 0 70px}.top{display:flex;justify-content:space-between;border-bottom:3px solid #111;padding-bottom:15px}.top a{color:#111;font-weight:900;text-decoration:none}h1{text-align:center;font-size:clamp(2.1rem,6vw,4rem);margin:28px 0 5px}.sub{text-align:center}.steps{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:22px}.step{width:42px;height:42px;border:2px solid #111;border-radius:50%;display:grid;place-items:center;font-weight:900;background:#fff}.step.on{background:#f2d31c}.step.done{background:#dff3df}.card{background:#fff;border:3px solid #111;border-radius:25px;padding:25px;text-align:center;box-shadow:7px 7px 0 #111}.pic{font-size:7rem}.word{font-size:2rem;font-weight:900;letter-spacing:3px}.btn{border:3px solid #111;border-radius:14px;padding:12px 18px;margin:7px;font-size:1.05rem;font-weight:900;background:#f2d31c;cursor:pointer}.choice{background:#fff;min-width:65px}.choice:hover,.tile:hover{background:#dceeff}.tiles{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:18px}.tile{border:3px solid #111;border-radius:12px;padding:12px 16px;background:#fff;font-size:1.4rem;font-weight:900;cursor:pointer}.built{min-height:58px;border:3px dashed #777;border-radius:14px;padding:10px;font-size:1.6rem;font-weight:900;margin:12px auto;max-width:480px}.answer{font-size:1.6rem;padding:12px;border:3px solid #111;border-radius:14px;text-align:center;width:min(380px,80%)}.feedback{min-height:55px;font-size:1.15rem;font-weight:800;margin:12px}.ok{background:#dff3df;border-radius:12px;padding:10px}.no{background:#ffe1dd;border-radius:12px;padding:10px}.phonemes{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:12px}.box{border:2px solid #111;padding:10px 14px;border-radius:10px;background:#f7f7f7;font-weight:900}@media(max-width:600px){.pic{font-size:5rem}}</style></head><body><a class="zm-corner-logo" href="index.html"><img src="images/logo-zou-mai-sensei.png" alt="Zou Maï"></a><div class="wrap"><div class="top"><strong>ZOU MAÏ · CP</strong><a href="cp-experimentation.html">← Expérimentation CP</a></div><h1>🧩 J'apprends à encoder</h1><p class="sub">Un mot, plusieurs étapes. J'écoute → je repère → je construis → je complète → j'écris seul.</p><div class="steps" id="steps"></div><div class="card"><div class="pic" id="pic"></div><h2 id="title"></h2><div id="work"></div><div class="feedback" id="feedback"></div></div></div>
<script>
const words=[
{w:"chat",p:"🐱",chunks:["CH","A","T"],target:"CH"},{w:"loup",p:"🐺",chunks:["L","OU","P"],target:"OU"},{w:"poule",p:"🐔",chunks:["P","OU","L","E"],target:"OU"},{w:"roi",p:"👑",chunks:["R","OI"],target:"OI"},{w:"poire",p:"🍐",chunks:["P","OI","R","E"],target:"OI"},{w:"mouton",p:"🐑",chunks:["M","OU","T","ON"],target:"ON"},{w:"ballon",p:"🎈",chunks:["B","A","LL","ON"],target:"ON"},{w:"lapin",p:"🐇",chunks:["L","A","P","IN"],target:"IN"},{w:"bateau",p:"⛵",chunks:["B","A","T","EAU"],target:"EAU"},{w:"chapeau",p:"🎩",chunks:["CH","A","P","EAU"],target:"EAU"},{w:"photo",p:"📷",chunks:["PH","O","T","O"],target:"PH"},{w:"agneau",p:"🐑",chunks:["A","GN","EAU"],target:"GN"}];
let wi=0,stage=0,built=[],attempt=0;const distract=["F","M","S","OU","OI","ON","AN","IN","CH","EAU","GN","PH","R","L"];
function speak(t=words[wi].w){if("speechSynthesis"in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";u.rate=.72;speechSynthesis.speak(u)}}
function progress(){steps.innerHTML="";for(let i=0;i<5;i++){let x=document.createElement("div");x.className="step "+(i<stage?"done":i===stage?"on":"");x.textContent=i+1;steps.appendChild(x)}}
function nextStage(){feedback.innerHTML="";stage++;attempt=0;if(stage>4){feedback.innerHTML='<div class="ok">🌟 Bravo ! Tu sais maintenant construire et écrire <strong>'+words[wi].w+'</strong>.</div>';setTimeout(()=>{wi=(wi+1)%words.length;stage=0;render()},1400)}else render()}
function render(){progress();let o=words[wi];pic.textContent=o.p;work.innerHTML="";feedback.innerHTML="";
if(stage===0){title.textContent="1. J'écoute le mot";work.innerHTML='<button class="btn" id="hear">🔊 Écouter le mot</button><p>Dis le mot lentement. Essaie d’entendre ses morceaux.</p><button class="btn" id="go">J’ai écouté →</button>';hear.onclick=()=>speak();go.onclick=nextStage;speak()}
if(stage===1){title.textContent="2. Je repère un son";work.innerHTML='<p>Écoute. Quel morceau entends-tu dans ce mot ?</p><button class="btn" id="hear">🔊 Réécouter</button><div id="choices"></div>';hear.onclick=()=>speak();let opts=[o.target,...distract.filter(x=>x!==o.target).sort(()=>Math.random()-.5).slice(0,2)].sort(()=>Math.random()-.5);opts.forEach(x=>{let b=document.createElement("button");b.className="btn choice";b.textContent=x;b.onclick=()=>{if(x===o.target){feedback.innerHTML='<div class="ok">Oui ! Tu entends <strong>'+o.target+'</strong>.</div>';setTimeout(nextStage,700)}else{feedback.innerHTML='<div class="no">Écoute encore. Cherche le son <strong>'+o.target+'</strong>.</div>';speak()}};choices.appendChild(b)})}
if(stage===2){title.textContent="3. Je construis le mot";built=[];work.innerHTML='<p>Pose les morceaux dans l’ordre.</p><button class="btn" id="hear">🔊 Écouter</button><div class="built" id="built"></div><div class="tiles" id="tiles"></div><button class="btn" id="reset">↺ Recommencer</button>';hear.onclick=()=>speak();let arr=[...o.chunks,...distract.filter(x=>!o.chunks.includes(x)).slice(0,2)].sort(()=>Math.random()-.5);arr.forEach(x=>{let b=document.createElement("button");b.className="tile";b.textContent=x;b.onclick=()=>{built.push(x);document.getElementById("built").textContent=built.join(" · ");if(built.length===o.chunks.length){if(built.join("")===o.chunks.join("")){feedback.innerHTML='<div class="ok">Bravo : <span class="word">'+o.w+'</span></div>';setTimeout(nextStage,800)}else{feedback.innerHTML='<div class="no">Presque. Écoute et recommence dans l’ordre.</div>';built=[];document.getElementById("built").textContent="";speak()}}};tiles.appendChild(b)});reset.onclick=()=>{built=[];document.getElementById("built").textContent="";feedback.innerHTML=""}}
if(stage===3){title.textContent="4. Je complète le mot";let up=o.w.toUpperCase(),masked=up.replace(o.target,"___");work.innerHTML='<button class="btn" id="hear">🔊 Écouter</button><p class="word">'+masked+'</p><p>Écris le morceau qui manque.</p><input class="answer" id="ans" autocomplete="off" autocapitalize="none" spellcheck="false"><br><button class="btn" id="valid">Je vérifie</button>';hear.onclick=()=>speak();valid.onclick=()=>{if(ans.value.trim().toUpperCase()===o.target){feedback.innerHTML='<div class="ok">Oui : <span class="word">'+up+'</span></div>';setTimeout(nextStage,800)}else{attempt++;feedback.innerHTML='<div class="no">Écoute encore. Le morceau attendu est <strong>'+o.target+'</strong>. Écris-le toi-même.</div>';ans.value="";ans.focus();speak()}};ans.focus()}
if(stage===4){title.textContent="5. J'écris tout seul";work.innerHTML='<button class="btn" id="hear">🔊 Écouter</button><p>L’image reste. Les aides ont disparu. Écris le mot entier.</p><input class="answer" id="ans" autocomplete="off" autocapitalize="none" spellcheck="false"><br><button class="btn" id="valid">Je vérifie</button>';hear.onclick=()=>speak();valid.onclick=()=>{let a=ans.value.trim().toLowerCase();if(a===o.w){feedback.innerHTML='<div class="ok">🎉 Oui ! <span class="word">'+o.w+'</span></div>';setTimeout(nextStage,900)}else{attempt++;feedback.innerHTML='<div class="no">Tu as écrit <strong>'+ans.value+'</strong>.<br>Observe : <span class="word">'+o.w+'</span><br>Maintenant, efface et <strong>réécris le mot correctement</strong>.</div>';ans.value="";ans.focus();speak()}};ans.focus()}
}
render();
</script><script src="site-tracking.js" defer></script></body></html>
