<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Maths à la corde | Zoumaï</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#edf3fa;color:#17243d}header{padding:10px;text-align:center;background:#182e53;color:white}h1{font-size:21px;margin:0}.settings{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px}select,button{font:inherit;border-radius:12px;padding:9px;border:1px solid #b8c8db;background:white}button{cursor:pointer;font-weight:750}.start{background:#f4b942}.tip{text-align:center;font-size:13px;margin:3px 8px}.game{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;max-width:1000px;margin:auto}.panel{border-radius:18px;padding:12px;text-align:center;background:#dcecff;border:3px solid #2875d0}.panel.red{background:#ffe2df;border-color:#db4b45}.question{font-weight:900;font-size:clamp(25px,5vw,46px);margin:6px}.answer{font-size:24px;width:min(100%,190px);text-align:center;border:2px solid #899db4;border-radius:12px;padding:8px}.submit{display:block;margin:8px auto;background:#fff}.stage{position:relative;grid-column:1/-1;background:linear-gradient(#b9e8ff 0 70%,#8bc982 70%);border-radius:20px;overflow:hidden;height:clamp(190px,30vw,300px)}svg{width:100%;height:100%}.status{text-align:center;font-weight:800;grid-column:1/-1;min-height:26px}.score{font-size:14px;font-weight:700}@media(orientation:portrait){.game{display:flex;flex-direction:column}.panel.red{order:0;transform:rotate(180deg)}.stage{order:1;height:34vh;min-height:180px}.panel.blue{order:2}.status{order:3}}@media(orientation:landscape){.panel.red{order:2}.panel.blue{order:0}.stage{order:1;grid-column:1/-1;grid-row:2}.game{grid-template-columns:1fr 1fr}} 
</style></head><body><header><h1>🪢 Maths à la corde</h1></header><div class="settings"><select id="mode"><option value="cpu">Contre l'ordinateur</option><option value="duo">Deux joueurs</option></select><select id="level"><option value="facile">Facile</option><option value="moyen" selected>Moyen</option><option value="expert">Expert</option></select><select id="operation"><option value="mix">Calculs mélangés</option><option value="add">Additions</option><option value="sub">Soustractions</option><option value="mul">Multiplications</option><option value="div">Divisions (Expert)</option></select><button class="start" id="start">Nouvelle partie</button></div><div class="tip" id="tip">À deux, placez-vous face à face. Répondez juste pour tirer la corde ! En solo, affrontez l'ordinateur.</div><main class="game"><section class="panel blue"><strong>🔵 Équipe bleue</strong><div class="question" id="qb">Prêt ?</div><input class="answer" type="number" inputmode="numeric" id="ab" placeholder="Réponse"><button class="submit" id="bb">Valider ✓</button><div class="score" id="sb">0 bonne réponse</div></section><section class="panel red"><strong id="redname">🔴 Ordinateur</strong><div class="question" id="qr">Prêt ?</div><input class="answer" type="number" inputmode="numeric" id="ar" placeholder="Réponse"><button class="submit" id="br">Valider ✓</button><div class="score" id="sr">0 bonne réponse</div></section><div class="stage"><svg viewBox="0 0 900 280" aria-label="Animation du tir à la corde"><line x1="0" y1="222" x2="900" y2="222" stroke="#59934e" stroke-width="5"/><g id="actors"><path id="rope" d="M140 157 Q450 163 760 157" fill="none" stroke="#8a5c32" stroke-width="12" stroke-linecap="round"/><path d="M140 154 Q450 160 760 154" fill="none" stroke="#d8aa68" stroke-width="3" stroke-dasharray="9 10"/><g id="blues"></g><g id="reds"></g><path d="M450 151 l0 38 l24 -10 l-24 -9" fill="#ffdc49" stroke="#a27c15" stroke-width="3"/></g><path d="M450 210 v30" stroke="#fff" stroke-width="5" stroke-dasharray="5 5"/></svg></div><div class="status" id="status">Premier à prendre 5 longueurs de corde !</div></main><script>
const $=x=>document.getElementById(x);let progress=0,score=[0,0],q=[null,null],active=false,timer=null;
function person(x,color,flip){return '<g transform="translate('+x+' 0) scale('+flip+' 1)"><path d="M-10 198 L-29 225 M8 198 L27 225" stroke="#26334b" stroke-width="13" stroke-linecap="round"/><path d="M-1 174 L-2 200" stroke="'+color+'" stroke-width="32" stroke-linecap="round"/><path d="M-5 178 L30 158 L54 157" fill="none" stroke="#e2a97f" stroke-width="11" stroke-linecap="round"/><circle cx="-2" cy="135" r="23" fill="#e2a97f"/><path d="M-25 132 Q-25 102 0 110 Q23 111 22 130" fill="#26334b"/><circle cx="8" cy="135" r="3" fill="#26334b"/><circle cx="54" cy="157" r="8" fill="#e2a97f"/></g>'}
$('blues').innerHTML=person(160,'#2677e3',1)+person(245,'#2677e3',1)+person(325,'#2677e3',1);$('reds').innerHTML=person(740,'#df5148',-1)+person(655,'#df5148',-1)+person(575,'#df5148',-1);
function rand(n){return Math.floor(Math.random()*n)+1}function question(){let level=$('level').value,ops=$('operation').value,choices=ops==='mix'?['add','sub','mul',...(level==='expert'?['div']:[])]:[ops];let op=choices[Math.floor(Math.random()*choices.length)];if(op==='div'&&level!=='expert')op='mul';let max=level==='facile'?5:level==='moyen'?10:12,a=rand(max),b=rand(max),ans,txt;if(op==='add'){ans=a+b;txt=a+' + '+b}else if(op==='sub'){if(a<b)[a,b]=[b,a];ans=a-b;txt=a+' − '+b}else if(op==='mul'){ans=a*b;txt=a+' × '+b}else{ans=a;txt=(a*b)+' ÷ '+b}return {txt,ans}}
function next(i){q[i]=question();$('q'+(i?'r':'b')).textContent=q[i].txt+' = ?'}
function draw(){let x=progress*42;$('actors').setAttribute('transform','translate('+x+' 0)');$('sb').textContent=score[0]+' bonnes réponses';$('sr').textContent=score[1]+' bonnes réponses';if(Math.abs(progress)>=5){active=false;clearInterval(timer);let winner=progress<0?'BLEUS':'ROUGES';$('status').textContent='🏆 Les '+winner+' gagnent ! Les adversaires lâchent la corde !';let loser=progress<0?$('reds'):$('blues');loser.setAttribute('transform','rotate('+(progress<0?18:-18)+' 450 190) translate(0 35)');$('rope').setAttribute('d','M140 157 Q450 175 760 210')}else $('status').textContent=progress===0?'Les équipes sont à égalité !':(progress<0?'Les bleus':'Les rouges')+' gagnent du terrain !'}
function correct(i){if(!active||!q[i])return;let inp=$(i?'ar':'ab');if(Number(inp.value)===q[i].ans&&inp.value.trim()!==''){score[i]++;progress+=i?1:-1;inp.value='';next(i);draw()}else{$('status').textContent='Essaie encore !';inp.select()}}
function start(){clearInterval(timer);active=true;progress=0;score=[0,0];$('reds').removeAttribute('transform');$('blues').removeAttribute('transform');$('rope').setAttribute('d','M140 157 Q450 163 760 157');$('ab').value='';$('ar').value='';let duo=$('mode').value==='duo';$('redname').textContent=duo?'🔴 Équipe rouge':'🔴 Ordinateur';$('ar').style.display=duo?'':'none';$('br').style.display=duo?'':'none';next(0);if(duo)next(1);else $('qr').textContent='🤖';draw();if(!duo){let ms={facile:7500,moyen:5100,expert:3300}[$('level').value];timer=setInterval(()=>{if(active){score[1]++;progress++;draw()}},ms)}}
$('bb').onclick=()=>correct(0);$('br').onclick=()=>correct(1);$('ab').onkeydown=e=>{if(e.key==='Enter')correct(0)};$('ar').onkeydown=e=>{if(e.key==='Enter')correct(1)};$('start').onclick=start;$('level').onchange=()=>{if($('level').value!=='expert'&&$('operation').value==='div')$('operation').value='mix'};start();
</script></body></html>
