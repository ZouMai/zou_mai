<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maths à la corde | Zoumaï</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:#0a1124;color:#f7f8ff;font-family:system-ui,sans-serif}
main{width:min(100% - 24px,880px);margin:auto;padding:12px 0 24px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.top a{color:#b6e8ff}
h1{font-size:clamp(1.65rem,5vw,3rem);margin:0}
h2,p{margin:0}
button,select,input{font:inherit}
button,select{min-height:44px;border:1px solid #57658d;border-radius:12px;padding:8px 13px;background:#1f2b49;color:white}
button{font-weight:750;cursor:pointer}
button.primary{background:#ffdc62;color:#151b2a;border-color:#ffdc62}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:3px solid #ffdc62;outline-offset:3px}
.hero{display:block;width:100%;height:auto;max-height:420px;object-fit:contain;background:#0e152c;border:1px solid #566695;border-radius:20px}
.settings,.choices,.actions{display:flex;flex-wrap:wrap;gap:10px}
.choices{margin:12px 0}.settings{margin:12px 0 0}
.settings label{display:grid;gap:4px;flex:1;min-width:132px;font-weight:700}
.rule{margin-top:10px;color:#d4e0fc}
.arena{position:relative;overflow:hidden;border:1px solid #516491;border-radius:18px;background:linear-gradient(110deg,#123663,#0c1532 49%,#441c50)}
.arena svg{display:block;width:100%;height:auto}
#pull{transition:transform .28s ease-out}
.arena.won #pull{animation:finish .36s ease-out}
@keyframes finish{50%{translate:var(--kick) 0}}
.board{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.arena,.race,.actions{grid-column:1/-1}
.race{text-align:center;color:#e0e8ff;min-height:1.5em}
.panel{--team:#6bd6ff;background:#121f3b;border:2px solid var(--team);border-radius:16px;text-align:center;padding:10px;min-width:0}
.panel.mai{--team:#ff91dc}
.panel h2{color:var(--team);font-size:1.2rem}
.calc{font-size:clamp(1.65rem,5vw,2.5rem);font-weight:850;margin:5px 0}
form{display:flex;justify-content:center;gap:7px}
input{width:min(110px,55%);min-width:0;min-height:44px;text-align:center;border-radius:10px;border:1px solid #7991bf;background:#fff;color:#101934;font-size:1.2rem}
.feedback{min-height:1.5em;margin-top:5px;color:#ffe087}
.panel small{color:#c9d4f1}
#result{display:grid;place-content:center;justify-items:center;gap:9px;text-align:center;position:absolute;inset:0;background:#10182be8;padding:10px}
.arena.won #result{animation:show-result .2s .36s both}
@keyframes show-result{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.arena.won #result{animation:none}}
#practiceNext{margin-top:7px}
.board[data-mode=practice]{grid-template-columns:1fr}
@media(max-width:540px){
  .board[data-mode=cpu]{grid-template-columns:1fr}
  .board[data-mode=cpu] .mai{display:flex;justify-content:space-between;align-items:center;gap:6px}
  .board[data-mode=cpu] .mai .calc{font-size:1rem;margin:0}
}
@media(orientation:portrait) and (max-width:740px){
  .board[data-mode=duo]{grid-template-columns:1fr}
  .board[data-mode=duo] .mai{grid-row:1;transform:rotate(180deg)}
  .board[data-mode=duo] .arena{grid-row:2}
  .board[data-mode=duo] .race{grid-row:3}
}
@media(prefers-reduced-motion:reduce){#pull{transition:none}.arena.won #pull{animation:none}}
</style>
</head>
<body>
<main>
  <header class="top"><a href="jeux.html">← Jeux</a><h1>Maths à la corde</h1></header>
  <section id="home" aria-label="Choisir une partie">
    <img class="hero" src="assets/maths-corde-duel.webp" width="1120" height="630" alt="Zoum et Maï tirent chacun de leur côté sur une corde au nœud rose.">
    <p class="rule">Chaque bonne réponse tire la corde vers ton équipe.</p>
    <div class="choices">
      <button class="primary" data-start="practice">M’entraîner</button>
      <button data-start="cpu">Jouer contre Maï</button>
      <button data-start="duo">Jouer à deux</button>
    </div>
    <details>
      <summary>Réglages du duel</summary>
      <div class="settings">
        <label>Niveau<select id="level"><option value="facile">Facile</option><option value="moyen">Moyen</option><option value="expert">Expert</option></select></label>
        <label>Calculs<select id="operation"><option value="mix">Calculs mélangés</option><option value="add">Additions</option><option value="sub">Soustractions</option><option value="mul">Multiplications</option><option value="div" disabled>Divisions (Expert)</option></select></label>
      </div>
    </details>
  </section>
  <section class="board" id="board" aria-label="Partie" hidden>
    <div class="arena" id="arena">
      <svg viewBox="0 0 720 166" aria-label="Zoum et Maï tirent sur la corde" role="img">
        <path d="M0 146H720" stroke="#a3d5ff" stroke-opacity=".4" stroke-width="2"/>
        <path d="M210 125v24m150-24v24m150-24v24" stroke="#e0e7ff" stroke-width="3" stroke-dasharray="4 4"/>
        <g id="pull">
          <path d="M214 119H506" stroke="#4c341a" stroke-width="13" stroke-linecap="round"/>
          <path d="M214 118H506" stroke="#ffcb55" stroke-width="8" stroke-linecap="round"/>
          <path d="M214 118H506" stroke="#9b5e23" stroke-width="4" stroke-dasharray="2 7"/>
          <image href="assets/zoum-neutral.png" x="150" y="20" width="137" height="122"/>
          <image href="assets/mai-neutral.png" x="434" y="14" width="138" height="130"/>
          <path d="M468 118h36" stroke="#ffcb55" stroke-width="7" stroke-linecap="round"/>
          <path d="M468 118h36" stroke="#9b5e23" stroke-width="3" stroke-dasharray="2 6"/>
          <path d="M360 117q-27-29-26-3q0 10 26 3q26-7 26-3q1-26-26 3l-13 22m13-22 13 22" fill="none" stroke="#fa6fb4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="360" cy="117" r="6" fill="#ffe0f3"/>
        </g>
      </svg>
      <div id="result" hidden><h2 id="winner"></h2><button class="primary" id="replay">Revanche</button></div>
    </div>
    <p class="race" id="race" role="status"></p>
    <article class="panel">
      <h2>Zoum</h2>
      <p class="calc" id="calc0"></p>
      <form data-side="0"><input id="answer0" type="text" inputmode="numeric" autocomplete="off" aria-labelledby="calc0"><button class="primary">Valider</button></form>
      <p class="feedback" id="feedback0" role="status"></p>
      <small id="score0"></small>
      <button id="practiceNext" hidden>Défier Maï</button>
    </article>
    <article class="panel mai" id="mai">
      <h2>Maï</h2>
      <p class="calc" id="calc1"></p>
      <form data-side="1"><input id="answer1" type="text" inputmode="numeric" autocomplete="off" aria-labelledby="calc1"><button class="primary">Valider</button></form>
      <p class="feedback" id="feedback1" role="status"></p>
      <small id="score1"></small>
    </article>
    <div class="actions"><button id="menu">Retour aux modes</button></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const forms = [...document.querySelectorAll('form[data-side]')];
const starts = [...document.querySelectorAll('[data-start]')];
const practice = [
  { text: '3 + 2', answer: 5, hint: 'Pars de 3 et avance de 2.' },
  { text: '4 + 3', answer: 7, hint: 'Pars de 4 et avance de 3.' },
  { text: '5 + 4', answer: 9, hint: 'Pars de 5 et avance de 4.' }
];
const pullStep = 30;
const finishLine = 5;
const maïDelay = { facile: 7500, moyen: 5100, expert: 3300 };
let mode, level, operation, timer, active, position, scores, questions;

function setEnabled(side, enabled) {
  forms[side].querySelectorAll('input, button').forEach(control => control.disabled = !enabled);
}

function nextQuestion(side) {
  if (mode === 'practice') {
    questions[side] = practice[scores[side]];
  } else {
    const operations = ['add', 'sub', 'mul'];
    if (level === 'expert') operations.push('div');
    const selected = operation === 'mix' ? operations[Math.floor(Math.random() * operations.length)] : operation;
    const max = { facile: 5, moyen: 10, expert: 12 }[level];
    const a = 1 + Math.floor(Math.random() * max);
    const b = 1 + Math.floor(Math.random() * max);
    const possibilities = {
      add: { text: a + ' + ' + b, answer: a + b },
      sub: { text: Math.max(a, b) + ' − ' + Math.min(a, b), answer: Math.abs(a - b) },
      mul: { text: a + ' × ' + b, answer: a * b },
      div: { text: (a * b) + ' ÷ ' + b, answer: a }
    };
    questions[side] = possibilities[selected];
  }
  $('calc' + side).textContent = questions[side].text + ' = ?';
}

function stop() {
  active = false;
  clearInterval(timer);
  setEnabled(0, false);
  setEnabled(1, false);
}

function pull(side) {
  scores[side]++;
  position += side === 0 ? -1 : 1;
  $('pull').style.transform = 'translateX(' + position * pullStep + 'px)';
  $('score' + side).textContent = scores[side] + (scores[side] === 1 ? ' bonne réponse' : ' bonnes réponses');
  if (mode === 'practice') {
    $('race').textContent = scores[0] + ' calcul' + (scores[0] > 1 ? 's' : '') + ' réussi' + (scores[0] > 1 ? 's' : '') + ' sur 3';
    if (scores[0] === practice.length) {
      stop();
      $('feedback0').textContent = 'Bravo, tu sais tirer la corde !';
      $('practiceNext').hidden = false;
      $('practiceNext').focus();
    }
    return;
  }
  const leader = position < 0 ? 'Zoum' : 'Maï';
  if (Math.abs(position) === finishLine) {
    stop();
    $('arena').style.setProperty('--kick', position < 0 ? '-9px' : '9px');
    $('arena').classList.add('won');
    $('winner').textContent = leader + ' remporte le duel !';
    $('race').textContent = $('winner').textContent;
    $('result').hidden = false;
    $('replay').focus();
  } else {
    $('race').textContent = position === 0 ? 'À égalité !' : leader + ' mène. Encore ' + (finishLine - Math.abs(position)) + ' pour gagner.';
  }
}

function start(selectedMode) {
  stop();
  mode = selectedMode;
  level = $('level').value;
  operation = $('operation').value;
  position = 0;
  scores = [0, 0];
  questions = [];
  active = true;
  $('home').hidden = true;
  $('board').hidden = false;
  $('board').dataset.mode = mode;
  $('arena').classList.remove('won');
  $('result').hidden = true;
  $('practiceNext').hidden = true;
  $('pull').style.transform = '';
  $('mai').hidden = mode === 'practice';
  forms[1].hidden = mode !== 'duo';
  $('feedback1').hidden = mode !== 'duo';
  $('race').textContent = mode === 'practice' ? 'À ton rythme · 3 calculs' : 'Tire le nœud jusqu’au repère de ton côté.';
  for (const side of [0, 1]) {
    $('answer' + side).value = '';
    $('feedback' + side).textContent = '';
    $('score' + side).textContent = '0 bonne réponse';
  }
  setEnabled(0, true);
  setEnabled(1, mode === 'duo');
  nextQuestion(0);
  if (mode === 'duo') nextQuestion(1);
  else $('calc1').textContent = 'Adversaire';
  $('answer0').focus({ preventScroll: true });
  if (mode === 'cpu') timer = setInterval(() => pull(1), maïDelay[level]);
}

forms.forEach(form => form.addEventListener('submit', event => {
  event.preventDefault();
  const side = Number(form.dataset.side);
  if (!active || !questions[side]) return;
  const field = $('answer' + side);
  const feedback = $('feedback' + side);
  const value = field.value.trim();
  if (!/^\d+$/.test(value) || Number(value) !== questions[side].answer) {
    feedback.textContent = value === '' ? 'Écris ta réponse.' : (questions[side].hint || 'Essaie encore !');
    field.focus();
    field.select();
    return;
  }
  field.value = '';
  feedback.textContent = 'Bien joué !';
  pull(side);
  if (active) {
    nextQuestion(side);
    field.focus();
  }
}));

starts.forEach(button => button.addEventListener('click', () => start(button.dataset.start)));
$('practiceNext').addEventListener('click', () => start('cpu'));
$('replay').addEventListener('click', () => start(mode));
$('menu').addEventListener('click', () => {
  stop();
  $('board').hidden = true;
  $('home').hidden = false;
  starts.find(button => button.dataset.start === mode).focus();
});
$('level').addEventListener('change', () => {
  const expert = $('level').value === 'expert';
  if (!expert && $('operation').value === 'div') $('operation').value = 'mix';
  $('operation').querySelector('[value=div]').disabled = !expert;
});
</script>
</body>
</html>
