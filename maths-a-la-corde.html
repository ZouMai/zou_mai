<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maths à la corde | Zoumaï</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:#0a1124;color:#f7f8ff;font-family:system-ui,sans-serif}
main{width:min(100% - 24px,880px);margin:auto;padding:12px 0 24px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.top a{color:#b6e8ff}
h1{font-size:clamp(1.65rem,5vw,3rem);margin:0}
h2,p{margin:0}
button,select,input{font:inherit}
button,select{min-height:44px;border:1px solid #57658d;border-radius:12px;padding:8px 13px;background:#1f2b49;color:white}
button{font-weight:750;cursor:pointer}
button.primary{background:#ffdc62;color:#151b2a;border-color:#ffdc62}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:3px solid #ffdc62;outline-offset:3px}
.hero{display:block;width:100%;height:auto;max-height:420px;object-fit:contain;background:#0e152c;border:1px solid #566695;border-radius:20px}
.settings,.choices,.actions{display:flex;flex-wrap:wrap;gap:10px}
.choices{margin:12px 0}.settings{margin:12px 0 0}
.settings label{display:grid;gap:4px;flex:1;min-width:132px;font-weight:700}
.rule{margin-top:10px;color:#d4e0fc}
.arena{position:relative;overflow:hidden;border:1px solid #516491;border-radius:18px;background:linear-gradient(110deg,#123663,#0c1532 49%,#441c50)}
.arena svg{display:block;width:100%;height:auto}
#pull{transition:transform .28s ease-out}
.arena.won #pull{animation:finish .36s ease-out}
@keyframes finish{50%{translate:var(--kick) 0}}
.board{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.arena,.race,.actions{grid-column:1/-1}
.race{text-align:center;color:#e0e8ff;min-height:1.5em}
.panel{--team:#6bd6ff;background:#121f3b;border:2px solid var(--team);border-radius:16px;text-align:center;padding:10px;min-width:0}
.panel.mai{--team:#ff91dc}
.panel h2{color:var(--team);font-size:1.2rem}
.calc{overflow-wrap:anywhere;font-size:clamp(1.65rem,5vw,2.5rem);font-weight:850;margin:5px 0}
form{display:flex;justify-content:center;gap:7px}
input{width:min(110px,55%);min-width:0;min-height:44px;text-align:center;border-radius:10px;border:1px solid #7991bf;background:#fff;color:#101934;font-size:1.2rem}
.feedback{min-height:1.5em;margin-top:5px;color:#ffe087}
.panel small{color:#c9d4f1}
#result{display:grid;place-content:center;justify-items:center;gap:9px;text-align:center;position:absolute;inset:0;background:#10182be8;padding:10px}
.arena.won #result{animation:show-result .2s .36s both}
@keyframes show-result{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.arena.won #result{animation:none}}
#practiceNext{margin-top:7px}
.board[data-mode=practice]{grid-template-columns:1fr}
@media(max-width:540px){
  .board[data-mode=cpu]{grid-template-columns:1fr}
  .board[data-mode=cpu] .mai{display:flex;justify-content:space-between;align-items:center;gap:6px}
  .board[data-mode=cpu] .mai .calc{overflow-wrap:anywhere;font-size:1rem;margin:0}
}
/* Keep both players on the same screen, with independent keypads. */
.keypad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;width:min(100%,248px);margin:4px auto;flex:none}
.keypad button{min-height:36px;min-width:0;padding:3px;font-size:1.05rem;touch-action:manipulation}
.keypad button.primary{grid-column:span 4}
.keypad button:active{background:#526289}
form{flex-direction:column;align-items:center}
form input{min-height:32px}
.posed{transform-box:fill-box;transform-origin:center bottom}
#pull[data-side="0"] .zoum-pose,#pull[data-side="1"] .mai-pose{
  animation:tug .34s steps(1,end);--lean:1
}
#pull[data-side="0"] .mai-pose,#pull[data-side="1"] .zoum-pose{
  animation:brace .34s steps(1,end);--lean:1
}
#pull[data-side="0"] .zoum-pose,#pull[data-side="0"] .mai-pose{--lean:-1}
@keyframes tug{
  0%{transform:rotate(calc(var(--lean) * -5deg)) scale(1.02,.96)}
  24%{transform:rotate(calc(var(--lean) * 13deg)) translateY(-5px) scale(.98,1.05)}
  60%{transform:rotate(calc(var(--lean) * 7deg)) translateY(-1px)}
}
@keyframes brace{
  0%{transform:rotate(calc(var(--lean) * -7deg)) translateY(-2px)}
  30%{transform:rotate(calc(var(--lean) * 9deg)) translateY(-7px)}
  67%{transform:rotate(calc(var(--lean) * -4deg))}
}
@media(pointer:coarse){
  .board{gap:6px}
  .board .panel{padding:4px 8px}
  .board .calc{font-size:clamp(1.15rem,4.4vw,1.8rem);line-height:1.1;margin:2px 0}
  .board[data-mode=duo] .calc{height:2.2em;display:grid;place-items:center}
  .board .feedback{margin-top:1px;min-height:1.1em;font-size:.85rem}
  .board[data-mode=duo] .feedback{height:2.3em;line-height:1.15;overflow:auto}
  .board .score{display:none}
  form input{min-height:29px;height:29px}
  .actions button{min-height:34px;padding:3px 9px}
  .race{font-size:.85rem;min-height:0}
  .arena svg{max-height:clamp(68px,16svh,138px)}
}
@media(orientation:portrait) and (max-width:1024px){
  .board[data-mode=duo]{grid-template-columns:1fr}
  .board[data-mode=duo] .mai{grid-row:1;transform:rotate(180deg)}
  .board[data-mode=duo] .arena{grid-row:2}
  .board[data-mode=duo] .race{grid-row:3}
  .board[data-mode=duo] .actions{justify-content:center}
}
@media(orientation:landscape) and (pointer:coarse){
  .board[data-mode=duo]{grid-template-columns:minmax(140px,1fr) minmax(130px,1.2fr) minmax(140px,1fr);align-items:center}
  .board[data-mode=duo] .arena{grid-column:2;grid-row:1}
  .board[data-mode=duo] .panel:not(.mai){grid-column:1;grid-row:1}
  .board[data-mode=duo] .mai{grid-column:3;grid-row:1;transform:rotate(180deg)}
  .board[data-mode=duo] .race{grid-column:2;grid-row:2}
  .board[data-mode=duo] .actions{justify-content:center}
}
@media(orientation:portrait) and (pointer:coarse) and (max-height:680px){
  .board[data-mode=duo] .keypad{grid-template-columns:repeat(7,minmax(0,1fr));width:min(100%,380px)}
  .board[data-mode=duo] .keypad button{min-height:42px}
  .board[data-mode=duo] .keypad .primary{grid-column:span 1}
}
body.playing .top{display:none}
@media(prefers-reduced-motion:reduce){
  #pull,.arena.won #pull,#pull[data-side] .posed{transition:none;animation:none}
}
</style>
</head>
<body>
<main>
  <header class="top"><a href="jeux.html">← Jeux</a><h1>Maths à la corde</h1></header>
  <section id="home" aria-label="Choisir une partie">
    <img class="hero" src="assets/maths-corde-duel.webp" width="1120" height="630" alt="Zoum et Maï tirent chacun de leur côté sur une corde au nœud rose.">
    <p class="rule">Chaque bonne réponse tire la corde vers ton équipe.</p>
    <div class="choices">
      <button class="primary" data-start="practice">M’entraîner</button>
      <button data-start="cpu">Jouer contre Maï</button>
      <button data-start="duo">Jouer à deux</button>
    </div>
    <details open>
      <summary>Réglages du duel</summary>
      <div class="settings">
        <label>Niveau<select id="level"><option value="moyen">Intermédiaire</option><option value="expert">Expert</option><option value="defi">Défi CM2</option></select></label>
        <label>Calculs<select id="operation"><option value="mix">Calculs mélangés</option></select></label>
      </div>
    </details>
  </section>
  <section class="board" id="board" aria-label="Partie" hidden>
    <div class="arena" id="arena">
      <svg viewBox="0 0 720 166" aria-label="Zoum et Maï tirent sur la corde" role="img">
        <path d="M0 146H720" stroke="#a3d5ff" stroke-opacity=".4" stroke-width="2"/>
        <path d="M210 125v24m150-24v24m150-24v24" stroke="#e0e7ff" stroke-width="3" stroke-dasharray="4 4"/>
        <g id="pull">
          <path d="M214 119H506" stroke="#4c341a" stroke-width="13" stroke-linecap="round"/>
          <path d="M214 118H506" stroke="#ffcb55" stroke-width="8" stroke-linecap="round"/>
          <path d="M214 118H506" stroke="#9b5e23" stroke-width="4" stroke-dasharray="2 7"/>
          <image class="posed zoum-pose" href="assets/zoum-neutral.png" x="150" y="20" width="137" height="122"/>
          <g class="posed mai-pose"><image href="assets/mai-neutral.png" x="434" y="14" width="138" height="130"/>
          <path d="M468 118h36" stroke="#ffcb55" stroke-width="7" stroke-linecap="round"/>
          <path d="M468 118h36" stroke="#9b5e23" stroke-width="3" stroke-dasharray="2 6"/></g>
          <path d="M360 117q-27-29-26-3q0 10 26 3q26-7 26-3q1-26-26 3l-13 22m13-22 13 22" fill="none" stroke="#fa6fb4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="360" cy="117" r="6" fill="#ffe0f3"/>
        </g>
      </svg>
      <div id="result" hidden><h2 id="winner"></h2><button class="primary" id="replay">Revanche</button></div>
    </div>
    <p class="race" id="race" role="status"></p>
    <article class="panel">
      <h2>Zoum</h2>
      <p class="calc" id="calc0"></p>
      <form data-side="0"><input id="answer0" type="text" inputmode="none" autocomplete="off" aria-labelledby="calc0"><div class="keypad" role="group" aria-label="Clavier numérique"></div></form>
      <p class="feedback" id="feedback0" role="status"></p>
      <small class="score" id="score0"></small>
      <button id="practiceNext" hidden>Défier Maï</button>
    </article>
    <article class="panel mai" id="mai">
      <h2>Maï</h2>
      <p class="calc" id="calc1"></p>
      <form data-side="1"><input id="answer1" type="text" inputmode="none" autocomplete="off" aria-labelledby="calc1"><div class="keypad" role="group" aria-label="Clavier numérique"></div></form>
      <p class="feedback" id="feedback1" role="status"></p>
      <small class="score" id="score1"></small>
    </article>
    <div class="actions"><button id="menu">Retour aux modes</button></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const forms = [...document.querySelectorAll('form[data-side]')];
const starts = [...document.querySelectorAll('[data-start]')];
const practice = [
  { text: '3 + 2', answer: 5, hint: 'Pars de 3 et avance de 2.' },
  { text: '4 + 3', answer: 7, hint: 'Pars de 4 et avance de 3.' },
  { text: '5 + 4', answer: 9, hint: 'Pars de 5 et avance de 4.' }
];
const pullStep = 30;
const finishLine = 5;
const maïDelay = { moyen: 9200, expert: 11800, defi: 14500 };
let mode, level, operation, timer, active, position, scores, questions;
let poseFrame = 0;

const random = (min, max) => min + Math.floor(Math.random() * (max - min + 1));
const pick = values => values[random(0, values.length - 1)];
const format = number => String(Number(number.toFixed(6))).replace('.', ',');
const item = (text, answer, hint) => ({ text, answer: Number(answer.toFixed(6)), hint });
const expression = (a, sign, b, answer, hint) =>
  item(format(a) + ' ' + sign + ' ' + format(b) + ' = ?', answer, hint);

const families = {
  add: [
    'Additions',
    difficulty => {
      const a = random(20, [70, 500, 1500][difficulty]);
      const b = random(8, [29, 199, 499][difficulty]);
      return expression(a, '+', b, a + b, 'Ajoute les dizaines, puis les unités.');
    }
  ],
  sub: [
    'Soustractions',
    difficulty => {
      const a = random(40, [100, 700, 2000][difficulty]);
      const b = random(9, Math.floor(a / 2));
      return expression(a, '−', b, a - b, 'Retire les dizaines, puis les unités.');
    }
  ],
  holes: [
    'Additions à trous',
    difficulty => {
      const total = random(40, [100, 500, 2000][difficulty]);
      const known = random(10, total - 10);
      const text = random(0, 1) ? known + ' + □ = ' + total : '□ + ' + known + ' = ' + total;
      return item(text, total - known, 'Soustrais le nombre connu du total.');
    }
  ],
  comp10: ['Compléments à 10', () => complement(10, random(1, 9))],
  comp100: ['Compléments à 100', () => complement(100, random(11, 99))],
  comp1000: [
    'Compléments à 1 000',
    difficulty => complement(1000, difficulty === 0 ? random(11, 99) * 10 : random(101, 999))
  ],
  near: [
    'Ajouter ou retirer 9, 29, 99…',
    difficulty => {
      const tens = difficulty === 0 ? pick([10, 20, 30]) : random(1, 10) * 10;
      const gap = difficulty === 0 ? 1 : pick([1, 2]);
      const b = tens - gap;
      const a = random(b + 9, [105, 500, 1800][difficulty]);
      const add = pick([true, false]);
      const hint = add ? 'Ajoute ' + tens + ', puis retire ' + gap + '.' : 'Retire ' + tens + ', puis ajoute ' + gap + '.';
      return expression(a, add ? '+' : '−', b, a + (add ? b : -b), hint);
    }
  ],
  tables: [
    'Multiplications et tables',
    difficulty => {
      const max = difficulty === 0 ? 10 : 9;
      const a = random(2, max);
      const b = random(2, max);
      if (difficulty === 0) return expression(a, '×', b, a * b, 'Retrouve ce produit dans les tables.');
      const scaleA = pick([10, 100, 1000]);
      const scaleB = difficulty === 1 ? 10 : pick([10, 100, 1000]);
      return expression(a * scaleA, '×', b * scaleB, a * b * scaleA * scaleB, 'Multiplie ' + a + ' par ' + b + ', puis tiens compte des dizaines, centaines ou milliers.');
    }
  ],
  times5: [
    'Multiplier par 5',
    difficulty => {
      const a = difficulty === 0 ? random(12, 49) : random(21, difficulty === 1 ? 98 : 298) / 10;
      return expression(a, '×', 5, a * 5, 'Multiplie par 10, puis prends la moitié.');
    }
  ],
  times50: [
    'Multiplier par 50',
    difficulty => {
      const a = difficulty === 0 ? random(11, 35) : random(11, 199) / 10;
      return expression(a, '×', 50, a * 50, 'Multiplie par 100, puis prends la moitié.');
    }
  ],
  place: [
    'Multiplier ou diviser par 10, 100, 1 000',
    difficulty => {
      const factor = pick([10, 100, 1000]);
      const multiply = pick([true, false]);
      const a = difficulty === 0 ? random(12, 80) * (multiply ? 1 : 10) :
        random(12, 199) / (difficulty === 1 && !multiply ? 1 : 10);
      return expression(a, multiply ? '×' : '÷', factor, multiply ? a * factor : a / factor,
        'Chaque chiffre prend une valeur ' + factor + ' fois plus ' + (multiply ? 'grande.' : 'petite.'));
    }
  ],
  distribute: [
    'Décomposer pour multiplier',
    difficulty => {
      const a = random(2, [6, 8, 9][difficulty]);
      const round = random(1, [2, 5, 9][difficulty]) * 10;
      const rest = random(2, 8);
      return expression(round + rest, '×', a, (round + rest) * a,
        'Calcule ' + round + ' × ' + a + ' et ' + rest + ' × ' + a + ', puis additionne.');
    }
  ],
  doubles: [
    'Doubles et moitiés',
    difficulty => {
      if (difficulty === 0 && pick([true, false])) {
        const a = random(1, 7) * 2 + 1;
        return item('La moitié de ' + a + ' ?', a / 2, 'Partage le nombre pair précédent, puis ajoute 0,5.');
      }
      const a = difficulty === 0 ? random(11, 49) : random(16, 999) / 10;
      return pick([
        item('Le double de ' + format(a) + ' ?', a * 2, 'Additionne le nombre avec lui-même.'),
        item('La moitié de ' + format(a * 2) + ' ?', a, 'Sépare la partie entière et la partie décimale si cela aide.')
      ]);
    }
  ],
  triples: ['Triples et tiers', difficulty => shares(difficulty, 3, 'triple', 'tiers')],
  quarters: ['Quadruples et quarts', difficulty => shares(difficulty, 4, 'quadruple', 'quart')],
  divide: [
    'Diviser par 4 ou par 8',
    difficulty => {
      const divisor = pick([4, 8]);
      const quotient = random(6, [30, 75, 150][difficulty]) / (difficulty === 2 ? 2 : 1);
      return expression(quotient * divisor, '÷', divisor, quotient,
        divisor === 4 ? 'Prends la moitié deux fois.' : 'Prends la moitié trois fois.');
    }
  ],
  decimals: [
    'Additions et soustractions avec des décimaux',
    difficulty => {
      const a = random(11, 89) / 10;
      if (difficulty === 0 || pick([true, false])) {
        const b = random(11, 89) / 10;
        return expression(a, '+', b, a + b, 'Additionne les parties entières et les dixièmes séparément.');
      }
      const b = random(1, 7);
      return pick([
        expression(a, '+', b, a + b, 'Ajoute les unités et garde les dixièmes.'),
        expression(a + b, '−', b, a, 'Retire les unités et garde les dixièmes.')
      ]);
    }
  ],
  fractions: [
    'Fractions usuelles et décimaux',
    difficulty => {
      if (difficulty > 0 && pick([true, false])) {
        const numerator = random(1, 4);
        return item(numerator + '/2 = □/4', numerator * 2, 'Pour passer des demis aux quarts, double le numérateur.');
      }
      const [fraction, answer] = pick(difficulty === 0 ?
        [['1/2', 0.5], ['1/4', 0.25], ['3/4', 0.75], ['1/5', 0.2]] :
        [['1/2', 0.5], ['1/4', 0.25], ['3/4', 0.75], ['1/5', 0.2], ['2/5', 0.4], ['1/10', 0.1]]);
      return item('Écris ' + fraction + ' en décimal.', answer, 'Cherche une fraction équivalente en dixièmes ou en centièmes.');
    }
  ],
  steps: [
    'Calculs en deux étapes',
    difficulty => {
      const a = random(8, [18, 37, 63][difficulty]);
      const b = random(2, 8);
      return item('(' + a + ' × 5) − ' + b + ' = ?', a * 5 - b, 'Calcule d’abord le produit, puis soustrais ' + b + '.');
    }
  ]
};

function complement(target, given) {
  return item(given + ' + □ = ' + target, target - given, 'Combien manque-t-il pour atteindre ' + target + ' ?');
}

function shares(difficulty, factor, multiple, part) {
  const value = random(4, [15, 60, 125][difficulty]);
  return pick([
    item('Le ' + multiple + ' de ' + value + ' ?', value * factor, 'Multiplie par ' + factor + '.'),
    item('Le ' + part + ' de ' + value * factor + ' ?', value, 'Divise par ' + factor + '.'),
    ...(difficulty === 2 ?
      [item('Le ' + part + ' de quel nombre vaut ' + value + ' ?', value * factor, 'Repars du résultat et multiplie par ' + factor + '.')] : [])
  ]);
}

const difficultyByLevel = { moyen: 0, expert: 1, defi: 2 };
const mixByDifficulty = [
  ['add', 'sub', 'holes', 'comp10', 'comp100', 'near', 'tables', 'times5', 'doubles', 'triples', 'quarters'],
  ['add', 'sub', 'holes', 'comp100', 'comp1000', 'near', 'tables', 'times5', 'times50', 'place', 'distribute', 'doubles', 'triples', 'quarters', 'divide', 'decimals', 'fractions'],
  ['holes', 'comp1000', 'near', 'tables', 'times5', 'times50', 'place', 'distribute', 'doubles', 'triples', 'quarters', 'divide', 'decimals', 'fractions', 'steps']
];

function setEnabled(side, enabled) {
  forms[side].querySelectorAll('input, button').forEach(control => control.disabled = !enabled);
}

function nextQuestion(side) {
  if (mode === 'practice') {
    questions[side] = practice[scores[side]];
  } else {
    const difficulty = difficultyByLevel[level];
    const selected = operation === 'mix' ? pick(mixByDifficulty[difficulty]) : operation;
    questions[side] = families[selected][1](difficulty);
  }
  const question = questions[side];
  $('calc' + side).textContent = mode === 'practice' ? question.text + ' = ?' : question.text;
}

function stop() {
  active = false;
  clearInterval(timer);
  setEnabled(0, false);
  setEnabled(1, false);
}

function pull(side) {
  scores[side]++;
  position += side === 0 ? -1 : 1;
  $('pull').style.transform = 'translateX(' + position * pullStep + 'px)';
  const cast = $('pull');
  cast.removeAttribute('data-side');
  cancelAnimationFrame(poseFrame);
  poseFrame = requestAnimationFrame(() => {
    poseFrame = requestAnimationFrame(() => cast.dataset.side = side);
  });
  $('score' + side).textContent = scores[side] + (scores[side] === 1 ? ' bonne réponse' : ' bonnes réponses');
  if (mode === 'practice') {
    $('race').textContent = scores[0] + ' calcul' + (scores[0] > 1 ? 's' : '') + ' réussi' + (scores[0] > 1 ? 's' : '') + ' sur 3';
    if (scores[0] === practice.length) {
      stop();
      $('feedback0').textContent = 'Bravo, tu sais tirer la corde !';
      $('practiceNext').hidden = false;
      $('practiceNext').focus();
    }
    return;
  }
  const leader = position < 0 ? 'Zoum' : 'Maï';
  if (Math.abs(position) === finishLine) {
    stop();
    $('arena').style.setProperty('--kick', position < 0 ? '-9px' : '9px');
    $('arena').classList.add('won');
    $('winner').textContent = leader + ' remporte le duel !';
    $('race').textContent = $('winner').textContent;
    $('result').hidden = false;
    $('replay').focus();
  } else {
    $('race').textContent = position === 0 ? 'À égalité !' : leader + ' mène. Encore ' + (finishLine - Math.abs(position)) + ' pour gagner.';
  }
}

function start(selectedMode) {
  stop();
  mode = selectedMode;
  level = $('level').value;
  operation = $('operation').value;
  position = 0;
  scores = [0, 0];
  questions = [];
  active = true;
  document.body.classList.add('playing');
  $('home').hidden = true;
  $('board').hidden = false;
  $('board').dataset.mode = mode;
  $('arena').classList.remove('won');
  $('result').hidden = true;
  $('practiceNext').hidden = true;
  cancelAnimationFrame(poseFrame);
  $('pull').removeAttribute('data-side');
  $('pull').style.transform = '';
  $('mai').hidden = mode === 'practice';
  forms[1].hidden = mode !== 'duo';
  $('feedback1').hidden = mode !== 'duo';
  $('race').textContent = mode === 'practice' ? 'À ton rythme · 3 calculs' : 'Tire le nœud jusqu’au repère de ton côté.';
  for (const side of [0, 1]) {
    $('answer' + side).value = '';
    $('feedback' + side).textContent = '';
    $('score' + side).textContent = '0 bonne réponse';
  }
  setEnabled(0, true);
  setEnabled(1, mode === 'duo');
  nextQuestion(0);
  if (mode === 'duo') nextQuestion(1);
  else $('calc1').textContent = 'Adversaire';
  if (mode !== 'duo') $('answer0').focus({ preventScroll: true });
  if (mode === 'cpu') timer = setInterval(() => pull(1), maïDelay[level]);
}

forms.forEach(form => {
  const field = form.querySelector('input');
  const keypad = form.querySelector('.keypad');
  keypad.setAttribute('aria-label', Number(form.dataset.side) ? 'Clavier de Maï' : 'Clavier de Zoum');
  for (const key of ['1', '2', '3', '⌫', '4', '5', '6', ',', '7', '8', '9', '0', '✓']) {
    const button = document.createElement('button');
    button.textContent = key;
    button.type = key === '✓' ? 'submit' : 'button';
    if (key === '✓') {
      button.className = 'primary';
      button.setAttribute('aria-label', 'Valider');
    } else {
      if (key === ',') button.setAttribute('aria-label', 'Virgule');
      if (key === '⌫') button.setAttribute('aria-label', 'Effacer un chiffre');
      button.addEventListener('click', () => {
        const start = field.selectionStart;
        const end = field.selectionEnd;
        if (key === '⌫') {
          const from = start === end ? Math.max(0, start - 1) : start;
          field.setRangeText('', from, end, 'end');
        } else if (field.value.length - (end - start) < 12) {
          field.setRangeText(key, start, end, 'end');
        }
      });
    }
    keypad.append(button);
  }
});

forms.forEach(form => form.addEventListener('submit', event => {
  event.preventDefault();
  const side = Number(form.dataset.side);
  if (!active || !questions[side]) return;
  const field = $('answer' + side);
  const feedback = $('feedback' + side);
  const value = field.value.trim();
  if (!/^\d+(?:[,.]\d+)?$/.test(value) || Number(value.replace(',', '.')) !== questions[side].answer) {
    feedback.textContent = value === '' ? 'Écris ta réponse.' : (questions[side].hint || 'Essaie encore !');
    field.select();
    return;
  }
  field.value = '';
  feedback.textContent = 'Bien joué !';
  pull(side);
  if (active) {
    nextQuestion(side);
  }
}));

starts.forEach(button => button.addEventListener('click', () => start(button.dataset.start)));
$('practiceNext').addEventListener('click', () => start('cpu'));
$('replay').addEventListener('click', () => start(mode));
$('menu').addEventListener('click', () => {
  stop();
  document.body.classList.remove('playing');
  $('board').hidden = true;
  $('home').hidden = false;
  starts.find(button => button.dataset.start === mode).focus();
});
for (const [value, [label]] of Object.entries(families)) {
  const option = document.createElement('option');
  option.value = value;
  option.textContent = label;
  $('operation').append(option);
}
</script>
</body>
</html>
