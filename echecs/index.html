<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zou Échecs — Échiquier</title><style>
:root{font-family:Arial,sans-serif;color:#f5f7fa;background:#17283a}*{box-sizing:border-box}body{margin:0;padding:20px}.app{max-width:1100px;margin:auto}h1{margin:0 0 6px}.intro{color:#bdd1e2;margin:0 0 18px}.layout{display:grid;grid-template-columns:minmax(0,720px) 240px;gap:24px;align-items:start}.board{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);border:4px solid #314b5f;border-radius:5px;overflow:hidden;touch-action:manipulation}.sq{border:0;padding:0;position:relative;display:grid;place-items:center;cursor:pointer;min-width:0}.light{background:#eeeed2}.dark{background:#769656}.sq.selected{background:#f0d45b}.sq.last:not(.selected){box-shadow:inset 0 0 0 999px #e8d95666}.sq.legal::after{content:"";position:absolute;width:24%;aspect-ratio:1;border-radius:50%;background:#243f3199;pointer-events:none}.sq.capture::after{content:"";position:absolute;inset:4%;border:5px solid #ce8e3c;border-radius:50%;pointer-events:none}.piece{width:94%;height:94%;object-fit:contain;pointer-events:none;user-select:none}.coord{position:absolute;bottom:2px;right:3px;font-weight:800;font-size:clamp(9px,1.5vw,14px);opacity:.8}.light .coord{color:#769656}.dark .coord{color:#eeeed2}.panel{background:#20364b;border-radius:16px;padding:18px}.panel button{width:100%;padding:12px;margin:6px 0;background:#304f67;color:white;border:1px solid #53738c;border-radius:10px;font-weight:700;cursor:pointer}.panel button:hover{background:#406a83}.status{min-height:55px;line-height:1.5}.hint{color:#c2d3e1;font-size:13px}a{color:#addaff}@media(max-width:760px){body{padding:10px}.layout{grid-template-columns:1fr;gap:12px}.panel{display:grid;grid-template-columns:1fr 1fr;gap:8px}.panel .status,.panel .hint{grid-column:1/-1}.panel button{margin:0}.board{border-width:2px}}</style></head><body><main class="app"><h1>♟ Zou Échecs</h1><p class="intro">L'échiquier interactif · Choisis une pièce puis une case.</p><div class="layout"><div id="board" class="board" aria-label="Échiquier interactif"></div><aside class="panel"><div class="status" id="status" aria-live="polite">Aux blancs de jouer.</div><button id="reset">↻ Recommencer</button><button id="flip">⇅ Retourner</button><button id="undo">↶ Annuler</button><p class="hint">Points : déplacements possibles. Cercle : capture. Les règles complètes sont appliquées (échec, roque, prise en passant, promotion automatique en dame).</p><p class="hint"><a href="../index.html">← Retour à Zoumaï</a></p></aside></div></main><script type="module">
import {Chess} from 'https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm';
const game=new Chess(),board=document.querySelector('#board'),status=document.querySelector('#status');let selected=null,flipped=false,last=null;
const files='abcdefgh',names={p:'pawn',r:'rook',n:'knight',b:'bishop',q:'queen',k:'king'};
function draw(){board.innerHTML='';const all=game.board();for(let visual=0;visual<64;visual++){let rank=flipped?visual>>3:7-(visual>>3),file=flipped?7-visual%8:visual%8;const square=files[file]+(rank+1),p=all[7-rank][file];let legal=selected?game.moves({square:selected,verbose:true}).some(m=>m.to===square):false;let capture=legal&&!!p;const cell=document.createElement('button');cell.className='sq '+((file+rank)%2?'light':'dark')+(selected===square?' selected':'')+(last&&(last.from===square||last.to===square)?' last':'')+(legal?(capture?' capture':' legal'):'');cell.setAttribute('aria-label',square+(p?' '+(p.color==='w'?'blanc ':'noir ')+names[p.type]:''));if(p){const img=document.createElement('img');img.className='piece';img.alt='';img.draggable=false;img.src='https://lichess1.org/assets/piece/cburnett/'+p.color+p.type+'.svg';cell.append(img)}if((flipped?rank===7:rank===0)||(flipped?file===7:file===0)){let c=document.createElement('span');c.className='coord';c.textContent=(flipped?rank===7:rank===0?files[file]:'');if((flipped?rank===7:rank===0))c.textContent=files[file];cell.append(c)}cell.onclick=()=>click(square,p);board.append(cell)}status.textContent=game.isCheckmate()?'Échec et mat !':game.isDraw()?'Partie nulle.':(game.turn()==='w'?'Aux blancs':'Aux noirs')+' de jouer'+(game.isCheck()?' — Échec !':'')+'.'}
function click(sq,p){if(selected){let moves=game.moves({square:selected,verbose:true});if(moves.some(m=>m.to===sq)){try{last=game.move({from:selected,to:sq,promotion:'q'});selected=null;draw();return}catch(e){}}}selected=p&&p.color===game.turn()?sq:null;draw()}
document.querySelector('#reset').onclick=()=>{game.reset();selected=null;last=null;draw()};document.querySelector('#flip').onclick=()=>{flipped=!flipped;draw()};document.querySelector('#undo').onclick=()=>{game.undo();selected=null;last=game.history({verbose:true}).at(-1)||null;draw()};draw();
</script></body></html>
