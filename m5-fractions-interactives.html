*{box-sizing:border-box}body{margin:0;background:#f1eee6;color:#193241;font:17px system-ui,sans-serif}.wrap{max-width:940px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}a{color:#176d72}.hero{background:#123b50;color:white;border-radius:24px;padding:24px;margin:18px 0}.hero h1{margin:4px 0}.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px}.tabs button,.btn{border:0;border-radius:12px;padding:13px;background:white;color:#193241;font-weight:800;cursor:pointer}.tabs button.active,.btn.primary{background:#157b72;color:white}.panel{background:white;border-radius:22px;padding:24px;margin-top:15px;min-height:340px;box-shadow:0 8px 30px #163b5012}h2{margin-top:0}#prompt{font-size:1.25rem;font-weight:750}#visual{margin:22px auto;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:12px;min-height:110px}#answers{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.btn{border:2px solid #cbdde1;min-width:85px}.btn:hover{border-color:#157b72}.btn:disabled{opacity:.5}#feedback{min-height:55px;padding:10px 0;font-weight:700}#progress{color:#526b76}svg{max-width:100%;touch-action:manipulation}.piece{cursor:pointer}.piece:hover{filter:brightness(.94)}.muted{color:#516a73}.quantity{display:grid;grid-template-columns:repeat(6,36px);gap:6px}.dot{width:34px;height:34px;border-radius:50%;background:#cde2ed;border:2px solid #88b1c5;cursor:pointer}.dot.on{background:#f4aa57;border-color:#ad6622}.action{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}@media(max-width:600px){.panel{padding:16px}.wrap{padding:12px}.tabs{grid-template-columns:repeat(2,1fr)}} </style></head><body><div class="wrap"><header><a href="maths-lecons-cm2.html">← Mathématiques CM2</a><a href="ressources.html#ma">Ressources</a></header><div class="hero"><small>LEÇON M5 · CM2</small><h1>Fractions (2)</h1><p>Explore, place, colorie et partage. Six ateliers pour devenir expert des fractions.</p></div><nav class="tabs" id="tabs"></nav><main class="panel"><div id="progress"></div><h2 id="heading"></h2><div id="prompt"></div><div id="visual"></div><div id="answers"></div><div id="feedback" aria-live="polite"></div><div class="action"><button class="btn" id="hint">💡 Un indice</button><button class="btn primary" id="next">Question suivante →</button></div></main></div><script>
const titles=['La droite graduée','Fractions jumelles','Camemberts à colorier','Plus grand que 1 ?','Je partage','Défis du quotidien'];let mode=0,step=0,correct=0,done=false,question={},selected=new Set();const $=id=>document.getElementById(id),random=a=>a[Math.floor(Math.random()*a.length)],gcd=(a,b)=>b?gcd(b,a%b):a,frac=(n,d)=>n+'/'+d;
function choices(values,answer){$('answers').innerHTML='';values.sort(()=>Math.random()-.5).forEach(v=>{let b=document.createElement('button');b.className='btn';b.textContent=v;b.onclick=()=>check(v===answer,'Bonne réponse !');$('answers').append(b)})}
function check(ok,msg){if(done)return;if(ok){done=true;correct++;$('feedback').textContent='✓ '+msg;$('feedback').style.color='#08755b'}else{$('feedback').textContent='Pas encore. Observe les parts et essaie de nouveau.';$('feedback').style.color='#b15c1d'}}
function disk(d,n,idx){let s='<svg width="135" height="135" viewBox="0 0 120 120" role="group" aria-label="Disque '+(idx+1)+' partagé en '+d+' parts">';for(let k=0;k<d;k++){let a=-Math.PI/2+k*2*Math.PI/d,b=a+2*Math.PI/d,x=60+51*Math.cos(a),y=60+51*Math.sin(a),xx=60+51*Math.cos(b),yy=60+51*Math.sin(b),id=idx*d+k;s+='<path class="piece" data-id="'+id+'" d="M60 60 L'+x+' '+y+' A51 51 0 '+(d===1?1:0)+' 1 '+xx+' '+yy+' Z" fill="'+(selected.has(id)?'#f4aa57':'#e6f2f6')+'" stroke="#42687c" stroke-width="1.7"/>'}return s+'</svg>'}
function renderDisks(){let out='';for(let i=0;i<question.disks;i++)out+=disk(question.d,question.n,i);$('visual').innerHTML=out;$('visual').querySelectorAll('.piece').forEach(p=>p.onclick=()=>{let id=+p.dataset.id;selected.has(id)?selected.delete(id):selected.add(id);renderDisks()})}
function line(){let d=question.d,n=question.n,w=330,start=16,end=318,unit=(end-start)/(3*d),out='<svg viewBox="0 0 350 125" width="100%" aria-label="Demi-droite graduée de zéro à trois"><line x1="16" y1="55" x2="333" y2="55" stroke="#193241" stroke-width="2"/><path d="M333 55 l-9 -5 v10z" fill="#193241"/>';for(let i=0;i<=3*d;i++){let x=start+i*unit;out+='<line x1="'+x+'" y1="47" x2="'+x+'" y2="63" stroke="#193241"/>';if(i%d===0)out+='<text x="'+x+'" y="82" text-anchor="middle" font-size="14">'+i/d+'</text>';out+='<circle data-v="'+i+'" cx="'+x+'" cy="55" r="11" fill="transparent" style="cursor:pointer"/>'}out+='<text x="170" y="113" text-anchor="middle" font-size="12">Touche la graduation choisie</text></svg>';$('visual').innerHTML=out;$('visual').querySelectorAll('circle').forEach(c=>c.onclick=()=>{let v=+c.dataset.v;check(v===n,'Tu as placé '+n+'/'+d+' au bon endroit.');if(done){c.setAttribute('fill','#f4aa57');c.setAttribute('r','7')}})}
function make(){done=false;selected.clear();$('feedback').textContent='';$('answers').innerHTML='';$('visual').innerHTML='';$('progress').textContent='Question '+(step+1)+' sur 8 · '+correct+' réussite(s)';$('heading').textContent=titles[mode];let d,n,total,a,b;
if(mode===0){d=random([2,3,4]);n=Math.floor(Math.random()*(3*d-1))+1;question={d,n};$('prompt').textContent='Place '+frac(n,d)+' sur la demi-droite.';line()}
if(mode===1){d=random([2,3,4]);n=random([d+1,d+2,2*d+1]);let k=random([2,3]),answer=frac(n*k,d*k),mixed=Math.floor(n/d)+' + '+(n%d)+'/'+d;question={answer};$('prompt').textContent='Quelle fraction représente le même nombre que '+frac(n,d)+' ?';choices([answer,frac(n*k+1,d*k),frac(n*k,d*k+1),frac(n,d*k)],answer);$('visual').textContent='Indice visuel : '+mixed}
if(mode===2){d=random([2,3,4]);n=random([d+1,d+2,2*d+1,2*d+2]);question={d,n,disks:Math.ceil(n/d)+1};$('prompt').textContent='Colorie exactement '+frac(n,d)+' ('+Math.floor(n/d)+' + '+(n%d)+'/'+d+').';renderDisks();let btn=document.createElement('button');btn.className='btn primary';btn.textContent='Vérifier mon coloriage';btn.onclick=()=>check(selected.size===n,'Tu as colorié '+n+' parts de taille 1/'+d+'.');$('answers').append(btn)}
if(mode===3){d=random([2,3,4,5,10]);n=random([d-1,d,d+1,d+2,2*d]);question={d,n};$('prompt').textContent='La fraction '+frac(n,d)+' est-elle inférieure, égale ou supérieure à 1 ?';choices(['Inférieure à 1','Égale à 1','Supérieure à 1'],n<d?'Inférieure à 1':n===d?'Égale à 1':'Supérieure à 1')}
if(mode===4){d=random([2,3,4,10]);let unit=random([2,3,4,5]),count=d*unit;question={d,n:1,total:count,answer:unit};$('prompt').textContent='Voici '+count+' objets. Combien représente 1/'+d+' de cette collection ?';$('visual').innerHTML='<div class="quantity">'+Array.from({length:count},()=>'<span class="dot"></span>').join('')+'</div>';let btn=document.createElement('button');btn.className='btn primary';btn.textContent='Vérifier';$('answers').append(btn);$('visual').querySelectorAll('.dot').forEach(el=>el.onclick=()=>el.classList.toggle('on'));btn.onclick=()=>check($('visual').querySelectorAll('.dot.on').length===unit,'Une part contient '+unit+' objets.')}
if(mode===5){let cases=[[60,4,1,'minutes'],[60,2,1,'minutes'],[60,3,2,'minutes'],[12,3,2,'billes'],[20,4,3,'élèves'],[100,10,1,'euros'],[24,3,1,'cartes'],[40,4,3,'litres']];let [amount,den,num,unit]=random(cases);question={d:den,n:num,total:amount,answer:amount/den*num};$('prompt').textContent='Combien font '+num+'/'+den+' de '+amount+' '+unit+' ?';$('visual').innerHTML='<p class="muted">Étape 1 : partage '+amount+' en '+den+' parts égales.<br>Étape 2 : prends '+num+' part(s).</p>';choices([String(question.answer),String(amount/den),String(question.answer+amount/den),String(amount)],String(question.answer))}
}
$('hint').onclick=()=>{let t=mode===0?'Chaque unité est divisée en '+question.d+' parts.':mode===1?'Multiplie le numérateur et le dénominateur par le même nombre.':mode===2?'Un disque entier représente '+question.d+'/'+question.d+'.':mode===3?'Compare le numérateur et le dénominateur.':mode===4?'Partage la collection en '+question.d+' groupes égaux.':'Calcule d’abord '+question.total+' ÷ '+question.d+', puis multiplie par '+question.n+'.';$('feedback').textContent='💡 '+t;$('feedback').style.color='#31677b'};
$('next').onclick=()=>{if(step===7){$('feedback').textContent='Parcours terminé : '+correct+' bonnes réponses sur 8. Tu peux recommencer ou choisir un autre atelier.';step=-1;correct=0;$('next').textContent='Recommencer →';return}step++;$('next').textContent='Question suivante →';make()};
function tabs(){titles.forEach((t,i)=>{let b=document.createElement('button');b.textContent=(i+1)+'. '+t;b.onclick=()=>{mode=i;step=0;correct=0;tabsActive();make()};$('tabs').append(b)});tabsActive()}function tabsActive(){[...$('tabs').children].forEach((b,i)=>b.classList.toggle('active',i===mode))}tabs();make();
</script><script src="site-tracking.js" defer></script></body></html>
