<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M5 · Fractions (2) · Zou Maï</title><link rel="stylesheet" href="zoumai-brand.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f1eee6;color:#193241;font:17px system-ui,sans-serif}.wrap{max-width:940px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}a{color:#176d72}.hero{background:#123b50;color:white;border-radius:24px;padding:24px;margin:18px 0}.hero h1{margin:4px 0}.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px}.tabs button,.btn{border:0;border-radius:12px;padding:13px;background:white;color:#193241;font-weight:800;cursor:pointer}.tabs button.active,.btn.primary{background:#157b72;color:white}.panel{background:white;border-radius:22px;padding:24px;margin-top:15px;min-height:340px;box-shadow:0 8px 30px #163b5012}h2{margin-top:0}#prompt{font-size:1.25rem;font-weight:750}#visual{margin:22px auto;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:12px;min-height:110px}#answers{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.btn{border:2px solid #cbdde1;min-width:85px}.btn:hover{border-color:#157b72}.btn:disabled{opacity:.5}#feedback{min-height:55px;padding:10px 0;font-weight:700}#progress{color:#526b76}svg{max-width:100%;touch-action:manipulation}.piece{cursor:pointer}.piece:hover{filter:brightness(.94)}.muted{color:#516a73}.quantity{display:grid;grid-template-columns:repeat(var(--cols),minmax(18px,32px));gap:7px;justify-content:center;max-width:100%}.quantity .dot{width:clamp(18px,5vw,32px);height:clamp(18px,5vw,32px)}.scene{display:flex;flex-direction:column;align-items:center;gap:12px}.tank{width:min(290px,90%);height:100px;border:4px solid #42687c;border-radius:18px;overflow:hidden;position:relative;background:linear-gradient(to top,#63bbd4 50%,#f1f8fa 50%)}.tank:after{content:"";position:absolute;top:50%;left:0;right:0;border-top:2px dashed #42687c}.clock{font-size:65px}.story{max-width:550px;text-align:center;font-size:1.2rem}.stephelp{font-size:1rem;color:#34667b;background:#eaf6f8;border-radius:12px;padding:12px}.group{padding:10px;border:2px solid #aacbd4;border-radius:14px;background:#f4fafb;display:grid;grid-template-columns:repeat(var(--cols),minmax(20px,34px));gap:5px}.groups{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;max-width:850px}.dot{width:34px;height:34px;border-radius:50%;background:#cde2ed;border:2px solid #88b1c5;cursor:pointer}.dot.on{background:#f4aa57;border-color:#ad6622}.action{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}@media(max-width:600px){.panel{padding:16px}.wrap{padding:12px}.tabs{grid-template-columns:repeat(2,1fr)}} </style></head><body><div class="wrap"><header><a href="maths-lecons-cm2.html">← Mathématiques CM2</a><a href="ressources.html#ma">Ressources</a></header><div class="hero"><small>LEÇON M5 · CM2</small><h1>Fractions (2)</h1><p>Explore, place, colorie et partage. Six ateliers pour devenir expert des fractions.</p></div><nav class="tabs" id="tabs"></nav><main class="panel"><div id="progress"></div><h2 id="heading"></h2><div id="prompt"></div><div id="visual"></div><div id="answers"></div><div id="feedback" aria-live="polite"></div><div class="action"><button class="btn" id="hint">💡 Un indice</button><button class="btn primary" id="next">Question suivante →</button></div></main></div><script>
const titles=['La droite graduée','Fractions jumelles','Camemberts à colorier','Plus grand que 1 ?','Je partage','Défis du quotidien'];let mode=0,step=0,correct=0,done=false,question={},selected=new Set(),seenQuestions=Array.from({length:6},()=>new Set());const $=id=>document.getElementById(id),random=a=>a[Math.floor(Math.random()*a.length)],gcd=(a,b)=>b?gcd(b,a%b):a,frac=(n,d)=>n+'/'+d;
function choices(values,answer){$('answers').innerHTML='';[...new Set(values.map(String))].sort(()=>Math.random()-.5).forEach(v=>{let b=document.createElement('button');b.className='btn';b.textContent=v;b.onclick=()=>check(v===answer,'Bonne réponse !');$('answers').append(b)})}
function check(ok,msg){if(done)return;if(ok){done=true;correct++;$('feedback').textContent='✓ '+msg;$('feedback').style.color='#08755b'}else{$('feedback').textContent='Pas encore. Observe les parts et essaie de nouveau.';$('feedback').style.color='#b15c1d'}}
function disk(d,n,idx){let s='<svg width="135" height="135" viewBox="0 0 120 120" role="group" aria-label="Disque '+(idx+1)+' partagé en '+d+' parts">';for(let k=0;k<d;k++){let a=-Math.PI/2+k*2*Math.PI/d,b=a+2*Math.PI/d,x=60+51*Math.cos(a),y=60+51*Math.sin(a),xx=60+51*Math.cos(b),yy=60+51*Math.sin(b),id=idx*d+k;s+='<path class="piece" data-id="'+id+'" d="M60 60 L'+x+' '+y+' A51 51 0 '+(d===1?1:0)+' 1 '+xx+' '+yy+' Z" fill="'+(selected.has(id)?'#f4aa57':'#e6f2f6')+'" stroke="#42687c" stroke-width="1.7"/>'}return s+'</svg>'}
function renderDisks(){let out='';for(let i=0;i<question.disks;i++)out+=disk(question.d,question.n,i);$('visual').innerHTML=out;$('visual').querySelectorAll('.piece').forEach(p=>p.onclick=()=>{let id=+p.dataset.id;selected.has(id)?selected.delete(id):selected.add(id);renderDisks()})}
function line(){let d=question.d,n=question.n,w=330,start=16,end=318,unit=(end-start)/(3*d),out='<svg viewBox="0 0 350 125" width="100%" aria-label="Demi-droite graduée de zéro à trois"><line x1="16" y1="55" x2="333" y2="55" stroke="#193241" stroke-width="2"/><path d="M333 55 l-9 -5 v10z" fill="#193241"/>';for(let i=0;i<=3*d;i++){let x=start+i*unit;out+='<line x1="'+x+'" y1="47" x2="'+x+'" y2="63" stroke="#193241"/>';if(i%d===0)out+='<text x="'+x+'" y="82" text-anchor="middle" font-size="14">'+i/d+'</text>';out+='<circle data-v="'+i+'" cx="'+x+'" cy="55" r="11" fill="transparent" style="cursor:pointer"/>'}out+='<text x="170" y="113" text-anchor="middle" font-size="12">Touche la graduation choisie</text></svg>';$('visual').innerHTML=out;$('visual').querySelectorAll('circle').forEach(c=>c.onclick=()=>{let v=+c.dataset.v;check(v===n,'Tu as placé '+n+'/'+d+' au bon endroit.');if(done){c.setAttribute('fill','#f4aa57');c.setAttribute('r','7')}})}
function makeCandidate(){done=false;selected.clear();$('feedback').textContent='';$('answers').innerHTML='';$('visual').innerHTML='';$('progress').textContent='Question '+(step+1)+' sur 8 · '+correct+' réussite(s)';$('heading').textContent=titles[mode];let d,n,total,a,b;
if(mode===0){d=random([2,3,4]);n=Math.floor(Math.random()*(3*d-1))+1;question={d,n};$('prompt').textContent='Place '+frac(n,d)+' sur la demi-droite.';line()}
if(mode===1){d=random([2,3,4]);let whole=random([1,2]),rem=random([1,d-1]),n=whole*d+rem;let answer=whole+' + '+rem+'/'+d;question={d,n,whole,rem,answer};$('prompt').textContent='Complète : '+n+'/'+d+' = …';$('visual').innerHTML='<p class="muted">Dans '+n+'/'+d+', combien y a-t-il d’unités entières et de parts restantes ?</p>';choices([answer,(whole+1)+' + '+rem+'/'+d,whole+' + '+(rem+1)+'/'+d,(whole-1)+' + '+rem+'/'+d],answer)}
if(mode===2){d=random([2,3,4]);n=random([d+1,d+2,2*d+1,2*d+2]);question={d,n,disks:Math.ceil(n/d)+1};$('prompt').textContent='Colorie exactement '+frac(n,d)+' ('+Math.floor(n/d)+' + '+(n%d)+'/'+d+').';renderDisks();let btn=document.createElement('button');btn.className='btn primary';btn.textContent='Vérifier mon coloriage';btn.onclick=()=>check(selected.size===n,'Tu as colorié '+n+' parts de taille 1/'+d+'.');$('answers').append(btn)}
if(mode===3){d=random([2,3,4,5,10]);n=random([d-1,d,d+1,d+2,2*d]);question={d,n};$('prompt').textContent='La fraction '+frac(n,d)+' est-elle inférieure, égale ou supérieure à 1 ?';choices(['Inférieure à 1','Égale à 1','Supérieure à 1'],n<d?'Inférieure à 1':n===d?'Égale à 1':'Supérieure à 1')}
if(mode===4){let cases=[[30,10,1,10],[40,4,1,10],[24,3,2,8],[36,4,3,9],[60,3,1,10],[60,3,2,10],[20,2,1,10],[48,4,3,12],[12,3,2,4],[40,10,3,10],[30,3,2,10],[60,10,1,10]];let [count,den,num,cols]=random(cases);let target=count/den*num;question={d:den,n:num,total:count,answer:target};$('prompt').textContent='Sélectionne '+num+'/'+den+' de '+count+' jetons.';$('visual').innerHTML='<div class="scene"><div class="quantity" style="--cols:'+cols+'" aria-label="'+count+' jetons alignés">'+Array.from({length:count},()=>'<span class="dot" role="button" tabindex="0" aria-label="Jeton à sélectionner"></span>').join('')+'</div><small class="muted">Les jetons sont alignés, mais les parts ne sont pas indiquées.</small></div>';let btn=document.createElement('button');btn.className='btn primary';btn.textContent='Vérifier ma sélection';$('answers').append(btn);$('visual').querySelectorAll('.dot').forEach(el=>{let toggle=()=>el.classList.toggle('on');el.onclick=toggle;el.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();toggle()}}});btn.onclick=()=>check($('visual').querySelectorAll('.dot.on').length===target,'Tu as sélectionné '+target+' jetons. '+count+' ÷ '+den+' = '+count/den+', puis '+(count/den)+' × '+num+' = '+target+'.')}
if(mode===5){let cases=[
{total:60,d:3,n:2,unit:'jetons',story:'Tu disposes de 60 jetons. Tu en offres les deux tiers. Combien en offres-tu ?',type:'dots'},
{total:60,d:3,n:1,unit:'jetons',story:'Tu as 60 jetons. Combien représentent un tiers de cette collection ?',type:'dots'},
{total:12,d:3,n:2,unit:'fraises',story:'Tu as 12 fraises et tu en manges les deux tiers. Combien de fraises as-tu mangées ?',type:'fruit'},
{total:24,d:4,n:3,unit:'fraises',story:'Un panier contient 24 fraises. Tu utilises les trois quarts pour un dessert. Combien de fraises utilises-tu ?',type:'fruit'},
{total:50,d:2,n:1,unit:'litres',story:'Un réservoir peut contenir 50 litres. Il est rempli à moitié. Combien de litres contient-il ?',type:'tank'},
{total:60,d:4,n:1,unit:'minutes',story:'Une heure dure 60 minutes. Combien de minutes représente un quart d’heure ?',type:'clock'},
{total:60,d:3,n:2,unit:'minutes',story:'Un film dure 60 minutes. Tu en as regardé les deux tiers. Combien de minutes as-tu regardées ?',type:'clock'},
{total:12,d:3,n:2,unit:'grammes',story:'Une recette utilise les deux tiers d’un sachet de 12 grammes. Combien de grammes sont utilisés ?',type:'scale'},
{total:60,d:3,n:2,unit:'grammes',story:'Un paquet contient 60 grammes de graines. Un oiseau en mange les deux tiers. Combien de grammes mange-t-il ?',type:'scale'},
{total:20,d:4,n:3,unit:'élèves',story:'Dans une classe de 20 élèves, les trois quarts participent à un tournoi. Combien d’élèves participent ?',type:'people'},
{total:100,d:10,n:1,unit:'euros',story:'Tu économises un dixième de 100 euros. Combien d’euros mets-tu de côté ?',type:'money'},
{total:36,d:3,n:2,unit:'cartes',story:'Tu possèdes 36 cartes. Tu en distribues les deux tiers. Combien de cartes distribues-tu ?',type:'cards'}];let v=random(cases),answer=v.total/v.d*v.n;question={...v,answer};$('prompt').textContent=v.story;let icon={fruit:'🍓',clock:'🕒',scale:'⚖️',people:'👥',money:'💶',cards:'🃏',dots:'🔵',tank:'💧'}[v.type];let art=v.type==='tank'?'<div class="tank" aria-label="Réservoir rempli à moitié"></div>':v.type==='fruit'&&v.total<=24?'<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:6px;font-size:26px">'+Array.from({length:v.total},()=>'<span>🍓</span>').join('')+'</div>':'<div style="font-size:55px">'+icon+'</div>'; $('visual').innerHTML='<div class="scene">'+art+'<div class="story">'+v.total+' '+v.unit+' · '+v.n+'/'+v.d+'</div></div>';let vals=[answer,v.total/v.d,answer+v.total/v.d,v.total];for(let offset=1;new Set(vals).size<4;offset++)vals.push(answer+offset);choices([...new Set(vals)].slice(0,4).map(String),String(answer))}

}
function questionKey(){if(mode===5)return question.story;if(mode===4)return [question.total,question.d,question.n].join(':');return [question.d,question.n,question.whole??'',question.rem??''].join(':')}
function make(){let key,tries=0;do{makeCandidate();key=questionKey();tries++}while(seenQuestions[mode].has(key)&&tries<300);if(seenQuestions[mode].has(key)){seenQuestions[mode].clear();}seenQuestions[mode].add(key)}
$('hint').onclick=()=>{let t=mode===0?'Chaque unité est divisée en '+question.d+' parts.':mode===1?'Compte les unités entières : chaque '+question.d+'/'+question.d+' forme 1. Il reste '+question.rem+'/'+question.d+'.':mode===2?'Un disque entier représente '+question.d+'/'+question.d+'.':mode===3?'Compare le numérateur et le dénominateur.':mode===4?'Imagine '+question.d+' parts égales. Une part contient '+(question.total/question.d)+' jetons. Il en faut '+question.n+' part(s).':'Aide : '+question.total+' ÷ '+question.d+' = '+(question.total/question.d)+' pour une part. Tu prends '+question.n+' part(s).';$('feedback').textContent='💡 '+t;$('feedback').style.color='#31677b'};
$('next').onclick=()=>{if(step===7){$('feedback').textContent='Parcours terminé : '+correct+' bonnes réponses sur 8. Tu peux recommencer ou choisir un autre atelier.';step=-1;correct=0;seenQuestions[mode].clear();$('next').textContent='Recommencer →';return}step++;$('next').textContent='Question suivante →';make()};
function tabs(){titles.forEach((t,i)=>{let b=document.createElement('button');b.textContent=(i+1)+'. '+t;b.onclick=()=>{mode=i;step=0;correct=0;seenQuestions[mode].clear();tabsActive();make()};$('tabs').append(b)});tabsActive()}function tabsActive(){[...$('tabs').children].forEach((b,i)=>b.classList.toggle('active',i===mode))}tabs();make();
</script><script src="site-tracking.js" defer></script></body></html>
