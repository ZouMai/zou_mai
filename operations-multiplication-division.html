<span>7</span></div><div class="scRow scResult"><span></span><span>2</span><span>6</span></div></div><small>Je barre les chiffres et j’écris 4 dizaines et 13 unités.</small></label><label><input type="radio" name="prepMethod" value="constant"> Avec retenues<div class="schoolCalc" aria-label="53 moins 27 égale 26 : on écrit un petit 1 rouge devant le 3 pour former 13, et un 1+ rouge devant le 2 du bas."><div class="scRow scTop"><span></span><span>5</span><span class="scPlusTop"><span class="scRedOne">1</span>3</span></div><div class="scRow scBottom"><span>−</span><span class="scPlusBottom"><span class="scCarry">1+</span>2</span><span>7</span></div><div class="scRow scResult"><span></span><span>2</span><span>6</span></div></div><small>J’écris un petit 1 rouge devant le 3 pour former 13, et une retenue 1+ en rouge devant le 2.</small></label></div></div><button type="button" class="prepStart" id="prepStart">Commencer l’opération →</button></div></div><script>

   let digit=Number(String(b).split('').reverse()[i]),carryRow=rows.find(r=>r.type==='carry'&&r.carryFor===i),carryMsg=carryRow?carryRemediation(carryRow,a,digit):null;

 }
}
let result=rows.find(r=>r.type==='result');
if(!aligned(result.cells,result.value,mulPlacesA+mulPlacesB)||!commaAt(result.cells,mulPlacesA+mulPlacesB?result.cells.length-mulPlacesA-mulPlacesB:-1)){
 if(mulPlacesA+mulPlacesB)return say('Vérifie le produit final et sa virgule : '+(mulPlacesA+mulPlacesB)+' chiffres décimaux sont attendus au total.','error');
 let ac=rows.find(r=>r.type==='addCarry');
 return say('Erreur dans l’addition finale. Repars de la colonne des unités : additionne uniquement les chiffres de cette colonne, écris les unités du total, puis place les dizaines éventuelles dans le cercle de retenue r＋ de la colonne suivante. Barre la retenue après l’avoir utilisée.','error');
}
say('Bravo ! Les facteurs, les produits partiels et l’addition finale sont corrects.','success')}
