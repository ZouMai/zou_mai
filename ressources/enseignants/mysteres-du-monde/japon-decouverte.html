:root{--ink:#162c3a;--red:#b73d43;--cream:#f7f4ed;--muted:#5b6d76;--gold:#c18b49}*{box-sizing:border-box}body{margin:0;background:#111a20;color:var(--ink);font-family:system-ui,'Segoe UI',Arial,sans-serif}.shell{min-height:100vh;display:grid;place-items:center;padding:10px 10px 64px}.slide{position:relative;overflow:hidden;width:min(100%,calc((100vh - 78px)*16/9));aspect-ratio:16/9;background:var(--cream);border-radius:14px;box-shadow:0 22px 70px #0008;display:grid;grid-template-columns:1.65fr 1fr}.slide::before{content:'';position:absolute;left:0;top:0;bottom:0;width:12px;background:var(--red)}.content{padding:3.5% 4.3% 3.3% 5%;display:flex;flex-direction:column;min-width:0;overflow:auto}.eyebrow{color:var(--red);font-weight:850;letter-spacing:.13em;text-transform:uppercase;font-size:clamp(12px,1.1vw,19px)}h1{font-size:clamp(23px,2.45vw,43px);line-height:1.13;margin:1.1% 0 2.1%;letter-spacing:-.035em}p{font-size:clamp(14px,1.33vw,23px);line-height:1.42;margin:0 0 1.1em;white-space:pre-line}.body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:.55em}.body p{margin:0}.body p:first-child{font-weight:680}.body p.math{font-size:clamp(18px,2.1vw,37px);font-weight:800;line-height:1.6;white-space:pre-line;font-family:'Consolas',monospace}.body p.small{font-size:clamp(12px,1.07vw,18px)}.body p.answer{font-size:clamp(27px,3.4vw,60px);font-weight:900;color:var(--red)}.media{position:relative;background:#d9e1e1;overflow:hidden}.media img{width:100%;height:100%;object-fit:cover;display:block}.media:after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 72%,#0009)}.caption{position:absolute;z-index:1;bottom:2.8%;left:5%;right:5%;color:white;font-size:clamp(10px,.85vw,15px);text-shadow:0 1px 3px #000}.credit{display:block;font-size:.75em;opacity:.85}.photoerror{display:none;position:absolute;inset:0;padding:12%;align-items:center;justify-content:center;text-align:center;color:#355;font-size:20px}.controls{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;gap:10px;justify-content:center;background:#111a20;padding:9px;color:#fff;z-index:5}.controls button,.controls select,.controls a{background:#263c4a;color:white;border:1px solid #50606c;border-radius:9px;padding:8px 12px;font-size:14px;cursor:pointer;text-decoration:none}.controls button:hover,.controls select:hover{background:#426477}.count{min-width:95px;text-align:center;font-size:13px}.hint{font-size:12px;color:#a7b7be}.quiz button{background:white;color:var(--ink);border:2px solid #d3c7b4;border-radius:12px;padding:10px 13px;margin:4px;font-weight:700;cursor:pointer;font-size:clamp(12px,1.1vw,18px)}.quiz button.selected{background:#f8e3ae;border-color:#b47b22}.quiz button.correct{background:#d6f3dc;border-color:#25864a}.quiz button.wrong{background:#ffe0de;border-color:#b73d43}.quiz .feedback{font-size:clamp(12px,1vw,17px);color:#566}.noimage{grid-template-columns:1fr}.noimage .media{display:none}.noimage .content{padding:4% 7%}.noimage h1{font-size:clamp(28px,3vw,52px)}.noimage .body p{font-size:clamp(18px,1.7vw,30px)}.noimage .body p.math{font-size:clamp(24px,2.5vw,44px)}.noimage .body p.small{font-size:clamp(14px,1.3vw,22px)}@media(max-width:850px){.shell{padding:4px 4px 80px}.slide{width:100%;grid-template-columns:1.4fr 1fr}.content{padding:4%}.controls{flex-wrap:wrap}.hint{display:none}}@media print{body{background:white}.controls{display:none}.shell{padding:0;display:block}.slide{width:100%;border-radius:0;box-shadow:none;page-break-after:always}}
</style></head><body><main class="shell"><article id="slide" class="slide"><section class="content"><div class="eyebrow" id="date"></div><h1 id="title"></h1><div id="body" class="body"></div></section><aside class="media"><img id="photo" alt="Photographie du Japon"><div id="photoerror" class="photoerror">Image indisponible sans connexion Internet.<br>La présentation et les activités restent utilisables.</div><div class="caption" id="caption"></div></aside></article></main><nav class="controls"><button id="prev" title="Flèche gauche">← Précédent</button><select id="day"><option value="LUNDI">Lundi</option><option value="MARDI">Mardi</option><option value="JEUDI">Jeudi</option><option value="VENDREDI">Vendredi</option></select><span id="count" class="count"></span><button id="next" title="Flèche droite">Suivant →</button><button id="full">⛶ Plein écran</button><a id="source" target="_blank" rel="noopener">Crédit photo ↗</a><span class="hint">← → naviguer · F plein écran</span></nav><script>
const slides=[{"texts": ["Rituel « Mystères du monde »", "1) Pose et calcule", "186 + 97 + 91 =", "8 462 − 8 394 =", "19 × 5 =", "Pose les opérations dans le cahier du jour.", "DÉFI BONUS · 4 ÉTAPES", "Un train japonais compte 3 voitures de 48 places chacune.\n\nAu départ, 27 places sont vides.\n\nÀ la première gare, 19 voyageurs descendent et 34 montent.\n\nCombien de voyageurs sont dans le train après cet arrêt ?"], "day": "LUNDI", "photo": 4}, {"texts": ["2) Corrige les calculs au tableau", "186\n   97\n+  91\n──────", "8 462\n−8 394\n──────", "19\n×   5\n──────", "3) Code : écris les trois résultats à la suite, sans espace.", "_   _   _   _   _   _   _", "Clé :  1 = M   2 = R   3 = L   4 = J   5 = N   6 = A   7 = E   8 = P   9 = O"], "day": "LUNDI", "photo": 1}, {"texts": ["3) Destination de la semaine", "374  ·  68  ·  95   →   3746895", "3  7  4  6  8  9  5", "L  E  J  A  P  O  N", "LE JAPON"], "day": "LUNDI", "photo": 2}, {"texts": ["Découvrons le Japon · Où est-il ?", "Le Japon est un pays d’Asie de l’Est, dans l’océan Pacifique. C’est un archipel : il est formé de milliers d’îles. Ses quatre îles principales sont Hokkaidō, Honshū, Shikoku et Kyūshū. Sa capitale est Tokyo.\n\nSur une carte, repère les pays proches du Japon : la Russie, la Corée du Nord, la Corée du Sud et la Chine. Taïwan se trouve aussi au sud-ouest de l’archipel. Le Japon n’a aucune frontière terrestre avec ces territoires : la mer les sépare.\n\nLe mont Fuji est un volcan célèbre, devenu un symbole du pays."], "day": "LUNDI", "photo": 1}, {"texts": ["Découvrons le Japon · Des mots à apprendre", "Au Japon, on parle principalement japonais. Cette langue utilise trois systèmes d’écriture : les hiragana, les katakana et les kanji.\n\nQuelques mots à retenir :\n• Konnichiwa (こんにちは) : bonjour, dans la journée.\n• Arigatō (ありがとう) : merci.\n• Sensei (先生) : maître, maîtresse ou professeur ; c’est une manière respectueuse de s’adresser à une personne qui enseigne.\n\nAu Japon, on retire généralement ses chaussures avant d’entrer dans une maison. Les coutumes peuvent varier selon les lieux et les familles.", "Photographie d’une rue japonaise avec enseignes en japonais."], "day": "LUNDI", "photo": 5}, {"texts": ["Découvrons le Japon · Sakura et Totoro", "Au printemps, les cerisiers du Japon se couvrent de fleurs roses ou blanches : ce sont les sakura. Pendant le hanami, des personnes se retrouvent dans les parcs pour admirer leur floraison. Les fleurs ne durent que peu de temps : elles rappellent que les beaux moments sont précieux.\n\nNotre mascotte Totoro fait penser au film d’animation japonais Mon voisin Totoro, réalisé par Hayao Miyazaki. Le film met en scène deux sœurs et une mystérieuse créature de la forêt. Au Japon, l’animation est un art très populaire."], "day": "LUNDI", "photo": 2}, {"texts": ["Découvrons le Japon · Les mangas", "Un manga est une bande dessinée japonaise. Dans les éditions japonaises traditionnelles, on commence par ce qui serait la dernière page d’un livre français : on lit de droite à gauche. Sur chaque page, on suit aussi les cases, puis les bulles, généralement de droite à gauche et de haut en bas. Certaines éditions adaptées peuvent se lire autrement.\n\nParmi les mangas célèbres : Dragon Ball (Son Goku), One Piece (Luffy), Naruto (un jeune ninja), mais aussi Détective Conan, Pokémon : La Grande Aventure et Doraemon. Leurs univers sont très différents : aventure, humour, enquête ou science-fiction.\n\nUn manga est une BD à lire ; lorsqu’une histoire est adaptée en dessin animé japonais, on parle souvent d’anime."], "day": "LUNDI", "photo": 3}, {"texts": ["LUNDI · LECTURE", "Pourquoi la terre tremble-t-elle au Japon ?", "La surface de la Terre est formée de grandes plaques rocheuses qui se déplacent très lentement. Le Japon se trouve près des limites de plusieurs plaques tectoniques. Leurs mouvements peuvent provoquer des séismes, parfois très puissants.\n\nLe pays connaît aussi des volcans actifs. Un séisme sous la mer peut déplacer une grande quantité d’eau et provoquer un tsunami : une série de vagues qui peut atteindre les côtes.\n\nLes habitants apprennent des gestes de protection et les bâtiments sont conçus pour mieux résister aux secousses."], "day": "LUNDI", "photo": 0}, {"texts": ["À copier dans le cahier du jour", "Destination de la semaine : le Japon", "Le Japon est un archipel situé en Asie de l’Est, dans l’océan Pacifique. Il connaît de nombreux séismes car il se trouve près de limites de plaques tectoniques."], "day": "LUNDI", "photo": 4}, {"texts": ["L’étonnant · À toi de formuler une hypothèse", "Comment un téléphone au Japon peut-il parfois prévenir d’un séisme quelques secondes avant que le sol ne tremble à cet endroit ?", "A · Des satellites voient les plaques tectoniques bouger juste avant la secousse.", "B · Des capteurs détectent les premières ondes du séisme ; l’alerte électronique peut arriver avant les secousses les plus fortes.", "C · Des scientifiques connaissent à l’avance l’heure exacte de chaque séisme.", "D · Des chats entraînés miaulent dans un micro pour prévenir tous les téléphones.", "Choisis une hypothèse et justifie-la oralement."], "day": "MARDI", "photo": 5}, {"texts": ["L’étonnant · Explication", "Réponse B", "Le séisme a déjà commencé lorsque les capteurs détectent ses premières ondes. Un message électronique peut circuler plus vite que les ondes sismiques les plus destructrices : certains habitants reçoivent alors une alerte avant les fortes secousses.", "Attention : près de l’épicentre, l’alerte peut arriver trop tard. Ce système ne prédit pas les séismes."], "day": "MARDI", "photo": 0}, {"texts": ["MARDI · L’ÉTONNANT · 1/10", "Vrai ou faux ?", "Au Japon, les élèves s’entraînent à réagir en cas de séisme.", "VRAI                         FAUX", "Choisis, puis justifie ta réponse."], "day": "MARDI", "photo": 1}, {"texts": ["MARDI · RÉPONSE · 1/10", "VRAI !", "Dans les écoles japonaises, des exercices de prévention apprennent aux élèves à se protéger et à évacuer si nécessaire.", "À SAVOIR", "On peut s’entraîner à se protéger avant qu’une catastrophe ne survienne."], "day": "MARDI", "photo": 2}, {"texts": ["MARDI · L’ÉTONNANT · 2/10", "Vrai ou faux ?", "Un tsunami est toujours provoqué par un très grand vent.", "VRAI                         FAUX", "Choisis, puis justifie ta réponse."], "day": "MARDI", "photo": 4}, {"texts": ["MARDI · RÉPONSE · 2/10", "FAUX !", "Un tsunami est généralement causé par un déplacement brutal de l’eau, souvent à la suite d’un puissant séisme sous-marin. Ce n’est pas une vague créée par le vent.", "À SAVOIR", "Un tsunami peut être composé de plusieurs vagues."], "day": "MARDI", "photo": 5}, {"texts": ["MARDI · L’ÉTONNANT · 3/10", "Vrai ou faux ?", "Le mont Fuji est un volcan.", "VRAI                         FAUX", "Choisis, puis justifie ta réponse."], "day": "MARDI", "photo": 0}, {"texts": ["MARDI · RÉPONSE · 3/10", "VRAI !", "Le mont Fuji est un volcan situé sur l’île de Honshū. Il est devenu un symbole culturel et artistique du Japon.", "À SAVOIR", "Un volcan peut rester longtemps sans entrer en éruption."], "day": "MARDI", "photo": 0}, {"texts": ["MARDI · L’ÉTONNANT · 4/10", "Vrai ou faux ?", "Tous les séismes peuvent être prédits précisément plusieurs jours à l’avance.", "VRAI                         FAUX", "Choisis, puis justifie ta réponse."], "day": "MARDI", "photo": 2}, {"texts": ["MARDI · RÉPONSE · 4/10", "FAUX !", "Les scientifiques surveillent l’activité sismique et évaluent les risques, mais ils ne savent pas prédire précisément le jour, le lieu et la magnitude d’un séisme.", "À SAVOIR", "La préparation et les consignes de sécurité sont donc essentielles."], "day": "MARDI", "photo": 4}, {"texts": ["Vrai ou faux ? · 5/10", "À Tokyo, un carrefour peut être traversé par des milliers de piétons lors d’un seul feu vert.", "VRAI                         FAUX", "Choisis et explique ton hypothèse."], "day": "MARDI", "photo": 1}, {"texts": ["Réponse · 5/10", "VRAI !", "Le carrefour de Shibuya est célèbre pour ses passages piétons simultanés. Des milliers de personnes peuvent traverser lors d’un même cycle, selon l’affluence."], "day": "MARDI", "photo": 1}, {"texts": ["Vrai ou faux ? · 6/10", "Au Japon, il existe une île où vivent de nombreux lapins en liberté.", "VRAI                         FAUX", "Choisis et explique ton hypothèse."], "day": "MARDI", "photo": 1}, {"texts": ["Réponse · 6/10", "VRAI !", "Sur l’île d’Ōkunoshima, de nombreux lapins vivent en liberté. Ce lieu attire des visiteurs, mais les animaux restent des êtres vivants à respecter."], "day": "MARDI", "photo": 2}, {"texts": ["Vrai ou faux ? · 7/10", "Certains trains japonais peuvent se déplacer au-dessus de leur voie grâce à des aimants.", "VRAI                         FAUX", "Choisis et explique ton hypothèse."], "day": "MARDI", "photo": 4}, {"texts": ["Réponse · 7/10", "VRAI !", "Les trains à sustentation magnétique, ou maglev, peuvent léviter légèrement au-dessus de la voie grâce aux forces magnétiques."], "day": "MARDI", "photo": 4}, {"texts": ["Vrai ou faux ? · 8/10", "Lors d’un séisme, les immeubles japonais les plus hauts sont conçus pour rester parfaitement immobiles.", "VRAI                         FAUX", "Choisis et explique ton hypothèse."], "day": "MARDI", "photo": 0}, {"texts": ["Réponse · 8/10", "FAUX !", "Des bâtiments sont conçus pour se déformer ou osciller de manière contrôlée : absorber les mouvements peut limiter les dégâts. Aucun bâtiment n’est garanti sans risque."], "day": "MARDI", "photo": 1}, {"texts": ["Vrai ou faux ? · 9/10", "Le Japon possède des sources d’eau chaude naturelles dans lesquelles on peut se baigner.", "VRAI                         FAUX", "Choisis et explique ton hypothèse."], "day": "MARDI", "photo": 2}, {"texts": ["Réponse · 9/10", "VRAI !", "Les onsen sont des bains alimentés par des eaux naturellement chaudes, souvent liées à l’activité géothermique. Leurs usages obéissent à des règles locales."], "day": "MARDI", "photo": 4}, {"texts": ["Vrai ou faux ? · 10/10", "Après un puissant séisme en mer, la première vague d’un tsunami est toujours la plus haute.", "VRAI                         FAUX", "Choisis et explique ton hypothèse."], "day": "MARDI", "photo": 5}, {"texts": ["Réponse · 10/10", "FAUX !", "Un tsunami peut arriver en plusieurs vagues ; la première n’est pas nécessairement la plus grande. On suit les alertes et on ne retourne pas trop tôt vers la côte."], "day": "MARDI", "photo": 0}, {"texts": ["L’étonnant · Ma phrase du jour", "Dans ton cahier du jour : saute une ligne, écris la date, puis choisis le fait qui t’a le plus étonné.", "Pour écrire ta phrase, tu peux commencer par :", "« Ce qui est surprenant, c’est que… »\n« J’ai été étonné(e) d’apprendre que… »\n« Je ne savais pas que… »\n« Ce qui m’a le plus impressionné(e), c’est… »", "Ajoute une deuxième phrase pour expliquer pourquoi."], "day": "MARDI", "photo": 1}, {"texts": ["Qu’est-ce qu’une plaque tectonique ?", "La couche externe solide de la Terre est découpée en grandes plaques rocheuses. Elles se déplacent de quelques centimètres par an.", "À leurs limites, elles peuvent se rapprocher, s’écarter ou glisser l’une contre l’autre."], "day": "JEUDI", "photo": 2}, {"texts": ["Comment naît un séisme ?", "1. Des roches se bloquent le long d’une faille.\n\n2. Les forces s’accumulent pendant que les plaques bougent.\n\n3. Les roches rompent ou glissent brusquement : des ondes font trembler le sol."], "day": "JEUDI", "photo": 4}, {"texts": ["Fenêtre sur le monde · Les séismes au Japon", "VIDÉO · 3 min 14 s", "C’est pas sorcier — « Tectonique des plaques et tremblements de terre » (Lumni).", "▶ OUVRIR LA VIDÉO LUMNI", "https://www.lumni.fr/video/tectonique-des-plaques-et-tremblements-de-terre", "Pendant la vidéo : repère ce qu’est une plaque tectonique, comment un séisme se produit et pourquoi le Japon est concerné."], "day": "JEUDI", "photo": 5}, {"texts": ["JEUDI · APRÈS LA VIDÉO", "Trois idées à retenir", "CAUSE", "Les plaques tectoniques bougent : leurs mouvements peuvent provoquer des séismes.", "SE PROTÉGER", "S’abriter, protéger sa tête et suivre les consignes de sécurité.", "SE PRÉPARER", "Faire des exercices et construire des bâtiments adaptés."], "day": "JEUDI", "photo": 0}, {"texts": ["VENDREDI · PASSEPORT", "Semaine 3 · Japon", "Destination : _______________________       Continent : _______________________", "📍 Je sais maintenant situer…\n________________________________________________________", "💡 J’ai découvert que…\n________________________________________________________", "😮 Ce qui m’a le plus surpris…\n________________________________________________________", "❓ Je me demande encore…\n________________________________________________________"], "day": "VENDREDI", "photo": 1}, {"texts": ["Passeport · Destination : le Japon", "Dans le cahier du jour : saute une ligne, écris la date et le titre « Passeport du Japon ».", "Destination : le Japon                         Continent : Asie\n\n📍 Je sais maintenant situer…\n\n💡 J’ai découvert que…\n\n😮 Ce qui m’a le plus surpris(e), c’est…\n\n❓ Je me demande encore…"], "day": "VENDREDI", "photo": 2}, {"texts": ["Ma production d’écrit · Le Japon", "Dans ton cahier du jour, rédige 3 à 4 phrases pour présenter le Japon à quelqu’un qui ne le connaît pas.", "Tu peux utiliser ces débuts de phrases :\n\n« Le Japon est situé… »\n« Ce pays connaît de nombreux séismes parce que… »\n« Pour s’y préparer, les habitants… »\n« Cette semaine, j’ai été surpris(e) de découvrir que… »", "Relis-toi : majuscules, points, phrases complètes."], "day": "VENDREDI", "photo": 4}],photos=[{"name": "Mount Fuji April Cherry Blossom.jpg", "caption": "Mont Fuji et cerisiers", "credit": "SRP1998 · CC BY-SA 4.0", "url": "https://commons.wikimedia.org/wiki/Special:FilePath/Mount%20Fuji%20April%20Cherry%20Blossom.jpg?width=1200", "source": "https://commons.wikimedia.org/wiki/File:Mount_Fuji_April_Cherry_Blossom.jpg"}, {"name": "Shibuya-Tokyo---2024-10-11 006.jpg", "caption": "Tokyo, carrefour de Shibuya", "credit": "RuinDig/Yuki Uchida · Wikimedia Commons", "url": "https://commons.wikimedia.org/wiki/Special:FilePath/Shibuya-Tokyo---2024-10-11%20006.jpg?width=1200", "source": "https://commons.wikimedia.org/wiki/File:Shibuya-Tokyo---2024-10-11_006.jpg"}, {"name": "Cherry blossom in Yoyogi.jpg", "caption": "Cerisiers en fleurs à Tokyo", "credit": "Syced · CC0", "url": "https://commons.wikimedia.org/wiki/Special:FilePath/Cherry%20blossom%20in%20Yoyogi.jpg?width=1200", "source": "https://commons.wikimedia.org/wiki/File:Cherry_blossom_in_Yoyogi.jpg"}, {"name": "Japan Bookstore.jpg", "caption": "Rayon de mangas au Japon", "credit": "Bobby · CC BY 2.0", "url": "https://commons.wikimedia.org/wiki/Special:FilePath/Japan%20Bookstore.jpg?width=1200", "source": "https://commons.wikimedia.org/wiki/File:Japan_Bookstore.jpg"}, {"name": "Shinkansen N700 N9.JPG", "caption": "Train Shinkansen", "credit": "toshinori baba · CC0", "url": "https://commons.wikimedia.org/wiki/Special:FilePath/Shinkansen%20N700%20N9.JPG?width=1200", "source": "https://commons.wikimedia.org/wiki/File:Shinkansen_N700_N9.JPG"}, {"name": "Shinkansen passing in front of Mount Fuji.jpg", "caption": "Shinkansen et mont Fuji", "credit": "Manish Prabhune · Wikimedia Commons", "url": "https://commons.wikimedia.org/wiki/Special:FilePath/Shinkansen%20passing%20in%20front%20of%20Mount%20Fuji.jpg?width=1200", "source": "https://commons.wikimedia.org/wiki/File:Shinkansen_passing_in_front_of_Mount_Fuji.jpg"}];let current=0;const $=id=>document.getElementById(id);const dates={LUNDI:'LUNDI 21 SEPTEMBRE 2026',MARDI:'MARDI 22 SEPTEMBRE 2026',JEUDI:'JEUDI 24 SEPTEMBRE 2026',VENDREDI:'VENDREDI 25 SEPTEMBRE 2026'};
function render(){const s=slides[current],t=s.texts.filter(Boolean);$('date').textContent=dates[s.day]+'  ·  SEMAINE 3';$('day').value=s.day;let title=t[0]||'Le Japon';if(title.match(/^(LUNDI|MARDI|JEUDI|VENDREDI) ·/)&&t[1])title=t[1];$('title').textContent=title;const b=$('body');b.innerHTML='';for(const [j,line] of t.entries()){if(line===title||line===dates[s.day]||line.match(/^(LUNDI|MARDI|JEUDI|VENDREDI) ·/))continue;if(line.includes('PHOTO À INSÉRER')||line.includes('CARTE /')||line.includes('Photographie de'))continue;const p=document.createElement('p');p.textContent=line;if(/^(VRAI !|FAUX !|LE JAPON)$/.test(line))p.className='answer';else if(/[+×−=]|────|_   _/.test(line)&&line.length<130)p.className='math';else if(line.length>370)p.className='small';b.appendChild(p)}
// Interactive choice on the hypothesis slide, preserving the original source text.
if(title.toLowerCase().includes('hypothèse')||t.join(' ').includes('quatre hypothèses')){const opts=t.filter(x=>/^[A-D][). ]/.test(x));if(opts.length){const q=document.createElement('div');q.className='quiz';const f=document.createElement('div');f.className='feedback';f.textContent='Choisis une hypothèse et justifie-la à l’oral.';opts.forEach(o=>{const btn=document.createElement('button');btn.textContent=o;btn.onclick=()=>{q.querySelectorAll('button').forEach(z=>z.classList.remove('selected'));btn.classList.add('selected');f.textContent='Explique pourquoi cette hypothèse te paraît possible. La réponse vient à la diapositive suivante.'};q.appendChild(btn)});q.appendChild(f);b.appendChild(q)}}
const ph=photos[s.photo];$('photo').src=ph.url;$('photo').alt=ph.caption;$('caption').innerHTML=ph.caption+'<span class="credit">'+ph.credit+'</span>';$('source').href=ph.source;$('photoerror').style.display='none';$('slide').classList.toggle('noimage',current===1);$('count').textContent=(current+1)+' / '+slides.length;location.hash='slide-'+(current+1)}
