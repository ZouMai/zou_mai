<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>At the airport — English Games</title>
<style>
:root{--ink:#151515;--blue:#168fe5;--yellow:#ffd72e;--red:#ef4353;--green:#25b56b;--paper:#fbfaf5}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Inter,system-ui,Arial,sans-serif;background:radial-gradient(circle at 9% 12%,#ffd72e26 0 110px,transparent 112px),linear-gradient(#fff,#f7f5ed);min-height:100vh}body:before{content:"";position:fixed;left:0;right:0;top:0;height:7px;background:linear-gradient(90deg,var(--blue) 0 38%,var(--yellow) 38% 68%,var(--red) 68%);z-index:99}header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:15px max(18px,4vw);background:#fffffff0;border-bottom:1px solid #ddd;box-shadow:0 3px 18px #0000000f}.plane{font-size:42px}h1{margin:0;font-size:clamp(28px,4vw,48px);line-height:.95}header p{margin:5px 0 0;color:#697076;font-size:13px;font-weight:900;text-transform:uppercase}.nav{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}.nav a,.nav button{border:2px solid #111;border-radius:999px;background:#fff;color:#111;padding:8px 13px;text-decoration:none;font-weight:900;cursor:pointer}.nav .bd{background:var(--yellow)}main{width:min(1180px,94vw);margin:auto;padding:30px 0 55px}.intro{text-align:center;margin-bottom:24px}.intro h2{font-size:clamp(27px,4vw,42px);margin:0 0 7px}.intro p{font-weight:750;color:#62686c}.games{display:grid;grid-template-columns:repeat(5,1fr);gap:15px}.gameBtn{min-height:190px;border:1px solid #d8d8d4;border-radius:20px;background:#fff;padding:16px;text-align:left;cursor:pointer;box-shadow:0 8px 24px #00000012;transition:.18s}.gameBtn:hover{transform:translateY(-5px);box-shadow:0 14px 30px #0002}.gameBtn:nth-child(3n+1){border-bottom:6px solid var(--blue)}.gameBtn:nth-child(3n+2){border-bottom:6px solid var(--yellow)}.gameBtn:nth-child(3n){border-bottom:6px solid var(--red)}.num{display:grid;place-items:center;width:34px;height:34px;border:2px solid #111;border-radius:50%;background:var(--yellow);font-weight:1000}.gameBtn .icon{display:block;font-size:48px;margin:15px 0 10px}.gameBtn b{font-size:18px}.gameBtn small{display:block;margin-top:5px;color:#70767a;font-weight:700}.panel{display:none;min-height:550px;background:#fff;border:1px solid #ddd;border-radius:28px;box-shadow:0 18px 50px #00000017;padding:clamp(20px,4vw,42px);text-align:center}.panel.active{display:block}.topline{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:18px}.back{border:0;border-radius:999px;background:#111;color:#fff;padding:9px 15px;font-weight:900;cursor:pointer}.score{font-weight:900}.prompt{font-size:clamp(25px,4vw,42px);font-weight:1000;margin:18px auto}.audio{width:82px;height:82px;border:3px solid #111;border-radius:50%;background:var(--blue);color:#fff;font-size:34px;box-shadow:4px 4px 0 #111;cursor:pointer}.choices{display:grid;grid-template-columns:repeat(2,minmax(150px,1fr));gap:13px;max-width:720px;margin:22px auto}.choice,.token,.next{border:3px solid #111;border-radius:13px;background:#fff;padding:13px;font-size:18px;font-weight:900;box-shadow:3px 3px 0 #111;cursor:pointer}.choice:hover,.token:hover{background:#fff6bd}.choice.good{background:#c8f3dc}.choice.bad{background:#ffd8de}.feedback{min-height:54px;max-width:650px;margin:18px auto;padding:12px;border-radius:12px;font-size:20px;font-weight:1000}.feedback.good{background:#dff8e9;color:#0b6738;border:2px solid #0b6738}.feedback.bad{background:#ffe2e6;color:#9b1730;border:2px solid #9b1730}.next{background:var(--yellow);margin-top:10px}.tokens{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:20px}.answer{min-height:64px;max-width:700px;margin:15px auto;border:3px dashed #111;border-radius:12px;padding:12px;font-size:24px;font-weight:900}.passport{font-size:86px;margin:15px}.namecard{display:inline-block;margin:10px;padding:15px 22px;border:3px solid #111;border-radius:15px;background:#eef7ff;font-size:26px;font-weight:1000;box-shadow:5px 5px 0 var(--yellow)}@media(max-width:900px){.games{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){header{align-items:flex-start}.plane{font-size:32px}.nav{width:100%}.games{grid-template-columns:1fr 1fr;gap:9px}.gameBtn{min-height:165px;padding:12px}.gameBtn .icon{font-size:39px}.choices{grid-template-columns:1fr}.panel{min-height:520px}.nav a{font-size:11px}}
</style>
</head>
<body>
<header><div class="plane">✈️</div><div><h1>At the airport</h1><p>Lesson 03 · What’s your name?</p></div><nav class="nav"><a href="../../">MENU</a><a class="bd" href="https://zoumai.github.io/zou_mai/ressources/anglais/at-the-airport/bd/">BD SONORISÉE</a></nav></header>
<main><section id="home"><div class="intro"><h2>Choose your game</h2><p>Écoute, comprends et apprends à te présenter.</p></div><div class="games">
<button class="gameBtn" onclick="start(0)"><span class="num">1</span><span class="icon">🔊</span><b>Who is it?</b><small>Écoute et retrouve le prénom.</small></button>
<button class="gameBtn" onclick="start(1)"><span class="num">2</span><span class="icon">🛂</span><b>Customs</b><small>Choisis la bonne réponse.</small></button>
<button class="gameBtn" onclick="start(2)"><span class="num">3</span><span class="icon">🧩</span><b>Build the question</b><small>Remets la question en ordre.</small></button>
<button class="gameBtn" onclick="start(3)"><span class="num">4</span><span class="icon">🎫</span><b>My passport</b><small>Construis une présentation.</small></button>
<button class="gameBtn" onclick="start(4)"><span class="num">5</span><span class="icon">🏁</span><b>Airport challenge</b><small>Le défi final.</small></button>
</div></section><section id="panel" class="panel"><div class="topline"><button class="back" onclick="home()">← MENU</button><span class="score" id="score"></span></div><div id="content"></div></section></main>
<script>
const names=['Patrick','Nessie','Harry','Arthur','Puss in Boots','Grace','Mike','Janet','Ali'];let mode=0,round=0,points=0,current='';const homeEl=document.getElementById('home'),panel=document.getElementById('panel'),content=document.getElementById('content'),score=document.getElementById('score');
function say(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.82;const vs=speechSynthesis.getVoices(),v=vs.find(x=>/en-GB/i.test(x.lang)&&/natural|google|microsoft|siri/i.test(x.name))||vs.find(x=>/en-GB/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u)}function pick(a){return a[Math.floor(Math.random()*a.length)]}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(m){mode=m;round=0;points=0;homeEl.style.display='none';panel.classList.add('active');render()}function home(){speechSynthesis.cancel();panel.classList.remove('active');homeEl.style.display='block'}function top(){score.textContent=`${points} ★ · ${round+1}/5`}function fb(ok,msg){const f=document.getElementById('feedback');f.className='feedback '+(ok?'good':'bad');f.textContent=msg;if(ok)points++}function next(){round++;if(round>=5)return finish();render()}function finish(){score.textContent=`${points} / 5 ★`;content.innerHTML=`<div class="passport">🛂✈️</div><div class="prompt">Mission complete!</div><p>You can ask and answer: <b>What’s your name?</b></p><button class="next" onclick="home()">RETOUR AU MENU</button>`;say('Mission complete!')}
function render(){top();current=pick(names);if(mode===0)return listen();if(mode===1)return customs();if(mode===2)return build();if(mode===3)return passport();challenge()}
function listen(){const opts=shuffle([current,...shuffle(names.filter(n=>n!==current)).slice(0,3)]);content.innerHTML=`<div class="prompt">Listen. Who is it?</div><button class="audio" onclick="say('My name is ${current}.')">🔊</button><div class="choices">${opts.map(n=>`<button class="choice" onclick="checkName(this,'${n}')">${n}</button>`).join('')}</div><div id="feedback" class="feedback"></div><button class="next" onclick="next()">NEXT →</button>`;setTimeout(()=>say(`My name is ${current}.`),250)}
function checkName(b,n){const ok=n===current;b.classList.add(ok?'good':'bad');fb(ok,ok?'Well done!':`Listen again: My name is ${current}.`);if(!ok)say(`My name is ${current}.`)}
function customs(){const correct=`My name is ${current}.`,wrong=[`Your name is ${current}.`,`What is ${current}?`,`I name ${current}.`],opts=shuffle([correct,...wrong]);content.innerHTML=`<div class="prompt">🛂 What’s your name?</div><div class="namecard">${current}</div><div class="choices">${opts.map(x=>`<button class="choice" onclick="checkSentence(this,\`${x}\`,\`${correct}\`)">${x}</button>`).join('')}</div><div id="feedback" class="feedback"></div><button class="next" onclick="next()">NEXT →</button>`;say("What's your name?")}
function checkSentence(b,x,e){const ok=x===e;b.classList.add(ok?'good':'bad');fb(ok,ok?'Correct!':'Try again.');say(ok?e:"Try again")}
function build(){const words=shuffle(["What's",'your','name?']);window.answer=[];content.innerHTML=`<div class="prompt">Build the question.</div><div id="answer" class="answer"></div><div class="tokens">${words.map((w,i)=>`<button class="token" id="t${i}" onclick="addToken(this,\`${w}\`)">${w}</button>`).join('')}</div><button class="next" onclick="checkBuild()">CHECK</button><div id="feedback" class="feedback"></div>`}
function addToken(b,w){answer.push(w);b.disabled=true;document.getElementById('answer').textContent=answer.join(' ')}function checkBuild(){const ok=answer.join(' ')==="What's your name?";fb(ok,ok?'Perfect!':'Try again.');if(ok){say("What's your name?");setTimeout(next,1000)}else setTimeout(render,900)}
function passport(){const opts=shuffle([`My name is ${current}.`,`I am ${current}.`,`My surname are ${current}.`,`Your name is ${current}.`]);content.innerHTML=`<div class="passport">🎫</div><div class="prompt">Choose a correct introduction.</div><div class="namecard">${current}</div><div class="choices">${opts.map(x=>`<button class="choice" onclick="checkPassport(this,\`${x}\`)">${x}</button>`).join('')}</div><div id="feedback" class="feedback"></div><button class="next" onclick="next()">NEXT →</button>`}
function checkPassport(b,x){const ok=x===`My name is ${current}.`||x===`I am ${current}.`;b.classList.add(ok?'good':'bad');fb(ok,ok?'Correct! Both forms are possible.':'This sentence is not correct.');if(ok)say(x)}
function challenge(){const q=round%2===0,expected=q?"What's your name?":`My name is ${current}.`,wrong=q?["Who your name?","What your name is?","What's name your?"]:[`My names ${current}.`,`I name is ${current}.`,`Your name is ${current}.`],opts=shuffle([expected,...wrong]);content.innerHTML=`<div class="prompt">${q?'Choose the correct question.':'Answer the customs officer.'}</div>${q?'':`<div class="namecard">${current}</div><button class="audio" onclick="say(\"What's your name?\")">🔊</button>`}<div class="choices">${opts.map(x=>`<button class="choice" onclick="checkSentence(this,\`${x}\`,\`${expected}\`)">${x}</button>`).join('')}</div><div id="feedback" class="feedback"></div><button class="next" onclick="next()">NEXT →</button>`;if(!q)say("What's your name?")}
</script></body></html>
