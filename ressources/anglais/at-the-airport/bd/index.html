<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>At the airport — planche sonorisée</title>
<style>:root{--accent:#0b69a8}*{box-sizing:border-box}body{margin:0;background:#ece9e2;color:#1b1b1b;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}.toolbar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:.55rem;padding:.7rem .9rem;background:#fffffff0;backdrop-filter:blur(8px);box-shadow:0 2px 12px #0002}.toolbar strong{margin-right:.4rem}.toolbar button,.toolbar select,.back{font:inherit;border:1px solid #bbb;border-radius:10px;background:#fff;color:#1b1b1b;padding:.45rem .65rem;text-decoration:none}.toolbar button{cursor:pointer}.toolbar button:hover,.toolbar button:focus,.back:hover,.back:focus{background:#eef7ff;outline:2px solid #ffe66d}.wrap{width:min(100%,1055px);margin:18px auto 40px;padding:0 8px}.page{position:relative;width:100%;aspect-ratio:1054/1492;background:#fff;box-shadow:0 8px 32px #0003;overflow:hidden}.page img{width:100%;height:100%;display:block;object-fit:contain}.sound-btn{position:absolute;transform:translate(-50%,-50%);width:clamp(30px,3.4vw,40px);height:clamp(30px,3.4vw,40px);border:2px solid #fff;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:clamp(14px,1.8vw,20px);cursor:pointer;box-shadow:0 2px 8px #0006;opacity:.76}.sound-btn:hover,.sound-btn:focus{transform:translate(-50%,-50%) scale(1.12);opacity:1;outline:3px solid #ffe66d}.sound-btn.playing{background:#b3261e;animation:pulse .85s infinite alternate}@keyframes pulse{to{transform:translate(-50%,-50%) scale(1.14)}}.hint{text-align:center;color:#555;padding:0 12px 20px}@media(max-width:680px){.toolbar{font-size:.88rem}.toolbar strong{width:100%}.wrap{margin-top:8px;padding:0}.page{box-shadow:none}.sound-btn{width:34px;height:34px}}</style></head><body>
<div class="toolbar"><strong>🔊 At the airport</strong><button id="playAll">▶ Tout écouter</button><button id="stop">■ Stop</button><label>Vitesse <select id="rate"><option value="0.72">très lente</option><option value="0.82" selected>lente</option><option value="0.92">normale</option><option value="1.02">rapide</option></select></label><label>Voix <select id="voice"></select></label><a class="back" href="https://zoumai.github.io/the-method/lessons/at-the-airport/">JEUX</a></div>
<div class="wrap"><div class="page"><img src="at-the-airport-enhanced.png" alt="Planche sonorisée At the airport">
<button class="sound-btn" style="left:8%;top:18%" data-text="What's your name?">🔊</button><button class="sound-btn" style="left:28%;top:30%" data-text="My name is Patrick!">🔊</button>
<button class="sound-btn" style="left:91%;top:20%" data-text="What's your name?">🔊</button><button class="sound-btn" style="left:91%;top:27%" data-text="My name is Nessie!">🔊</button>
<button class="sound-btn" style="left:9%;top:43%" data-text="What's your name, Sir?">🔊</button><button class="sound-btn" style="left:44%;top:57%" data-text="My name is Harry!">🔊</button>
<button class="sound-btn" style="left:64%;top:43%" data-text="What's your name, Sir?">🔊</button><button class="sound-btn" style="left:67%;top:58%" data-text="My name is Arthur!">🔊</button>
<button class="sound-btn" style="left:62%;top:71%" data-text="What's your name?">🔊</button><button class="sound-btn" style="left:64%;top:83%" data-text="I am Puss in Boots!">🔊</button>
</div></div><p class="hint">Clique sur un 🔊 pour entendre la bulle correspondante. Une voix anglaise britannique est choisie en priorité.</p>
<script>const synth=speechSynthesis,buttons=[...document.querySelectorAll('.sound-btn')],voiceSelect=document.getElementById('voice'),rateSelect=document.getElementById('rate');let voices=[];function loadVoices(){voices=synth.getVoices();const en=voices.filter(v=>/^en(-|_)/i.test(v.lang)).sort((a,b)=>(/en-GB/i.test(a.lang)?0:1)-(/en-GB/i.test(b.lang)?0:1));voiceSelect.innerHTML='';(en.length?en:voices).forEach(v=>{const o=document.createElement('option');o.value=voices.indexOf(v);o.textContent=`${v.name} (${v.lang})`;voiceSelect.appendChild(o)});const i=voices.findIndex(v=>/en-GB/i.test(v.lang)&&/natural|google|microsoft|siri|premium/i.test(v.name)),f=voices.findIndex(v=>/en-GB/i.test(v.lang));voiceSelect.value=String(i>=0?i:f)}loadVoices();if('onvoiceschanged'in synth)synth.onvoiceschanged=loadVoices;function clear(){buttons.forEach(b=>b.classList.remove('playing'))}function speak(t,b,end){const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=+rateSelect.value;const v=voices[+voiceSelect.value];if(v)u.voice=v;b?.classList.add('playing');u.onend=()=>{b?.classList.remove('playing');end?.()};u.onerror=()=>{clear();end?.()};synth.speak(u)}buttons.forEach(b=>b.onclick=()=>{synth.cancel();clear();speak(b.dataset.text,b)});stop.onclick=()=>{synth.cancel();clear()};playAll.onclick=()=>{synth.cancel();clear();let i=0;const next=()=>{if(i<buttons.length){const b=buttons[i++];speak(b.dataset.text,b,()=>setTimeout(next,250))}};next()}</script></body></html>
