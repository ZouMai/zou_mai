<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revise the Numbers · Zou Maï</title><style>
:root{font-family:system-ui,Arial;background:#f3efe5;color:#172333}*{box-sizing:border-box}body{max-width:960px;margin:auto;padding:20px}header,.panel{background:white;border:2px solid #182d43;border-radius:20px;padding:22px;margin-bottom:18px}a{color:#174f8c}h1{margin:8px 0}button,select,input{font:inherit;padding:12px;border:2px solid #345;border-radius:12px;background:white}button{cursor:pointer}button:focus-visible{outline:4px solid orange}.menu,.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:16px 0}.menu button{background:#ffdf65;font-weight:750;min-height:75px}.choices button{background:#e7f2ff}.big{font-size:clamp(2rem,7vw,4rem);font-weight:800;text-align:center;margin:20px}.muted{color:#526477}#feedback{font-weight:bold;min-height:35px;margin-top:15px}#play[hidden],#home[hidden]{display:none}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.selected{background:#ffe49b!important}input{max-width:100%}
</style></head><body><header><a href="arcade.html?lesson=5">← At the Hotel · 10 jeux</a><h1>🔢 Revise the Numbers</h1><p>Listen, match, spell and play! Écoute, associe, écris et joue.</p><label>Niveau : <select id="level"><option value="20">1 à 20</option><option value="100" selected>1 à 100 · CM2</option><option value="1000">1 à 1 000 · Expert</option></select></label></header><section class="panel" id="home"><h2>Choisis un jeu</h2><div class="menu" id="menu"></div><p class="muted">La voix anglaise dépend des voix installées sur ton appareil. Aucun compte nécessaire.</p></section><section class="panel" id="play" hidden><div class="row"><button id="back">← Jeux</button><strong id="heading"></strong><span id="score"></span></div><div id="work"></div><p id="feedback" aria-live="polite"></p><button id="next" hidden>Suivant →</button></section><script>
const names=['Match the Numbers 🔗','Number Dictation 🎧','Spell the Number ✍️','Number Order 🧩','Hotel Reception 🛎️','Number Challenge ⚡'];
const units=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const tens=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function words(n){if(n<20)return units[n];if(n<100)return tens[Math.floor(n/10)]+(n%10?'-'+units[n%10]:'');if(n===1000)return 'one thousand';return units[Math.floor(n/100)]+' hundred'+(n%100?' and '+words(n%100):'')}
const $=id=>document.getElementById(id),rand=max=>1+Math.floor(Math.random()*max);let mode=0,round=0,points=0,answer=0,done=false,selected=null,sequence=[];
function speak(t){if(!('speechSynthesis'in window)){say('Audio indisponible sur cet appareil.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.82;let v=speechSynthesis.getVoices().find(x=>x.lang.toLowerCase().startsWith('en-gb'));if(v)u.voice=v;speechSynthesis.speak(u)}
function say(t){$('feedback').textContent=t}
function button(t,fn){let b=document.createElement('button');b.textContent=t;b.onclick=fn;return b}
function unique(count){let s=new Set();while(s.size<count)s.add(rand(+$('level').value));return [...s]}
function check(ok,correct){if(done)return;done=true;if(ok){points++;say('✅ Well done!')}else say('❌ Réponse : '+correct);$('score').textContent='⭐ '+points+' / '+(round+1);$('next').hidden=false}
function start(m){mode=m;round=0;points=0;$('home').hidden=true;$('play').hidden=false;$('heading').textContent=names[m];newRound()}
function newRound(){done=false;selected=null;$('next').hidden=true;say('');$('score').textContent='⭐ '+points+' / '+round;let w=$('work');w.replaceChildren();if(round>=10){w.innerHTML='<h2>🎉 Mission terminée !</h2><p>Score : '+points+'/10</p>';w.append(button('Rejouer',()=>start(mode)));return}answer=rand(+$('level').value);
if(mode===0){let nums=unique(4);answer=nums[0];let a=document.createElement('div'),b=document.createElement('div');a.className=b.className='choices';w.append('Choisis un chiffre, puis son étiquette anglaise.',a,b);nums.sort(()=>Math.random()-.5).forEach(n=>a.append(button(''+n,()=>{selected=n;[...a.children].forEach(x=>x.classList.remove('selected'));eventSafeHighlight(a,n)})));nums.sort(()=>Math.random()-.5).forEach(n=>b.append(button(words(n),()=>{if(selected===null){say('Choisis d’abord un chiffre.');return}check(selected===n,selected+' = '+words(selected))})))}
else if(mode===1||mode===4||mode===5){w.append(button('🔊 Écouter / réécouter',()=>speak(mode===4?'Room number '+words(answer):words(answer))));if(mode===4||mode===5){let opts=new Set([answer]);while(opts.size<4)opts.add(rand(+$('level').value));let c=document.createElement('div');c.className='choices';w.append(c);[...opts].sort(()=>Math.random()-.5).forEach(n=>c.append(button(''+n,()=>check(n===answer,answer+' = '+words(answer)))))}else inputAnswer(w,String(answer),'Écris le nombre en chiffres');speak(mode===4?'Room number '+words(answer):words(answer))}
else if(mode===2){let d=document.createElement('div');d.className='big';d.textContent=answer;w.append(d);inputAnswer(w,words(answer),'Écris le nombre en anglais')}
else if(mode===3){sequence=unique(5).sort((a,b)=>a-b);let shuffled=[...sequence].sort(()=>Math.random()-.5),picked=[];w.append('Clique sur les nombres du plus petit au plus grand.');let c=document.createElement('div');c.className='choices';w.append(c);shuffled.forEach(n=>{let b=button(words(n),()=>{if(done)return;picked.push(n);b.disabled=true;b.classList.add('selected');if(picked.length===5)check(picked.every((x,i)=>x===sequence[i]),sequence.map(words).join(' → '))});c.append(b)})}}
function eventSafeHighlight(container,n){[...container.children].find(x=>x.textContent===String(n))?.classList.add('selected')}
function inputAnswer(w,expected,placeholder){let f=document.createElement('form');f.className='row';let i=document.createElement('input');i.placeholder=placeholder;i.autocomplete='off';i.setAttribute('aria-label',placeholder);let b=button('Valider ✓',()=>{});b.type='submit';f.append(i,b);f.onsubmit=e=>{e.preventDefault();let normalize=s=>s.trim().toLowerCase().replace(/[‐‑–—]/g,'-').replace(/\s+/g,' ');check(normalize(i.value)===normalize(expected),expected)};w.append(f);i.focus()}
names.forEach((n,i)=>$('menu').append(button(n,()=>start(i))));$('back').onclick=()=>{$('play').hidden=true;$('home').hidden=false;speechSynthesis?.cancel()};$('next').onclick=()=>{round++;newRound()};
</script></body></html>
