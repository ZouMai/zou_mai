<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ghost Castle · Zou Maï</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#403467,#111323 75%);color:white;font-family:system-ui;text-align:center}header{padding:12px}a{color:#ffe29b}h1{margin:8px;font-size:clamp(24px,4vw,38px)}main{max-width:880px;margin:auto;padding:10px}.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.hud button,button{cursor:pointer;border:2px solid #d9c18d;border-radius:12px;background:#302846;color:white;font-weight:800;padding:10px}.castle{background:#211a34;border:7px ridge #9a839b;border-radius:18px;padding:10px;box-shadow:0 12px 35px #0008}.floor{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:650px;margin:auto}.cell{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;position:relative;font-size:clamp(22px,5vw,42px);background:linear-gradient(135deg,#56445e,#342a48);border:2px solid #89768c}.wall{background:repeating-linear-gradient(0deg,#211b31 0 16px,#393044 17px 20px);border-color:#312a3b}.path{background:linear-gradient(135deg,#8b6372,#563c65)}.goal{background:#705431;box-shadow:inset 0 0 20px #e5ba56}.ghost{filter:drop-shadow(0 0 12px #bcefff);animation:bob 1.2s infinite alternate}@keyframes bob{to{transform:translateY(-5px)}}.controls{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:14px 0}.controls button{min-height:85px;background:#40345c;font-size:clamp(11px,2vw,15px);padding:7px 3px}.controls button span{display:block;font-size:25px}.queue{min-height:52px;background:#1b182b;border:1px dashed #c7b4df;border-radius:12px;padding:10px;line-height:1.8}.actions{display:flex;justify-content:center;gap:9px;margin:12px}.actions button{background:#76516b}.actions #play{background:#247a5e}.message{min-height:32px;color:#ffe7a3;font-weight:800}button:disabled{opacity:.4}@media(max-width:540px){.controls{gap:3px}.controls button{min-height:78px}.cell{border-width:1px}.castle{padding:4px}}
</style><header><a href="./index.html">← English lessons</a><h1>👻 Ghost Castle</h1></header><main><div class="hud"><strong id="level"></strong><strong id="floor"></strong><button id="sound">🔊</button></div><div class="castle"><div class="floor" id="board"></div></div><div class="controls" id="controls"></div><div class="queue" id="queue">✨</div><div class="actions"><button id="undo">↶</button><button id="play">▶ PLAY</button><button id="reset">⟲</button></div><div class="message" id="message" aria-live="polite"></div></main><script>
const commands=[["straight","⬆️","Straight on"],["right","↪️","Turn right"],["left","↩️","Turn left"],["up","🪜⬆️","Go up the stairs"],["down","🪜⬇️","Go down the stairs"]];
const routes=[
["straight","right","straight","up","left","straight","down","straight"],
["left","straight","up","right","straight","down","right","straight"],
["right","straight","down","left","straight","up","left","straight"],
["straight","up","right","straight","left","down","straight","right","straight"]];
let level=0,sequence=[],busy=false,step=0,position={x:1,y:5,z:0,d:0};const vec=[[0,-1],[1,0],[0,1],[-1,0]];const start={x:1,y:5,z:0,d:0};
function simulate(route){let p={...start};const states=[{...p}];for(const c of route){if(c==="left")p.d=(p.d+3)%4;else if(c==="right")p.d=(p.d+1)%4;else if(c==="straight"){p.x+=vec[p.d][0];p.y+=vec[p.d][1]}else if(c==="up")p.z++;else if(c==="down")p.z--;states.push({...p})}return states}
const maps=routes.map(r=>simulate(r));function speak(t){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=.8;speechSynthesis.speak(u)}
function render(){document.getElementById("level").textContent="🏰 "+(level+1)+" / "+routes.length;document.getElementById("floor").textContent="🏰 "+(position.z+2);const b=document.getElementById("board");b.innerHTML="";const states=maps[level];const occupied=new Set(states.filter(p=>p.z===position.z).map(p=>p.x+","+p.y));for(let y=0;y<7;y++)for(let x=0;x<7;x++){const el=document.createElement("div");const on=occupied.has(x+","+y);el.className="cell "+(on?"path":"wall");const target=states.at(-1);if(x===target.x&&y===target.y&&position.z===target.z){el.classList.add("goal");el.textContent="🚪"}if(x===position.x&&y===position.y)el.innerHTML='<span class="ghost">👻</span>';else if(on&&!el.textContent&&states.some((p,i)=>i>0&&p.x===x&&p.y===y&&p.z===position.z&&states[i-1].z!==p.z))el.textContent="🪜";b.append(el)}document.getElementById("queue").textContent=sequence.length?sequence.map(c=>commands.find(v=>v[0]===c)[1]).join("  →  "):"✨"}
commands.forEach(([id,emoji,label])=>{const b=document.createElement("button");b.innerHTML="<span>"+emoji+"</span>"+label;b.onclick=()=>{if(busy)return;sequence.push(id);speak(label);render()};document.getElementById("controls").append(b)});
document.getElementById("undo").onclick=()=>{if(!busy){sequence.pop();render()}};document.getElementById("reset").onclick=()=>{if(busy)return;sequence=[];position={...start};document.getElementById("message").textContent="";render()};document.getElementById("sound").onclick=()=>speak("Help the ghost find the secret room!");
const wait=ms=>new Promise(r=>setTimeout(r,ms));document.getElementById("play").onclick=async()=>{if(busy||!sequence.length)return;busy=true;position={...start};render();const correct=routes[level];for(let i=0;i<sequence.length;i++){const c=sequence[i];speak(commands.find(v=>v[0]===c)[2]);await wait(950);if(c!==correct[i]){document.getElementById("message").textContent="👻 Try again!";busy=false;render();return}position={...maps[level][i+1]};render();await wait(450)}if(sequence.length===correct.length){document.getElementById("message").textContent="🌟 Well done!";speak("Well done!");await wait(1500);level=(level+1)%routes.length;sequence=[];position={...start};document.getElementById("message").textContent="";}else document.getElementById("message").textContent="👻 Keep going!";busy=false;render()};render();
</script></html>
