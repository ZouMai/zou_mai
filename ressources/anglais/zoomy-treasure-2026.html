<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zoomy Treasure Quest · Zoumaï</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8f2f5;color:#17334c;font-family:system-ui,sans-serif;text-align:center}header{padding:12px 10px}a{color:#12618a}h1{margin:5px;font-size:clamp(23px,5vw,36px)}main{max-width:850px;margin:auto;padding:0 12px 25px}.hint{margin:6px 0 12px;font-weight:700}.scene{position:relative;aspect-ratio:1000/690;border:5px solid #8b6a46;border-radius:17px;overflow:hidden;background:#8db6ce;box-shadow:0 8px 25px #25394b44}.scene img{width:100%;height:100%;display:block;object-fit:fill}.zoomy,.treasure-pin{position:absolute;transform:translate(-50%,-50%);z-index:3}.zoomy{transition:left .35s,top .35s;filter:drop-shadow(0 3px 5px #0008)}.zoomy .face{display:block;font-size:clamp(24px,5.5vw,53px);background:transparent;border:0;width:clamp(39px,8vw,76px);height:clamp(39px,8vw,76px);line-height:1.25}.zoomy .arrow{display:block;font-size:clamp(15px,2.6vw,25px);color:#f9df3e;text-shadow:0 2px 3px #162d44;transition:transform .3s}.treasure-pin{font-size:clamp(30px,6vw,60px);filter:drop-shadow(0 2px 4px #24180c)}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}.controls button,.actions button,.reward button{border:0;border-radius:14px;padding:13px 5px;background:#176c9b;color:white;font-weight:800;cursor:pointer;font-size:clamp(12px,2.5vw,17px)}.controls button span{display:block;font-size:27px}.actions{display:flex;justify-content:center;gap:12px}.actions button{padding:12px 22px;background:#36637b}.actions #play{background:#21845e}.message{min-height:33px;font-weight:800;margin:10px}.queue{min-height:40px;padding:10px;background:white;border:2px dashed #91b7c9;border-radius:12px}.reward{position:fixed;inset:0;background:#102338d9;display:grid;place-items:center;z-index:10;padding:15px}.reward[hidden]{display:none}.reward>div{width:min(460px,100%);border:5px solid #eac46d;border-radius:24px;background:#fff6d6;padding:24px;box-shadow:0 0 55px #e8bc52}.reward .chest{font-size:110px;animation:pop .7s ease-out}.reward .coins{font-size:35px;animation:pop 1s ease-out}.reward button{background:#21845e;padding:13px 25px}@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}@media(max-width:500px){.scene{border-width:3px}.controls{gap:5px}.controls button{padding:10px 3px}.controls button span{font-size:22px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}.map-picker{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:12px}.map-picker select{border:2px solid #8b7aab;border-radius:12px;padding:10px;font-weight:800;background:#fff;color:#28354b}.scene #mapArt{width:100%;height:100%;display:block}.scene{overflow:hidden}</style></head><body><header><a href="./index.html">← English lessons</a><h1>👻 Zoomy's Haunted Castle · NEW</h1></header><main><p class="hint">Help Zoomy find the treasure! 🪙</p><div class="map-picker"><label for="mapSelect">🏰 Choose a castle: </label><select id="mapSelect"><option value="0">1 · The Old Tower</option><option value="1">2 · The Haunted Library</option><option value="2">3 · The Secret Dungeon</option><option value="3">4 · The Moonlit Attic</option><option value="4">5 · The Ghostly Keep</option></select><span id="progress"></span></div><div class="scene" id="scene"><svg id="mapArt" viewBox="0 0 1000 690" preserveAspectRatio="none" role="img" aria-label="A haunted castle with one winding corridor"></svg><div class="treasure-pin" id="target">💰</div><div class="zoomy" id="zoomy"><span class="face">👻</span><span class="arrow" id="arrow">▲</span></div></div><div class="controls" id="controls"></div><div class="queue" id="queue">✨</div><div class="actions"><button id="undo">↶ UNDO</button><button id="play">▶ PLAY</button><button id="reset">⟲ RESET</button></div><div class="message" id="message" aria-live="polite"></div></main><div class="reward" id="reward" hidden><div><div class="coins">🪙 ✨ 🪙 ✨ 🪙</div><div class="chest">💰</div><h2>Treasure found!</h2><p>🌟 Well done, Zoomy! 🌟</p><button id="again">PLAY AGAIN</button></div></div><script>
const commands=[["straight","⬆️","Straight on"],["right","↪️","Turn right"],["left","↩️","Turn left"],["up","🪜⬆️","Go up the stairs"],["down","🪜⬇️","Go down the stairs"]];
const $=id=>document.getElementById(id);
const maps=[
{name:"The Old Tower",pts:[[105,555],[350,555],[350,395],[635,395],[635,215]],stairs:[3],facing:1},
{name:"The Haunted Library",pts:[[110,520],[310,520],[310,290],[660,290],[660,480],[875,480]],stairs:[1,3],facing:1},
{name:"The Secret Dungeon",pts:[[120,200],[120,440],[410,440],[410,560],[800,560]],stairs:[0,2],facing:2},
{name:"The Moonlit Attic",pts:[[100,550],[285,550],[285,360],[545,360],[545,190],[870,190]],stairs:[1,3],facing:1},
{name:"The Ghostly Keep",pts:[[105,220],[345,220],[345,480],[570,480],[570,300],[870,300]],stairs:[1,3],facing:1}
];
const icons={straight:"⬆️",right:"↪️",left:"↩️",up:"🪜⬆️",down:"🪜⬇️"};
const headings=(a,b)=>b[0]>a[0]?1:b[0]<a[0]?3:b[1]>a[1]?2:0;
let level=0,stage=0,node=0,direction=1,queue=[],busy=false,program=[];
function buildProgram(){const m=maps[level];program=[];let d=m.facing;for(let i=0;i<m.pts.length-1;i++){const n=headings(m.pts[i],m.pts[i+1]);if(!m.stairs.includes(i)){while(d!==n){const delta=(n-d+4)%4;const turn=delta===3?"left":"right";program.push({cmd:turn,to:i});d=(d+(turn==="right"?1:3))%4}program.push({cmd:"straight",to:i+1})}else{program.push({cmd:m.pts[i+1][1]<m.pts[i][1]?"up":"down",to:i+1})}}}
function draw(){const m=maps[level],p=m.pts;const base='<defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#17213d"/><stop offset="1" stop-color="#56546d"/></linearGradient><pattern id="brick" width="92" height="44" patternUnits="userSpaceOnUse"><path d="M0 0H92M46 0V22M0 22H92M0 22V44" stroke="#b0a4b3" stroke-width="3" opacity=".13"/></pattern></defs><rect width="1000" height="690" fill="url(#sky)"/><rect width="1000" height="690" fill="url(#brick)"/><circle cx="895" cy="80" r="42" fill="#f3dfad"/><g fill="#8994ac" opacity=".25"><path d="M30 160L130 65 230 160V270H30Z"/><path d="M680 155L780 55 880 155V260H680Z"/></g><g font-size="44"><text x="65" y="120">🦇</text><text x="450" y="105">🕸️</text><text x="800" y="610">🕯️</text></g>';
let lines='';for(let i=0;i<p.length-1;i++){const [x,y]=p[i],[u,v]=p[i+1];const stair=m.stairs.includes(i);lines+='<path d="M'+x+' '+y+'L'+u+' '+v+'" stroke="#101b2c" stroke-width="120" stroke-linecap="round"/><path d="M'+x+' '+y+'L'+u+' '+v+'" stroke="'+(stair?'#9d7858':'#c6a57b')+'" stroke-width="90" stroke-linecap="round"/>';if(stair){const low=Math.min(y,v),high=Math.max(y,v);for(let t=low+16;t<high;t+=24)lines+='<path d="M'+(x-37)+' '+t+'H'+(x+37)+'" stroke="#e6d4a7" stroke-width="7"/>'}}$("mapArt").innerHTML=base+lines+'<g font-size="38"><text x="'+(p[0][0]-24)+'" y="'+(p[0][1]+65)+'">🏁</text></g>'}
function speak(t){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=.85;window.speechSynthesis.speak(u)}
function render(){const p=maps[level].pts;const [x,y]=p[node],goal=p[p.length-1];$("zoomy").style.left=x/10+"%";$("zoomy").style.top=y/6.9+"%";$("target").style.left=goal[0]/10+"%";$("target").style.top=goal[1]/6.9+"%";$("arrow").textContent="▲";$("arrow").style.transform="rotate("+(direction*90)+"deg)";$("queue").textContent=queue.length?queue.map(c=>icons[c]).join(" → "):"✨";$("progress").textContent="Map "+(level+1)+"/5"}
commands.forEach(([id,icon,label])=>{const b=document.createElement("button");b.innerHTML="<span>"+icon+"</span>"+label;b.onclick=()=>{if(busy)return;queue.push(id);speak(label);render()};$("controls").append(b)});
function reset(){stage=0;node=0;direction=maps[level].facing;queue=[];busy=false;$("reward").hidden=true;$("message").textContent="";buildProgram();draw();render()}
$("mapSelect").onchange=()=>{if(busy){$("mapSelect").value=String(level);return}level=Number($("mapSelect").value);reset()};
$("undo").onclick=()=>{if(!busy){queue.pop();render()}};$("reset").onclick=()=>{if(!busy)reset()};$("again").onclick=()=>{if(busy)return;level=(level+1)%maps.length;$("mapSelect").value=String(level);reset()};
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function moveTo(n){const from=maps[level].pts[node],to=maps[level].pts[n];for(let k=1;k<=12;k++){const t=k/12;$("zoomy").style.left=(from[0]+(to[0]-from[0])*t)/10+"%";$("zoomy").style.top=(from[1]+(to[1]-from[1])*t)/6.9+"%";await wait(55)}node=n}
$("play").onclick=async()=>{if(busy||!queue.length)return;busy=true;const pending=queue.splice(0);$("message").textContent="";for(const c of pending){const next=program[stage];if(!next||c!==next.cmd){$("message").textContent="👻 Not this way! Try again.";speak("Try again!");break}if(c==="left")direction=(direction+3)%4;else if(c==="right")direction=(direction+1)%4;if(next.to!==node)await moveTo(next.to);else await wait(280);stage++;render();if(stage===program.length){$("reward").hidden=false;$("reward").querySelector("p").textContent=level===4?"🌟 All five castles conquered! 🌟":"🌟 Well done, Zoomy! Next castle awaits! 🌟";$("again").textContent=level===4?"PLAY AGAIN":"NEXT CASTLE →";speak("You found the treasure! Well done!");break}}busy=false;render()};reset();
</script></body></html>
