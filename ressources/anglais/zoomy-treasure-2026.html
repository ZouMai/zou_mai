<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zoomy Treasure Quest · Zoumaï</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8f2f5;color:#17334c;font-family:system-ui,sans-serif;text-align:center}header{padding:12px 10px}a{color:#12618a}h1{margin:5px;font-size:clamp(23px,5vw,36px)}main{max-width:850px;margin:auto;padding:0 12px 25px}.hint{margin:6px 0 12px;font-weight:700}.scene{position:relative;aspect-ratio:1000/690;border:5px solid #8b6a46;border-radius:17px;overflow:hidden;background:#8db6ce;box-shadow:0 8px 25px #25394b44}.scene img{width:100%;height:100%;display:block;object-fit:fill}.zoomy,.treasure-pin{position:absolute;transform:translate(-50%,-50%);z-index:3}.zoomy{transition:left .35s,top .35s;filter:drop-shadow(0 3px 5px #0008)}.zoomy .face{display:block;font-size:clamp(24px,5.5vw,53px);background:transparent;border:0;width:clamp(39px,8vw,76px);height:clamp(39px,8vw,76px);line-height:1.25}.zoomy .arrow{display:block;font-size:clamp(15px,2.6vw,25px);color:#f9df3e;text-shadow:0 2px 3px #162d44;transition:transform .3s}.treasure-pin{font-size:clamp(30px,6vw,60px);filter:drop-shadow(0 2px 4px #24180c)}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}.controls button,.actions button,.reward button{border:0;border-radius:14px;padding:13px 5px;background:#176c9b;color:white;font-weight:800;cursor:pointer;font-size:clamp(12px,2.5vw,17px)}.controls button span{display:block;font-size:27px}.actions{display:flex;justify-content:center;gap:12px}.actions button{padding:12px 22px;background:#36637b}.actions #play{background:#21845e}.message{min-height:33px;font-weight:800;margin:10px}.queue{min-height:40px;padding:10px;background:white;border:2px dashed #91b7c9;border-radius:12px}.reward{position:fixed;inset:0;background:#102338d9;display:grid;place-items:center;z-index:10;padding:15px}.reward[hidden]{display:none}.reward>div{width:min(460px,100%);border:5px solid #eac46d;border-radius:24px;background:#fff6d6;padding:24px;box-shadow:0 0 55px #e8bc52}.reward .chest{font-size:110px;animation:pop .7s ease-out}.reward .coins{font-size:35px;animation:pop 1s ease-out}.reward button{background:#21845e;padding:13px 25px}@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}@media(max-width:500px){.scene{border-width:3px}.controls{gap:5px}.controls button{padding:10px 3px}.controls button span{font-size:22px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body><header><a href="./index.html">← English lessons</a><h1>👻 Zoomy's Haunted Castle · NEW</h1></header><main><p class="hint">Help Zoomy find the treasure! 🪙</p><div class="scene" id="scene"><img src="./zoomy-haunted-corridor.svg?v=20261011b" alt="A colourful castle with nine rooms"><div class="treasure-pin" id="target">💰</div><div class="zoomy" id="zoomy"><span class="face">👻</span><span class="arrow" id="arrow">▲</span></div></div><div class="controls" id="controls"></div><div class="queue" id="queue">✨</div><div class="actions"><button id="undo">↶ UNDO</button><button id="play">▶ PLAY</button><button id="reset">⟲ RESET</button></div><div class="message" id="message" aria-live="polite"></div></main><div class="reward" id="reward" hidden><div><div class="coins">🪙 ✨ 🪙 ✨ 🪙</div><div class="chest">💰</div><h2>Treasure found!</h2><p>🌟 Well done, Zoomy! 🌟</p><button id="again">PLAY AGAIN</button></div></div><script>
const commands=[["straight","⬆️","Straight on"],["right","↪️","Turn right"],["left","↩️","Turn left"],["up","🪜⬆️","Go up the stairs"],["down","🪜⬇️","Go down the stairs"]];
const $=id=>document.getElementById(id);
const nodes=[[105,555],[350,555],[350,395],[635,395],[845,215]];
// One corridor: move all the way to the next wall; turns rotate in place.
const actions=["straight","left","straight","right","straight","up"];
const destination=[1,1,2,2,3,4];
const headings=[1,0,0,1,1,1,1]; // 0 north, 1 east, 2 south, 3 west
let phase=0,node=0,direction=1,queue=[],busy=false;
const icons={straight:"⬆️",right:"↪️",left:"↩️",up:"🪜⬆️",down:"🪜⬇️"};
function speak(t){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=.85;window.speechSynthesis.speak(u)}
function render(){const [x,y]=nodes[node];$("zoomy").style.left=x/10+"%";$("zoomy").style.top=y/6.9+"%";$("target").style.left="84.5%";$("target").style.top="31%";$("arrow").textContent="▲";$("arrow").style.transform="rotate("+(direction*90)+"deg)";$("queue").textContent=queue.length?queue.map(c=>icons[c]).join(" → "):"✨"}
commands.forEach(([id,icon,label])=>{const b=document.createElement("button");b.innerHTML="<span>"+icon+"</span>"+label;b.onclick=()=>{if(busy)return;queue.push(id);speak(label);render()};$("controls").append(b)});
function reset(){phase=0;node=0;direction=1;queue=[];busy=false;$("reward").hidden=true;$("message").textContent="";render()}
$("undo").onclick=()=>{if(!busy){queue.pop();render()}};$("reset").onclick=()=>{if(!busy)reset()};$("again").onclick=reset;
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function moveTo(n){const from=nodes[node],to=nodes[n];const pieces=8;for(let k=1;k<=pieces;k++){const t=k/pieces;$("zoomy").style.left=(from[0]+(to[0]-from[0])*t)/10+"%";$("zoomy").style.top=(from[1]+(to[1]-from[1])*t)/6.9+"%";await wait(85)}node=n}
$("play").onclick=async()=>{if(busy||!queue.length)return;busy=true;const pending=queue.splice(0);$("message").textContent="";for(const c of pending){if(c!==actions[phase]){$("message").textContent="👻 Not this way! Try again.";speak("Try again!");break}if(c==="left")direction=(direction+3)%4;else if(c==="right")direction=(direction+1)%4;render();if(c==="straight"||c==="up")await moveTo(destination[phase]);else await wait(380);phase++;render();if(phase===actions.length){$("reward").hidden=false;speak("You found the treasure! Well done!");break}}busy=false;render()};render();
</script></body></html>
