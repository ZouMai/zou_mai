<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>On the plane · BD expressive · Zou Maï</title><style>*{box-sizing:border-box}body{margin:0;background:#e8e5df;color:#16191e;font-family:system-ui,Arial,sans-serif}button,select,a{font:inherit}.toolbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;flex-wrap:wrap;gap:.55rem;padding:.65rem max(10px,2vw);background:#fffefa;box-shadow:0 2px 12px #0002}.toolbar strong{margin-right:auto}.toolbar button,.toolbar select,.toolbar a{padding:.6rem .8rem;border:2px solid #20242a;border-radius:12px;background:white;color:#151515;text-decoration:none;font-weight:750;cursor:pointer}.toolbar #playAll{background:#aff3c7}.toolbar #stop{background:#ffe2dd}.toolbar button:focus-visible,.sound-btn:focus-visible{outline:4px solid #fae248;outline-offset:3px}.wrap{max-width:1055px;margin:16px auto 40px;padding:0 8px}.page{position:relative;width:100%;background:#fff;box-shadow:0 8px 25px #0002;line-height:0}.page>img{display:block;width:100%;height:auto}.sound-btn{position:absolute;z-index:2;transform:translate(-50%,-50%);width:clamp(30px,3.2vw,42px);height:clamp(30px,3.2vw,42px);display:grid;place-items:center;line-height:1;border:2px solid #fff;border-radius:50%;background:#146cbd;color:#fff;box-shadow:0 2px 8px #0009;cursor:pointer;transition:background .15s}.sound-btn.active{background:#e43166;box-shadow:0 0 0 9px #ffed4f99,0 0 28px 17px #ffde3599;animation:pulse 1s infinite alternate}@keyframes pulse{to{box-shadow:0 0 0 14px #ffed4f77,0 0 36px 22px #ffde3577}}.sound-btn.active:before{content:'';position:absolute;z-index:-1;width:clamp(70px,13vw,145px);height:clamp(42px,7vw,84px);border:5px solid #f9ce16;border-radius:50%;background:#fff25d25;pointer-events:none}.transcript{margin:14px auto;padding:12px 16px;background:#fff;border-radius:14px;border-left:7px solid #ffca25;font-size:1.1rem;line-height:1.4}.transcript strong{display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em}.hint{max-width:1055px;margin:12px auto;padding:0 10px 25px;color:#484c52;font-size:.92rem}@media(max-width:680px){.toolbar strong{width:100%}.wrap{padding:0;margin-top:6px}.sound-btn{width:31px;height:31px;font-size:13px}}@media(prefers-reduced-motion:reduce){.sound-btn.active{animation:none}}</style><link rel="stylesheet" href="../../../../zoumai-brand.css"></head><body><a class="zm-corner-logo" href="../../../../index.html" aria-label="Accueil Zou Maï"><img src="../../../../images/logo-zou-mai-sensei.png" alt="Logo Sensei Zou Maï"></a><div class="toolbar"><strong>🎭 On the plane</strong><button id="playAll">▶ Écouter toute la BD</button><button id="stop">■ Arrêter</button><label>Vitesse <select id="rate"><option value="0.76">Très lente</option><option value="0.88" selected>Lente</option><option value="1">Normale</option></select></label><a href="../../index.html">← Retour aux leçons</a></div><div class="wrap"><div class="page"><img src="on-the-plane-enhanced.png" alt="Planche de BD : On the plane"><button class="sound-btn" style="left:13%;top:16.5%" data-character="crew" data-text="Hello! What do you want to drink?" aria-label="Écouter : Hello! What do you want to drink?" aria-pressed="false">🔊</button>
<button class="sound-btn" style="left:91%;top:17.5%" data-character="crew" data-text="What do you want to drink, Sir?" aria-label="Écouter : What do you want to drink, Sir?" aria-pressed="false">🔊</button>
<button class="sound-btn" style="left:13%;top:28.5%" data-character="child" data-text="An orange juice, please." aria-label="Écouter : An orange juice, please." aria-pressed="false">🔊</button>
<button class="sound-btn" style="left:58%;top:29%" data-character="adult" data-text="Coffee, please! And a glass of water." aria-label="Écouter : Coffee, please! And a glass of water." aria-pressed="false">🔊</button>
<button class="sound-btn" style="left:8%;top:43%" data-character="crew" data-text="And you, Madam?" aria-label="Écouter : And you, Madam?" aria-pressed="false">🔊</button>
<button class="sound-btn" style="left:61%;top:43%" data-character="crew" data-text="And you, Miss?" aria-label="Écouter : And you, Miss?" aria-pressed="false">🔊</button>
<button class="sound-btn" style="left:47%;top:54%" data-character="adult2" data-text="I would like a cup of tea, please. With milk!" aria-label="Écouter : I would like a cup of tea, please. With milk!" aria-pressed="false">🔊</button>
<button class="sound-btn" style="left:78%;top:58%" data-character="child2" data-text="A soda, please." aria-label="Écouter : A soda, please." aria-pressed="false">🔊</button>
<button class="sound-btn" style="left:44%;top:72%" data-character="adult" data-text="And you, Peek? What do you want to drink?" aria-label="Écouter : And you, Peek? What do you want to drink?" aria-pressed="false">🔊</button></div><div class="transcript" aria-live="polite"><strong>Réplique en cours</strong><span id="caption">Choisis une bulle, ou écoute toute la scène.</span></div></div><p class="hint">Clique sur le 🔊 d’une bulle pour l’écouter seule. Pendant la lecture intégrale, la bulle active est surlignée autour de son bouton. Les voix dépendent de celles installées sur l’appareil.</p><script>(() => {
  'use strict';
  const synth = window.speechSynthesis;
  const buttons = [...document.querySelectorAll('.sound-btn')];
  const playAll = document.querySelector('#playAll');
  const stop = document.querySelector('#stop');
  const rate = document.querySelector('#rate');
  const caption = document.querySelector('#caption');
  let voices = [], token = 0, timeout = null;
  // Pick separate installed English voices when possible. Pitch/rate provide
  // an audible distinction if the device offers only one English voice.
  const characters = {
    crew:{slot:0,pitch:1.13,speed:1.02},child:{slot:1,pitch:1.24,speed:1.02},
    adult:{slot:2,pitch:.88,speed:.96},adult2:{slot:3,pitch:1.04,speed:.98},
    child2:{slot:1,pitch:1.29,speed:1.08},questioner:{slot:0,pitch:1.03,speed:.98},
    patrick:{slot:1,pitch:.91,speed:1.03},nessie:{slot:2,pitch:1.28,speed:1.07},
    harry:{slot:3,pitch:.84,speed:.93},arthur:{slot:1,pitch:1.11,speed:1},
    cat:{slot:2,pitch:1.52,speed:.91}
  };
  function loadVoices(){
    const available=synth.getVoices();
    voices=available.filter(v=>/^en[-_]/i.test(v.lang))
      .sort((a,b)=>(/en-GB/i.test(b.lang)?1:0)-(/en-GB/i.test(a.lang)?1:0));
  }
  loadVoices();synth.addEventListener?.('voiceschanged',loadVoices);
  function clear(){
    buttons.forEach(b=>{b.classList.remove('active');b.setAttribute('aria-pressed','false')});
    caption.textContent='Choisis une bulle, ou écoute toute la scène.';
  }
  function halt(){token++;clearTimeout(timeout);synth.cancel();clear();playAll.disabled=false;}
  function lineAt(i,current,all){
    if(current!==token)return;
    if(i>=buttons.length){clear();playAll.disabled=false;return;}
    const b=buttons[i],name=b.dataset.character;
    buttons.forEach(x=>{x.classList.remove('active');x.setAttribute('aria-pressed','false')});
    b.classList.add('active');b.setAttribute('aria-pressed','true');
    caption.textContent=b.dataset.text;
    const actor=characters[name]||characters.questioner;
    const u=new SpeechSynthesisUtterance(b.dataset.text);
    u.lang='en-GB';
    u.rate=Math.max(.55,Math.min(1.5,Number(rate.value)*actor.speed));
    u.pitch=actor.pitch;
    if(voices.length)u.voice=voices[actor.slot%voices.length];
    let done=false;
    const finish=()=>{
      if(done||current!==token)return;done=true;
      b.classList.remove('active');b.setAttribute('aria-pressed','false');
      if(all)timeout=setTimeout(()=>lineAt(i+1,current,true),340);
      else clear();
    };
    u.onend=finish;
    u.onerror=finish;
    synth.speak(u);
  }
  buttons.forEach((b,i)=>b.addEventListener('click',()=>{
    halt();lineAt(i,token,false);
  }));
  playAll.addEventListener('click',()=>{
    halt();playAll.disabled=true;lineAt(0,token,true);
  });
  stop.addEventListener('click',halt);
  window.addEventListener('pagehide',halt);
  if(!synth||!window.SpeechSynthesisUtterance){playAll.disabled=true;caption.textContent='La synthèse vocale n’est pas disponible dans ce navigateur.';}
})();</script></body></html>
