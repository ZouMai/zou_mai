</style></head><body><div class="wrap"><header><img class="logo" src="./assets/logo-zoumai-chart.png" alt="Signature Zou Maï"><div><h1>🎮 Jeux d’anglais · The Méthode 3</h1><div class="muted">19 leçons · CM2 · comprendre, écouter, écrire</div></div><a class="back" href="./index.html">← Menu anglais</a></header><main><section id="home"><p>Choisis une leçon. Chaque jeu comprend des cartes de vocabulaire, un quiz, une dictée audio et des phrases à compléter. Le son utilise les voix anglaises de ton navigateur.</p><div id="catalog"></div></section><section id="game" hidden><div id="lessonHead"></div><div class="tabs" role="group" aria-label="Choix du jeu"><button class="btn" data-mode="cards">🃏 Flashcards</button><button class="btn" data-mode="quiz">🎯 Je choisis</button><button class="btn" data-mode="audio">🔊 J’écoute et j’écris</button><button class="btn" data-mode="phrase">✍️ Je complète</button></div><div class="round"><div class="meta"><span id="progress"></span><strong id="score"></strong></div><div id="activity"></div><div id="feedback" aria-live="polite"></div><div class="controls"><button id="check" class="btn primary">Vérifier</button><button id="next" class="btn" hidden>Suivant →</button><button id="restart" class="btn">Recommencer</button><button id="backHome" class="btn">Toutes les leçons</button></div><div id="review" class="review" hidden></div></div></section></main></div><script id="lesson-data" type="application/json">[{"id": 4, "title": "The train to London", "subtitle": "Directions", "icon": "./assets/04_the_train_to_london.png", "vocab": [{"fr": "tourner à gauche", "en": "turn left"}, {"fr": "tourner à droite", "en": "turn right"}, {"fr": "aller tout droit", "en": "go straight on"}, {"fr": "monter les escaliers", "en": "go up the stairs"}, {"fr": "descendre les escaliers", "en": "go down the stairs"}, {"fr": "le train", "en": "the train"}, {"fr": "la gare", "en": "the station"}, {"fr": "Londres", "en": "London"}], "phrases": [{"en": "Where is the trai (()=>{'use strict';const lessons=JSON.parse(document.getElementById('lesson-data').textContent);const $=id=>document.getElementById(id);let lesson=null,mode='cards',index=0,score=0,answered=false,selected='',cardShown=false,items=[],mistakes=[];const norm=s=>s.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[’‘]/g,"'").replace(/[.!?]/g,'').replace(/\s+/g,' ').trim();const shuffle=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);function speech(t){if(!('speechSynthesis' in window)){$('feedback').textContent='Voix anglaise indisponible sur ce navigateur.';return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.82;let vs=speechSynthesis.getVoices();u.voice=vs.find(v=>v.lang==='en-GB')||vs.find(v=>v.lang.startsWith('en'))||null;speechSynthesis.speak(u)}function elem(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}function button(t,fn,cls='btn'){const b=elem('button',t,cls);b.type='button';b.addEventListener('click',fn);return b}function catalog(){const box=$('catalog');box.replaceChildren();lessons.forEach(l=>{const c=elem('article',undefined,'card');const im=elem('img');im.src=l.icon;im.alt='Illustration '+l.title;im.loading='lazy';const h=elem('h2',String(l.id).padStart(2,'0')+' · '+l.title);c.append(im,h,elem('p',l.subtitle),button('JOUER →',()=>{location.hash='lesson-'+l.id},'btn primary'));box.append(c)})}function openLesson(l){lesson=l;$('home').hidden=true;$('game').hidden=false;const h=$('lessonHead');h.replaceChildren();const im=elem('img');im.src=l.icon;im.alt='Illustration de la leçon';const box=elem('div');box.append(elem('h2',l.id+' · '+l.title),elem('div',l.subtitle,'muted'));h.append(im,box);setMode('cards');window.scrollTo(0,0)}function setMode(m){if(!lesson)return;mode=m;index=0;score=0;answered=false;mistakes=[];items=shuffle(m==='phrase'?lesson.phrases:lesson.vocab).slice(0,m==='cards'?lesson.vocab.length:m==='phrase'?4:8);document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));render()}function render(){if(!lesson)return;answered=false;selected='';cardShown=false;$('next').hidden=true;$('check').hidden=mode==='cards';$('feedback').replaceChildren();$('review').hidden=true;const area=$('activity');area.replaceChildren();if(index>=items.length){finish();return;}$('progress').textContent=(index+1)+' / '+items.length;$('score').textContent='Score : '+score;const item=items[index];if(mode==='cards'){area.append(elem('p','Lis le mot en français, retrouve le mot anglais, puis retourne la carte.','muted'));const f=elem('div',undefined,'flash');const front=elem('strong',item.fr);const back=elem('strong',item.en);back.hidden=true;f.append(front,back);area.append(f);area.append(button('👁 Retourner la carte',()=>{cardShown=!cardShown;front.hidden=cardShown;back.hidden=!cardShown}),button('🔊 Écouter',()=>speech(item.en)));$('next').hidden=false;}else if(mode==='quiz'){area.append(elem('p','Choisis la bonne traduction en anglais.','muted'),elem('div',item.fr,'prompt'));const pool=shuffle(lesson.vocab.filter(x=>x.en!==item.en)).slice(0,3).map(x=>x.en);const choices=shuffle([item.en,...pool]);const grid=elem('div',undefined,'choices');choices.forEach(a=>{const b=button(a,()=>{if(answered)return;selected=a;grid.querySelectorAll('button').forEach(x=>x.classList.toggle('selected',x===b))},'choice');grid.append(b)});area.append(grid)}else if(mode==='audio'){area.append(elem('p','Écoute puis écris le mot en anglais. Aucun correcteur automatique.','muted'));area.append(button('🔊 Écouter',()=>speech(item.en),'btn primary'));const input=elem('input');input.type='text';input.id='answer';input.className='answer';input.autocomplete='off';input.autocorrect='off';input.spellcheck=false;input.placeholder='Écris ce que tu entends…';input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!answered)check()});area.append(input);const keyboard=elem('div',undefined,'keyboard');'abcdefghijklmnopqrstuvwxyz'.split('').forEach(ch=>keyboard.append(button(ch,()=>{input.value+=ch;input.focus()},'key')));keyboard.append(button('⌫',()=>{input.value=input.value.slice(0,-1);input.focus()},'key'));area.append(keyboard)}else{const words=item.en.split(' ');let wi=words.findIndex(w=>/^(in|on|under|behind|between|can|have|is|are|like|the|your|down|up|left|right)$/i.test(w.replace(/[^A-Za-z]/g,'')));if(wi<0)wi=words.length>3?2:words.length-1;const target=words[wi].replace(/^[^A-Za-z]+|[^A-Za-z]+$/g,'');const masked=words.map((w,i)=>i===wi?w.replace(target,'_____'):w).join(' ');item._target=target;area.append(elem('p','Complète la phrase anglaise.','muted'),elem('div',masked,'prompt'),elem('p',item.fr,'muted'));const input=elem('input');input.type='text';input.id='answer';input.className='answer';input.placeholder='Mot manquant…';input.autocomplete='off';input.autocorrect='off';input.spellcheck=false;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!answered)check()});area.append(input);area.append(button('🔊 Écouter la phrase',()=>speech(item.en)));} }function check(){if(answered||index>=items.length||mode==='cards')return;const item=items[index];const target=mode==='phrase'?item._target:item.en;const got=mode==='quiz'?selected:$('answer')?.value||'';if(!got.trim()){$('feedback').textContent='Choisis une réponse ou écris un mot.';return;}answered=true;const correct=norm(got)===norm(target);if(correct)score++;else mistakes.push({prompt:mode==='audio'?'Mot dicté':mode==='phrase'?item.en:item.fr,expected:target,got});$('feedback').replaceChildren();const msg=elem('div',(correct?'✓ Bravo ! ':'↻ À revoir. ')+'Réponse : '+target,'feedback'+(correct?'':' bad'));$('feedback').append(msg);$('score').textContent='Score : '+score;$('next').hidden=false;$('check').hidden=true;if(mode==='audio'||mode==='phrase')$('answer').disabled=true;}function finish(){$('progress').textContent='Terminé';$('score').textContent='Score : '+score+' / '+items.length;$('activity').replaceChildren(elem('h2','Bravo, exercice terminé !'),elem('p','Tu peux revoir tes erreurs ou choisir un autre jeu.'));$('check').hidden=true;$('next').hidden=true;const r=$('review');r.replaceChildren();if(mistakes.length){r.append(elem('h3','Mots ou phrases à revoir'));const ul=elem('ul');mistakes.forEach(x=>ul.append(elem('li',x.prompt+' → '+x.expected)));r.append(ul);r.hidden=false}else if(mode!=='cards')r.append(elem('p','Toutes tes réponses sont correctes !')),r.hidden=false;}function route(){const match=location.hash.match(/^#lesson-(\d+)$/),l=match&&lessons.find(x=>x.id===Number(match[1]));if(!l){$('home').hidden=false;$('game').hidden=true;lesson=null;return;}openLesson(l)}document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));$('check').addEventListener('click',check);$('next').addEventListener('click',()=>{index++;render()});$('restart').addEventListener('click',()=>setMode(mode));$('backHome').addEventListener('click',()=>{location.hash='';$('home').hidden=false;$('game').hidden=true;lesson=null});window.addEventListener('hashchange',route);window.addEventListener('pagehide',()=>speechSynthesis?.cancel());catalog();route();})();
