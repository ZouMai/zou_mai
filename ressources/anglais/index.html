<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Méthode 3 · Ressources anglais</title><link rel="stylesheet" href="./styles.css"></head><body><main class="page"><header class="hero"><div class="hero-top"><a class="back-link" href="../../ressources.html">← Retour aux ressources</a></div><div class="hero-panel"><div class="hero-copy"><div class="eyebrow">ANGLAIS · CYCLE 3</div><h1>The Méthode <span>3</span></h1><p>Toutes les leçons avec la bande dessinée correspondante, dans la vraie charte graphique Zou Maï.</p></div><img class="hero-logo" src="./assets/logo-zoumai-chart.png" alt="Logo Zou Maï"></div></header><section class="toolbar"><label for="search">Chercher une leçon</label><input id="search" type="search" placeholder="Ex. airport, Christmas, zoo…"><div id="count" class="count"></div></section><section id="cards" class="cards"></section></main><script src="./lessons.js"></script><script>const wrap=document.getElementById('cards');const search=document.getElementById('search');const count=document.getElementById('count');function btn(label,href,cls){if(!href){return '<span class="btn off '+cls+'">'+label+'</span>';}return '<a class="btn '+cls+'" href="'+href+'">'+label+'</a>';}function render(){const q=search.value.toLowerCase().trim();const items=LESSONS.filter(l=>(l.title+' '+l.subtitle+' '+l.id).toLowerCase().includes(q));wrap.innerHTML=items.map(l=>`<article class="card"><div class="num">${String(l.id).padStart(2,'0')}</div><div class="iconbox"><img src="${l.icon}" alt="Illustration du loup pour ${l.title}"></div><div class="info"><div class="kicker">THE METHOD · LEÇON ${String(l.id).padStart(2,'0')}</div><h2>${l.title}</h2><p>${l.subtitle}</p><div class="actions">${btn('📖 BD',l.viewer,'bd')}${btn('🔊 BD sonorisée',l.audio,'audio')}${btn('🎮 Jeux',l.games,'game')}</div></div><a class="preview" href="${l.viewer}"><img src="${l.image}" alt="Aperçu BD ${l.title}"></a></article>`).join('');count.textContent=items.length+' / '+LESSONS.length+' leçons';}search.addEventListener('input',render);render();</script></body></html>
