<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#121416"><title>English Games · The Méthode 3 · Zou Maï</title><link rel="stylesheet" href="./styles.css"></head>
<body><div class="container">
<nav class="topnav" aria-label="Navigation"><a href="../../index.html">ACCUEIL</a><a href="../../ressources.html">RESSOURCES</a><a aria-current="page" href="./index.html">ANGLAIS</a></nav>
<header class="banner"><img class="stamp" src="./assets/logo-zoumai-chart.png" alt="Logo original Zou Maï"><div class="banner-text"><p>ENSEIGNER · JOUER · IMAGINER</p><h1>Sensei Zou Maï<br><strong>English Games</strong></h1><p>THE MÉTHODE 3 · CYCLE 3</p></div></header>
<main><div class="heading"><div><p class="eyebrow">RESSOURCES · ANGLAIS</p><h2>Les leçons</h2></div><label>RECHERCHER <input id="search" type="search" placeholder="Titre ou numéro…" autocomplete="off"></label></div><p class="intro">Choisis une leçon, puis ouvre ses jeux ou sa bande dessinée. La version sonorisée est accessible lorsqu’elle est disponible.</p><p id="count" aria-live="polite" class="count"></p><section id="lessons-grid" class="lessons-grid" aria-label="22 leçons d’anglais"></section></main>
<footer><img src="./assets/logo-zoumai-chart.png" alt="Zou Maï"><span>ENSEIGNER · JOUER · IMAGINER</span></footer></div>
<script src="./lessons.js"></script><script>
'use strict';
const grid=document.getElementById('lessons-grid'),search=document.getElementById('search'),counter=document.getElementById('count');
function action(text,url,kind){const node=document.createElement(url?'a':'span');node.className='action '+kind+(url?'':' unavailable');node.textContent=text+(url?'':' · à venir');if(url)node.href=url;else node.setAttribute('aria-disabled','true');return node;}
function render(){const query=search.value.trim().toLocaleLowerCase('fr');const list=LESSONS.filter(x=>(x.id+' '+x.title+' '+x.subtitle).toLocaleLowerCase('fr').includes(query));grid.replaceChildren();list.forEach(l=>{const card=document.createElement('article');card.className='lesson-card';
const top=document.createElement('div');top.className='card-top';const number=document.createElement('span');number.className='number';number.textContent=String(l.id).padStart(2,'0');const chip=document.createElement('span');chip.className='chip';chip.textContent='THE MÉTHODE 3';top.append(number,chip);
const visual=document.createElement('div');visual.className='visual';const wolf=document.createElement('img');wolf.src=l.icon;wolf.alt='Le loup Zou Maï : '+l.title;wolf.loading='lazy';visual.append(wolf);
const title=document.createElement('h3');title.textContent=l.title;const subtitle=document.createElement('p');subtitle.className='subtitle';subtitle.textContent=l.subtitle;
const actions=document.createElement('div');actions.className='actions';actions.append(action('🎮 JEUX',l.games,'game'),action('📖 BD',l.viewer,'comic'),action('🔊 BD SONORISÉE',l.audio,'audio'));
card.append(top,visual,title,subtitle,actions);grid.append(card);});counter.textContent=list.length+' / '+LESSONS.length+' leçons';}
search.addEventListener('input',render);render();
</script></body></html>
