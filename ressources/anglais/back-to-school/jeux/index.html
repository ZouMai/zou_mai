<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Back to school — English Games</title><style>
:root{--ink:#151515;--blue:#168fe5;--yellow:#ffd72e;--red:#ef4353;--green:#25b56b;--paper:#fbfaf5}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Inter,system-ui,Arial,sans-serif;background:radial-gradient(circle at 9% 12%,#ffd72e26 0 110px,transparent 112px),linear-gradient(#fff,#f7f5ed);min-height:100vh}body:before{content:"";position:fixed;left:0;right:0;top:0;height:7px;background:linear-gradient(90deg,var(--blue) 0 38%,var(--yellow) 38% 68%,var(--red) 68%);z-index:99}header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:15px max(18px,4vw);background:#fffffff0;border-bottom:1px solid #ddd;box-shadow:0 3px 18px #0000000f}.plane{font-size:42px}h1{margin:0;font-size:clamp(28px,4vw,48px);line-height:.95}header p{margin:5px 0 0;color:#697076;font-size:13px;font-weight:900;text-transform:uppercase}.nav{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}.nav a,.nav button{border:2px solid #111;border-radius:999px;background:#fff;color:#111;padding:8px 13px;text-decoration:none;font-weight:900;cursor:pointer}.nav .bd{background:var(--yellow)}main{width:min(1180px,94vw);margin:auto;padding:30px 0 55px}.intro{text-align:center;margin-bottom:24px}.intro h2{font-size:clamp(27px,4vw,42px);margin:0 0 7px}.intro p{font-weight:750;color:#62686c}.games{display:grid;grid-template-columns:repeat(5,1fr);gap:15px}.gameBtn{min-height:190px;border:1px solid #d8d8d4;border-radius:20px;background:#fff;padding:16px;text-align:left;cursor:pointer;box-shadow:0 8px 24px #00000012;transition:.18s}.gameBtn:hover{transform:translateY(-5px);box-shadow:0 14px 30px #0002}.gameBtn:nth-child(3n+1){border-bottom:6px solid var(--blue)}.gameBtn:nth-child(3n+2){border-bottom:6px solid var(--yellow)}.gameBtn:nth-child(3n){border-bottom:6px solid var(--red)}.num{display:grid;place-items:center;width:34px;height:34px;border:2px solid #111;border-radius:50%;background:var(--yellow);font-weight:1000}.gameBtn .icon{display:block;font-size:48px;margin:15px 0 10px}.gameBtn b{font-size:18px}.gameBtn small{display:block;margin-top:5px;color:#70767a;font-weight:700}.panel{display:none;min-height:550px;background:#fff;border:1px solid #ddd;border-radius:28px;box-shadow:0 18px 50px #00000017;padding:clamp(20px,4vw,42px);text-align:center}.panel.active{display:block}.topline{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:18px}.back{border:0;border-radius:999px;background:#111;color:#fff;padding:9px 15px;font-weight:900;cursor:pointer}.score{font-weight:900}.prompt{font-size:clamp(25px,4vw,42px);font-weight:1000;margin:18px auto}.audio{width:82px;height:82px;border:3px solid #111;border-radius:50%;background:var(--blue);color:#fff;font-size:34px;box-shadow:4px 4px 0 #111;cursor:pointer}.choices{display:grid;grid-template-columns:repeat(2,minmax(150px,1fr));gap:13px;max-width:720px;margin:22px auto}.choice,.token,.next{border:3px solid #111;border-radius:13px;background:#fff;padding:13px;font-size:18px;font-weight:900;box-shadow:3px 3px 0 #111;cursor:pointer}.choice:hover,.token:hover{background:#fff6bd}.choice.good{background:#c8f3dc}.choice.bad{background:#ffd8de}.feedback{min-height:54px;max-width:650px;margin:18px auto;padding:12px;border-radius:12px;font-size:20px;font-weight:1000}.feedback.good{background:#dff8e9;color:#0b6738;border:2px solid #0b6738}.feedback.bad{background:#ffe2e6;color:#9b1730;border:2px solid #9b1730}.next{background:var(--yellow);margin-top:10px}.tokens{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:20px}.answer{min-height:64px;max-width:700px;margin:15px auto;border:3px dashed #111;border-radius:12px;padding:12px;font-size:24px;font-weight:900}.passport{font-size:86px;margin:15px}.namecard{display:inline-block;margin:10px;padding:15px 22px;border:3px solid #111;border-radius:15px;background:#eef7ff;font-size:26px;font-weight:1000;box-shadow:5px 5px 0 var(--yellow)}@media(max-width:900px){.games{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){header{align-items:flex-start}.plane{font-size:32px}.nav{width:100%}.games{grid-template-columns:1fr 1fr;gap:9px}.gameBtn{min-height:165px;padding:12px}.gameBtn .icon{font-size:39px}.choices{grid-template-columns:1fr}.panel{min-height:520px}.nav a{font-size:11px}}
</style></head><body>
<header><div class="plane">🎒</div><div><h1>Back to school</h1><p>Lesson 01 · School supplies</p></div><nav class="nav"><a href="../../index.html">ANGLAIS</a><a class="bd" href="../bd/">BD SONORISÉE</a></nav></header>
<main><section id="home"><div class="intro"><h2>Choose your game</h2><p>Écoute, comprends, mémorise et réutilise le vocabulaire.</p></div><div class="games">
<button class="gameBtn" onclick="start(0)"><span class="num">1</span><span class="icon">🔊</span><b>Listen & choose</b><small>Écoute et retrouve le mot.</small></button>
<button class="gameBtn" onclick="start(1)"><span class="num">2</span><span class="icon">👀</span><b>Quick match</b><small>Retrouve la traduction.</small></button>
<button class="gameBtn" onclick="start(2)"><span class="num">3</span><span class="icon">🧩</span><b>Build it</b><small>Remets la phrase en ordre.</small></button>
<button class="gameBtn" onclick="start(3)"><span class="num">4</span><span class="icon">💬</span><b>Choose the phrase</b><small>Choisis la bonne expression.</small></button>
<button class="gameBtn" onclick="start(4)"><span class="num">5</span><span class="icon">🏁</span><b>Final challenge</b><small>Mélange vocabulaire et phrases.</small></button>
</div></section><section id="panel" class="panel"><div class="topline"><button class="back" onclick="home()">← MENU</button><span class="score" id="score"></span></div><div id="content"></div></section></main>
<script>
const WORDS=[{"en":"a pencil case","fr":"une trousse"},{"en":"a blue pen","fr":"un stylo bleu"},{"en":"a red pen","fr":"un stylo rouge"},{"en":"a green pen","fr":"un stylo vert"},{"en":"a black pen","fr":"un stylo noir"},{"en":"a glue stick","fr":"un bâton de colle"},{"en":"an eraser","fr":"une gomme"},{"en":"a ruler","fr":"une règle"},{"en":"coloured pencils","fr":"des crayons de couleur"},{"en":"a notebook","fr":"un cahier"},{"en":"a calculator","fr":"une calculatrice"}],PHRASES=[{"en":"Have you got a ruler?","fr":"As-tu une règle ?"},{"en":"Yes, I have!","fr":"Oui, j'en ai une !"},{"en":"No, I haven't!","fr":"Non, je n'en ai pas !"},{"en":"Let's check your school supplies!","fr":"Vérifions tes fournitures scolaires !"}];let mode=0,round=0,points=0,locked=false;const homeEl=document.getElementById('home'),panel=document.getElementById('panel'),content=document.getElementById('content'),score=document.getElementById('score');
function say(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.82;speechSynthesis.speak(u)}function pick(a){return a[Math.floor(Math.random()*a.length)]}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(m){mode=m;round=0;points=0;homeEl.style.display='none';panel.classList.add('active');render()}function home(){speechSynthesis.cancel();panel.classList.remove('active');homeEl.style.display='block'}function top(){score.textContent=(points*20)+' / 100 pts · '+(round+1)+'/5'}function feedback(ok,msg){if(locked)return;locked=true;const f=document.getElementById('feedback');f.className='feedback '+(ok?'good':'bad');f.textContent=msg;if(ok)points++;top()}function next(){round++;if(round>=5)return finish();render()}function choices(opts,correct){return '<div class="choices">'+opts.map(x=>'<button class="choice" onclick="check(this,'+JSON.stringify(x)+','+JSON.stringify(correct)+')">'+x+'</button>').join('')+'</div><div id="feedback" class="feedback"></div><button class="next" onclick="next()">NEXT →</button>'}function check(b,x,e){const ok=x===e;b.classList.add(ok?'good':'bad');feedback(ok,ok?'Well done!':'Correct answer: '+e);if(ok)say(e)}
function render(){locked=false;top();if(mode===0)return listen();if(mode===1)return match();if(mode===2)return build();if(mode===3)return phrase();return challenge()}
function listen(){const q=pick(WORDS),opts=shuffle([q.en,...shuffle(WORDS.filter(x=>x.en!==q.en)).slice(0,3).map(x=>x.en)]);content.innerHTML='<div class="prompt">Listen. What is it?</div><button class="audio" onclick="say('+JSON.stringify(q.en)+')">🔊</button>'+choices(opts,q.en);setTimeout(()=>say(q.en),200)}
function match(){const q=pick(WORDS),opts=shuffle([q.en,...shuffle(WORDS.filter(x=>x.en!==q.en)).slice(0,3).map(x=>x.en)]);content.innerHTML='<div class="prompt">'+q.fr+'</div>'+choices(opts,q.en)}
function build(){const p=pick(PHRASES),tokens=shuffle(p.en.replace(/[?!.,]/g,'').split(' '));window.answer=[];window.expected=p.en.replace(/[?!.,]/g,'');content.innerHTML='<div class="prompt">'+p.fr+'</div><div id="answer" class="answer"></div><div class="tokens">'+tokens.map((w,i)=>'<button class="token" onclick="add(this,'+JSON.stringify(w)+')">'+w+'</button>').join('')+'</div><button class="next" onclick="checkBuild()">CHECK</button><div id="feedback" class="feedback"></div>'}
function add(b,w){answer.push(w);b.disabled=true;document.getElementById('answer').textContent=answer.join(' ')}function checkBuild(){const ok=answer.join(' ')===expected;feedback(ok,ok?'Perfect!':'Try again.');if(ok){say(expected);setTimeout(next,900)}else setTimeout(render,900)}
function phrase(){const p=pick(PHRASES),opts=shuffle([p.en,...shuffle(PHRASES.filter(x=>x.en!==p.en)).slice(0,3).map(x=>x.en)]);content.innerHTML='<div class="prompt">'+p.fr+'</div>'+choices(opts,p.en)}
function challenge(){return round%2?phrase():listen()}function finish(){const finalPoints=points*20;score.textContent=finalPoints+' / 100 pts';ZoumaiScores.save('anglais-back-to-school',finalPoints,100);const msg=finalPoints===100?'Perfect!':finalPoints>=80?'Excellent!':finalPoints>=60?'Well done!':'Keep practising!';content.innerHTML='<div class="passport">🏆</div><div class="prompt">'+msg+'</div><p style="font-size:32px;font-weight:1000">'+finalPoints+' / 100 points</p><p>'+points+' bonnes réponses sur 5</p><button class="next" onclick="home()">RETOUR AU MENU</button>';say(msg)}
</script><script src="../../../../zoumai-scores.js?v=2"></script></body></html>
