<body><a class="zm-corner-logo" href="../../../../index.html" aria-label="Accueil Zou Maï"><img src="../../../../images/logo-zou-mai-sensei.png" alt="Logo Sensei Zou Maï"></a>
<div class="card">
  <h1>🎮 Back to school — Jeux</h1>
  <p>Cette page sert de point d’entrée pour les jeux de la leçon.</p>
  <p><strong>Quand tu connais l’adresse de tes jeux</strong>, remplace simplement la valeur de <code>GAME_URL</code> dans ce fichier.</p>
  <p id="state">Aucun lien de jeux n’est encore configuré.</p>
</div>

<script>
  // ==========================================================
  // À MODIFIER UNE SEULE FOIS :
  const GAME_URL = "";
  // Exemple :
  // const GAME_URL = "https://ton-site.github.io/the-method/back-to-school/";
  // ==========================================================

  if (GAME_URL) {
    document.getElementById("state").textContent = "Ouverture des jeux…";
    location.replace(GAME_URL);
  }
</script>
