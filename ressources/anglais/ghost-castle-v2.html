<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zoomy Treasure Quest · Zoumaï</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8f2f5;color:#17334c;font-family:system-ui,sans-serif;text-align:center}header{padding:12px 10px}a{color:#12618a}h1{margin:5px;font-size:clamp(23px,5vw,36px)}main{max-width:850px;margin:auto;padding:0 12px 25px}.hint{margin:6px 0 12px;font-weight:700}.scene{position:relative;aspect-ratio:1000/690;border:5px solid #8b6a46;border-radius:17px;overflow:hidden;background:#8db6ce;box-shadow:0 8px 25px #25394b44}.scene img{width:100%;height:100%;display:block;object-fit:fill}.zoomy,.treasure-pin{position:absolute;transform:translate(-50%,-50%);z-index:3}.zoomy{transition:left .35s,top .35s;filter:drop-shadow(0 3px 5px #0008)}.zoomy .face{display:block;font-size:clamp(24px,5.5vw,53px);background:transparent;border:0;width:clamp(39px,8vw,76px);height:clamp(39px,8vw,76px);line-height:1.25}.zoomy .arrow{display:block;font-size:clamp(15px,2.6vw,25px);color:#f9df3e;text-shadow:0 2px 3px #162d44;transition:transform .3s}.treasure-pin{font-size:clamp(30px,6vw,60px);filter:drop-shadow(0 2px 4px #24180c)}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}.controls button,.actions button,.reward button{border:0;border-radius:14px;padding:13px 5px;background:#176c9b;color:white;font-weight:800;cursor:pointer;font-size:clamp(12px,2.5vw,17px)}.controls button span{display:block;font-size:27px}.actions{display:flex;justify-content:center;gap:12px}.actions button{padding:12px 22px;background:#36637b}.actions #play{background:#21845e}.message{min-height:33px;font-weight:800;margin:10px}.queue{min-height:40px;padding:10px;background:white;border:2px dashed #91b7c9;border-radius:12px}.reward{position:fixed;inset:0;background:#102338d9;display:grid;place-items:center;z-index:10;padding:15px}.reward[hidden]{display:none}.reward>div{width:min(460px,100%);border:5px solid #eac46d;border-radius:24px;background:#fff6d6;padding:24px;box-shadow:0 0 55px #e8bc52}.reward .chest{font-size:110px;animation:pop .7s ease-out}.reward .coins{font-size:35px;animation:pop 1s ease-out}.reward button{background:#21845e;padding:13px 25px}@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}@media(max-width:500px){.scene{border-width:3px}.controls{gap:5px}.controls button{padding:10px 3px}.controls button span{font-size:22px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body><header><a href="./index.html">← English lessons</a><h1>👻 Zoomy's Treasure Quest</h1></header><main><p class="hint">Help Zoomy find the treasure! 🪙</p><div class="scene" id="scene"><img src="./zoomy-open-path.svg?v=1" alt="A colourful castle with nine rooms"><div class="treasure-pin" id="target">💰</div><div class="zoomy" id="zoomy"><span class="face">👻</span><span class="arrow" id="arrow">▲</span></div></div><div class="controls" id="controls"></div><div class="queue" id="queue">✨</div><div class="actions"><button id="undo">↶ UNDO</button><button id="play">▶ PLAY</button><button id="reset">⟲ RESET</button></div><div class="message" id="message" aria-live="polite"></div></main><div class="reward" id="reward" hidden><div><div class="coins">🪙 ✨ 🪙 ✨ 🪙</div><div class="chest">💰</div><h2>Treasure found!</h2><p>🌟 Well done, Zoomy! 🌟</p><button id="again">PLAY AGAIN</button></div></div><script>
const commands=[["straight","⬆️","Straight on"],["right","↪️","Turn right"],["left","↩️","Turn left"],["up","🪜⬆️","Go up the stairs"],["down","🪜⬇️","Go down the stairs"]];
const dirs=[[0,-1],[1,0],[0,1],[-1,0]];const start={x:0,y:2,d:1};let pos={...start},queue=[],busy=false;const $=id=>document.getElementById(id);
function speak(t){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=.85;window.speechSynthesis.speak(u)}
function render(){const left=21+pos.x*29,top=22+pos.y*23;$("zoomy").style.left=left+"%";$("zoomy").style.top=top+"%";$("arrow").style.transform="rotate("+(pos.d*90)+"deg)";$("target").style.left="79%";$("target").style.top="68%";$("queue").textContent=queue.length?queue.map(c=>commands.find(v=>v[0]===c)[1]).join(" → "):"✨"}
commands.forEach(([id,icon,label])=>{const b=document.createElement("button");b.innerHTML="<span>"+icon+"</span>"+label;b.onclick=()=>{if(busy)return;queue.push(id);speak(label);render()};$("controls").append(b)});
function reset(){pos={...start};queue=[];$("reward").hidden=true;$("message").textContent="";render()}
$("undo").onclick=()=>{if(!busy){queue.pop();render()}};$("reset").onclick=()=>{if(!busy)reset()};$("again").onclick=reset;
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
$("play").onclick=async()=>{if(busy||!queue.length)return;busy=true;const actions=queue.splice(0);$("message").textContent="";for(const c of actions){if(c==="right")pos.d=(pos.d+1)%4;else if(c==="left")pos.d=(pos.d+3)%4;else if(c==="up"||c==="down"){if(pos.x!==1){$("message").textContent="🪜 Find the stairs in the middle!";break}const y=pos.y+(c==="up"?-1:1);if(y<0||y>2){$("message").textContent="🪜 No more stairs!";break}pos.y=y}else{const x=pos.x+dirs[pos.d][0],y=pos.y+dirs[pos.d][1];if(x<0||x>2||y<0||y>2){$("message").textContent="🧱 A wall!";break}pos.x=x;pos.y=y}render();await wait(580);if(pos.x===2&&pos.y===2){$("reward").hidden=false;speak("You found the treasure! Well done!");break}}busy=false;render()};render();
</script></body></html>
