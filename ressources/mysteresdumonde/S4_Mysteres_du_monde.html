e trouver de la nourriture, des abris et des lieux de reproduction."],"photo":"https://commons.wikimedia.org/wiki/Special:FilePath/Ara%20macao%20-%20two%20at%20Lowry%20Park%20Zoo.jpg?width=1100","caption":"Les aras écarlates font partie de la grande biodiversité amazonienne.","kind":"standard"},{"day":"LUNDI","title":"La déforestation : quand la forêt recule","paras":["La déforestation, c’est la disparition durable d’une partie de la forêt, lorsque les arbres sont abattus ou brûlés et que le terrain est transformé. Vue du ciel, la différence est frappante : d’un côté, les arbres forment un tapis vert continu ; de l’autre, apparaissent de grandes étendues de terre nue.","En Amazonie, cette transformation se concentre notamment le long de routes et dans certaines zones de progression agricole. Compare attentivement la forêt intacte et l’espace déboisé sur la photographie : que remarques-tu ?"],"photo":"https://www.rbsdirect.com.br/imagesrc/25314106.jpg?a=c&format=webp&h=1600&w=1600","caption":"Vue aérienne : la limite nette entre forêt préservée et zone déboisée (photographie documentaire).","kind":"standard"},{"day":"LUNDI","title":"Pourquoi coupe-t-on les arbres ?","paras":["Une partie de la forêt est défrichée pour créer des pâturages destinés à l’élevage bovin ou des terres agricoles. D’autres parcelles sont touchées par l’exploitation du bois, l’ouverture de routes ou certaines activités minières. Les causes ne sont pas identiques partout.","Sur la photographie, observe les bovins dans un espace aménagé : cet usage du sol diffère fortement de celui d’une forêt dense. Le déboisement peut être légal ou illégal selon les lieux et les règles applicables."],"photo":"https://www.wwf.de/fileadmin/_processed_/9/b/csm_Original_WW1216940_5620a29f92.jpg","caption":"Des bovins sur une zone de pâturage aménagée en région amazonienne (WWF).","kind":"standard"},{"day":"LUNDI","title":"Quelles conséquences ? Comment protéger la forêt ?","paras":["Quand les arbres disparaissent, de nombreux animaux et végétaux perdent leur habitat. Le sol dénudé devient aussi plus exposé à l’érosion et certaines zones sont fragmentées par les pistes et les coupes. Les incendies allumés pour défricher peuvent également se propager.","Des actions existent : surveiller les coupes grâce aux satellites, faire respecter les zones protégées, soutenir les populations locales et développer des activités qui évitent de détruire la forêt. Protéger l’Amazonie demande des décisions et des efforts à plusieurs échelles."],"photo":"https://f.i.uol.com.br/fotografia/2025/12/18/17660584896943e9f9ac799_1766058489_3x2_rt.jpg","caption":"Transport de grumes sur une piste forestière : l’exploitation du bois modifie les paysages amazoniens.","kind":"standard"},{"day":"LUNDI","title":"À copier dans le cahier du jour","paras":["L’Amazonie est une immense région d’Amérique du Sud, traversée par le fleuve Amazone. Elle abrite la plus grande forêt tropicale humide du monde et une biodiversité exceptionnelle. Mais la déforestation menace les animaux, les plantes et l’équilibre de cet environnement."],"photo":"","caption":"","kind":"writing"},{"day":"MARDI","title":"L’étonnant · Une forêt qui fabrique de la pluie ?","paras":["Comment les arbres de la forêt amazonienne peuvent-ils contribuer à la formation des nuages et de la pluie ?","A · Les arbres soufflent directement des gouttes de pluie vers le ciel.","B · Leurs feuilles libèrent de la vapeur d’eau dans l’air.","C · Les racines transforment la terre en pluie.","D · La couleur verte des feuilles attire automatiquement les nuages.","Choisis une hypothèse et justifie-la à l’oral."],"photo":"https://images.unsplash.com/photo-1473448912268-2022ce9509d8?w=1200","caption":"Les feuilles des arbres participent au cycle de l’eau en libérant de la vapeur d’eau.","kind":"hypothesis"},{"day":"MARDI","title":"L’étonnant · Les arbres rejettent de la vapeur d’eau","paras":["Réponse B","Les racines absorbent de l’eau dans le sol. Une partie est ensuite libérée sous forme de vapeur d’eau par de minuscules ouvertures des feuilles : c’est la transpiration des plantes.","Cette vapeur augmente l’humidité de l’air. Avec l’évaporation de l’eau des sols et des rivières, elle participe au cycle de l’eau et peut favoriser la formation de nuages et de pluie."],"photo":"https://images.unsplash.com/photo-1433086966358-54859d0ed716?w=1200","caption":"Dans une forêt tropicale, la vapeur d’eau contribue à l’humidité atmosphérique et à la formation des nuages.","kind":"standard"},{"day":"MARDI","title":"Vrai ou faux ? · 1/5","paras":["Un poisson d’Amazonie peut produire une décharge électrique capable d’assommer une proie.","Choisis, puis explique ton hypothèse."],"photo":"","caption":"","kind":"vfq"},{"day":"MARDI","title":"L’étonnant · Réponse 1/5","paras":["VRAI !","L’anguille électrique possède des organes capables de produire de puissantes décharges. Elle peut ainsi étourdir une proie et se défendre. Malgré son nom, ce n’est pas une véritable anguille."],"photo":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAQDAwMDAgQDAwMEBAQFBgoGBgUFBgwICQcKDgwPDg4MDQ0PERYTDxAVEQ0NExoTFRcYGRkZDxIbHRsYHRYYGRj/2wBDAQQEBAYFBgsGBgsYEA0QGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBj/wAARCAIAAgADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwDc03Uw9tICfvCuo8LTbWVM87s153pCSG2znGPWuo0fUFt75Bz781+TY+HtZXifPRqcx668bS2xI9K4vxPps00DHPG3Fdbpt6k9qPmAyO9VdWhEsJTrXyTg44lc5
