</style></head><body><main class="shell"><article id="slide" class="slide"><section class="content"><div class="eyebrow" id="date"></div><h1 id="title"></h1><div id="body" class="body"></div></section><aside class="media"><img id="photo" alt="Photographie documentaire du Japon"><div id="photoerror" class="photoerror">Photographie indisponible : une connexion Internet est nécessaire.</div><div class="caption" id="caption"></div></aside></article></main><nav class="controls"><a href="index.html">← Semaines</a><button id="prev">← Précédent</button><select id="day"><option>LUNDI</option><option>MARDI</option><option>JEUDI</option><option>VENDREDI</option></select><span id="count" class="count"></span><button id="next">Suivant →</button><button id="full">⛶ Plein écran</button><a id="source" target="_blank" rel="noopener">Crédit photo ↗</a><span class="hint">← → naviguer · F plein écran</span></nav><script>const slides=[{"texts": ["Rituel « Mystères du monde »", "1) Pose et calcule", "186 + 97 + 91 =", "8 462 − 8 394 =", "19 × 5 =", "Pose les opérations dans le cahier du jour.", "DÉFI BONUS · 4 ÉTAPES", "Un train japonais compte 3 voitures de 48 places chacune.\n\nAu départ, 27 places sont vides.\n\nÀ la première gare, 19 voyageurs descendent et 34 montent.\n\nCombien de voyageurs sont dans le train après cet arrêt ?"], "day": "LUNDI", "photo": 4}, {"texts": ["2) Corrige les calculs au tableau", "186\n   97\n+  91\n──────", "8 462\n−8 394\n──────", "19\n×   5\n──────", "3) Code : écris les trois résultats à la suite, sans espace.", "_   _   _   _   _   _   _", "Clé :  1 = M   2 = R   3 = L   4 = J   5 = N   6 = A   7 = E   8 = P   9 = O"], "day": "LUNDI", "photo": 1}, {"texts": ["3) Destination de la semaine", "374  ·  68  ·  95   →   3746895", "3  7  4  6  8  9  5", "L  E  J  A  P  O  N", "LE JAPON"], "day": "LUNDI", "photo": 2}, {"texts": ["Géographie du Japon", "Le Japon est un pays d’Asie de l’Est, dans l’océan Pacifique. C’est un archipel : il est formé de milliers d’îles. Ses quatre îles principales sont Hokkaidō, Honshū, Shikoku et Kyūshū. Sa capitale est Tokyo.\n\nSur une carte, repère les pays proches du Japon : la Russie, la Corée du Nord, la Corée du Sud et la Chine. Taïwan se trouve aussi au sud-ouest de l’archipel. Le Japon n’a aucune frontière terrestre avec ces territoires : la mer les sépare.\n\nLe mont Fuji est un volcan célèbre, devenu un symbole du pays."], "day": "LUNDI", "photo": 1}, {"day": "LUNDI", "texts": ["Histoire du Japon", "Pendant plusieurs siècles, le Japon a été gouverné par des empereurs et, à certaines périodes, par des chefs militaires appelés shoguns. Les samouraïs étaient des guerriers au service de seigneurs.\n\nÀ partir de 1868, pendant l’ère Meiji, le pays se transforme rapidement : développement des chemins de fer, des usines et de nouvelles institutions.\n\nAujourd’hui, le Japon est une monarchie constitutionnelle : l’empereur est un symbole de l’État, tandis que le gouvernement dirige le pays."]}, {"texts": ["Le japonais", "Au Japon, on parle principalement japonais. Cette langue utilise trois systèmes d’écriture : les hiragana, les katakana et les kanji.\n\nKonnichiwa (こんにちは) signifie « bonjour » dans la journée. Arigatō (ありがとう) signifie « merci ». Sensei (先生) est une manière respectueuse de s’adresser à un professeur ou à une personne qui enseigne."], "day": "LUNDI", "photo": 5}, {"texts": ["Une tradition du Japon", "Au printemps, les cerisiers se couvrent de fleurs roses ou blanches : ce sont les sakura. Pendant le hanami, des familles et des amis se retrouvent dans les parcs pour admirer leur floraison.\n\nDans de nombreuses maisons japonaises, on retire ses chaussures à l’entrée. Les coutumes varient selon les lieux et les familles."], "day": "LUNDI", "photo": 2}, {"texts": ["Quelques éléments culturels du Japon : zoom sur le manga", "Un manga est une bande dessinée japonaise. Dans les éditions japonaises traditionnelles, on commence par ce qui serait la dernière page d’un livre français : on lit de droite à gauche. Sur chaque page, on suit aussi les cases, puis les bulles, généralement de droite à gauche et de haut en bas. Certaines éditions adaptées peuvent se lire autrement.\n\nParmi les mangas célèbres : Dragon Ball (Son Goku), One Piece (Luffy), Naruto (un jeune ninja), mais aussi Détective Conan, Pokémon : La Grande Aventure et Doraemon. Leurs univers sont très différents : aventure, humour, enquête ou science-fiction.\n\nUn manga est une BD à lire ; lorsqu’une histoire est adaptée en dessin animé japonais, on parle souvent d’anime.\n\nLe film d’animation Mon voisin Totoro, réalisé par Hayao Miyazaki, raconte la rencontre de deux sœurs avec une mystérieuse créature de la forêt."], "day": "LUNDI", "photo": 3}, {"texts": ["Le Japon, un pays de séismes", "Pourquoi la terre tremble-t-elle au Japon ?", "La surface de la Terre est formée de grandes plaques rocheuses qui se déplacent très lentement. Le Japon se trouve près des limites de plusieurs plaques tectoniques. Leurs mouvements peuvent provoquer des séismes, parfois très puissants.\n\nLe pays connaît aussi des volcans actifs. Un séisme sous la mer peut déplacer une grande quantité d’eau et provoquer un tsunami : une série de vagues qui peut atteindre les côtes.\n\nLes habitants apprennent des gestes de protection et les bâtiments sont conçus pour mieux résister aux secousses."], "day": "LUNDI", "photo": 0}, {"texts": ["À copier dans le cahier du jour", "Destination de la semaine : le Japon", "Le Japon est un archipel situé en Asie de l’Est, dans l’océan Pacifique. Il connaît de nombreux séismes car il se trouve près de limites de plaques tectoniques."], "day": "LUNDI", "photo": 4}, {"texts": ["L’étonnant · À toi de formuler une hypothèse", "Comment un téléphone au Japon peut-il parfois prévenir d’un séisme quelques secondes avant que le sol ne tremble à cet endroit ?", "A · Des satellites voient les plaques tectoniques bouger juste avant la secousse.", "B · Des capteurs détectent les premières ondes du séisme ; l’alerte électronique peut arriver avant les secousses les plus fortes.", "C · Des scientifiques connaissent à l’avance l’heure exacte de chaque séisme.", "D · Des chats entraînés miaulent dans un micro pour prévenir tous les téléphones.", "Choisis une hypothèse et justifie-la oralement."], "day": "MARDI", "photo": 5}, {"texts": ["L’étonnant · Explication", "Réponse B", "Le séisme a déjà commencé lorsque les capteurs détectent ses premières ondes. Un message électronique peut circuler plus vite que les ondes sismiques les plus destructrices : certains habitants reçoivent alors une alerte avant les fortes secousses.", "Attention : près de l’épicentre, l’alerte peut arriver trop tard. Ce système ne prédit pas les séismes."], "day": "MARDI", "photo": 0}, {"texts": ["MARDI · L’ÉTONNANT · 1/5", "Vrai ou faux ?", "Un tsunami est toujours provoqué par un très grand vent.", "VRAI                         FAUX", "Choisis, puis justifie ta réponse."], "day": "MARDI", "photo": 4}, {"texts": ["MARDI · RÉPONSE · 1/5", "FAUX !", "Un tsunami est généralement causé par un déplacement brutal de l’eau, souvent à la suite d’un puissant séisme sous-marin. Ce n’est pas une vague créée par le vent.", "À SAVOIR", "Un tsunami peut être composé de plusieurs vagues."], "day": "MARDI", "photo": 5}, {"texts": ["Vrai ou faux ? · 2/5", "À Tokyo, un carrefour peut être traversé par des milliers de piétons lors d’un seul feu vert.", "VRAI                         FAUX", "Choisis et explique ton hypothèse."], "day": "MARDI", "photo": 1}, {"texts": ["Réponse · 2/5", "VRAI !", "Le carrefour de Shibuya est célèbre pour ses passages piétons simultanés. Des milliers de personnes peuvent traverser lors d’un même cycle, selon l’affluence."], "day": "MARDI", "photo": 1}, {"texts": ["Vrai ou faux ? · 3/5", "Au Japon, il existe une île où vivent de nombreux lapins en liberté.", "VRAI                         FAUX", "Choisis et explique ton hypothèse."], "day": "MARDI", "photo": 1}, {"texts": ["Réponse · 3/5", "VRAI !", "Sur l’île d’Ōkunoshima, de nombreux lapins vivent en liberté. Ce lieu attire des visiteurs, mais les animaux restent des êtres vivants à respecter."], "day": "MARDI", "photo": 2}, {"texts": ["Vrai ou faux ? · 4/5", "Certains trains japonais peuvent se déplacer au-dessus de leur voie grâce à des aimants.", "VRAI                         FAUX", "Choisis et explique ton hypothèse."], "day": "MARDI", "photo": 4}, {"texts": ["Réponse · 4/5", "VRAI !", "Les trains à sustentation magnétique, ou maglev, peuvent léviter légèrement au-dessus de la voie grâce aux forces magnétiques."], "day": "MARDI", "photo": 4}, {"texts": ["Vrai ou faux ? · 5/5", "Le Japon possède des sources d’eau chaude naturelles dans lesquelles on peut se baigner.", "VRAI                         FAUX", "Choisis et explique ton hypothèse."], "day": "MARDI", "photo": 2}, {"texts": ["Réponse · 5/5", "VRAI !", "Les onsen sont des bains alimentés par des eaux naturellement chaudes, souvent liées à l’activité géothermique. Leurs usages obéissent à des règles locales."], "day": "MARDI", "photo": 4}, {"texts": ["L’étonnant · Ma phrase du jour", "Dans ton cahier du jour : saute une ligne, écris la date, puis choisis le fait qui t’a le plus étonné.", "Pour écrire ta phrase, tu peux commencer par :", "« Ce qui est surprenant, c’est que… »\n« J’ai été étonné(e) d’apprendre que… »\n« Je ne savais pas que… »\n« Ce qui m’a le plus impressionné(e), c’est… »", "Ajoute une deuxième phrase pour expliquer pourquoi."], "day": "MARDI", "photo": 1}, {"texts": ["Qu’est-ce qu’une plaque tectonique ?", "La couche externe solide de la Terre est découpée en grandes plaques rocheuses. Elles se déplacent de quelques centimètres par an.", "À leurs limites, elles peuvent se rapprocher, s’écarter ou glisser l’une contre l’autre."], "day": "JEUDI", "photo": 2}, {"texts": ["Comment naît un séisme ?", "1. Des roches se bloquent le long d’une faille.\n\n2. Les forces s’accumulent pendant que les plaques bougent.\n\n3. Les roches rompent ou glissent brusquement : des ondes font trembler le sol."], "day": "JEUDI", "photo": 4}, {"texts": ["Fenêtre sur le monde · Les séismes au Japon", "VIDÉO · 3 min 14 s", "C’est pas sorcier — « Tectonique des plaques et tremblements de terre » (Lumni).", "▶ OUVRIR LA VIDÉO LUMNI", "https://www.lumni.fr/video/tectonique-des-plaques-et-tremblements-de-terre", "Pendant la vidéo : repère ce qu’est une plaque tectonique, comment un séisme se produit et pourquoi le Japon est concerné."], "day": "JEUDI", "photo": 5}, {"texts": ["JEUDI · APRÈS LA VIDÉO", "Trois idées à retenir", "CAUSE", "Les plaques tectoniques bougent : leurs mouvements peuvent provoquer des séismes.", "SE PROTÉGER", "S’abriter, protéger sa tête et suivre les consignes de sécurité.", "SE PRÉPARER", "Faire des exercices et construire des bâtiments adaptés."], "day": "JEUDI", "photo": 0}, {"day": "JEUDI", "texts": ["Dans le cahier du jour", "Les séismes"]}, {"day": "VENDREDI", "texts": ["Vendredi · Mon passeport du Japon", "Dans ton cahier du jour, écris la date et le titre « Passeport du Japon ».", "1. Géographie : situe le Japon (continent, océan et un pays voisin).", "2. Culture : présente une tradition, un mot japonais ou un personnage découvert cette semaine.", "3. Sciences : explique en une phrase pourquoi les séismes sont fréquents au Japon.", "4. Mon avis : quel fait t’a le plus étonné ? Explique pourquoi.", "Rédige quatre phrases complètes. Relis les majuscules, les points et les accords."]}];const queries=["Japan shinkansen bullet train station 1", "Japan Tokyo city skyline 2", "Japan Hokkaido landscape 3", "Japan archipelago aerial coastline islands 4", "Japan Meiji era historic Tokyo railway 1", "Japanese calligraphy hiragana shop signs Japan 2", "Japan sakura hanami cherry blossom park 3", "Japan Meiji era historic Tokyo railway 4", "Japan earthquake tectonic plate map 1", "Japan earthquake seismic science tectonics 2", "Japan earthquake early warning smartphone 3", "
