<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M6 · Fractions décimales · Zou Maï</title><link rel="stylesheet" href="zoumai-brand.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f1eee6;color:#193241;font:17px/1.5 system-ui,sans-serif}.wrap{max-width:990px;margin:auto;padding:18px 15px 60px}header{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}a{color:#176d72}.hero{background:#123b50;color:white;border-radius:24px;padding:22px;margin:18px 0;display:flex;align-items:center;gap:18px}.hero img{width:85px;max-width:22vw}.hero h1{margin:0;font-size:clamp(1.65rem,4vw,2.7rem)}.hero p{margin:6px 0}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.tab,.btn,.choice{border:2px solid #cbdde1;border-radius:13px;padding:12px;background:white;color:#193241;font:inherit;font-weight:750;cursor:pointer}.tab[aria-selected=true],.primary{background:#157b72!important;color:white!important;border-color:#157b72!important}.panel{background:white;border-radius:22px;padding:clamp(16px,4vw,28px);margin-top:15px;min-height:340px;box-shadow:0 8px 30px #163b5012}.eyebrow{color:#57707b;font-size:.9rem;font-weight:800}h2{margin:6px 0 8px}.question{font-size:1.25rem;font-weight:800}.visual{margin:20px 0;min-height:90px;display:grid;place-items:center;overflow:auto}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.choice:focus-visible,.btn:focus-visible,.tab:focus-visible{outline:3px solid #efaa49;outline-offset:2px}.choice:hover:not(:disabled){border-color:#157b72}.choice.correct{background:#ddf7eb;border-color:#168365}.choice.wrong{background:#fff0e7;border-color:#ce714c}.choice:disabled{cursor:default}.feedback{min-height:54px;margin:14px 0;font-weight:750}.actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:space-between}.muted{color:#58707c}.progress{height:9px;background:#e6eef0;border-radius:9px;overflow:hidden;margin:11px 0 18px}.progress>div{height:100%;background:#18a48d;transition:width .2s}.grid100{display:grid;grid-template-columns:repeat(10,1fr);width:min(340px,100%);border:2px solid #32677e}.cell{aspect-ratio:1;border:1px solid #aecbd7;background:#e6f0f4;cursor:pointer}.cell.on{background:#efa957}.strip{display:flex;width:min(500px,100%);border:2px solid #32677e}.strip span{flex:1;min-height:65px;border-right:1px solid #32677e;background:#e6f0f4}.strip span.on{background:#efa957}.line{width:min(100%,640px)}.small{font-size:.87rem}.finish{padding:15px;border-radius:14px;background:#edf8f6}@media(max-width:650px){.tabs{grid-template-columns:repeat(2,1fr)}.answers{grid-template-columns:1fr}.hero img{width:63px}.tab{font-size:.9rem;padding:10px 6px}}
</style></head><body><main class="wrap"><header><a href="maths-lecons-cm2.html">← Mathématiques CM2</a><a href="ressources.html#ma">Ressources</a></header><section class="hero"><img src="images/loup-bleu-original.png" alt="Le loup bleu de Zou Maï"><div><small>MISSION M6 · CM2</small><h1>Les fractions décimales</h1><p>Six ateliers pour voir, comprendre et manipuler les dixièmes, centièmes et millièmes.</p></div></section><nav id="tabs" class="tabs" aria-label="Choisir un atelier"></nav><section class="panel"><div class="eyebrow" id="count"></div><div class="progress"><div id="bar"></div></div><h2 id="heading"></h2><p id="question" class="question"></p><div class="visual" id="visual"></div><div class="answers" id="answers"></div><p id="feedback" class="feedback" role="status" aria-live="polite"></p><div class="actions"><button class="btn" id="hint">💡 Indice</button><button class="btn primary" id="next">Question suivante →</button></div></section></main>
<script>
(()=>{'use strict';
const names=['🔍 Je reconnais','🎨 Je colorie','🧩 Je décompose','📍 Je me repère','⚖️ Je compare','🏡 Je résous'];
const $=id=>document.getElementById(id),rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[rand(0,a.length-1)],shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=rand(0,i);[b[i],b[j]]=[b[j],b[i]]}return b},fmt=n=>String(Math.round(n*1000)/1000).replace('.',','),fraction=(a,b)=>a+'/'+b;
let mode=0,step=0,score=0,solved=false,q=null,seen=names.map(()=>new Set()),tries=0;
function options(correct,other){return shuffle([...new Set([String(correct),...other.map(String)])]).slice(0,4)}
function make(m){let d,n,k,t,ans,wrong,explain,visual='',type='choice',hint='';
if(m===0){d=pick([10,100,1000]);n=rand(1,Math.min(d*2,850));ans=fraction(n,d);wrong=[fraction(n,3),fraction(n,7),fraction(n,9)];hint='Le dénominateur est 10, 100 ou 1 000.';explain='Une fraction décimale a pour dénominateur 10, 100, 1 000…';return {ask:'Quelle écriture est une fraction décimale ?',ans,wrong,hint,explain}}
if(m===1){d=pick([10,100]);n=d===10?rand(1,9):rand(8,92);ans=fraction(n,d);wrong=[fraction(n+1,d),fraction(Math.max(1,n-1),d),fraction(d-n,d)];visual=grid(d,n);hint='Compte les cases orange, puis toutes les cases.';explain='Il y a '+n+' cases colorées sur '+d+' cases égales.';return {ask:'Quelle fraction de la figure est colorée ?',ans,wrong,hint,explain,visual}}
if(m===2){d=pick([10,100,1000]);n=rand(d+1,d*3-1);let units=Math.floor(n/d),rest=n%d;ans=units+' unité'+(units>1?'s':'')+' et '+rest+' '+(d===10?'dixièmes':d===100?'centièmes':'millièmes');wrong=[(units+1)+' unités et '+rest+' '+(d===10?'dixièmes':d===100?'centièmes':'millièmes'),units+' unités et '+(rest+1)+' '+(d===10?'dixièmes':d===100?'centièmes':'millièmes'),rest+' unités et '+units+' '+(d===10?'dixièmes':d===100?'centièmes':'millièmes')];hint='Chaque '+d+'/'+d+' représente une unité.';explain=fraction(n,d)+' = '+units+' + '+fraction(rest,d)+'.';return {ask:'Décompose '+fraction(n,d)+' en unités et fractions d’unité.',ans,wrong,hint,explain}}
if(m===3){d=pick([10,100]);n=rand(1,d*2-1);ans=fraction(n,d);wrong=[fraction(n+1,d),fraction(Math.max(0,n-1),d),fraction(n,d===10?100:10)];visual=line(d,n);hint='Chaque petit intervalle vaut 1/'+d+'.';explain='Le point représente '+n+' graduations de 1/'+d+'.';return {ask:'Quelle fraction correspond au point orange ?',ans,wrong,hint,explain,visual}}
if(m===4){d=pick([10,100,1000]);n=rand(1,d*2);k=rand(1,d*2);if(n===k)k++;ans=n>k?'>':'<';wrong=[ans==='>'?'<':'>','='];hint='Les deux dénominateurs sont égaux. Compare les numérateurs.';explain=n+' '+ans+' '+k+', donc '+fraction(n,d)+' '+ans+' '+fraction(k,d)+'.';return {ask:'Complète : '+fraction(n,d)+' … '+fraction(k,d),ans,wrong,hint,explain}}
d=pick([10,100]);n=rand(2,d-1);let objects=pick(['une bouteille de jus','une tablette de chocolat','une piste cyclable','un ruban pour bricoler']);ans=fraction(n,d);wrong=[fraction(n+1,d),fraction(n,10===d?100:10),fraction(d-n,d)];hint='La quantité entière vaut '+d+'/'+d+'.';explain=n+' parts sur '+d+' parts égales représentent '+ans+' de l’unité.';return {ask:'On partage '+objects+' en '+d+' parts égales. '+n+' parts sont utilisées. Quelle fraction de l’unité cela représente-t-il ?',ans,wrong,hint,explain,visual:grid(d,n)}}
function grid(d,n){let s='<div class="'+(d===10?'strip':'grid100')+'" role="img" aria-label="'+n+' parties colorées sur '+d+'">';for(let i=0;i<d;i++)s+='<span class="'+(d===10?'':'cell ')+(i<n?'on':'')+'"></span>';return s+'</div>'}
function line(d,n){let base=Math.floor(n/d),start=base*d,span=d===10?10:10,interval=d===10?1:10,idx=Math.round((n-start)/interval);if(d===100){start=Math.floor(n/10)*10;idx=n-start}let s='<svg class="line" viewBox="0 0 620 125" role="img" aria-label="Droite graduée avec un point orange"><path d="M20 64H600" stroke="#315f78" stroke-width="4"/>';for(let i=0;i<=10;i++){let x=30+i*56;s+='<path d="M'+x+' 55V74" stroke="#315f78" stroke-width="2"/>';if(i===0||i===10)s+='<text x="'+x+'" y="103" text-anchor="middle" font-size="17" fill="#315f78">'+fraction(start+i*interval,d)+'</text>'}let px=30+idx*56;s+='<circle cx="'+px+'" cy="64" r="9" fill="#e79435" stroke="#9d570e" stroke-width="2"/></svg>';return s}
function create(){let candidate,signature;for(let i=0;i<60;i++){candidate=make(mode);signature=candidate.ask+'|'+candidate.ans;if(!seen[mode].has(signature))break}q=candidate;seen[mode].add(signature);if(seen[mode].size>150)seen[mode].clear();solved=false;tries=0;render()}
function render(){document.querySelectorAll('.tab').forEach((b,i)=>b.setAttribute('aria-selected',String(i===mode)));$('heading').textContent=names[mode];$('count').textContent='Atelier '+(mode+1)+'/6 · Question '+(step+1)+'/8 · '+score+' bonne(s) réponse(s)';$('bar').style.width=(step/8*100)+'%';$('question').textContent=q.ask;$('visual').innerHTML=q.visual||'';$('feedback').textContent='';$('answers').innerHTML='';options(q.ans,q.wrong).forEach(value=>{let b=document.createElement('button');b.className='choice';b.textContent=value;b.onclick=()=>answer(value,b);$('answers').append(b)});$('next').disabled=true;$('hint').disabled=false}
function answer(v,b){if(solved)return;tries++;if(v===q.ans){solved=true;if(tries===1)score++;b.classList.add('correct');$('answers').querySelectorAll('button').forEach(x=>x.disabled=true);$('feedback').style.color='#08755b';$('feedback').textContent='✓ Exact ! '+q.explain;$('next').disabled=false}else{b.classList.add('wrong');b.disabled=true;$('feedback').style.color='#a75324';$('feedback').textContent='Pas encore. '+q.hint+' Essaie une autre réponse.'}}
function next(){if(!solved)return;step++;if(step>=8){$('bar').style.width='100%';$('visual').innerHTML='<div class="finish"><strong>Atelier terminé !</strong><p>Tu as réussi '+score+' question(s) du premier coup sur 8.</p><p>Tu peux recommencer ou découvrir l’atelier suivant.</p></div>';$('question').textContent='Mission accomplie';$('answers').innerHTML='';$('feedback').textContent='';$('next').disabled=false;$('next').textContent=mode===5?'Recommencer ↻':'Atelier suivant →';$('next').onclick=()=>{mode=mode===5?0:mode+1;start()};return}create()}
function start(){step=0;score=0;$('next').textContent='Question suivante →';$('next').onclick=next;create()}
names.forEach((name,i)=>{let b=document.createElement('button');b.className='tab';b.textContent=name;b.setAttribute('aria-selected','false');b.onclick=()=>{mode=i;start()};$('tabs').append(b)});$('next').onclick=next;$('hint').onclick=()=>{$('feedback').style.color='#34667b';$('feedback').textContent='💡 '+q.hint};start();
})();
</script><script src="site-tracking.js" defer></script></body></html>
