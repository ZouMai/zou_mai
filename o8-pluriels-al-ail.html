<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>O8 · Pluriels en -al et -ail | Zoumaï</title><style>body{font-family:system-ui;background:#edf4fb;color:#17243a;margin:0}main{max-width:780px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center}a{color:#214c8b}.card{background:white;padding:26px;border-radius:22px;box-shadow:0 8px 25px #10203019;margin:20px 0}h1{font-size:clamp(26px,5vw,42px)}button{cursor:pointer;border:2px solid #283b60;border-radius:14px;padding:13px 17px;background:white;font-size:18px;font-weight:700;margin:6px}button:hover{background:#e5f2ff}.good{background:#d9f7df}.bad{background:#ffe1df}.progress{height:12px;background:#dfe5ef;border-radius:12px;overflow:hidden}.progress div{height:100%;background:#3983cf;transition:.2s}#feedback{min-height:50px;font-weight:700}.hint{background:#fff4d3;padding:12px;border-radius:12px;margin:14px 0}small{color:#526177}#next{background:#203e77;color:white}#next:disabled{opacity:.4}img{width:66px;height:66px;object-fit:contain} .options{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))} .options button{margin:5px}</style><main><header><a href="ressources.html#orthographe">← Orthographe</a><img src="images/loup-bleu-original.png" alt="Loup bleu Zoumaï"></header><section class="card"><small>ORTHOGRAPHE · CM2 · O8</small><h1>🐺 Le défi des pluriels</h1><p>Les mots en <b>-al</b> deviennent généralement <b>-aux</b> ; les noms en <b>-ail</b> prennent généralement <b>-s</b>. Attention aux exceptions !</p><div class="progress"><div id="bar"></div></div><p id="stage"></p><h2 id="question"></h2><div id="hint" class="hint" hidden></div><button id="help" onclick="showHint()">💡 Définition / indice</button><div class="options" id="options"></div><p id="feedback" aria-live="polite"></p><button id="next" onclick="advance()" disabled>Continuer →</button></section></main><script>
const words=[
["animal","animaux","animal qui vit, se nourrit et se déplace","🐾"],["journal","journaux","publication qui donne des nouvelles","📰"],["royal","royaux","qui concerne un roi ou une reine","👑"],["cheval","chevaux","animal que l'on peut monter","🐴"],["festival","festivals","événement réunissant des spectacles ou concerts","🎵"],["carnaval","carnavals","fête avec des déguisements et des défilés","🎭"],["chacal","chacals","mammifère sauvage ressemblant à un petit loup","🐺"],["récital","récitals","concert donné par un artiste ou un petit groupe","🎹"],["travail","travaux","activité à réaliser ; au pluriel, aussi des chantiers","🔨"],["vitrail","vitraux","fenêtre composée de morceaux de verre coloré","🪟"],["corail","coraux","animal marin vivant en colonie, formant parfois des récifs","🪸"],["bail","baux","contrat pour louer un logement ou un local","🏠"],["émail","émaux","matière brillante et dure qui recouvre certains objets","🏺"],["soupirail","soupiraux","petite ouverture qui éclaire ou aère une cave","🏚️"],["vantail","vantaux","partie mobile d'une porte ou d'une fenêtre","🚪"],["portail","portails","grande porte donnant accès à une cour","🚪"],["éventail","éventails","objet que l'on agite pour se rafraîchir","🪭"],["détail","détails","petit élément d'un ensemble","🔎"],["national","nationaux","qui concerne une nation, un pays","🇫🇷"],["oral","oraux","qui se fait avec la parole","🗣️"]];
let n=0,score=0,answered=false;const $=id=>document.getElementById(id);
function render(){if(n===words.length){$("stage").textContent="Mission terminée";$("question").textContent="🏆 Score : "+score+" / "+words.length;$("options").innerHTML="";$("help").hidden=true;$("hint").hidden=true;$("feedback").textContent=score>=17?"Excellent travail !":"Relis les exceptions et retente le défi.";$("next").textContent="Rejouer ↻";$("next").disabled=false;$("bar").style.width="100%";return}answered=false;const w=words[n];$("bar").style.width=(n/words.length*100)+"%";$("stage").textContent="Mission "+(Math.floor(n/5)+1)+" / 4 · Question "+(n+1)+" / "+words.length;$("question").textContent="Quel est le pluriel de « "+w[0]+" » ?";$("hint").hidden=true;$("hint").textContent=w[3]+" "+w[2];$("feedback").textContent="";$("next").disabled=true;$("next").textContent="Continuer →";let wrong=w[0].endsWith("al")?w[0]+"s":w[0].slice(0,-3)+"aux";if(wrong===w[1])wrong=w[0].slice(0,-2)+"s";const choices=[w[1],wrong].sort(()=>Math.random()-.5);$("options").innerHTML="";choices.forEach(c=>{let b=document.createElement("button");b.textContent=c;b.onclick=()=>choose(c,b);$("options").appendChild(b)})}
function showHint(){$("hint").hidden=false}
function choose(c,b){if(answered)return;answered=true;const correct=words[n][1];if(c===correct){score++;b.classList.add("good");$("feedback").textContent="✓ Bravo ! "+correct}else{b.classList.add("bad");$("feedback").textContent="✗ La bonne réponse est « "+correct+" »."}document.querySelectorAll(".options button").forEach(x=>{x.disabled=true;if(x.textContent===correct)x.classList.add("good")});$("next").disabled=false;$("hint").hidden=false}
function advance(){if(n===words.length){n=0;score=0}else n++;render()}render();</script></html>
