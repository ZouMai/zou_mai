<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="zoumai.css"><link rel="stylesheet" href="zoumai-brand.css"><style>body{margin:0;background:#f5f0e5;font-family:Arial;color:#101114}.wrap{width:min(920px,94vw);margin:auto;padding:24px 0 70px}.top{display:flex;justify-content:space-between;border-bottom:3px solid #111;padding:12px}.top a{color:#111;font-weight:900;text-decoration:none}.card{background:#fff;border:3px solid #111;border-radius:24px;padding:24px;box-shadow:7px 7px 0 #111;text-align:center}h1{font-size:clamp(2rem,6vw,3.6rem)}.btn,button{border:3px solid #111;border-radius:13px;padding:11px 16px;margin:6px;background:#f2d31c;font-weight:900;cursor:pointer;font-size:1rem}.white{background:#fff}.big{font-size:clamp(2rem,8vw,4rem);font-weight:900;margin:22px}.feedback{min-height:50px;font-weight:800;margin:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.box{border:2px solid #111;border-radius:14px;padding:14px;background:#fafafa}input,textarea,select{font:inherit;padding:10px;border:2px solid #111;border-radius:10px;max-width:90%}</style></head><body><div class="wrap"><div class="top"><strong>ZOU MAÏ · RASED</strong><a href="cp-experimentation.html">← Espace RASED</a></div><h1>📒 Carnet de séance</h1><div class="card"><p>Une trace courte des séances d'aide. Les données restent sur cet appareil.</p><input id="eleve" placeholder="Prénom ou initiales"><br><select id="dom"><option>Lecture</option><option>Phonologie</option><option>Encodage</option><option>Compréhension</option><option>Mathématiques</option></select><br><textarea id="obs" rows="5" cols="45" placeholder="Obstacle observé, aide apportée, progrès..."></textarea><br><button onclick="save()">Ajouter la séance</button><button class="white" onclick="show()">Afficher l’historique</button><div id="out"></div></div><script>function save(){let a=JSON.parse(localStorage.getItem("rased-carnet")||"[]");a.unshift({date:new Date().toLocaleDateString(),e:eleve.value,d:dom.value,o:obs.value});localStorage.setItem("rased-carnet",JSON.stringify(a));obs.value="";show()}function show(){let a=JSON.parse(localStorage.getItem("rased-carnet")||"[]");out.innerHTML=a.map(x=>'<div class="box" style="margin-top:10px"><strong>'+x.date+' · '+x.e+' · '+x.d+'</strong><br>'+x.o+'</div>').join("")||"<p>Aucune séance enregistrée.</p>"}</script></div><script src="site-tracking.js" defer></script></body></html>
