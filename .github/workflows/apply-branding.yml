name: Ajouter le jeu des tables

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-branding.yml"

permissions:
  contents: write

jobs:
  add-tables-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Relier le jeu à la rubrique Mathématiques
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("ressources.html")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '<span class="count">À VENIR</span>\n<h2>Mathématiques</h2>',
              '<span class="count">1 JEU</span>\n<h2>Mathématiques</h2>',
              1,
          )
          text = text.replace(
              '["CALCUL","#ma"]',
              '["CALCUL","tables-multiplication.html",1]',
              1,
          )
          block = """<script>
          const mathGrid=document.querySelector('#ma .grid');
          if(mathGrid){
            mathGrid.innerHTML='<article class="item"><span class="type">TABLES 2 À 11 · 3 NIVEAUX</span><h4>Le défi des tables</h4><p>Choisir une, deux, trois ou toutes les tables, puis jouer sans chrono, en 6 secondes ou en mode Champion.</p><a href="tables-multiplication.html">JOUER →</a></article>';
            const mathCount=document.querySelector('.subject.ma .count');
            if(mathCount)mathCount.textContent='1 JEU';
          }
          </script>
          """
          if "const mathGrid=" not in text:
              text = text.replace('<footer class="site-footer">', block + '<footer class="site-footer">', 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Publier
        run: |
          git config user.name "ZouMai automation"
          git config user.email "actions@users.noreply.github.com"
          git add ressources.html
          git diff --cached --quiet || git commit -m "Ajouter le jeu des tables aux ressources"
          git push
