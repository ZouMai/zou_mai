name: Tests interactifs additions et soustractions
on:
  push:
    paths:
      - operations-posees.html
      - tests/operations-interaction.cjs
      - .github/workflows/operations-interaction.yml
  workflow_dispatch:
jobs:
  interactions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save jsdom@26
      - run: node tests/operations-interaction.cjs
