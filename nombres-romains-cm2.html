<!doctype html>
<html lang="fr"><head><title>Jeu des nombres romains · Zou Maï</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="zoumai-brand.css">
<style>
:root{font:17px/1.5 system-ui,Arial,sans-serif;color:#202631;background:#eee7d9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#f4d592,transparent 40%),#eee7d9}header{background:#19232c;color:#fff;padding:20px max(20px,calc((100% - 1100px)/2));border-bottom:7px solid #b44735}header a{color:#ffe49f}h1{font-size:clamp(2.1rem,5vw,4rem);line-height:1.05;margin:8px 0}.kicker{color:#f4c775;font-weight:900;letter-spacing:.13em;text-transform:uppercase;font-size:.8rem}main{max-width:1100px;margin:auto;padding:24px 18px 70px}.tabs{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 18px}.tabs button,button,.button{font:inherit;cursor:pointer;border:2px solid #202631;border-radius:10px;padding:10px 15px;background:#fff;color:#202631;font-weight:800}.tabs button[aria-selected=true],.primary{background:#f3cb64}.view{background:#fffaf0;border:2px solid #202631;border-radius:19px;padding:clamp(19px,4vw,34px);box-shadow:7px 7px 0 #be7657}.view[hidden],.answer[hidden],.feedback[hidden],.next[hidden]{display:none}h2{font-size:clamp(1.5rem,3vw,2.1rem);margin:0 0 8px}.lead{color:#505660;margin:0 0 20px}.stage{min-height:270px;background:#efe6d3;border:2px solid #c7aa85;border-radius:15px;padding:25px;display:flex;flex-direction:column;justify-content:center}.stage small{font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:#91442e}.stage h3{font-size:clamp(1.6rem,4vw,2.6rem);line-height:1.16;margin:7px 0}.stage .challenge{font-size:clamp(1.25rem,3vw,1.8rem);margin:8px 0}.inscription{font-family:Georgia,serif;font-size:clamp(3rem,10vw,7rem);font-weight:bold;letter-spacing:.09em;text-align:center;color:#6c5141;background:linear-gradient(140deg,#ded4bd,#f8f0df,#c3b49c);border:9px ridge #a58b70;padding:15px;max-width:530px;margin:8px auto;box-shadow:8px 11px #75665566}.answer{background:#ddf2df;border-left:6px solid #39784d;border-radius:9px;padding:14px 17px;margin:15px 0 0}.answer strong{font-size:1.25rem}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}.controls .spacer{flex:1}.legend{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.legend span{background:#19232c;color:#fff;border-radius:8px;padding:7px 10px;font:900 1.2rem Georgia,serif}.problem{padding:15px;background:#f5e8cd;border-radius:12px;margin:17px 0}.problem .roman{font:900 clamp(2.6rem,9vw,5rem) Georgia,serif;letter-spacing:.1em;display:block;margin:7px 0;color:#852f29}.problem .decimal{font:900 clamp(2.6rem,9vw,5rem) system-ui;display:block;margin:7px 0;color:#852f29}.problem small{font-weight:800;text-transform:uppercase}.response{display:flex;flex-wrap:wrap;gap:10px;align-items:end}.response label{font-weight:800;flex:1;min-width:200px}.response input{display:block;width:100%;font:800 1.65rem system-ui;letter-spacing:.09em;padding:11px;border:2px solid #202631;border-radius:8px;margin-top:5px;text-transform:uppercase}.keypad{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.keypad button{font:900 1.5rem Georgia,serif;min-width:48px}.feedback{border-radius:10px;background:#e6f1f6;border-left:6px solid #347b9b;padding:13px 16px;margin:14px 0}.feedback.correct{background:#ddf2df;border-color:#39784d}.feedback.error{background:#fff0d9;border-color:#bd7a25}.next{margin-top:12px}.meter{height:14px;border-radius:99px;background:#d6cfbf;overflow:hidden}.meter span{display:block;height:100%;background:#b44735;transition:width .25s}.steps{display:grid;gap:12px;counter-reset:steps;margin:18px 0;padding:0}.steps li{list-style:none;counter-increment:steps;background:#f4ebd9;border:1px solid #d9c8aa;border-radius:10px;padding:12px 15px}.steps li:before{content:counter(steps) ' · ';font-weight:900;color:#a44836}.summary{background:#e3f0ed;border-radius:12px;padding:17px;margin-top:20px}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #087dbb;outline-offset:3px}@media(max-width:600px){.view{box-shadow:4px 4px 0 #be7657}.controls .spacer{display:none}.controls button{flex:1}.stage{padding:16px}}

</style></head><body>
<header><a href="ressources.html#hi">← Ressources · Histoire</a><div class="kicker">CM2 · Histoire · Antiquité</div><h1>Le code des Romains</h1><p>Lis et écris des nombres romains en 12 défis progressifs.</p></header><main>
<section id="game" class="view" role="tabpanel" aria-label="Jeu des nombres romains"><h2>La mission des inscriptions</h2><p class="lead">12 défis progressifs. Lis un nombre, puis écris-le avec les symboles romains. Après une erreur, utilise l’indice pour retenter.</p><p id="game-progress" aria-live="polite"></p><div class="meter" aria-hidden="true"><span id="meter-fill"></span></div><div id="problem" class="problem"></div><form id="answer-form" class="response"><label id="response-label" for="response">Ta réponse<input id="response" autocomplete="off" spellcheck="false" required></label><button class="primary" type="submit">Vérifier</button></form><div id="keypad" class="keypad" hidden aria-label="Touches de chiffres romains"></div><div id="game-feedback" class="feedback" role="status" aria-live="polite" hidden></div><button type="button" class="next" id="next-problem" hidden>Défi suivant →</button><div id="finish" class="summary" hidden></div></section>
</main><script>
const $=id=>document.getElementById(id);
function toRoman(n){if(!Number.isInteger(n)||n<1||n>3999)throw Error('Nombre hors limites');const symbols=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];let result='';for(const [value,letters] of symbols){while(n>=value){result+=letters;n-=value}}return result}
function fromRoman(s){const values={I:1,V:5,X:10,L:50,C:100,D:500,M:1000};if(!/^[IVXLCDM]+$/.test(s))return null;let sum=0;for(let i=0;i<s.length;i++){const v=values[s[i]],next=values[s[i+1]]||0;sum+=v<next?-v:v}return sum>=1&&sum<=3999&&toRoman(sum)===s?sum:null}
const tasks=[
{mode:'read',roman:'VII',tip:'V vaut 5 et chaque I vaut 1.',why:'VII = 5 + 1 + 1 = 7.'},
{mode:'write',number:9,tip:'Pour 9, place I devant X.',why:'IX = 10 − 1 = 9.'},
{mode:'read',roman:'XIV',tip:'Sépare X et IV.',why:'XIV = 10 + (5 − 1) = 14.'},
{mode:'write',number:24,tip:'Écris deux dizaines, puis 4.',why:'XXIV = 10 + 10 + 4 = 24.'},
{mode:'read',roman:'XXXIX',tip:'IX est un groupe : 10 − 1.',why:'XXXIX = 30 + 9 = 39.'},
{mode:'write',number:46,tip:'Décompose 46 en 40 et 6.',why:'XLVI = (50 − 10) + 5 + 1 = 46.'},
{mode:'read',roman:'LXXIV',tip:'L = 50, XX = 20 et IV = 4.',why:'LXXIV = 50 + 20 + 4 = 74.'},
{mode:'write',number:89,tip:'Décompose 89 en 50 + 30 + 9.',why:'LXXXIX = 50 + 30 + 9 = 89.'},
{mode:'read',roman:'XCIV',tip:'XC = 90 ; IV = 4.',why:'XCIV = 90 + 4 = 94.'},
{mode:'write',number:149,tip:'Décompose 149 en 100 + 40 + 9.',why:'CXLIX = 100 + 40 + 9 = 149.'},
{mode:'read',roman:'CDXLIV',tip:'CD = 400, XL = 40, IV = 4.',why:'CDXLIV = 400 + 40 + 4 = 444.'},
{mode:'write',number:2026,tip:'Décompose 2026 en 2000 + 20 + 6.',why:'MMXXVI = 2000 + 20 + 6 = 2026.'}
];
let taskIndex=0,score=0,tries=0,locked=false,tracked=false;
function showTask(){const t=tasks[taskIndex];tries=0;locked=false;$('game-progress').textContent=`Défi ${taskIndex+1} / ${tasks.length} · ${score} réussi${score>1?'s':''} du premier coup`;$('meter-fill').style.width=`${taskIndex/tasks.length*100}%`;$('problem').replaceChildren();const label=document.createElement('small');label.textContent=t.mode==='read'?'Lis cette inscription':'Écris ce nombre à la manière des Romains';const value=document.createElement('strong');value.className=t.mode==='read'?'roman':'decimal';value.textContent=t.mode==='read'?t.roman:String(t.number);$('problem').append(label,value);$('response-label').firstChild.textContent=t.mode==='read'?'Nombre en chiffres habituels':'Nombre en chiffres romains';$('response').value='';$('response').inputMode=t.mode==='read'?'numeric':'text';$('response').maxLength=t.mode==='read'?4:15;$('keypad').hidden=t.mode==='read';$('answer-form').hidden=false;$('game-feedback').hidden=true;$('next-problem').hidden=true;$('finish').hidden=true;$('response').focus()}
for(const ch of 'IVXLCDM'){const b=document.createElement('button');b.type='button';b.textContent=ch;b.setAttribute('aria-label','Ajouter '+ch);b.onclick=()=>{$('response').value+=ch;$('response').focus()};$('keypad').append(b)}const erase=document.createElement('button');erase.type='button';erase.textContent='⌫ Effacer';erase.onclick=()=>{$('response').value=$('response').value.slice(0,-1);$('response').focus()};$('keypad').append(erase);
$('answer-form').onsubmit=e=>{e.preventDefault();if(locked)return;const t=tasks[taskIndex],value=$('response').value.trim().toUpperCase().replace(/\s/g,''),expected=t.mode==='read'?String(fromRoman(t.roman)):toRoman(t.number),correct=t.mode==='read'?/^\d+$/.test(value)&&Number(value)===Number(expected):value===expected;tries++;const box=$('game-feedback');box.hidden=false;box.className='feedback '+(correct?'correct':'error');if(correct){if(tries===1)score++;box.textContent=`Bien vu ! ${t.why}`;locked=true;$('answer-form').hidden=true;$('keypad').hidden=true;$('next-problem').hidden=false;$('next-problem').textContent=taskIndex===tasks.length-1?'Voir mon résultat':'Défi suivant →'}else if(tries===1){box.textContent=`Essaie encore. Indice : ${t.tip}`;$('response').focus()}else{box.textContent=`La réponse est ${expected}. ${t.why}`;locked=true;$('answer-form').hidden=true;$('keypad').hidden=true;$('next-problem').hidden=false;$('next-problem').textContent=taskIndex===tasks.length-1?'Voir mon résultat':'Défi suivant →'}};
$('next-problem').onclick=()=>{if(taskIndex<tasks.length-1){taskIndex++;showTask();return}$('problem').replaceChildren();$('game-progress').textContent='Mission terminée';$('meter-fill').style.width='100%';$('next-problem').hidden=true;$('finish').hidden=false;$('finish').textContent=`${score} / ${tasks.length} réussis du premier coup. Reprends les indices et explique comment tu décomposes les nombres.`;if(!tracked&&typeof window.zoumaiTrackResult==='function'){tracked=true;window.zoumaiTrackResult('Nombres romains CM2',score,tasks.length)}};
showTask();
</script><script src="site-tracking.js" defer></script></body></html>
