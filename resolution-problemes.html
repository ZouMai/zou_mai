<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zoumaï · Problèmes</title><style>body{margin:0;background:#07111f;color:#eef6ff;font-family:system-ui}main{max-width:960px;margin:auto;padding:18px}.card,.item{background:#101e30;border:1px solid #29405a;border-radius:16px;padding:16px;margin:10px 0}.item{cursor:pointer}.item:hover{border-color:#35d7ff}.btn{background:#15283e;color:white;border:1px solid #38536f;border-radius:11px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:#35d7ff;color:#04111b}.help{color:#ffe09b}.mut{color:#a8bad0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:9px}.work,.panel{display:none}.show{display:block}.statement{font-size:1.25rem;font-weight:750;line-height:1.5}.answer{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.answer input,textarea{flex:1;min-width:180px;padding:12px;font-size:1rem;border-radius:9px}.tools{display:flex;gap:8px;flex-wrap:wrap}.panel{margin-top:12px;background:#091726;border:1px solid #29405a;border-radius:13px;padding:14px}.bar{display:flex;border:2px solid #91a6ba;border-radius:7px;margin:10px 0;min-height:55px}.slot{flex:1;border-right:1px solid #91a6ba;padding:8px}.slot:last-child{border:0}.slot input{width:100%;box-sizing:border-box;background:transparent;color:white;border:0;border-bottom:1px dashed #91a6ba;text-align:center}.calc button{width:54px;height:45px;margin:3px}.status{font-weight:800;margin:12px 0}</style></head><body><main><a class="btn" href="ressources.html">← Mathématiques</a><h1>Résolution de problèmes</h1><p class="mut">Réponds directement si tu sais faire. Les outils et les coups de pouce sont facultatifs.</p><div id="catalog" class="grid"></div><section id="work" class="work"><button class="btn" id="back">← Changer d’item</button><h2 id="title"></h2><div class="card"><div id="count" class="mut"></div><div id="statement" class="statement"></div><div class="answer"><input id="answer" inputmode="decimal" placeholder="Ma réponse"><button id="check" class="btn primary">Valider</button></div><div class="tools"><button id="draftBtn" class="btn">✏️ Mes calculs</button><button id="helpBtn" class="btn help">💡 Coup de pouce</button></div><div id="draft" class="panel"><b>Mes calculs</b><textarea placeholder="Écris tes calculs ici"></textarea></div><div id="help" class="panel"><b id="hint"></b><div class="tools"><button id="schemaBtn" class="btn">▭ Mon schéma</button><button id="modelBtn" class="btn">👁 Voir le schéma</button><button id="calcBtn" class="btn">🧮 Calculatrice</button></div></div><div id="schema" class="panel"><b>Schéma en barres</b><p class="mut">Place les données et le ? dans les barres.</p><div id="bars"></div></div><div id="calculator" class="panel calc"><b>Calculatrice</b><div><input id="display" readonly></div><div id="keys"></div></div><div id="status" class="status"></div><button id="next" class="btn" style="display:none">Problème suivant →</button></div></section><script>
const S=[
['Quatre opérations','Lis la question puis repère la quantité cherchée.',[['8 boîtes contiennent chacune 24 feutres. Combien de feutres ?',192],['360 places : 287 sont occupées. Combien restent libres ?',73],['936 cartes sont partagées entre 9 classes. Combien par classe ?',104],['Une bibliothèque a 1245 livres, en achète 178 puis en retire 96. Combien en reste-t-il ?',1327],['7 cars de 52 élèves sont prévus. 19 élèves sont absents. Combien participent ?',345]]],
['Parties – tout et transformation','Cherche si tu connais le tout ou une partie.',[['Sur 286 élèves, 154 mangent à la cantine. Combien n’y mangent pas ?',132],['Lina a 438 images et en donne 127. Combien lui en reste-t-il ?',311],['675 spectateurs viennent le matin et 248 l’après-midi. Combien au total ?',923],['185 billets sont vendus et il en reste 327. Combien y en avait-il ?',512],['Un réservoir a 840 L, reçoit 175 L puis on utilise 260 L. Combien reste-t-il ?',755]]],
['Transformations en plusieurs étapes','Suis les changements dans l’ordre.',[['Noé a 325 billes, en gagne 86 puis en donne 47. Combien en a-t-il ?',364],['640 cahiers arrivent, 285 sont vendus puis 120 arrivent. Combien restent ?',475],['950 chaises : on en retire 138 puis en ajoute 75. Combien ?',887],['2450 km au compteur puis 186 km et 239 km parcourus. Nouvelle valeur ?',2875],['1200 €, dépense 375 €, reçoit 240 €, dépense 95 €. Reste ?',970]]],
['Multiplicatifs : tout, parts, valeur d’une part','Cherche le total, le nombre de parts ou la valeur d’une part.',[['18 rangées de 24 sièges. Combien de sièges ?',432],['540 bonbons dans 12 sachets identiques. Combien par sachet ?',45],['168 livres, 24 par étagère. Combien d’étagères ?',7],['15 ballons à 28 € chacun. Prix total ?',420],['756 élèves en 9 groupes égaux. Combien par groupe ?',84]]],
['Proportionnalité','Cherche comment passer d’une quantité à l’autre.',[['3 cahiers coûtent 9 €. Prix de 7 cahiers ?',21],['300 g de riz pour 4 personnes. Pour 8 ?',600],['5 boîtes contiennent 60 craies. Dans 15 boîtes ?',180],['36 km en 2 h à allure constante. En 5 h ?',90],['6 billets coûtent 42 €. Combien coûtent 10 billets ?',70]]],
['Additifs et multiplicatifs en plusieurs étapes','Cherche d’abord une quantité intermédiaire.',[['12 lots de 25 cahiers, puis 184 distribués. Combien restent ?',116],['18 rangées de 32 places, 79 vides. Combien de spectateurs ?',497],['9 classes reçoivent 28 livres, l’école en avait 135. Total ?',387],['16 caisses de 35 pommes, puis 248 vendues. Combien restent ?',312],['14 tables de 8 places et 27 chaises ajoutées. Combien de places ?',139]]],
['Atypiques : pré-algébriques','Raisonne à l’envers à partir du résultat.',[['Un nombre + 37 = 92. Quel nombre ?',55],['Un nombre × 6 = 174. Quel nombre ?',29],['Un nombre − 48 = 125. Quel nombre ?',173],['Trois fois le même nombre donne 216. Quel nombre ?',72],['J’ajoute 25 à un nombre puis je double : 150. Nombre de départ ?',50]]]
];let si=0,pi=0,help=false,expr='';const $=x=>document.getElementById(x);
function init(){$('catalog').innerHTML=S.map((s,i)=>'<div class="item" data-i="'+i+'"><b>'+s[0]+'</b><p class="mut">5 problèmes · aides facultatives</p></div>').join('');document.querySelectorAll('.item').forEach(e=>e.onclick=()=>start(+e.dataset.i))}
function start(i){si=i;pi=0;$('catalog').style.display='none';$('work').classList.add('show');load()}
function load(){let p=S[si][2][pi];$('title').textContent=S[si][0];$('count').textContent='Problème '+(pi+1)+' / 5';$('statement').textContent=p[0];$('answer').value='';$('status').textContent='';$('next').style.display='none';help=false;['draft','help','schema','calculator'].forEach(x=>$(x).classList.remove('show'))}
$('back').onclick=()=>{$('work').classList.remove('show');$('catalog').style.display='grid'};$('draftBtn').onclick=()=>$('draft').classList.toggle('show');$('helpBtn').onclick=()=>{help=true;$('help').classList.add('show');$('hint').textContent=S[si][1]};$('schemaBtn').onclick=()=>{help=true;schema(false)};$('modelBtn').onclick=()=>{help=true;schema(true)};function schema(model){$('schema').classList.add('show');let p=S[si][2][pi],nums=p[0].match(/\d+/g)||[];$('bars').innerHTML='<div class="bar">'+[...nums,'?'].map((n,i)=>'<div class="slot"><input '+(model?'value="'+n+'" disabled':'placeholder="donnée / ?"')+'></div>').join('')+'</div>'}
$('calcBtn').onclick=()=>{help=true;$('calculator').classList.add('show')};$('check').onclick=()=>{let v=Number($('answer').value.replace(',','.').replace(/\s/g,'')),ok=v===S[si][2][pi][1];$('status').textContent=ok?(help?'✓ Réussi avec un coup de pouce.':'✓ Réussi seul !'):'Pas encore. Vérifie ce que l’on cherche ou demande un coup de pouce.';$('status').style.color=ok?'#59df9a':'#ffcc66';if(ok)$('next').style.display='inline-block'};$('next').onclick=()=>{if(pi<4){pi++;load()}else{$('back').click()}};for(const k of '789/456*123-0.+'){let b=document.createElement('button');b.textContent=k;b.onclick=()=>{expr+=k;$('display').value=expr};$('keys').append(b)}let e=document.createElement('button');e.textContent='=';e.onclick=()=>{try{if(!/^[0-9+*/.\-]+$/.test(expr))throw 0;let r=Function('return ('+expr+')')();if(!Number.isFinite(r))throw 0;$('display').value=r;expr=String(r)}catch(_){$('display').value='Erreur';expr=''}};$('keys').append(e);let c=document.createElement('button');c.textContent='C';c.onclick=()=>{expr='';$('display').value=''};$('keys').append(c);init();
</script></main></body></html>
