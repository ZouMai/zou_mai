<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--ink:#182033;--paper:#fffdf7;--accent:#ef4b43;--good:#178a50;--bad:#c93636;--soft:#f3eee3}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(135deg,#f8f0df,#eaf5ff);color:var(--ink);min-height:100vh}.wrap{max-width:900px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between}.logo{width:82px}.back{color:var(--ink);text-decoration:none;font-weight:800}.card{background:var(--paper);border:3px solid var(--ink);border-radius:28px;padding:clamp(20px,5vw,42px);box-shadow:8px 8px 0 var(--ink);text-align:center;margin-top:18px}.kicker{font-weight:1000;color:var(--accent);letter-spacing:.12em}h1{font-size:clamp(2rem,6vw,3.8rem);margin:.15em}.rule{background:var(--soft);border-radius:18px;padding:14px 18px;text-align:left;line-height:1.5;margin:18px auto;max-width:700px}.progress{height:12px;background:#e7e1d7;border-radius:99px;overflow:hidden;margin:22px 0}.bar{height:100%;background:var(--accent)}.q{font-size:clamp(1.6rem,5vw,3rem);font-weight:1000;margin:25px 0}.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}.choices button,.go{border:3px solid var(--ink);border-radius:16px;background:#fff;padding:12px 20px;font-size:1.25rem;font-weight:900;box-shadow:4px 4px 0 var(--ink);cursor:pointer}.input{font-size:1.5rem;padding:12px;border:3px solid var(--ink);border-radius:14px;width:min(100%,520px)}.feedback{min-height:42px;font-size:1.15rem;font-weight:900;margin-top:18px}.ok{color:var(--good)}.no{color:var(--bad)}.hidden{display:none}.score{font-size:3rem;font-weight:1000}</style><style>.perfect-pop{position:fixed;inset:0;z-index:9999;background:rgba(255,255,255,.94);display:flex;align-items:center;justify-content:center;flex-direction:column;padding:18px;text-align:center}.perfect-pop img{width:min(72vw,620px);max-height:62vh;object-fit:contain;filter:drop-shadow(0 14px 18px rgba(0,0,0,.22));animation:perfectIn .5s cubic-bezier(.2,1.5,.4,1)}.perfect-bubble{font:1000 clamp(2rem,7vw,5rem)/1 system-ui;background:#fff;border:5px solid #182033;border-radius:35px;padding:18px 28px;box-shadow:8px 8px 0 #182033;margin-bottom:12px;transform:rotate(-2deg)}.perfect-pop button{margin-top:12px;border:3px solid #182033;border-radius:16px;background:#fff;padding:10px 20px;font-weight:900;font-size:1.1rem;cursor:pointer}@keyframes perfectIn{from{transform:scale(.25) rotate(-10deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}</style></head><body><main class="wrap"><div class="top"><a class="back" href="ressources.html#orthographe">← Orthographe</a><img class="logo" src="images/loup-bleu-original.png" alt="Zoumaï"></div><section class="card"><div class="kicker">ORTHOGRAPHE · O2</div><h1>Écrire les nombres en lettres</h1><div class="rule"><strong>Consigne :</strong> écris le nombre en toutes lettres. Les traits d’union sont acceptés selon l’orthographe rectifiée. Pense à <strong>cent</strong> et <strong>vingt</strong> qui prennent parfois un <strong>s</strong>.</div><div id="game"><div class="progress"><div class="bar" id="bar"></div></div><div id="count"></div><div class="q" id="q"></div><input class="input" id="inp" autocomplete="off" placeholder="Écris le nombre en lettres"><div style="margin-top:15px"><button class="go" onclick="check()">Valider</button></div><div class="feedback" id="fb"></div></div><div id="end" class="hidden"><div class="score" id="score"></div><p>Bravo ! Rejoue pour améliorer ton score.</p><button class="go" onclick="start()">Rejouer</button></div></section></main><script>
const items=[[17,"dix-sept"],[21,"vingt et un"],[32,"trente-deux"],[71,"soixante et onze"],[80,"quatre-vingts"],[81,"quatre-vingt-un"],[99,"quatre-vingt-dix-neuf"],[100,"cent"],[200,"deux cents"],[201,"deux cent un"],[350,"trois cent cinquante"],[999,"neuf cent quatre-vingt-dix-neuf"],[1000,"mille"],[2026,"deux mille vingt-six"],[12000,"douze mille"],[25000,"vingt-cinq mille"],[100000,"cent mille"],[305000,"trois cent cinq mille"],[1000000,"un million"],[2345678,"deux millions trois cent quarante-cinq mille six cent soixante-dix-huit"]];
let deck,i,pts,lock;function norm(s){return s.toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/-/g," ").replace(/\s+/g," ")}function start(){deck=[...items].sort(()=>Math.random()-.5);i=pts=0;end.classList.add("hidden");game.classList.remove("hidden");show()}function show(){lock=false;let x=deck[i];q.textContent=x[0].toLocaleString("fr-FR");count.textContent=(i+1)+" / "+deck.length;bar.style.width=(i/deck.length*100)+"%";inp.value="";fb.textContent="";inp.focus()}function check(){if(lock||!inp.value.trim())return;lock=true;let good=deck[i][1];if(norm(inp.value)===norm(good)){pts++;fb.textContent="✓ Bravo !";fb.className="feedback ok"}else{fb.textContent="✗ Réponse : "+good;fb.className="feedback no"}setTimeout(()=>{if(++i<deck.length)show();else finish()},1100)}function finish(){game.classList.add("hidden");end.classList.remove("hidden");score.textContent=pts+" / "+deck.length;if(pts===deck.length)setTimeout(zoumaiPerfect,250)}inp.addEventListener("keydown",e=>{if(e.key==="Enter")check()});start();</script><script>
function zoumaiPerfect(){
 const msgs=["BRAVO !","PARFAIT !","TROP FORT !","100 % RÉUSSI !","INCROYABLE !","TU AS TOUT RÉUSSI !","FÉLICITATIONS !","GÉNIAL !"];
 const box=document.createElement("div");box.className="perfect-pop";
 const tilt=[-5,-3,0,3,5][Math.floor(Math.random()*5)];
 box.innerHTML='<div class="perfect-bubble">'+msgs[Math.floor(Math.random()*msgs.length)]+'</div><img src="images/totoro-felicitations.png" alt="Totoro te félicite" style="transform:rotate('+tilt+'deg)"><button>CONTINUER</button>';
 box.querySelector("button").onclick=()=>box.remove();document.body.appendChild(box);
}
</script></body></html>
