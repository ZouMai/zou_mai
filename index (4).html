<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Nationalities · BD sonorisée · Zou Maï</title><style>:root{--ink:#16191e;--paper:#e8e5df;--yellow:#ffdf35;--blue:#146cbd}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}button,select,a{font:inherit}.toolbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;flex-wrap:wrap;gap:.55rem;padding:.65rem max(10px,2vw);background:#fffefa;box-shadow:0 2px 12px #0002}.toolbar strong{margin-right:auto}.toolbar button,.toolbar select,.toolbar a{padding:.6rem .8rem;border:2px solid #20242a;border-radius:12px;background:#fff;color:#151515;text-decoration:none;font-weight:750;cursor:pointer}.toolbar #playAll{background:#aff3c7}.toolbar #stop{background:#ffe2dd}.toolbar button:disabled{opacity:.55;cursor:default}.toolbar button:focus-visible,.sound-btn:focus-visible{outline:4px solid var(--yellow);outline-offset:3px}.wrap{max-width:1055px;margin:16px auto 40px;padding:0 8px}.page{position:relative;width:100%;background:#fff;box-shadow:0 8px 25px #0002;line-height:0}.page>img{display:block;width:100%;height:auto}.sound-btn{position:absolute;z-index:2;transform:translate(-50%,-50%);width:clamp(30px,3.2vw,42px);height:clamp(30px,3.2vw,42px);display:grid;place-items:center;line-height:1;border:2px solid #fff;border-radius:50%;background:var(--blue);color:#fff;box-shadow:0 2px 8px #0009;cursor:pointer;transition:background .15s}.sound-btn.active{background:#e43166;box-shadow:0 0 0 9px #ffed4f99,0 0 28px 17px #ffde3599;animation:pulse 1s infinite alternate}@keyframes pulse{to{box-shadow:0 0 0 14px #ffed4f77,0 0 36px 22px #ffde3577}}.sound-btn.active:before{content:'';position:absolute;z-index:-1;width:clamp(70px,13vw,145px);height:clamp(42px,7vw,84px);border:5px solid #f9ce16;border-radius:50%;background:#fff25d25;pointer-events:none}.transcript{margin:14px auto;padding:12px 16px;background:#fff;border-radius:14px;border-left:7px solid #ffca25;font-size:1.1rem;line-height:1.4}.transcript strong{display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em}.hint{max-width:1055px;margin:12px auto;padding:0 10px 25px;color:#484c52;font-size:.92rem}@media(max-width:680px){.toolbar strong{width:100%}.wrap{padding:0;margin-top:6px}.sound-btn{width:31px;height:31px;font-size:13px}}@media(prefers-reduced-motion:reduce){.sound-btn.active{animation:none}}</style><link rel="stylesheet" href="zoumai-brand.css"></head>
<body><a class="zm-corner-logo" href="index.html" aria-label="Accueil Zou Maï"><img src="images/logo-zou-mai-sensei.png" alt="Logo Sensei Zou Maï"></a><div class="toolbar"><strong>🎭 Nationalities</strong><button type="button" id="playAll">▶ Écouter toute la BD</button><button type="button" id="stop">■ Arrêter</button><label>Vitesse <select id="rate"><option value="0.76">Très lente</option><option value="0.88" selected>Lente</option><option value="1">Normale</option></select></label><a href="../../index.html">← Retour aux leçons</a></div>
<div class="wrap"><div class="page"><img src="nationalities.png" alt="Planche de BD : Nationalities"><button type="button" class="sound-btn" style="left:40%;top:15%" data-character="grace" data-text="Hello! My name is Grace! I'm from France, I'm French!" aria-label="Case 1" aria-pressed="false">🔊</button><button type="button" class="sound-btn" style="left:74%;top:15%" data-character="guide" data-text="Where are you from?" aria-label="Case 2 - question" aria-pressed="false">🔊</button><button type="button" class="sound-btn" style="left:78%;top:26%" data-character="girl" data-text="I'm from the United States, I'm American." aria-label="Case 2 - answer" aria-pressed="false">🔊</button><button type="button" class="sound-btn" style="left:39%;top:45%" data-character="guide" data-text="And you, where are you from?" aria-label="Case 3 - question" aria-pressed="false">🔊</button><button type="button" class="sound-btn" style="left:58%;top:55%" data-character="girl" data-text="I'm from Canada, I'm Canadian." aria-label="Case 3 - answer" aria-pressed="false">🔊</button><button type="button" class="sound-btn" style="left:74%;top:45%" data-character="guide" data-text="And you, where are you from?" aria-label="Case 4 - question" aria-pressed="false">🔊</button><button type="button" class="sound-btn" style="left:74%;top:55%" data-character="girl" data-text="I'm from Australia, I'm Australian." aria-label="Case 4 - answer" aria-pressed="false">🔊</button><button type="button" class="sound-btn" style="left:38%;top:76%" data-character="guide" data-text="And you, where are you from?" aria-label="Case 5 - question" aria-pressed="false">🔊</button><button type="button" class="sound-btn" style="left:57%;top:86%" data-character="girl" data-text="I'm from Ireland, I'm Irish!" aria-label="Case 5 - answer" aria-pressed="false">🔊</button><button type="button" class="sound-btn" style="left:61%;top:80%" data-character="greycat" data-text="Helloooo, where are you from?" aria-label="Case 6 - question" aria-pressed="false">🔊</button><button type="button" class="sound-btn" style="left:76%;top:91%" data-character="cat" data-text="I'm from England, I'm English!" aria-label="Case 6 - answer" aria-pressed="false">🔊</button></div><div class="transcript" aria-live="polite"><strong>Réplique en cours</strong><span id="caption">Choisis une bulle, ou écoute toute la scène.</span></div></div><p class="hint">Les questions et les réponses sont lues dans l’ordre, pour faciliter la répétition en classe.</p><script>
(() => {
  'use strict';
  const synth = window.speechSynthesis;
  const buttons = [...document.querySelectorAll('.sound-btn')];
  const playAll = document.querySelector('#playAll');
  const stop = document.querySelector('#stop');
  const rate = document.querySelector('#rate');
  const caption = document.querySelector('#caption');
  let voices = [], token = 0, timeout = null;
  const characters = {grace:{slot:0,pitch:1.18,speed:1.0},guide:{slot:1,pitch:1.05,speed:0.98},girl:{slot:2,pitch:1.15,speed:1.0},cat:{slot:3,pitch:1.42,speed:1.0},greycat:{slot:4,pitch:1.33,speed:1.0}};
  function loadVoices(){
    voices = synth.getVoices().filter(v => /^en[-_]/i.test(v.lang))
      .sort((a,b) => Number(/en-GB/i.test(b.lang)) - Number(/en-GB/i.test(a.lang)));
  }
  function clearActive(){ buttons.forEach(b => {b.classList.remove('active'); b.setAttribute('aria-pressed','false');}); }
  function halt(){ token++; clearTimeout(timeout); if (synth) synth.cancel(); clearActive(); caption.textContent = 'Choisis une bulle, ou écoute toute la scène.'; playAll.disabled = false; }
  function lineAt(i, current, all){
    if (current !== token) return;
    if (i >= buttons.length){ clearActive(); playAll.disabled = false; caption.textContent = 'Lecture terminée.'; return; }
    const b = buttons[i], actor = characters[b.dataset.character] || Object.values(characters)[0];
    clearActive(); b.classList.add('active'); b.setAttribute('aria-pressed','true');
    caption.textContent = b.dataset.text;
    const u = new SpeechSynthesisUtterance(b.dataset.text);
    u.lang = 'en-GB';
    u.rate = Math.max(.55, Math.min(1.5, Number(rate.value) * actor.speed));
    u.pitch = actor.pitch;
    if (voices.length) u.voice = voices[actor.slot % voices.length];
    let done = false;
    const finish = () => {
      if (done || current !== token) return;
      done = true;
      b.classList.remove('active'); b.setAttribute('aria-pressed','false');
      if (all) timeout = setTimeout(() => lineAt(i + 1, current, true), 340);
    };
    u.onend = finish; u.onerror = finish; synth.speak(u);
  }
  if (!synth || !window.SpeechSynthesisUtterance){
    playAll.disabled = true; buttons.forEach(b => {b.disabled = true;});
    caption.textContent = 'La synthèse vocale n’est pas disponible sur cet appareil.'; return;
  }
  loadVoices();
  synth.addEventListener?.('voiceschanged', loadVoices);
  buttons.forEach((b,i) => b.addEventListener('click', () => { halt(); lineAt(i, token, false); }));
  playAll.addEventListener('click', () => { halt(); playAll.disabled = true; lineAt(0, token, true); });
  stop.addEventListener('click', halt);
  window.addEventListener('pagehide', halt);
})();
</script><script src="site-tracking.js" defer></script>
</body></html>
