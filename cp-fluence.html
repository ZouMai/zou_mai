<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fluence CP — son OI | Zou Maï</title><link rel="stylesheet" href="zoumai.css"><link rel="stylesheet" href="zoumai-brand.css"><style>
:root{--ink:#111;--paper:#f5f0e5;--yellow:#f2d31c;--red:#e04435;--blue:#244b78}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:Arial,sans-serif;color:var(--ink)}.wrap{width:min(900px,94vw);margin:auto;padding:24px 0 60px}.top{display:flex;justify-content:space-between;border-bottom:3px solid #111;padding:0 0 18px}.top a{color:#111;font-weight:900;text-decoration:none}.hero{text-align:center;padding:30px 0 18px}.hero h1{font-size:clamp(2.2rem,7vw,4.4rem);margin:0}.oi{color:var(--red)}.game{background:#fff;border:3px solid #111;border-radius:25px;padding:clamp(18px,4vw,34px);box-shadow:7px 7px 0 #111;text-align:center}.intro{font-size:1.1rem;line-height:1.5}.start,.good,.skip{border:3px solid #111;border-radius:999px;padding:15px 22px;font-size:1.1rem;font-weight:1000;cursor:pointer}.start,.good{background:var(--red);color:#fff}.skip{background:#fff}.timer{font-size:2.4rem;font-weight:1000;margin:14px}.bar{height:12px;background:#ddd;border:2px solid #111;border-radius:10px;overflow:hidden}.fill{height:100%;width:100%;background:var(--yellow)}.strip{display:none;align-items:baseline;justify-content:center;gap:clamp(15px,4vw,35px);min-height:170px;margin:15px 0}.now{font-size:clamp(3.5rem,12vw,6.5rem);font-weight:1000}.next{font-size:clamp(2rem,7vw,3.4rem);font-weight:900;opacity:.48}.after{font-size:clamp(1.4rem,5vw,2.3rem);font-weight:800;opacity:.22}.actions{display:none;justify-content:center;gap:12px;flex-wrap:wrap}.result{font-size:1.3rem;font-weight:900;line-height:1.55;margin-top:20px}.small{font-size:.9rem;color:#555;margin-top:16px}@media(max-width:600px){.strip{gap:13px;min-height:145px}.game{box-shadow:5px 5px 0 #111}}
</style></head><body><a class="zm-corner-logo" href="index.html"><img src="images/logo-zou-mai-sensei.png" alt="Zou Maï"></a><div class="wrap"><div class="top"><strong>ZOU MAÏ</strong><a href="cp-experimentation.html">← Expérimentation CP</a></div><section class="hero"><h1>⚡ Fluence — son <span class="oi">OI</span></h1><p>Lis vite, mais lis juste !</p></section><section class="game"><div id="intro" class="intro"><strong>Tu as 1 minute.</strong><br>Lis le mot en grand. Tes yeux peuvent déjà préparer les deux suivants.<br><br><button id="start" class="start">▶ COMMENCER</button></div><div id="play" style="display:none"><div id="timer" class="timer">1:00</div><div class="bar"><div id="fill" class="fill"></div></div><div id="strip" class="strip"><div id="now" class="now"></div><div id="next" class="next"></div><div id="after" class="after"></div></div><div id="actions" class="actions"><button id="good" class="good">✓ MOT LU</button><button id="skip" class="skip">↪ PASSER</button></div></div><div id="result" class="result"></div><div class="small">Pour cette version expérimentale, l'adulte valide chaque mot. La reconnaissance vocale automatique sera testée ensuite.</div></section></div><script>
(()=>{const words=["roi","loi","moi","toi","soi","joie","voie","voix","bois","noix","pois","trois","croix","froid","droit","noir","soir","voir","boire","foire","poire","toile","boîte","étoile","voiture","poisson","oiseau","voisin","toiture","armoire","histoire","miroir","couloir","mouchoir","arrosoir","balançoire"];const $=x=>document.getElementById(x);let pos=0,good=0,skip=0,left=60,timer;const paint=w=>w.replace(/oi/gi,m=>'<span class="oi">'+m+'</span>');function render(){$("now").innerHTML=paint(words[pos%words.length]);$("next").innerHTML=paint(words[(pos+1)%words.length]);$("after").innerHTML=paint(words[(pos+2)%words.length])}function advance(ok){if(ok)good++;else skip++;pos++;render()}function finish(){clearInterval(timer);$("play").style.display="none";$("intro").style.display="block";$("start").textContent="↻ REJOUER";let msg=good<10?"🌱 Bravo ! Tu as bien commencé. On recommence et tu vas encore progresser !":good<20?"😊 Bravo ! Tu as tenu ton rythme pendant toute la minute !":good<30?"🌟 Super lecture ! Tes yeux commencent vraiment à anticiper !":"🚀 Waouh ! Quelle lecture ! Tu peux être très fier de toi !";$("result").innerHTML=msg+"<br><strong>"+good+" mot"+(good>1?"s":"")+" correctement lu"+(good>1?"s":"")+" en 1 minute.</strong>"+(skip?"<br><span style='font-size:.95rem'>"+skip+" mot"+(skip>1?"s":"")+" passé"+(skip>1?"s":"")+"</span>":"")}function start(){pos=good=skip=0;left=60;$("result").textContent="";$("intro").style.display="none";$("play").style.display="block";$("strip").style.display="flex";$("actions").style.display="flex";$("timer").textContent="1:00";$("fill").style.width="100%";render();timer=setInterval(()=>{left--;$("timer").textContent="0:"+String(left).padStart(2,"0");$("fill").style.width=(left/60*100)+"%";if(left<=0)finish()},1000)}$("start").onclick=start;$("good").onclick=()=>advance(true);$("skip").onclick=()=>advance(false);document.addEventListener("keydown",e=>{if($("play").style.display==="none")return;if(e.key===" "||e.key==="ArrowRight"){e.preventDefault();advance(true)}if(e.key==="ArrowDown")advance(false)});})();
</script><script src="site-tracking.js" defer></script></body></html>
