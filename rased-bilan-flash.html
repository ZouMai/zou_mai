<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="zoumai.css"><link rel="stylesheet" href="zoumai-brand.css"><style>body{margin:0;background:#f5f0e5;font-family:Arial;color:#101114}.wrap{width:min(920px,94vw);margin:auto;padding:24px 0 70px}.top{display:flex;justify-content:space-between;border-bottom:3px solid #111;padding:12px}.top a{color:#111;font-weight:900;text-decoration:none}.card{background:#fff;border:3px solid #111;border-radius:24px;padding:24px;box-shadow:7px 7px 0 #111;text-align:center}h1{font-size:clamp(2rem,6vw,3.6rem)}.btn,button{border:3px solid #111;border-radius:13px;padding:11px 16px;margin:6px;background:#f2d31c;font-weight:900;cursor:pointer;font-size:1rem}.white{background:#fff}.big{font-size:clamp(2rem,8vw,4rem);font-weight:900;margin:22px}.feedback{min-height:50px;font-weight:800;margin:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.box{border:2px solid #111;border-radius:14px;padding:14px;background:#fafafa}input,textarea,select{font:inherit;padding:10px;border:2px solid #111;border-radius:10px;max-width:90%}</style></head><body><div class="wrap"><div class="top"><strong>ZOU MAÏ · RASED</strong><a href="cp-experimentation.html">← Espace RASED</a></div><h1>🩺 Bilan flash</h1><div class="card"><p>Une photographie rapide, sans note. Pour chaque domaine, choisissez ce que vous observez.</p><div class="grid" id="domains"></div><button onclick="report()">Voir la synthèse</button><div class="feedback" id="out"></div></div><script>const ds=["Conscience phonologique","Décodage","Fluence","Compréhension","Encodage","Sens du nombre","Calcul"];domains.innerHTML=ds.map((x,i)=>'<div class="box"><strong>'+x+'</strong><br><select id="d'+i+'"><option>À observer</option><option>Solide</option><option>Fragile</option><option>À construire</option></select></div>').join("");function report(){out.innerHTML="<h2>Carte des besoins</h2>"+ds.map((x,i)=>"<div>"+x+" : <strong>"+document.getElementById("d"+i).value+"</strong></div>").join("")+"<p>À utiliser comme point de départ pour choisir les ateliers, pas comme une note.</p>"}</script></div><script src="site-tracking.js" defer></script></body></html>
