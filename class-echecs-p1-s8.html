<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class'Échecs · Séance 8 · Calculer pour choisir le bon coup</title><style>:root{font-family:system-ui,sans-serif;background:#122638;color:#f4f7f2}*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:auto;padding:22px}a{color:#c8e9cc}h1{font-size:clamp(1.6rem,4vw,2.5rem)}nav{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px;background:#dce8c8;color:#182d36}nav button{flex:1;min-width:105px}nav button.active{background:#ffcf69}.card{border:1px solid #527181;background:#1e3c50;border-radius:15px;padding:20px;margin:16px 0}.muted{color:#c0d0d6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.option{width:100%;text-align:left;margin:5px 0;background:#e6eddf}.option:disabled{opacity:.6}.good{color:#c6f6ab}.bad{color:#ffd29c}.big{font-size:1.5rem;color:#ffd47b}table{border-collapse:collapse;width:100%}td,th{padding:9px;border-bottom:1px solid #587080;text-align:left}.pill{display:inline-block;padding:5px 10px;border-radius:20px;background:#365769}.hidden{display:none}#feedback{min-height:2.6em;font-weight:700}.mini{font-size:.85rem}#army{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.counter{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:9px;background:#2c4c5d;border-radius:10px}.counter button{padding:6px 10px}.score{font-size:1.4rem;color:#ffe39b}.chessboard{display:grid;grid-template-columns:repeat(8,1fr);width:min(100%,500px);margin:16px auto;border:5px solid #587384;border-radius:9px;overflow:hidden}.chessboard button{aspect-ratio:1;border-radius:0;padding:0;position:relative;display:grid;place-items:center;font-size:clamp(20px,5vw,45px);font-family:"DejaVu Sans",sans-serif;line-height:1}.chessboard button.light{background:#eeeed2}.chessboard button.dark{background:#769656}.chessboard button.chosen{background:#f2d574}.chessboard button.valid{box-shadow:inset 0 0 0 4px #f9d06e}.chessboard .w{color:#fff;text-shadow:0 1px 3px #000,1px 0 2px #000}.chessboard .b{color:#111;text-shadow:0 1px 1px #fff}.chessboard .coordinate{position:absolute;bottom:1px;right:3px;font-size:10px;font-family:system-ui;color:#233a2e}.board-help{text-align:center;font-size:.92rem;color:#e8e8d0}</style></head><body><main><header><a href="class-echecs.html#parcours-1">← Toutes les séances</a></header><h1>♟ Parcours 1 · Séance 8</h1><p class="muted">Calculer pour choisir le bon coup · Cycle 3 · D'après les documents officiels Class'Échecs</p><nav><button data-stage="0">1. Défis tactiques</button><button data-stage="1">2. Découvrir</button><button data-stage="2">3. Problèmes FFE</button><button data-stage="3">4. Calculer</button><button data-stage="4">5. Bilan</button><button data-stage="5">6. Bataille</button></nav><section id="content" class="card"></section><p id="stars" class="big"></p><p id="feedback" aria-live="polite"></p></main><script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const scenarios=[{"title":"Situation collective 1","side":"Noirs","choices":["Fou prend la tour h4","Cavalier prend le pion e6"],"correct":0,"lines":["1… Fxh4 : gain de 5 points.","1… Cxe6 2.fxe6 Txe6 : 6 points gagnés, 3 perdus, soit +3."],"gain":[5,3],"steps":["1… Fxh4","1… Cxe6 2.fxe6 Txe6"]},{"title":"Situation collective 2","side":"Noirs","choices":["Cavalier prend h7","Fou prend e4"],"correct":0,"lines":["1… Cxh7 2.Fxh7 Txh7 3.Txh7 Txh7 : 13 − 8 = +5.","1… Fxe4 2.Fxe4 Cxe4 : 6 − 3 = +3."],"gain":[5,3],"steps":["1… Cxh7 2.Fxh7 Txh7 3.Txh7 Txh7","1… Fxe4 2.Fxe4 Cxe4"]},{"title":"Problème officiel 1","side":"Noirs","choices":["Fou prend b7","Fou prend c5 ou dame prend h5"],"correct":0,"lines":["1… Fxb7 2.Cxb7 Txb7 3.Txb7 Dxb7 : 13 − 8 = +5.","1… Fxc5 ou 1… Dxh5 : gain de 3 points."],"gain":[5,3],"steps":["1… Fxb7 2.Cxb7 Txb7 3.Txb7 Dxb7","1… Fxc5 ou 1… Dxh5"]},{"title":"Problème officiel 2","side":"Blancs","choices":["Fou prend c8","Tour prend h5"],"correct":0,"lines":["1.Fxc8 Txc8 2.Txc8 Txc8 : 15 − 8 = +7.","1.Txh5 Txh5 2.Txh5 : 8 − 5 = +3."],"gain":[7,3],"steps":["1.Fxc8 Txc8 2.Txc8 Txc8","1.Txh5 Txh5 2.Txh5"]},{"title":"Problème officiel 3","side":"Blancs","choices":["Cavalier prend c7","Tour prend b5"],"correct":0,"lines":["1.Cxc7 Cxc7 2.Fxc7 Cxc7 3.Txc7 Txc7 4.Dxc7 : 16 − 11 = +5.","1.Txb5 : gain de 3 points."],"gain":[5,3],"steps":["1.Cxc7 Cxc7 2.Fxc7 Cxc7 3.Txc7 Txc7 4.Dxc7","1.Txb5"]}];
let stage=0,question=0,answers={},revealed=false,army={Q:0,R:0,B:0,N:0,P:0};
const vals={Q:10,R:5,B:3,N:3,P:1},names={Q:'Dame',R:'Tour',B:'Fou',N:'Cavalier',P:'Pion'};
function setStage(n){stage=n;question=n===1?0:n===2?2:0;revealed=false;$$('[data-stage]').forEach(b=>b.classList.toggle('active',+b.dataset.stage===n));render()}

const boardCases=[{"fen":"8/pp6/4R3/PP3PP1/3n3R/8/5b2/4r3","lines":[["f2","h4"],["d4","e6","f5","e6","e1","e6"]]},{"fen":"8/p3R2R/1p2P3/5Bn1/1P2N3/P7/7r/1b5r","lines":[["g5","h7","f5","h7","h2","h7","e7","h7","h1","h7"],["b1","e4","f5","e4","g5","e4"]]},{"fen":"7n/1R3R2/6P1/2Nb3N/8/8/8/1r4bq","lines":[["d5","b7","c5","b7","b1","b7","f7","b7","h1","b7"],["d5","c5"]]},{"fen":"2q2r1r/Q5p1/B7/R1R4b/8/2n5/8/8","lines":[["a6","c8","f8","c8","c5","c8","h8","c8"],["a5","h5","h8","h5","c5","h5"]]},{"fen":"N3n3/2r3r1/8/1n2B3/8/8/1RR4Q/8","lines":[["a8","c7","e8","c7","e5","c7","b5","c7","b2","c7","g7","c7","h2","c7"],["b2","b5"]]}];
const glyph={wK:'♔',wQ:'♕',wR:'♖',wB:'♗',wN:'♘',wP:'♙',bK:'♚',bQ:'♛',bR:'♜',bB:'♝',bN:'♞',bP:'♟'};
let position={},pick=null,branch=0,ply=0;
function parseFen(f){let b={};f.split('/').forEach((row,i)=>{let x=0;for(let ch of row){if(/[1-8]/.test(ch)){x+=+ch}else{b['abcdefgh'[x]+(8-i)]=(ch===ch.toUpperCase()?'w':'b')+ch.toUpperCase();x++}}});return b}
function resetBoard(){position=parseFen(boardCases[question].fen);pick=null;ply=0;branch=0;drawBoard()}
function drawBoard(){let el=document.getElementById('chessboard');if(!el)return;el.replaceChildren();let line=boardCases[question].lines[branch];for(let rank=8;rank>=1;rank--)for(let col=0;col<8;col++){let s='abcdefgh'[col]+rank,b=document.createElement('button');b.className=((col+rank)%2?'dark':'light')+(pick===s?' chosen':'')+(line[ply+1]===s?' valid':'');b.type='button';b.title=s;b.setAttribute('aria-label',s+(position[s]?' '+position[s]:''));if(position[s]){let p=document.createElement('span');p.className=position[s][0];p.textContent=glyph[position[s]];b.append(p)}if(rank===1){let co=document.createElement('span');co.className='coordinate';co.textContent='abcdefgh'[col];b.append(co)}b.onclick=()=>boardClick(s);el.append(b)}let t=document.getElementById('boardstatus');if(t)t.textContent=ply>=line.length?'🎉 Variante terminée ! Compare maintenant les gains.':'Coup '+(Math.floor(ply/2)+1)+' / '+(line.length/2)+' : '+(ply%2===0?'choisis la pièce à déplacer':'choisis la case d’arrivée')+'.'}
function boardClick(s){let line=boardCases[question].lines[branch];if(ply>=line.length)return;if(ply%2===0){if(s!==line[ply]){document.getElementById('boardstatus').textContent='Observe les prises possibles : cherche la pièce du coup '+(Math.floor(ply/2)+1)+'.';return}pick=s;ply++;drawBoard()}else{if(s!==line[ply]){document.getElementById('boardstatus').textContent='Ce coup ne correspond pas à la variante étudiée. Regarde les reprises possibles.';return}position[s]=position[pick];delete position[pick];pick=null;ply++;drawBoard();if(ply===line.length){document.getElementById('boardstatus').textContent='🎉 Séquence terminée ! Compare les gains et choisis la meilleure variante.'}}}
function setBranch(n){branch=n;position=parseFen(boardCases[question].fen);pick=null;ply=0;drawBoard()}
function showBoard(){let h=document.getElementById('board-area');if(!h)return;h.innerHTML='<h3>Échiquier officiel FFE — '+scenarios[question].title+'</h3><p class="board-help">Joue les prises et les reprises dans l’ordre. Sélectionne la pièce, puis sa destination.</p><div class="grid"><button onclick="setBranch(0)">Variante principale</button><button onclick="setBranch(1)">Autre coup</button></div><div id="chessboard" class="chessboard"></div><p id="boardstatus" class="board-help" aria-live="polite"></p><button onclick="resetBoard()">↺ Recommencer la variante</button>';resetBoard()}
function score(){return Object.values(answers).filter(Boolean).length}
function render(){let html='';$('#feedback').textContent='';$('#stars').textContent='';if(stage===0){html='<div id="tactic"></div>';}
if(stage===1||stage===2){let s=scenarios[question];html='<span class="pill">'+(stage===1?'Découverte collective':'Défi FFE')+'</span><h2>'+s.title+'</h2><p><strong>'+s.side+' de jouer.</strong> Quel coup rapporte le plus après toutes les reprises possibles ?</p><div id="board-area"></div><div class="grid">'+s.choices.map((x,i)=>'<button class="option" onclick="choose('+i+')">'+(i+1)+'. '+x+'</button>').join('')+'</div><div id="reason"></div><p class="muted mini">Exercice de calcul fondé sur les variantes officielles FFE. Les positions sont des reconstitutions pédagogiques : elles ne remplacent pas les diagrammes officiels.</p><div class="grid"><button onclick="moveQuestion(-1)">← Précédent</button><button onclick="moveQuestion(1)">Suivant →</button></div>';}
if(stage===3){html='<h2>4. Calcule avant de choisir</h2><p>À chaque prise, additionne les valeurs des pièces gagnées et soustrais celles que tu perds.</p><div class="card"><h3>Quel est le gain net ?</h3><p id="calcTitle"></p><div id="calcChoices"></div></div><button onclick="newCalc()">Autre calcul →</button>'; }
if(stage===4){html='<h2>5. Bilan des problèmes</h2><p>Les cinq situations officielles ont été étudiées : deux collectives et trois problèmes.</p><div class="score">'+score()+' / 5 bons choix</div><p>'+('★'.repeat(Math.min(3,score()>=5?3:score()>=3?2:score()>=1?1:0)))+'</p><button onclick="setStage(1)">Revoir les situations</button> <button onclick="setStage(2)">Revoir les problèmes</button>';}
if(stage===5){html='<h2>6. Compose ton armée : 15 points</h2><p>Comme dans la séance FFE, compose une armée de <strong>15 points exactement</strong>. Pions sur la deuxième rangée ; autres pièces sur leur case initiale. Si tu prends une tour ou une dame, place un pion devant.</p><div id="army"></div><p class="score" id="total"></p><p id="armyHelp"></p><button onclick="resetArmy()">Recommencer</button> <a href="class-echecs-p1-s7.html">Ouvrir une bataille à deux joueurs →</a><p class="muted mini">Le constructeur prépare la composition ; le placement libre et la partie avec ces armées ne sont pas encore intégrés ici.</p>';}
$('#content').innerHTML=html;if(stage===0)tacticalRender();if(stage===1||stage===2)showBoard();if(stage===3)newCalc();if(stage===5)drawArmy()}
function choose(i){let s=scenarios[question],ok=i===s.correct;answers[question]=ok;let gain=s.gain;$('#reason').innerHTML='<div class="card"><h3>'+(ok?'🎉 Bravo !':'Pas tout à fait : regarde les reprises.')+'</h3><p><strong>Choix 1 : +'+gain[0]+' points.</strong> '+s.lines[0]+'</p><p><strong>Choix 2 : +'+gain[1]+' points.</strong> '+s.lines[1]+'</p><p>Le meilleur choix est : <strong>'+s.choices[s.correct]+'</strong>.</p></div>';$('#stars').textContent=ok?'★★★':'★☆☆'}
function moveQuestion(d){let first=stage===1?0:2,last=stage===1?1:4;question=Math.max(first,Math.min(last,question+d));render()}
let calcIndex=0;function newCalc(){let s=scenarios[calcIndex++%scenarios.length];$('#calcTitle').textContent=s.title+' : combien rapporte le meilleur choix ?';$('#calcChoices').innerHTML=[s.gain[1],s.gain[0],s.gain[0]+3].map(v=>'<button class="option" onclick="checkCalc('+v+','+s.gain[0]+')">'+v+' points</button>').join('')}
function checkCalc(v,correct){$('#feedback').textContent=v===correct?'🎉 Bravo, bon calcul !':'Essaie encore : points gagnés moins points perdus.';if(v===correct)$('#stars').textContent='★★★'}
function drawArmy(){let sum=Object.keys(army).reduce((a,k)=>a+army[k]*vals[k],0);$('#army').innerHTML=Object.keys(army).map(k=>'<div class="counter"><span>'+names[k]+' ('+vals[k]+')</span><button onclick="changeArmy(\''+k+'\',-1)">−</button><strong>'+army[k]+'</strong><button onclick="changeArmy(\''+k+'\',1)">+</button></div>').join('');$('#total').textContent=sum+' / 15 points';$('#armyHelp').textContent=sum===15?'🎉 Armée prête ! Pense au pion devant chaque tour ou dame.':sum>15?'Tu dépasses les 15 points.':'Il te reste '+(15-sum)+' point(s) à attribuer.'}
function changeArmy(k,d){let next=army[k]+d;if(next<0||next>(k==='P'?8:k==='Q'?1:2))return;army[k]=next;drawArmy()}
function resetArmy(){army={Q:0,R:0,B:0,N:0,P:0};drawArmy()}

const tactical=[["8/1p3p2/8/3n4/2B5/2P2N2/1P4P1/3R4","c4","d5","Trouve une prise qui gagne du matériel.","Le fou prend le cavalier : une pièce de 3 points."],["8/1p3p2/8/2b5/3P4/2N2N2/1P4P1/3R4","d4","c5","Un pion peut gagner une pièce plus forte. Quel coup ?","Le pion prend le fou : 3 points gagnés."],["8/1p3p2/8/3r4/3R4/2B2N2/1P4P1/3Q4","d4","d5","Deux tours se font face. Quelle prise évite une perte ?","La tour blanche prend la tour noire."],["8/1p3p2/8/2b5/3R4/2P2N2/1P4P1/3Q4","d4","d2","Une pièce blanche est attaquée. Trouve un coup de sauvegarde.","La tour quitte la diagonale du fou."],["8/1p3p2/8/2n5/3P4/2B2N2/1P4P1/3R4","d4","c5","Quel coup permet de gagner trois points avec un pion ?","Le pion capture le cavalier."],["8/1p3p2/8/3n4/2B5/2P2N2/1P4P1/3R4","c4","d5","Les Blancs jouent. Quelle pièce adverse est accessible sans perdre le fou ?","Le fou capture le cavalier."],["8/1p3p2/8/3r4/3R4/2B2N2/1P4P1/3Q4","d4","d5","Calcule la prise la plus avantageuse sur la colonne centrale.","La tour capture la tour : 5 points."]];
let ti=0,tp=null,ts=null,tc=0;
function tacticalRender(){let d=tactical[ti],b=parseFen(d[0]);tp=b;ts=null;let area=document.getElementById('tactic');if(!area)return;area.innerHTML='<p class="pill">Défi '+(ti+1)+' / '+tactical.length+'</p><h2>'+d[3]+'</h2><p class="muted">Aux Blancs de jouer. Analyse les prises et les protections avant de choisir.</p><div id="tboard" class="chessboard"></div><p id="tmsg" aria-live="polite">Choisis une pièce, puis une case.</p><div class="grid"><button id="tprev">← Précédent</button><button id="tnext">Suivant →</button><button id="treset">↺ Recommencer</button><button id="thint">💡 Indice</button></div>';document.getElementById('tprev').onclick=()=>{ti=Math.max(0,ti-1);tacticalRender()};document.getElementById('tnext').onclick=()=>{ti=Math.min(tactical.length-1,ti+1);tacticalRender()};document.getElementById('treset').onclick=tacticalRender;document.getElementById('thint').onclick=()=>document.getElementById('tmsg').textContent='Observe les pièces qui peuvent être prises et celles qui sont protégées.';tacticalDraw()}
function tacticalDraw(){let el=document.getElementById('tboard');if(!el)return;el.replaceChildren();for(let rank=8;rank>=1;rank--)for(let col=0;col<8;col++){let sq='abcdefgh'[col]+rank,c=document.createElement('button');c.type='button';c.className=((col+rank)%2?'dark':'light')+(ts===sq?' chosen':'');c.setAttribute('aria-label',sq);if(tp[sq]){let span=document.createElement('span');span.className=tp[sq][0];span.textContent=glyph[tp[sq]];c.append(span)}c.onclick=()=>tacticalClick(sq);el.append(c)}}
function tacticalClick(sq){let d=tactical[ti],m=document.getElementById('tmsg');if(!ts){if(tp[sq]&&tp[sq][0]==='w'){ts=sq;tacticalDraw()}else m.textContent='Choisis une pièce blanche.';return}if(sq===ts){ts=null;tacticalDraw();return}if(ts===d[1]&&sq===d[2]){tp[sq]=tp[ts];delete tp[ts];ts=null;tacticalDraw();m.textContent='🌟 Bravo ! '+d[4];return}if(tp[sq]&&tp[sq][0]==='w'){ts=sq;tacticalDraw();return}m.textContent='Ce coup ne résout pas le défi. Regarde les menaces et les reprises.';ts=null;tacticalDraw()}

$('[data-stage]').forEach(b=>b.onclick=()=>setStage(+b.dataset.stage));setStage(0);
</script></body></html>
