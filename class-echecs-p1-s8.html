<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class'Échecs · Séance 8 · Calculer pour choisir le bon coup</title><style>:root{font-family:system-ui,sans-serif;background:#122638;color:#f4f7f2}*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:auto;padding:22px}a{color:#c8e9cc}h1{font-size:clamp(1.6rem,4vw,2.5rem)}nav{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px;background:#dce8c8;color:#182d36}nav button{flex:1;min-width:105px}nav button.active{background:#ffcf69}.card{border:1px solid #527181;background:#1e3c50;border-radius:15px;padding:20px;margin:16px 0}.muted{color:#c0d0d6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.option{width:100%;text-align:left;margin:5px 0;background:#e6eddf}.option:disabled{opacity:.6}.good{color:#c6f6ab}.bad{color:#ffd29c}.big{font-size:1.5rem;color:#ffd47b}table{border-collapse:collapse;width:100%}td,th{padding:9px;border-bottom:1px solid #587080;text-align:left}.pill{display:inline-block;padding:5px 10px;border-radius:20px;background:#365769}.hidden{display:none}#feedback{min-height:2.6em;font-weight:700}.mini{font-size:.85rem}#army{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.counter{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:9px;background:#2c4c5d;border-radius:10px}.counter button{padding:6px 10px}.score{font-size:1.4rem;color:#ffe39b}</style></head><body><main><header><a href="class-echecs.html#parcours-1">← Toutes les séances</a></header><h1>♟ Parcours 1 · Séance 8</h1><p class="muted">Calculer pour choisir le bon coup · Cycle 3 · D'après les documents officiels Class'Échecs</p><nav><button data-stage="0">1. Réviser</button><button data-stage="1">2. Découvrir</button><button data-stage="2">3. Problèmes FFE</button><button data-stage="3">4. Calculer</button><button data-stage="4">5. Bilan</button><button data-stage="5">6. Bataille</button></nav><section id="content" class="card"></section><p id="stars" class="big"></p><p id="feedback" aria-live="polite"></p></main><script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const scenarios=[{"title":"Situation collective 1","side":"Noirs","choices":["Fou prend la tour h4","Cavalier prend le pion e6"],"correct":0,"lines":["1… Fxh4 : gain de 5 points.","1… Cxe6 2.fxe6 Txe6 : 6 points gagnés, 3 perdus, soit +3."],"gain":[5,3],"steps":["1… Fxh4","1… Cxe6 2.fxe6 Txe6"]},{"title":"Situation collective 2","side":"Noirs","choices":["Cavalier prend h7","Fou prend e4"],"correct":0,"lines":["1… Cxh7 2.Fxh7 Txh7 3.Txh7 Txh7 : 13 − 8 = +5.","1… Fxe4 2.Fxe4 Cxe4 : 6 − 3 = +3."],"gain":[5,3],"steps":["1… Cxh7 2.Fxh7 Txh7 3.Txh7 Txh7","1… Fxe4 2.Fxe4 Cxe4"]},{"title":"Problème officiel 1","side":"Noirs","choices":["Fou prend b7","Fou prend c5 ou dame prend h5"],"correct":0,"lines":["1… Fxb7 2.Cxb7 Txb7 3.Txb7 Dxb7 : 13 − 8 = +5.","1… Fxc5 ou 1… Dxh5 : gain de 3 points."],"gain":[5,3],"steps":["1… Fxb7 2.Cxb7 Txb7 3.Txb7 Dxb7","1… Fxc5 ou 1… Dxh5"]},{"title":"Problème officiel 2","side":"Blancs","choices":["Fou prend c8","Tour prend h5"],"correct":0,"lines":["1.Fxc8 Txc8 2.Txc8 Txc8 : 15 − 8 = +7.","1.Txh5 Txh5 2.Txh5 : 8 − 5 = +3."],"gain":[7,3],"steps":["1.Fxc8 Txc8 2.Txc8 Txc8","1.Txh5 Txh5 2.Txh5"]},{"title":"Problème officiel 3","side":"Blancs","choices":["Cavalier prend c7","Tour prend b5"],"correct":0,"lines":["1.Cxc7 Cxc7 2.Fxc7 Cxc7 3.Txc7 Txc7 4.Dxc7 : 16 − 11 = +5.","1.Txb5 : gain de 3 points."],"gain":[5,3],"steps":["1.Cxc7 Cxc7 2.Fxc7 Cxc7 3.Txc7 Txc7 4.Dxc7","1.Txb5"]}];
let stage=0,question=0,answers={},revealed=false,army={Q:0,R:0,B:0,N:0,P:0};
const vals={Q:10,R:5,B:3,N:3,P:1},names={Q:'Dame',R:'Tour',B:'Fou',N:'Cavalier',P:'Pion'};
function setStage(n){stage=n;question=n===1?0:n===2?2:0;revealed=false;$$('[data-stage]').forEach(b=>b.classList.toggle('active',+b.dataset.stage===n));render()}
function score(){return Object.values(answers).filter(Boolean).length}
function render(){let html='';$('#feedback').textContent='';$('#stars').textContent='';if(stage===0){html='<h2>1. Réviser la valeur des pièces</h2><p>Lorsqu’une pièce est prise, son adversaire peut parfois la reprendre. Il faut calculer <strong>toutes les captures et reprises</strong> avant de choisir.</p><div class="grid">'+Object.entries(vals).map(([k,v])=>'<div class="card"><span class="big">'+({Q:'♛',R:'♜',B:'♝',N:'♞',P:'♟'}[k])+'</span><h3>'+names[k]+'</h3><strong>'+v+' point'+(v>1?'s':'')+'</strong></div>').join('')+'</div><p>Le meilleur coup n’est pas toujours celui qui prend la pièce la plus chère immédiatement.</p><button onclick="setStage(1)">Découvrir les calculs →</button>';}
if(stage===1||stage===2){let s=scenarios[question];html='<span class="pill">'+(stage===1?'Découverte collective':'Défi FFE')+'</span><h2>'+s.title+'</h2><p><strong>'+s.side+' de jouer.</strong> Quel coup rapporte le plus après toutes les reprises possibles ?</p><div class="grid">'+s.choices.map((x,i)=>'<button class="option" onclick="choose('+i+')">'+(i+1)+'. '+x+'</button>').join('')+'</div><div id="reason"></div><p class="muted mini">Exercice de calcul fondé sur les variantes officielles FFE. Les positions originales ne sont pas reproduites dans cette version.</p><div class="grid"><button onclick="moveQuestion(-1)">← Précédent</button><button onclick="moveQuestion(1)">Suivant →</button></div>';}
if(stage===3){html='<h2>4. Calcule avant de choisir</h2><p>À chaque prise, additionne les valeurs des pièces gagnées et soustrais celles que tu perds.</p><div class="card"><h3>Quel est le gain net ?</h3><p id="calcTitle"></p><div id="calcChoices"></div></div><button onclick="newCalc()">Autre calcul →</button>'; }
if(stage===4){html='<h2>5. Bilan des problèmes</h2><p>Les cinq situations officielles ont été étudiées : deux collectives et trois problèmes.</p><div class="score">'+score()+' / 5 bons choix</div><p>'+('★'.repeat(Math.min(3,score()>=5?3:score()>=3?2:score()>=1?1:0)))+'</p><button onclick="setStage(1)">Revoir les situations</button> <button onclick="setStage(2)">Revoir les problèmes</button>';}
if(stage===5){html='<h2>6. Compose ton armée : 15 points</h2><p>Comme dans la séance FFE, compose une armée de <strong>15 points exactement</strong>. Pions sur la deuxième rangée ; autres pièces sur leur case initiale. Si tu prends une tour ou une dame, place un pion devant.</p><div id="army"></div><p class="score" id="total"></p><p id="armyHelp"></p><button onclick="resetArmy()">Recommencer</button> <a href="class-echecs-p1-s7.html">Ouvrir une bataille à deux joueurs →</a><p class="muted mini">Le constructeur prépare la composition ; le placement libre et la partie avec ces armées ne sont pas encore intégrés ici.</p>';}
$('#content').innerHTML=html;if(stage===3)newCalc();if(stage===5)drawArmy()}
function choose(i){let s=scenarios[question],ok=i===s.correct;answers[question]=ok;let gain=s.gain;$('#reason').innerHTML='<div class="card"><h3>'+(ok?'🎉 Bravo !':'Pas tout à fait : regarde les reprises.')+'</h3><p><strong>Choix 1 : +'+gain[0]+' points.</strong> '+s.lines[0]+'</p><p><strong>Choix 2 : +'+gain[1]+' points.</strong> '+s.lines[1]+'</p><p>Le meilleur choix est : <strong>'+s.choices[s.correct]+'</strong>.</p></div>';$('#stars').textContent=ok?'★★★':'★☆☆'}
function moveQuestion(d){let first=stage===1?0:2,last=stage===1?1:4;question=Math.max(first,Math.min(last,question+d));render()}
let calcIndex=0;function newCalc(){let s=scenarios[calcIndex++%scenarios.length];$('#calcTitle').textContent=s.title+' : combien rapporte le meilleur choix ?';$('#calcChoices').innerHTML=[s.gain[1],s.gain[0],s.gain[0]+3].map(v=>'<button class="option" onclick="checkCalc('+v+','+s.gain[0]+')">'+v+' points</button>').join('')}
function checkCalc(v,correct){$('#feedback').textContent=v===correct?'🎉 Bravo, bon calcul !':'Essaie encore : points gagnés moins points perdus.';if(v===correct)$('#stars').textContent='★★★'}
function drawArmy(){let sum=Object.keys(army).reduce((a,k)=>a+army[k]*vals[k],0);$('#army').innerHTML=Object.keys(army).map(k=>'<div class="counter"><span>'+names[k]+' ('+vals[k]+')</span><button onclick="changeArmy(\''+k+'\',-1)">−</button><strong>'+army[k]+'</strong><button onclick="changeArmy(\''+k+'\',1)">+</button></div>').join('');$('#total').textContent=sum+' / 15 points';$('#armyHelp').textContent=sum===15?'🎉 Armée prête ! Pense au pion devant chaque tour ou dame.':sum>15?'Tu dépasses les 15 points.':'Il te reste '+(15-sum)+' point(s) à attribuer.'}
function changeArmy(k,d){let next=army[k]+d;if(next<0||next>(k==='P'?8:k==='Q'?1:2))return;army[k]=next;drawArmy()}
function resetArmy(){army={Q:0,R:0,B:0,N:0,P:0};drawArmy()}
$$('[data-stage]').forEach(b=>b.onclick=()=>setStage(+b.dataset.stage));setStage(0);
</script></body></html>
