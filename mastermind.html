<!doctype html><html lang="fr"><head><title>Mastermind · Zou Maï</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="zoumai.css"><link rel="stylesheet" href="zoumai-brand.css"><style>*{box-sizing:border-box}body{margin:0;background:#111823;color:#f5f2e9;font-family:Arial,sans-serif}main{max-width:850px;margin:auto;padding:22px 15px 70px}a{color:#ffdb53}h1{font-size:clamp(2rem,6vw,3.4rem)}.panel{background:#202d40;border:2px solid #52627a;border-radius:20px;padding:20px;margin-top:18px}.controls{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}button,select,input{font:inherit;border-radius:9px;padding:10px;border:2px solid #62758d}button{background:#ffdc59;color:#161b24;font-weight:900;cursor:pointer}select,input{background:#f9f7f0;color:#17202c}p{line-height:1.5}.status{font-weight:800;min-height:38px;color:#ffdf72}.chip{display:inline-flex;align-items:center;justify-content:center;min-width:48px;min-height:48px;border-radius:10px;background:#344d6b;font-size:1.35rem;font-weight:900;margin:4px}.small{color:#c5d3e5}</style><style>.board{display:grid;gap:9px;max-width:450px;margin:20px auto}.attempt{display:flex;align-items:center;justify-content:center;gap:8px}.peg{width:clamp(38px,9vw,55px);height:clamp(38px,9vw,55px);border-radius:50%;border:3px solid #7890ab;background:#34455b;cursor:pointer}.peg.selected{outline:3px solid #ffdc59}.feedback-pegs{width:70px;display:grid;grid-template-columns:repeat(2,14px);gap:6px;justify-content:center}.mini{width:14px;height:14px;border-radius:50%;background:#718096}.palette{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.palette button{width:48px;height:48px;border-radius:50%;border:3px solid white}.palette button.active{outline:4px solid #ffdc59}.rules{color:#d2dce9}</style><style>
body{background:radial-gradient(ellipse at 15% 0,#102c49,transparent 45%),radial-gradient(ellipse at 90% 20%,#361333,transparent 40%),#080910;color:#f5f6ff}main{max-width:760px}.hero{display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;text-align:center;gap:8px;margin:18px 0}.hero img{width:100%;max-height:145px;object-fit:contain;filter:drop-shadow(0 0 12px #27cfff)}.hero img:last-child{filter:drop-shadow(0 0 12px #ff45b9)}h1{font-style:italic;letter-spacing:-.06em;transform:rotate(-3deg);font-weight:1000;font-size:clamp(1.6rem,6vw,3.6rem);margin:8px 0;color:#fff;text-shadow:3px 3px #ff36ae,-3px -2px #24cfff,0 0 20px #24cfff}.kicker{font-size:.7rem;letter-spacing:.18em;color:#8ceaff;font-weight:900}.panel{background:#101522;border:1px solid #36d9ff;box-shadow:0 0 25px #21baff33,inset 0 0 35px #102f47;border-radius:24px;padding:clamp(10px,3vw,24px)}.attempt{padding:5px;border:1px solid #26374c;border-radius:12px;background:#0b101a;gap:clamp(4px,2vw,12px)}.attempt.live{border-color:#30dfff;box-shadow:0 0 13px #30dfff66}.attempt.past{opacity:.85}.peg{border:2px solid #526a86;background:#141d2b;box-shadow:inset 0 0 8px #0009}.peg.filled,.palette button{box-shadow:inset 0 3px 8px #fff8,inset 0 -5px 10px #0006,0 0 12px var(--glow)}.peg:disabled{cursor:default}.mini{border:1px solid #8fa5bd}.palette button.active{outline:3px solid #fff;outline-offset:3px}.controls button{background:#102b40;color:#8ceaff;border-color:#36d9ff;box-shadow:0 0 10px #36d9ff33}#check{background:#a9ff54;color:#10200a;border-color:#c5ff9a;box-shadow:0 0 18px #a9ff5466}select{background:#111b2b;color:white;border-color:#56718e}.meter{display:flex;gap:5px;margin:12px 0}.meter i{height:6px;flex:1;background:#27354b;border-radius:8px}.meter i.used{background:#ff54b7;box-shadow:0 0 8px #ff54b7}.meter i.next{background:#35dfff;box-shadow:0 0 8px #35dfff}.status{color:#b9f5ff}.legend{font-size:.85rem;color:#d1d9ea}.win .hero img{animation:bounce .65s ease-in-out 3}.win .panel{border-color:#c5ff70;box-shadow:0 0 40px #a9ff5466}@keyframes bounce{50%{transform:translateY(-12px) rotate(5deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}.secret{display:flex;justify-content:center;gap:10px;margin:10px}.secret span{width:30px;height:30px;border-radius:50%;border:2px solid white}.sound{font-size:.8rem}
</style><style id="mastermind-touch-fit">
.rule-dot{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:middle;margin:0 3px 0 6px}.rule-dot.red{background:#f33b49}.rule-dot.white{background:#fff}.peg{padding:0;touch-action:manipulation}.controls button:disabled{opacity:.45;cursor:default}.board{gap:4px;margin:5px auto;width:min(100%,420px)}.attempt{padding:2px 5px;gap:9px}.feedback-pegs{width:48px;grid-template-columns:repeat(2,10px);gap:3px}.mini{width:10px;height:10px}.secret:empty{display:none}.secret{margin:3px}.secret span{width:20px;height:20px}.rules{margin:4px 0;font-size:.8rem}.status{min-height:0;margin:4px 0;font-size:.85rem}.controls{margin:5px 0;align-items:center}.controls button,.controls select{padding:6px 8px;font-size:.8rem}.meter{margin:4px 0}.legend{font-size:.78rem}main{padding:8px 12px 10px}.hero{margin:2px 0}.hero img{max-height:64px}main>p{margin:4px 0;font-size:.83rem}.panel{margin-top:6px;padding:10px}.kicker{font-size:.58rem}h1{margin:4px 0;font-size:clamp(1.5rem,4vw,2.6rem)}.peg{width:clamp(22px,4.5dvh,40px);height:clamp(22px,4.5dvh,40px)}
@media(min-width:600px) and (orientation:landscape){main{max-width:1000px;height:100dvh;display:grid;grid-template-columns:minmax(180px,1fr) minmax(0,2.2fr);grid-template-rows:auto auto 1fr;gap:4px 18px;align-items:start;padding:8px 14px}.hero{grid-column:1;grid-row:2;grid-template-columns:1fr 1fr;align-content:start}.hero>div{grid-column:1/-1;grid-row:1}.hero img{max-height:100px}main>p{grid-column:1;grid-row:3}.panel{grid-column:2;grid-row:1/4;margin:0;max-height:100%;display:flex;flex-direction:column;min-height:0}.board{flex:1;min-height:0;gap:2px;grid-template-rows:repeat(10,minmax(0,1fr));margin:3px auto}.attempt{min-height:0;padding:1px 4px}.peg{width:clamp(17px,calc((100dvh - 165px)/10 - 4px),38px);height:clamp(17px,calc((100dvh - 165px)/10 - 4px),38px)}}

</style></head><body><main><a href="jeux.html">← Jeux</a><header class="hero"><img id="zoum" src="assets/zoum-neutral.png" alt="Zoum"><div><div class="kicker">ZOU MAÏ · CODE LAB</div><h1>MASTERMIND</h1><div class="kicker">MISSION CODE SECRET</div></div><img id="mai" src="assets/mai-neutral.png" alt="Maï"></header><p>Découvre le code secret en 10 essais. <span class="rule-dot red"></span> Bien placée · <span class="rule-dot white"></span> Mal placée</p><div class="panel"><div class="controls"><label>Difficulté <select id="level"><option value="easy">Débutant : sans doublons</option><option value="hard">Expert : doublons possibles</option></select></label><button id="new">Nouvelle partie</button><button id="sound" class="sound" aria-pressed="true">🔊 Son</button></div><div class="meter" id="meter" aria-hidden="true"></div><div id="count" class="legend"></div><div class="board" id="board"></div><div class="secret" id="secret"></div><p class="rules">Touche chaque pion pour changer sa couleur. Remplis les quatre cases puis valide.</p><div class="controls"><button id="check">✓ Valider l'essai</button><button id="clear">↶ Effacer le dernier pion</button></div><p class="status" id="status" role="status"></p></div></main><script>
const colors=['#e95353','#f3cc45','#4cbf86','#4a96ed','#ad73dd','#ed8e43'];let secret=[],rows=[],current=[null,null,null,null],history=[],ended=false;
let sound=true, audio;function tone(win=false){if(!sound)return;try{audio ||= new (window.AudioContext||window.webkitAudioContext)();audio.resume();(win?[523,659,784,1047]:[440,660]).forEach((f,i)=>{let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+i*.10;o.frequency.value=f;g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.17)})}catch(e){}}document.getElementById('sound').onclick=()=>{sound=!sound;document.getElementById('sound').textContent=sound?'🔊 Son':'🔇 Son';document.getElementById('sound').setAttribute('aria-pressed',sound)};function mood(m){for(let id of ['zoum','mai'])document.getElementById(id).src='assets/'+id+'-'+m+(m==='victory'?'.gif':'.png')}function start(){document.body.classList.remove('win');mood('neutral');document.getElementById('secret').replaceChildren();secret=[];let pool=[0,1,2,3,4,5];for(let i=0;i<4;i++){let idx=Math.floor(Math.random()*pool.length),n=pool[idx];secret.push(n);if(document.getElementById('level').value==='easy')pool.splice(idx,1)}rows=[];current=[null,null,null,null];history=[];ended=false;document.getElementById('status').textContent='Trouve le code secret !';render()}
function evaluate(row){let exact=0,sc=Array(6).fill(0),gc=Array(6).fill(0);for(let i=0;i<4;i++){if(row[i]===secret[i])exact++;else{sc[secret[i]]++;gc[row[i]]++}}let misplaced=sc.reduce((n,v,i)=>n+Math.min(v,gc[i]),0);return {exact,misplaced}}
function render(){document.getElementById('count').textContent=ended?'Partie terminée':'Essai '+(rows.length+1)+' / 10';document.getElementById('meter').innerHTML=Array.from({length:10},(_,i)=>'<i class="'+(i<rows.length?'used':i===rows.length&&!ended?'next':'')+'"></i>').join('');document.getElementById('check').disabled=ended;let board=document.getElementById('board');board.replaceChildren();for(let r=0;r<10;r++){let line=document.createElement('div');line.className='attempt '+(r<rows.length?'past':r===rows.length&&!ended?'live':'');let vals=r<rows.length?rows[r].values:r===rows.length?current:[null,null,null,null];for(let c=0;c<4;c++){let b=document.createElement('button');b.className='peg';if(vals[c]!==null){b.style.background=colors[vals[c]];b.style.setProperty('--glow',colors[vals[c]]);b.classList.add('filled')}b.disabled=r!==rows.length||ended;b.setAttribute('aria-label','Essai '+(r+1)+', position '+(c+1)+', '+(vals[c]===null?'vide':['rouge','jaune','vert','bleu','violet','orange'][vals[c]]));b.onclick=()=>{history=history.filter(x=>x!==c);history.push(c);current[c]=current[c]===null?0:(current[c]+1)%colors.length;render();document.querySelector('.attempt.live')?.children[c]?.focus({preventScroll:true})};line.append(b)}let hints=document.createElement('div');hints.className='feedback-pegs';if(r<rows.length){let {exact,misplaced}=rows[r].result;for(let i=0;i<exact+misplaced;i++){let dot=document.createElement('span');dot.className='mini';dot.style.background=i<exact?'#f33b49':'#fff';dot.setAttribute('aria-label',i<exact?'Bien placée':'Mal placée');hints.append(dot)}}line.append(hints);board.append(line)}document.getElementById('clear').disabled=ended||!history.length}
document.getElementById('check').onclick=()=>{if(ended)return;if(current.some(x=>x===null)){document.getElementById('status').textContent='Complète les quatre cases.';return}let result=evaluate(current);rows.push({values:current.slice(),result});current=[null,null,null,null];history=[];tone(result.exact===4);if(result.exact===4){ended=true;document.body.classList.add('win');mood('victory');document.getElementById('status').textContent='🏆 Code trouvé en '+rows.length+' essai(s) !'}else if(rows.length===10){ended=true;mood('think');document.getElementById('secret').innerHTML=secret.map(x=>'<span style="background:'+colors[x]+'"></span>').join('');document.getElementById('status').textContent='Fin de partie. Voici le code secret.'}else {mood(result.exact>=2?'happy':'think');document.getElementById('status').textContent=result.exact+' bien placée(s), '+result.misplaced+' mal placée(s).';}render()};document.getElementById('clear').onclick=()=>{if(!ended&&history.length){current[history.pop()]=null;render()}};document.getElementById('new').onclick=start;document.getElementById('level').onchange=start;start();
</script><script src="site-tracking.js" defer></script></body></html>
