<!doctype html><html lang="fr"><head><title>Mastermind · Zou Maï</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="zoumai.css"><link rel="stylesheet" href="zoumai-brand.css"><style>*{box-sizing:border-box}body{margin:0;background:#111823;color:#f5f2e9;font-family:Arial,sans-serif}main{max-width:850px;margin:auto;padding:22px 15px 70px}a{color:#ffdb53}h1{font-size:clamp(2rem,6vw,3.4rem)}.panel{background:#202d40;border:2px solid #52627a;border-radius:20px;padding:20px;margin-top:18px}.controls{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}button,select,input{font:inherit;border-radius:9px;padding:10px;border:2px solid #62758d}button{background:#ffdc59;color:#161b24;font-weight:900;cursor:pointer}select,input{background:#f9f7f0;color:#17202c}p{line-height:1.5}.status{font-weight:800;min-height:38px;color:#ffdf72}.chip{display:inline-flex;align-items:center;justify-content:center;min-width:48px;min-height:48px;border-radius:10px;background:#344d6b;font-size:1.35rem;font-weight:900;margin:4px}.small{color:#c5d3e5}</style><style>.board{display:grid;gap:9px;max-width:450px;margin:20px auto}.attempt{display:flex;align-items:center;justify-content:center;gap:8px}.peg{width:clamp(38px,9vw,55px);height:clamp(38px,9vw,55px);border-radius:50%;border:3px solid #7890ab;background:#34455b;cursor:pointer}.peg.selected{outline:3px solid #ffdc59}.feedback-pegs{width:70px;display:grid;grid-template-columns:repeat(2,14px);gap:6px;justify-content:center}.mini{width:14px;height:14px;border-radius:50%;background:#718096}.palette{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.palette button{width:48px;height:48px;border-radius:50%;border:3px solid white}.palette button.active{outline:4px solid #ffdc59}.rules{color:#d2dce9}</style></head><body><main><a href="jeux.html">← Jeux</a><h1>🧠 MASTERMIND</h1><p>Découvre le code secret en 10 essais. Un point noir signifie une couleur bien placée ; un point blanc signifie une bonne couleur à la mauvaise place.</p><div class="panel"><div class="controls"><label>Difficulté <select id="level"><option value="easy">Débutant : sans doublons</option><option value="hard">Expert : doublons possibles</option></select></label><button id="new">Nouvelle partie</button></div><div class="board" id="board"></div><p class="rules">Choisis une couleur, puis clique sur une case de ta ligne. Remplis les quatre cases avant de valider.</p><div class="palette" id="palette"></div><div class="controls"><button id="check">✓ Valider l'essai</button><button id="clear">Effacer la ligne</button></div><p class="status" id="status" role="status"></p></div></main><script>
const colors=['#e95353','#f3cc45','#4cbf86','#4a96ed','#ad73dd','#ed8e43'];let secret=[],rows=[],current=[null,null,null,null],choice=0,ended=false;
function start(){secret=[];let pool=[0,1,2,3,4,5];for(let i=0;i<4;i++){let idx=Math.floor(Math.random()*pool.length),n=pool[idx];secret.push(n);if(document.getElementById('level').value==='easy')pool.splice(idx,1)}rows=[];current=[null,null,null,null];choice=0;ended=false;document.getElementById('status').textContent='Trouve le code secret !';render()}
function evaluate(row){let exact=0,sc=Array(6).fill(0),gc=Array(6).fill(0);for(let i=0;i<4;i++){if(row[i]===secret[i])exact++;else{sc[secret[i]]++;gc[row[i]]++}}let misplaced=sc.reduce((n,v,i)=>n+Math.min(v,gc[i]),0);return {exact,misplaced}}
function render(){let board=document.getElementById('board');board.replaceChildren();for(let r=0;r<10;r++){let line=document.createElement('div');line.className='attempt';let vals=r<rows.length?rows[r].values:r===rows.length?current:[null,null,null,null];for(let c=0;c<4;c++){let b=document.createElement('button');b.className='peg';if(vals[c]!==null)b.style.background=colors[vals[c]];b.disabled=r!==rows.length||ended;b.setAttribute('aria-label','Essai '+(r+1)+', position '+(c+1));b.onclick=()=>{current[c]=choice;render()};line.append(b)}let hints=document.createElement('div');hints.className='feedback-pegs';if(r<rows.length){let {exact,misplaced}=rows[r].result;for(let i=0;i<exact+misplaced;i++){let dot=document.createElement('span');dot.className='mini';dot.style.background=i<exact?'#111':'#fff';hints.append(dot)}}line.append(hints);board.append(line)}let palette=document.getElementById('palette');palette.replaceChildren();colors.forEach((color,i)=>{let b=document.createElement('button');b.style.background=color;b.className=i===choice?'active':'';b.setAttribute('aria-label','Couleur '+(i+1));b.onclick=()=>{choice=i;render()};palette.append(b)})}
document.getElementById('check').onclick=()=>{if(ended)return;if(current.some(x=>x===null)){document.getElementById('status').textContent='Complète les quatre cases.';return}let result=evaluate(current);rows.push({values:current.slice(),result});current=[null,null,null,null];if(result.exact===4){ended=true;document.getElementById('status').textContent='🏆 Code trouvé en '+rows.length+' essai(s) !'}else if(rows.length===10){ended=true;document.getElementById('status').textContent='Fin de partie. Code : '+secret.map(x=>x+1).join(' - ')+' (numéros des couleurs).'}else document.getElementById('status').textContent=result.exact+' bien placée(s), '+result.misplaced+' mal placée(s).';render()};document.getElementById('clear').onclick=()=>{if(!ended)current=[null,null,null,null];render()};document.getElementById('new').onclick=start;document.getElementById('level').onchange=start;start();
</script><script src="site-tracking.js" defer></script></body></html>
