<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zoonimator vocal | Zou Maï</title><style>*{box-sizing:border-box}body{margin:0;background:#102b43;color:white;font:18px system-ui,sans-serif;text-align:center}main{max-width:800px;margin:auto;padding:24px}h1{color:#ffcf60}button{cursor:pointer;border:0;border-radius:16px;padding:15px 19px;font-size:1.1rem;font-weight:bold;margin:5px}button:focus-visible{outline:4px solid orange}.panel{background:#fff;color:#173047;border-radius:24px;padding:24px;margin:20px auto;box-shadow:0 16px 40px #0005}.answers{display:flex;flex-wrap:wrap;justify-content:center}.answers button{background:#e6f2fb;color:#15334b}.answers button:hover{background:#c4e5f9}.primary{background:#ffc64f;color:#1d3042}.hint{background:#fff4cc;padding:15px;border-radius:12px}#status{min-height:2em}dialog{border:0;border-radius:24px;max-width:min(94vw,600px);width:100%;padding:25px;color:#16324b;box-shadow:0 20px 80px #0008}dialog::backdrop{background:#041421c9}small{color:#c8dce8}#history{font-size:.9rem;color:#d6e5ee}</style><main><a href="./" style="color:#bfe8ff">← Zou Maï</a><h1>🐾 ZOONIMATOR</h1><p>Je pense à un animal. À toi de le découvrir !</p><button class="primary" id="start">🎮 Commencer</button><p><label><input type="checkbox" id="voice" checked> 🔊 Lire les questions</label></p><p id="history"></p><p id="status" role="status" aria-live="polite"></p><dialog id="popup" aria-labelledby="question"><h2 id="question"></h2><p id="definition" class="hint" hidden></p><div id="answers" class="answers"></div><button id="explain">💡 Explique ce mot</button><button id="speak">🔊 Réécouter</button><button id="mic">🎤 Répondre à l'oral</button><p id="heard" aria-live="polite"></p><p><button id="restart">↻ Recommencer</button></p></dialog><small>La reconnaissance vocale dépend du navigateur et nécessite l'autorisation du microphone. Les boutons restent toujours disponibles.</small></main><script>
const animals=[{name:"le dauphin",emoji:"🐬",mammal:true,water:true,eggs:false,flies:false},{name:"la tortue marine",emoji:"🐢",mammal:false,water:true,eggs:true,flies:false},{name:"l'aigle",emoji:"🦅",mammal:false,water:false,eggs:true,flies:true},{name:"la chauve-souris",emoji:"🦇",mammal:true,water:false,eggs:false,flies:true},{name:"le chat",emoji:"🐈",mammal:true,water:false,eggs:false,flies:false},{name:"le manchot",emoji:"🐧",mammal:false,water:true,eggs:true,flies:false},{name:"la grenouille",emoji:"🐸",mammal:false,water:true,eggs:true,flies:false}];
const questions=[{key:"mammal",text:"Cet animal est-il un mammifère ?",def:"Un mammifère nourrit ses petits avec du lait."},{key:"water",text:"Cet animal vit-il souvent dans l'eau ?",def:"Un milieu aquatique est un endroit où vivent des animaux dans l'eau."},{key:"eggs",text:"Cet animal est-il ovipare ?",def:"Ovipare signifie : qui pond des œufs."},{key:"flies",text:"Cet animal peut-il voler ?",def:"Voler signifie se déplacer dans l'air avec des ailes."}];
const $=id=>document.getElementById(id);let target,index=0,score=0;const popup=$("popup");function say(t){if(!$("voice").checked||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";u.rate=.9;speechSynthesis.speak(u)}function show(){if(index>=questions.length){finish();return}const q=questions[index];$("question").textContent="Question "+(index+1)+" : "+q.text;$("definition").textContent=q.def;$("definition").hidden=true;$("explain").hidden=false;$("answers").replaceChildren();["Oui","Non","Je ne sais pas"].forEach(v=>{let b=document.createElement("button");b.textContent=v;b.onclick=()=>answer(v);$("answers").append(b)});$("heard").textContent="";popup.showModal();say(q.text)}function answer(v){if(v==="Je ne sais pas"){say(questions[index].def);$("definition").hidden=false;return}const correct=(v==="Oui")===target[questions[index].key];if(correct)score++;$("status").textContent=correct?"Bonne réponse !":"Pas tout à fait : "+(target[questions[index].key]?"oui.":"non.");$("history").textContent="Réponses correctes : "+score+" / "+(index+1);say($("status").textContent);index++;popup.close();setTimeout(show,450)}function finish(){popup.showModal();$("question").textContent="Bravo ! "+target.emoji+" C'était "+target.name+" !";$("answers").replaceChildren();$("definition").hidden=false;$("definition").textContent="Score : "+score+" / "+questions.length+". Chaque erreur est une occasion d'apprendre.";$("explain").hidden=true;$("mic").hidden=true;say("Bravo ! C'était "+target.name)}function start(){target=animals[Math.floor(Math.random()*animals.length)];index=0;score=0;$("mic").hidden=false;$("history").textContent="";$("status").textContent="Écoute la question et réponds.";if(popup.open)popup.close();show()}$("start").onclick=start;$("restart").onclick=start;$("explain").onclick=()=>{$("definition").hidden=false;say(questions[index]?.def||"Bravo !")};$("speak").onclick=()=>say($("question").textContent);$("mic").onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$("heard").textContent="Micro non disponible dans ce navigateur. Utilise les boutons.";return}const r=new SR();r.lang="fr-FR";r.interimResults=false;$("heard").textContent="🎙️ Je t'écoute…";r.onresult=e=>{let s=e.results[0][0].transcript.toLowerCase();$("heard").textContent="J'ai entendu : "+s;if(/\b(oui|ouais|exact|affirmatif)\b/.test(s))answer("Oui");else if(/\b(non|pas du tout)\b/.test(s))answer("Non");else if(/\b(sais pas|ne sais pas|ignore)\b/.test(s))answer("Je ne sais pas");else {$("heard").textContent+=". Réessaie avec oui ou non.";say("Dis oui, non, ou je ne sais pas.")}};r.onerror=()=>{$("heard").textContent="Micro indisponible ou autorisation refusée. Utilise les boutons."};try{speechSynthesis.cancel();r.start()}catch(e){$("heard").textContent="Impossible de démarrer le micro."}};</script></html>
