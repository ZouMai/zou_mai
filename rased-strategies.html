<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="zoumai.css"><link rel="stylesheet" href="zoumai-brand.css"><style>body{margin:0;background:#f5f0e5;font-family:Arial;color:#101114}.wrap{width:min(920px,94vw);margin:auto;padding:24px 0 70px}.top{display:flex;justify-content:space-between;border-bottom:3px solid #111;padding:12px}.top a{color:#111;font-weight:900;text-decoration:none}.card{background:#fff;border:3px solid #111;border-radius:24px;padding:24px;box-shadow:7px 7px 0 #111;text-align:center}h1{font-size:clamp(2rem,6vw,3.6rem)}.btn,button{border:3px solid #111;border-radius:13px;padding:11px 16px;margin:6px;background:#f2d31c;font-weight:900;cursor:pointer;font-size:1rem}.white{background:#fff}.big{font-size:clamp(2rem,8vw,4rem);font-weight:900;margin:22px}.feedback{min-height:50px;font-weight:800;margin:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.box{border:2px solid #111;border-radius:14px;padding:14px;background:#fafafa}input,textarea,select{font:inherit;padding:10px;border:2px solid #111;border-radius:10px;max-width:90%}</style></head><body><div class="wrap"><div class="top"><strong>ZOU MAÏ · RASED</strong><a href="cp-experimentation.html">← Espace RASED</a></div><h1>🧠 Comment as-tu fait ?</h1><div class="card"><p>Cet outil aide l'enseignant à garder une trace de la stratégie utilisée par l'enfant.</p><div class="big" id="challenge">27 + 8</div><button class="white" onclick="pick('compter')">J’ai compté</button><button class="white" onclick="pick('decomposer')">J’ai décomposé</button><button class="white" onclick="pick('mental')">Je l’ai su directement</button><button class="white" onclick="pick('autre')">Autre stratégie</button><h3>Observation de l’enseignant</h3><textarea id="note" rows="5" cols="45" placeholder="Ce que l’enfant dit, montre, essaie..."></textarea><br><button onclick="save()">Garder cette observation</button><div class="feedback" id="fb"></div></div><script>let strat="";function pick(x){strat=x;fb.textContent="Stratégie choisie : "+x+". Maintenant, fais expliquer comment."}function save(){localStorage.setItem("rased-strategie",JSON.stringify({date:new Date().toLocaleString(),strategie:strat,note:note.value}));fb.textContent="✓ Observation conservée sur cet appareil."}</script></div><script src="site-tracking.js" defer></script></body></html>
